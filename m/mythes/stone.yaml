name        : mythes
version     : "1.2.7"
release     : 2
upstreams   :
    - https://github.com/hunspell/mythes/archive/refs/tags/v1.2.7.tar.gz : ab6c398a783bb581fdede5075953cfb8ea4b8d13a2d90eb901af013b09db3f8f
homepage    : https://hunspell.github.io/
license     : BSD-3-Clause
summary     : Simple thesaurus library
description : |
    MyThes is a simple thesaurus that uses a structured text data file and an index file with binary search to lookup words and phrases and return information on part of speech, meanings, and synonyms.
builddeps   :
    - binary(bison)
    - binary(flex)
    - pkgconfig(hunspell)
setup       : |
    %autogen \
        --disable-static
build       : |
    %make
install     : |
    %make_install
packages    :
    - "%(name)-devel":
        paths:
            - /usr/bin/
        rundeps:
            - binary(perl)
