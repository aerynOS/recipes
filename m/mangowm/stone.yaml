name        : mangowm
version     : "0.18.6"
release     : 16
homepage    : https://github.com/mangowm/mango
upstreams   :
        - https://github.com/mangowm/mango/archive/refs/tags/0.18.6.tar.gz : 3018b593e48a1ea71247ec10ab898f1186687fa1e225863f360e3f04cf0520df
summary     : A Wayland compositor with smooth animation
description : |
    A wayland compositor utilizing wlroots as a base and SceneFX for aesthetics
license     : GPL-3.0-or-later
builddeps   :
    - pkgconfig(libcjson)
    - pkgconfig(libpcre2-8)
    - pkgconfig(pango)
    - pkgconfig(scenefx)
    - pkgconfig(wayland-protocols)
    - pkgconfig(wlroots)
setup       : |
    %patch %(pkgdir)/stateless-config.patch
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
