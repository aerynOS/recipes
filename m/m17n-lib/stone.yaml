name        : m17n-lib
version     : "1.8.7"
release     : 3
homepage    : https://www.nongnu.org/m17n/
upstreams   :
    - https://download.savannah.nongnu.org/releases/m17n/m17n-lib-1.8.7.tar.gz : a72cf78e40198020aa05217b9839dd260b94d4f2dc59a5a8d60bae7b84104caa
summary     : Multilingual text processing library
description : |
    Multilingual text processing library
license     : LGPL-2.1-only
builddeps   :
    - binary(bison)
    - pkgconfig(fontconfig)
    - pkgconfig(freetype2)
    - pkgconfig(fribidi)
    - pkgconfig(gdlib)
    - pkgconfig(libotf)
    - pkgconfig(libthai)
    - pkgconfig(libxml-2.0)
    - pkgconfig(m17n-db)
    - pkgconfig(x11)
    - pkgconfig(xaw7)
    - pkgconfig(xft)
    - pkgconfig(xt)
    - gettext-devel
setup       : |
    %configure \
        --disable-static
build       : |
    %make
install     : |
    %make_install

    # empty folder (why?)
    rm -r %(installroot)%(datadir)
