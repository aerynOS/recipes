name        : mediainfo
version     : "26.10"
release     : 1
homepage    : https://mediaarea.net/en/MediaInfo
upstreams   :
    - https://github.com/MediaArea/MediaInfo/archive/refs/tags/v26.10.tar.gz : 33b0d63a9d4c16fe0579173bb2d1cb8d665f722875db791bac11ba881b5099bb
