name        : massif-visualizer
version     : "26.08.3"
release     : 2
homepage    : https://apps.kde.org/massif_visualizer/
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/massif-visualizer-26.08.3.tar.xz : 01ce094d0c8c00147a17f8156db78c0f5c31953b6128d4f14d0d4271d035d9d5
summary     : Visualizer for Valgrind Massif data files
description : |
    Inspect memory profiling data produced by Valgrind's Massif heap profiler.
license     : GPL-2.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KChart6)
    - cmake(KF6Archive)
    - cmake(KF6Config)
    - cmake(KF6CoreAddons)
    - cmake(KF6I18n)
    - cmake(KF6KIO)
    - cmake(KF6Parts)
    - cmake(KGraphViewerPart)
    - cmake(Qt6Core5Compat)
    - cmake(Qt6Svg)
    - pkgconfig(shared-mime-info)
rundeps     :
    - kgraphviewer
    - qt6-wayland
    - valgrind
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
