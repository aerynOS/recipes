name        : mailcommon
version     : "26.08.3"
release     : 23
homepage    : https://invent.kde.org/pim/mailcommon
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/mailcommon-26.08.3.tar.xz : 2f8d76f8318f32065e375c87044cdf007563846c9a24e78db84e6fbb013b3531
summary     : MailCommon Library
description : |
    MailCommon Library.
license     :
    - GPL-2.0-or-later
    - LGPL-2.1-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Archive)
    - cmake(KF6Completion)
    - cmake(KF6Config)
    - cmake(KF6DBusAddons)
    - cmake(KF6I18n)
    - cmake(KF6IconThemes)
    - cmake(KF6ItemModels)
    - cmake(KF6ItemViews)
    - cmake(KF6KIO)
    - cmake(KF6SyntaxHighlighting)
    - cmake(KF6XmlGui)
    - cmake(KPim6Akonadi)
    - cmake(KPim6AkonadiMime)
    - cmake(KPim6Libkdepim)
    - cmake(KPim6MailImporter)
    - cmake(KPim6MailTransport)
    - cmake(KPim6MessageComposer)
    - cmake(QGpgmeQt6)
    - cmake(Qt6Multimedia)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    # KPim6MailCommonConfig.cmake find_dependency()s these, so consumers need them present
    - "%(name)-devel":
        rundeps:
            - cmake(KF6Completion)
            - cmake(KPim6Akonadi)
            - cmake(KPim6AkonadiMime)
            - cmake(KPim6Libkdepim)
            - cmake(KPim6MessageComposer)
            - cmake(KPim6MessageViewer)
            - cmake(KPim6PimCommon)
            - cmake(KPim6PimCommonAkonadi)
