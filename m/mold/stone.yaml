name        : mold
version     : "2.42.1"
release     : 16
summary     : A Modern Linker
license     : BSD-3-Clause
homepage    : https://github.com/rui314/mold
description : |
    mold is a faster drop-in replacement for existing Unix linkers.
upstreams   :
    - https://github.com/rui314/mold/archive/refs/tags/v2.42.1.tar.gz: 0580221bfdad7148ceeafd0ad3c1c7b3ca9e66b45950405230cc3f81a205c816
builddeps   :
    - pkgconfig(libblake3)
    - pkgconfig(libzstd)
    - pkgconfig(mimalloc)
    - pkgconfig(tbb)
    - pkgconfig(zlib)
    - mimalloc-static
setup       : |
    %patch %(pkgdir)/0001-Set-default-settings-for-compression-and-build.patch

    # CMAKE_INSTALL_LIBEXECDIR is libdir because it already installs to a mold subdir
    %cmake \
        -DCMAKE_INSTALL_LIBEXECDIR="%(libdir)" \
        -DMOLD_LTO=ON \
        -DMOLD_MOSTLY_STATIC=OFF \
        -DMOLD_USE_SYSTEM_MIMALLOC=ON \
        -DMOLD_USE_SYSTEM_TBB=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
tuning      :
    - icf: all
    - lto: full
    - nosemantic
    - symbolic
