name        : messagelib
version     : "26.08.3"
release     : 27
homepage    : https://invent.kde.org/pim/messagelib
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/messagelib-26.08.3.tar.xz : 9a9c64ccd5c722cb5b6e605d4804ea2be50f0687377737cba82553bbe7856cf2
summary     : KDE PIM messaging library
description : |
    KDE PIM messaging library.
license     :
    - GPL-2.0-only
    - LGPL-2.1-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Archive)
    - cmake(KF6CalendarCore)
    - cmake(KF6Codecs)
    - cmake(KF6Completion)
    - cmake(KF6Config)
    - cmake(KF6Contacts)
    - cmake(KF6CoreAddons)
    - cmake(KF6I18n)
    - cmake(KF6IconThemes)
    - cmake(KF6ItemViews)
    - cmake(KF6JobWidgets)
    - cmake(KF6KIO)
    - cmake(KF6Mime)
    - cmake(KF6NewStuff)
    - cmake(KF6Notifications)
    - cmake(KF6Sonnet)
    - cmake(KF6SyntaxHighlighting)
    - cmake(KF6TextTemplate)
    - cmake(KF6TextWidgets)
    - cmake(KF6XmlGui)
    - cmake(KPim6Akonadi)
    - cmake(KPim6AkonadiContactWidgets)
    - cmake(KPim6AkonadiMime)
    - cmake(KPim6AkonadiSearch)
    - cmake(KPim6Gravatar)
    - cmake(KPim6IdentityManagementWidgets)
    - cmake(KPim6Libkleo)
    - cmake(KPim6MailTransport)
    - cmake(KPim6Mbox)
    - cmake(KPim6PimCommonAkonadi)
    - cmake(QGpgmeQt6)
    - cmake(Qt6WebEngineWidgets)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    # KPim6Message*Config.cmake find_dependency()s these, so consumers need them present
    - "%(name)-devel":
        rundeps:
            - cmake(KF6ColorScheme)
            - cmake(KF6Contacts)
            - cmake(KF6I18n)
            - cmake(KF6Mime)
            - cmake(KF6Service)
            - cmake(KF6TextAutoCorrectionWidgets)
            - cmake(KF6TextCustomEditor)
            - cmake(KPim6Akonadi)
            - cmake(KPim6AkonadiMime)
            - cmake(KPim6IdentityManagementCore)
            - cmake(KPim6IdentityManagementWidgets)
            - cmake(KPim6Libkleo)
            - cmake(KPim6Mbox)
            - cmake(KPim6MimeTreeParser)
            - cmake(KPim6PimCommon)
            - cmake(KPim6PimCommonAkonadi)
            - cmake(Qt6WebEngineWidgets)
