name        : morewaita-icon-theme
version     : "50"
release     : 12
homepage    : https://github.com/somepaulo/MoreWaita
upstreams   :
    - https://github.com/somepaulo/MoreWaita/archive/refs/tags/v50.tar.gz : 2df5022854f8bc77f467dbc71c8dc5e7a5f0f042f90acad0773bc623bd92f769
summary     : An expanded Adwaita-styled icon theme
description : |
    An expanded Adwaita-styled companion icon theme with extra icons for popular apps to complement Gnome Shell's original icons.
license     : GPL-3.0-or-later
builddeps   :
    - binary(gtk-update-icon-cache)
    - adwaita-icon-theme
    - adwaita-icon-theme-legacy
    - hicolor-icon-theme
rundeps     :
    - adwaita-icon-theme
    - hicolor-icon-theme
setup       : |
    %patch %(pkgdir)/0001-Fix-invalid-meson-variable.patch
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
    # Pre-compile icon cache
    for i in %(installroot)%(datadir)/icons/*/; do
        gtk-update-icon-cache -f $i
    done
