name        : mimetreeparser
version     : "26.08.3"
release     : 33
homepage    : https://invent.kde.org/pim/mimetreeparser
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/mimetreeparser-26.08.3.tar.xz : dc98b618ee66ba38a519be421793a752bae1252acfce9e0389e7d0668a9fa13d
summary     : Parser for MIME trees
description : |
    A parser for a MIME tree and is based on KMime. The goal is given a MIME tree to extract a list of parts (e.g. text, html) and a list of attachments, check the validity of the signatures and decrypt any encrypted part.
license     :
    - BSD-2-Clause
    - BSD-3-Clause
    - CC0-1.0
    - FSFULLR
    - GPL-2.0-only
    - GPL-2.0-or-later
    - GPL-3.0-only
    - LGPL-2.0-only
    - LGPL-2.0-or-later
    - LGPL-2.1-only
    - LGPL-3.0-only
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(Gpgmepp)
    - cmake(KF6CalendarCore)
    - cmake(KF6ColorScheme)
    - cmake(KF6I18n)
    - cmake(KF6KIO)
    - cmake(KF6Kirigami)
    - cmake(KF6KirigamiAddons)
    - cmake(KF6Mime)
    - cmake(KF6WidgetsAddons)
    - cmake(KPim6Libkleo)
    - cmake(KPim6Mbox)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6Qml)
rundeps     :
    - kf6-kirigami
    - kf6-kirigami-addons
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    # KPim6MimeTreeParser*Config.cmake find_dependency()s these, so consumers need them present
    - "%(name)-devel":
        rundeps:
            - cmake(KF6I18n)
            - cmake(KF6Mime)
            - cmake(KPim6Libkleo)
            - cmake(KPim6Mbox)
