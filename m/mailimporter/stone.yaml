name        : mailimporter
version     : "26.08.3"
release     : 21
homepage    : https://invent.kde.org/pim/mailimporter
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/mailimporter-26.08.3.tar.xz : fd9dfee4e15a922f284575a68bdfb2e45613f207bdaeda07907d7562936d7f32
summary     : Mail importer library
description : |
    Mail importer library.
license     : GPL-2.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Archive)
    - cmake(KF6I18n)
    - cmake(KF6KIO)
    - cmake(KF6Mime)
    - cmake(KPim6Akonadi)
    - cmake(KPim6AkonadiMime)
    - cmake(KPim6PimCommon)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    # KPim6MailImporter*Config.cmake find_dependency()s these, so consumers need them present
    - "%(name)-devel":
        rundeps:
            - cmake(KF6Archive)
            - cmake(KF6Config)
            - cmake(KF6CoreAddons)
            - cmake(KF6I18n)
            - cmake(KF6KIO)
            - cmake(KF6Mime)
            - cmake(KPim6Akonadi)
            - cmake(KPim6AkonadiMime)
            - cmake(KPim6PimCommon)
