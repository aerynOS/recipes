name        : meld
version     : "3.24.1"
release     : 6
upstreams   :
    - https://download.gnome.org/sources/meld/3.24/meld-3.24.1.tar.xz : 29dfee0d857b89c2fa4dad7c9fb9e48506d8bde3f71b6634798659e6697c6b1e
homepage    : https://meldmerge.org/
license     : GPL-2.0-or-later
summary     : Meld is a visual diff and merge tool targeted at developers.
description : |
    Meld is a visual diff and merge tool targeted at developers.
builddeps   :
    - binary(itstool)
    - binary(msgfmt)
    - binary(update-desktop-database)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(gtksourceview-4)
    - pkgconfig(py3cairo)
    - pkgconfig(pygobject-3.0)
    - pkgconfig(python3)
rundeps     :
    - python(dbus-python)
    - python(pycairo)
    - python(pygobject)
    - gtksourceview4
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
