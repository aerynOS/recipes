name        : mpv
version     : "0.42.0"
release     : 23
homepage    : https://mpv.io/
upstreams   :
    - https://github.com/mpv-player/mpv/archive/refs/tags/v0.42.0.tar.gz : bcfebbfa2b65a6d88dc97ea18117831072373e38b5785a2afb874ed4df5070dd
summary     : a free, open source, and cross-platform media player
description : |
  mpv is a free (as in freedom) media player for the command line. It supports a wide variety of media file formats, audio and video codecs, and subtitle types.
license     :
    - GPL-2.0-or-later
    - LGPL-2.1-or-later
builddeps   :
    - binary(python3)
    - binary(rst2man)
    - cmake(VulkanHeaders)
    - pkgconfig(alsa)
    # pkgconfig(caca)
    - pkgconfig(dvdnav)
    - pkgconfig(dvdread)
    - pkgconfig(egl)
    - pkgconfig(ffnvcodec)
    - pkgconfig(gbm)
    - pkgconfig(jack)
    - pkgconfig(lcms2)
    - pkgconfig(libarchive)
    - pkgconfig(libass)
    - pkgconfig(libavcodec)
    - pkgconfig(libavdevice)
    - pkgconfig(libavfilter)
    - pkgconfig(libavformat)
    - pkgconfig(libavutil)
    # pkgconfig(libbluray)
    - pkgconfig(libcdio)
    - pkgconfig(libcdio_paranoia)
    - pkgconfig(libcurl)
    - pkgconfig(libdisplay-info)
    - pkgconfig(libdrm)
    - pkgconfig(libjpeg)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libplacebo)
    - pkgconfig(libpulse)
    # pkgconfig(libsixel)
    - pkgconfig(libswresample)
    - pkgconfig(libswscale)
    - pkgconfig(libva)
    - pkgconfig(luajit)
    # pkgconfig(mujs)
    - pkgconfig(openal)
    # pkgconfig(rubberband)
    - pkgconfig(sdl2)
    - pkgconfig(shaderc)
    - pkgconfig(sndio)
    # pkgconfig(spirv-cross-c-shared)
    - pkgconfig(uchardet)
    - pkgconfig(vapoursynth)
    - pkgconfig(vulkan)
    - pkgconfig(wayland-client)
    - pkgconfig(wayland-protocols)
    - pkgconfig(x11)
    - pkgconfig(xext)
    - pkgconfig(xfixes)
    - pkgconfig(xkbcommon)
    # pkgconfig(xpresent)
    - pkgconfig(xrandr)
    - pkgconfig(xscrnsaver)
    - pkgconfig(xv)
    - pkgconfig(zimg)
    - pkgconfig(zlib)
setup       : |
    # mpv currently only looks for unversioned libs of vapoursynth
    # we ship vapoursynth in the base package as versioned
    # so patch mpv to accept the .0 version as well
    %patch %(pkgdir)/libvapoursynth-versioned.patch

    %meson \
        -Dlibmpv=true \
        -Dopenal=enabled \
        -Dsdl2-gamepad=enabled
build       : |
    %meson_build
install     : |
    %meson_install

    # from Arch
    %install_file TOOLS/{umpv,mpv_identify.sh,stats-conv.py,idet.sh,lua/*} \
        -t %(installroot)%(datadir)/%(name)/scripts
packages:
    - "%(name)-libs":
        paths:
            - /usr/lib/*.so.*

    - "%(name)-libs-devel":
        paths:
            - /usr/include
            - /usr/lib/*.so
            - /usr/lib/pkgconfig
        rundeps:
            - mpv-libs
