name        : moss
version     : "0.26.10~git.632816b"
release     : 135
summary     : AerynOS package & system state manager
license     : MPL-2.0
homepage    : https://github.com/AerynOS/os-tools
upstreams   :
    - git|https://github.com/aerynOS/os-tools.git :
        ref : 632816b99d374a3007785a9b7d391b29500b2700
description : |
    Advanced package & system state manager with atomic transactions, content deduplication and declarative system-model support.
builddeps   :
    - binary(cargo)
networking  : true
tuning      :
    - optimize: size
    - lto
rundeps     :
    - layout
    - os-info
environment : |
    export RUSTFLAGS="$RUSTFLAGS -C codegen-units=1"
check       : |
    %cargo_test --features moss/testing
setup       : |
    %cargo_fetch
build       : |
    %cargo_build -p moss
install     : |
    %cargo_install

    # Generate completions and man pages
    mkdir generated/
    ./target/*/release/moss completions generated/

    # Install completions
    %install_file generated/_moss %(installroot)%(datadir)/zsh/site-functions/_moss
    %install_file generated/moss.bash %(installroot)%(datadir)/bash-completion/completions/moss
    %install_file generated/moss.fish %(installroot)%(datadir)/fish/completions/moss.fish

    # Install man pages
    %install_dir %(installroot)%(mandir)/man1
    cp generated/*.1 %(installroot)%(mandir)/man1/

    # Install the base cmdline snippet
    %install_file %(pkgdir)/00-quiet.cmdline -t %(installroot)%(libdir)/kernel/cmdline.d/

    # Install the mime type
    %install_file stone.xml -t %(installroot)%(datadir)/mime/packages/

    # Install command-not-found helper
    %install_file %(pkgdir)/80-command-not-found.sh -t %(installroot)%(vendordir)/profile.d/

    %install_dir %(installroot)%(libdir)/dracut/modules.d/90moss
    %install_file boot/module/module-setup.sh -t %(installroot)%(libdir)/dracut/modules.d/90moss/
    %install_file boot/moss-fstx.service -t %(installroot)%(libdir)/systemd/system/
    %install_exe boot/moss-fstx.sh -t %(installroot)%(libdir)/moss/
