name        : mimalloc
version     : "3.6.1"
release     : 22
homepage    : https://github.com/microsoft/mimalloc
upstreams   :
    - https://github.com/microsoft/mimalloc/archive/refs/tags/v3.6.1.tar.gz:
        hash: 2672e6a99d4579fb4bb32d9de0d63aa424ce600d31fbfaf06eb74d940d2e07a6
        unpackdir: current

    # - https://github.com/microsoft/mimalloc/archive/refs/tags/v2.5.1.tar.gz:
    #     hash: 8381e86a7fe49b1e8759574ca1ad4dc915cedc1181182e4623454df53ed9abed
    #     unpackdir: compat
summary     : Compact general purpose allocator
description : |
    mimalloc is a compact general purpose allocator with excellent performance.
license     : MIT
setup       : |
    if [ -d ../compat ]; then
        pushd ../compat

        %cmake \
            -DMI_ALLOW_THP=OFF \
            -DMI_BUILD_OBJECT=OFF \
            -DMI_BUILD_STATIC=ON \
            -DMI_INSTALL_TOPLEVEL=ON
        popd
    fi

    # 2026-09-11: Enabling transparent huge pages actually slows down clang startup slightly likely due to the aerynOS kernel already enabling THP by default
    %cmake \
        -DMI_ALLOW_THP=OFF \
        -DMI_BUILD_OBJECT=OFF \
        -DMI_BUILD_STATIC=ON \
        -DMI_INSTALL_TOPLEVEL=ON
build       : |
    if [ -d ../compat ]; then
        pushd ../compat
            %ccache_zero
            env CCACHE_BASEDIR="${PWD}" %cmake_build
            %ccache_stats
        popd
    fi

    %ccache_zero
    env CCACHE_BASEDIR="${PWD}" %cmake_build
    %ccache_stats
install     : |
    if [ -d ../compat ]; then
        pushd ../compat
            mkdir tmp
            DESTDIR="${PWD}/tmp" cmake --install "%(builddir)" --verbose

            # Only copy the sonames
            %install_dir %(installroot)/%(libdir)
            find ${PWD}/tmp/%(libdir) -name "libmimalloc.so.*" -print -exec mv {} %(installroot)/%(libdir) \;
        popd
    fi

    %cmake_install
check       : |
    # Full LTO inlines the ten allocation call sites the pprof multi-site test needs distinct
    %cmake_test -E test-pprof
tuning      :
    - lto: full
    - optimize: speed
packages    :
    - "%(name)-static":
        summary: Static libs for %(name)
        description: Static libs for %(name)
        paths:
            - /usr/lib/lib*.a
        rundeps:
            - "%(name)-devel"
