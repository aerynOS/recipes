name        : mpvqt
version     : "1.2.1"
release     : 7
homepage    : https://mpv.io/
upstreams   :
    - https://download.kde.org/stable/mpvqt/mpvqt-1.2.1.tar.xz : 6ff5f56a0edd8248073446e5cc038f47d4b17c46b6af43cf438123d0ac911189
summary     : MpvQt is a libmpv wrapper for QtQuick and QML
description : |
    MpvQt is a libmpv wrapper for QtQuick and QML
license     :
    - BSD-2-Clause
    - BSD-3-Clause
    - CC-BY-SA-4.0
    - CC0-1.0
    - LGPL-2.1-only
    - LGPL-3.0-only
    - LicenseRef-KDE-Accepted-LGPL
    - MIT
builddeps   :
    - cmake(ECM)
    - cmake(Qt6Quick)
    - pkgconfig(mpv)
setup       : |
    %cmake
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-devel":
        rundeps:
            - cmake(Qt6Quick)
            - pkgconfig(mpv)
