name        : maven
version     : "3.10.0"
release     : 5
homepage    : https://maven.apache.org
upstreams   :
    - https://dlcdn.apache.org/maven/maven-3/3.10.0/source/apache-maven-3.10.0-src.tar.gz:
        hash: aa4d8ff3b71b636e6826b91695062d909ea6949a27e3442dd2762d8459439df9
        unpackdir: "maven"

    # Comment out this section if bootstrapping isn't necessary
    # - https://dlcdn.apache.org/maven/maven-3/3.9.14/binaries/apache-maven-3.9.14-bin.tar.gz :
    #     hash: 126ed3233e569bd0add9e889d226139acd3de9005876a01fe6108fbf4246f515
    #     unpackdir: "maven/bootstrap"
summary     : Build automation tool for Java Projects
description : |
    Apache Maven is a build tool for Java projects. Using a project object model (POM), Maven manages a project's compilation, testing, and documentation.
license     : Apache-2.0
networking  : true
builddeps   :
    - binary(java-21)
    - binary(mvn)
    - binary(tar)
rundeps     :
    - binary(java-21)
environment : |
    _maven_dir="%(datadir)/%(name)"

    export JAVA_HOME=%(libdir)/openjdk-21
    export PATH=$JAVA_HOME/bin:$PATH

    if [ -d "bootstrap" ]; then
        export PATH="%(workdir)/bootstrap/bin:$PATH"
    fi
setup       : |
    # org.eclipse.m2e:lifecycle-mapping is an m2e IDE-only artifact that is not
    # published to Maven Central; exclude it so dependency:go-offline succeeds
    mvn dependency:go-offline \
        -DexcludeGroupIds=org.eclipse.m2e
build       : |
    mvn compile \
        -DdistributionTargetDir="%(installroot)${_maven_dir}" \
        -Drat.skip=true \
        -DskipTests
install     : |
    mvn install javadoc:aggregate \
        -DdistributionTargetDir="%(installroot)${_maven_dir}" \
        -Drat.skip=true \
        -DskipTests

    # Only keep the Linux x86_64 JLine native library
    rm -rf %(installroot)${_maven_dir}/lib/jline-native/{FreeBSD,Windows} \
           %(installroot)${_maven_dir}/lib/jline-native/Linux/{arm,arm64,armv6,armv7,ppc64,x86}

    %install_dir %(installroot)/usr/bin
    ln -srv %(installroot)${_maven_dir}/bin/mvn %(installroot)%(bindir)/mvn
    ln -srv %(installroot)${_maven_dir}/bin/mvnDebug %(installroot)%(bindir)/mvnDebug
