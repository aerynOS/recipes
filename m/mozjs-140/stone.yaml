name        : mozjs-140
version     : "140.17.0"
release     : 21
homepage    : https://mozilla.org
upstreams   :
    - https://archive.mozilla.org/pub/firefox/releases/140.17.0esr/source/firefox-140.17.0esr.source.tar.xz : 4d6ed3b18b2069c55bab12d8ba95da6013ac0b036d8a031df8b9f39a25d05c33
summary     : Mozilla's Spidermonkey JS Engine
description : |
    SpiderMonkey is the code-name for the Mozilla's C++ implementation of JavaScript.
    It is used in various Mozilla products, including Firefox, and is available under MPL-2.0.
    Notably, it is used in the GNOME Shell for its JavaScript extensions and core functionality.
license     : MPL-2.0
packages    :
    - "%(name)":
        paths:
            # No actual soname, force it back into main package
            - /usr/lib/lib*.so
    - "%(name)-devel":
        paths:
            - /usr/bin/js140-config
builddeps   :
    - binary(cargo)
    - binary(cbindgen)
    - binary(m4)
    - binary(objdump)
    - binary(python3)
    - binary(which)
    - pkgconfig(icu-uc)
    - pkgconfig(nspr)
    - pkgconfig(readline)
    - pkgconfig(zlib)
environment : |
    unset RUSTFLAGS
setup       : |
    %patch %(pkgdir)/upstream-01.patch
    %patch %(pkgdir)/upstream-02.patch

    mkdir obj && cd obj
    ../js/src/configure \
        --prefix=%(prefix) \
        --libdir=%(libdir) \
        --enable-optimize \
        --enable-readline \
        --enable-release \
        --disable-jemalloc \
        --with-intl-api \
        --with-system-icu \
        --with-system-nspr \
        --with-system-zlib
build       : |
    cd obj
    %make
install     : |
    cd obj
    %make_install
    # Remove honkin great big library nobody asked for
    rm -v %(installroot)%(libdir)/*static.ajs
