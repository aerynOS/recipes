name        : milou
version     : "6.8.3"
release     : 36
homepage    : https://kde.org/plasma-desktop/
upstreams   :
    - https://download.kde.org/stable/plasma/6.8.3/milou-6.8.3.tar.xz : 87706400f9f82277cba4aeffbcc8d67e74b89f33038a7d49c0e7db6db3138f86
summary     : A dedicated search application built on top of Baloo
description : |
    A dedicated search application built on top of Baloo
license     :
    - GPL-2.0-or-later
    - LGPL-2.1-only
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Config)
    - cmake(KF6I18n)
    - cmake(KF6Runner)
    - cmake(KF6Svg)
    - cmake(Plasma)
    - cmake(Qt6CorePrivate)
tuning      :
    - lto: full
    - optimize: speed
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
