name        : iniparser
version     : "4.3.2"
release     : 5
homepage    : https://gitlab.com/iniparser/iniparser
upstreams   :
    - https://gitlab.com/iniparser/iniparser/-/archive/v4.3.2/iniparser-v4.3.2.tar.gz : d7382f72f94649afa7a9d61346a7fc31cd3ff9ae389a71f92770133d49f1b22c
summary     : This modules offers parsing of ini files from C
description : |
    This modules offers parsing of ini files from C.

    Key features:

        Small : around 1500 sloc inside 4 files (2 .c and 2 .h)
        Portable : false dependancies, written in -pedantic C
        Fully re-entrant : easy to make it thread-safe (just surround library calls by mutex)

license     : MIT
