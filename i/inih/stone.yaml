name        : inih
version     : "63"
release     : 9
homepage    : https://github.com/benhoyt/inih
upstreams   :
    - https://github.com/benhoyt/inih/archive/refs/tags/r63.tar.gz : 5d7967de62c5bfdc4f9f5ab06ce44c9e498bae021c7dac5792c0696e76aa9963
summary     : inih is a simple .INI file parser written in C
description : |
    inih is a simple .INI file parser written in C
license     : BSD-3-Clause
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
tuning      :
    - lto: full
packages    :
    - "%(name)-cpp":
        summary: INIReader C++ library
        description: This package contains the INIReader C++ library which provides a C++ interface for inih.
        paths:
            - /usr/lib/libINIReader.so.*

    - "%(name)-devel":
        rundeps:
            - "%(name)-cpp"
