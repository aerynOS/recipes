name        : isoimagewriter
version     : "26.08.3"
release     : 7
homepage    : https://apps.kde.org/isoimagewriter/
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/isoimagewriter-26.08.3.tar.xz : 768fba424780a321590c93d599048579cfa4a23f5c01313b31116512ece7d46c
summary     : ISO Image Writer is a KDE tool to write a .iso file to a USB disk
description : |
    ISO Image Writer is a KDE tool to write a .iso file to a USB disk
license     : GPL-3.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(Gpgmepp)
    - cmake(KF6Archive)
    - cmake(KF6CoreAddons)
    - cmake(KF6Crash)
    - cmake(KF6I18n)
    - cmake(KF6IconThemes)
    - cmake(KF6Solid)
    - cmake(KF6WidgetsAddons)
    - cmake(QGpgmeQt6)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
