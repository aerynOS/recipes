name        : icu
version     : "79.1"
release     : 16
homepage    : https://icu.unicode.org/
upstreams   :
    - https://github.com/unicode-org/icu/releases/download/release-79.1/icu4c-79.1-sources.tgz:
        hash: 06fa63ecb521048f8082f12ad988f6b678d90cbd88aafce24cbc94902b191d99
        unpackdir: current

    # Don't delete this section, just comment it out if it's not needed. The build recipe accounts for it possibly not existing
    - https://github.com/unicode-org/icu/releases/download/release-78.3/icu4c-78.3-sources.tgz:
        hash: 3a2e7a47604ba702f345878308e6fefeca612ee895cf4a5f222e7955fabfe0c0
        unpackdir: compat
summary     : International Components for Unicode
description : |
    The International Components for Unicode (ICU) package is a mature, widely used set of C/C++ libraries providing Unicode and Globalization support for software applications. ICU is widely portable and gives applications the same results on all platforms.
license     : MIT
emul32      : true
builddeps   :
    - binary(doxygen)
checkdeps   :
    - binary(python3)
profiles    :
    - emul32:
        setup       : |
            if [ -d ../compat ]; then
                pushd ../compat/source

                # thunderbird to show Calendar and sidebar properly.
                # https://bugzilla.mozilla.org/show_bug.cgi?id=1843007
                # https://unicode-org.atlassian.net/browse/ICU-22132
                %patch %(pkgdir)/ICU-22132.patch -p2

                %configure \
                    --disable-static
                popd
            fi

            cd source
            # thunderbird to show Calendar and sidebar properly.
            # https://bugzilla.mozilla.org/show_bug.cgi?id=1843007
            # https://unicode-org.atlassian.net/browse/ICU-22132
            %patch %(pkgdir)/ICU-22132.patch -p2

            %configure \
                --disable-static
        check       : |
            cd source
            # Currently failing on i686
            %make check || :
setup       : |
    if [ -d ../compat ]; then
        pushd ../compat/source

        # thunderbird to show Calendar and sidebar properly.
        # https://bugzilla.mozilla.org/show_bug.cgi?id=1843007
        # https://unicode-org.atlassian.net/browse/ICU-22132
        %patch %(pkgdir)/ICU-22132.patch -p2

        %configure
        popd
    fi

    cd source

    # thunderbird to show Calendar and sidebar properly.
    # https://bugzilla.mozilla.org/show_bug.cgi?id=1843007
    # https://unicode-org.atlassian.net/browse/ICU-22132
    %patch %(pkgdir)/ICU-22132.patch -p2

    # Static libs for static bsdtar
    %configure \
        --enable-static
build       : |
    if [ -d ../compat ]; then
        pushd ../compat/source
            %ccache_zero
            env CCACHE_BASEDIR="${PWD}" %make
            %ccache_stats
        popd
    fi

    cd source
    %ccache_zero
    env CCACHE_BASEDIR="${PWD}" %make
    %ccache_stats
install     : |
    if [ -d ../compat ]; then
        pushd ../compat/source
            mkdir tmp
            make install DESTDIR="${PWD}/tmp"

            # Only copy the sonames
            %install_dir %(installroot)/%(libdir)
            find ${PWD}/tmp/%(libdir) -name "*.so.*" -print -exec mv {} %(installroot)/%(libdir) \;
        popd
    fi

    cd source
    %make_install
check       : |
    cd source
    %make check
tuning      :
    - fortify: lvl2 # lvl3 causes test segfaults
    - lto: full
packages    :
    - "%(name)-libs":
        summary: "Library files for %(name)"
        description: |
            Library files for %(name), typically pulled in as a dependency of another package.
        paths:
            - /usr/lib/lib*.so.*

    # Workaround moss issue with moving libraries to libs package
    - "%(name)":
        rundeps:
            - "%(name)-libs"

    - "%(name)-devel":
        paths:
            - /usr/bin/icu-config
            - /usr/bin/icuinfo
            - /usr/lib/icu
            - /usr/share/icu
            - /usr/share/man/man1/icu-config*

    - "%(name)-static":
        paths:
            - /usr/lib/lib*.a
        rundeps:
            - "%(name)-devel"

    - "%(name)-32bit-devel":
        paths:
            - "/usr/lib32/icu"
