name        : intel-compute-runtime
version     : "26.40.40196.15"
release     : 10
homepage    : https://github.com/intel/compute-runtime
upstreams   :
    - https://github.com/intel/compute-runtime/archive/refs/tags/26.40.40196.15.tar.gz : 138ad074eb617372ddc778cf2b63f382f210a4cbf5a1cd38d207567ffa74a7e3
    - git|https://github.com/intel/aubstream.git : 941711fa1499871e7c81038ded0e6e386c254dcd
summary     :  Intel® Graphics Compute Runtime for oneAPI Level Zero and OpenCL™ Driver
description : |
    The Intel(R) Graphics Compute Runtime for oneAPI Level Zero and OpenCL(TM) Driver is an open source project providing compute API support (Level Zero, OpenCL) for Intel graphics hardware architectures (HD Graphics, Xe).
license     : MIT
builddeps   :
    - binary(mold)
    - cmake(igsc)
    - pkgconfig(igc-opencl)
    - pkgconfig(igdgmm)
    - pkgconfig(level-zero)
    - pkgconfig(libdrm)
    - pkgconfig(libigdmd)
    - pkgconfig(libigdml)
    - pkgconfig(libnl-3.0)
    - pkgconfig(libtracefs)
    - pkgconfig(libudev)
    - pkgconfig(libva)
    - pkgconfig(libze_loader)
    - pkgconfig(ocl-icd)
rundeps     :
    - intel-graphics-compiler
    - level-zero
tuning      :
    # let CMake set LTO
   - lto: false
environment : |
    export LDFLAGS="$LDFLAGS -fuse-ld=mold"
setup       : |
    # cmake strips -O and fortify flags from tests but fails
    # since the regex is quite brittle. patch to match our flags
    %patch %(pkgdir)/fortify-source-3.patch

    # TODO: remove this patch in next update
    %patch %(pkgdir)/ftbfs-llvm-23-unused-but-set-global.patch

    %cmake \
        -DAUB_STREAM_DIR=%(buildroot)/aubstream.git \
        -DDISABLE_WDDM_LINUX=ON \
        -DLIBTRACEFS_INCLUDE_DIR=%(includedir)/libtracefs \
        -DNEO_BUILD_UNVERSIONED_OCLOC=ON \
        -DNEO_VERSION_BUILD=$(echo "%(version)" | cut -d. -f3) \
        -DOCL_ICD_VENDORDIR=%(datadir)/OpenCL/vendors
# Tests run automatically during build, check section not required
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)":
        paths:
            - /usr/lib/liboc*
