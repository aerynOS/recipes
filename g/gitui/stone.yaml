name        : gitui
version     : 0.28.1
release     : 3
homepage    : https://github.com/gitui-org/gitui
upstreams   :
    - https://github.com/gitui-org/gitui/archive/refs/tags/v0.28.1.tar.gz : 0400cbf59605490b5fb8779f9af41fa4d7a1bb748093ca0e13156a5dff31c7aa
summary     : Git terminal user interface
description : |
    Git terminal user interface
license     : MIT
networking  : true
builddeps   :
    - pkgconfig(libgit2)
    - pkgconfig(libssh2)
    - pkgconfig(openssl)
    - pkgconfig(zlib)
checkdeps   :
    - binary(python)
environment : |
    export LIBGIT2_NO_VENDOR=1
    export LIBSSH2_SYS_USE_PKG_CONFIG=1
    export OPENSSL_NO_VENDOR=true
setup       : |
    %patch %(pkgdir)/ftbfs-openssl-4.patch
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    %cargo_install
check       : |
    # test_env_variables sets GIT_DIR process-wide and races the other tests
    # Upstream uses `cargo nextest` which runs each test in a separate process and avoids this issue.
    # We don't package that and these tests complete in a second anyway even single-threaded
    %cargo_test -- --test-threads=1
