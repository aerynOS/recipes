name        : gdb
version     : "18.1"
release     : 12
homepage    : https://www.sourceware.org/gdb
upstreams   :
    - https://ftp.gnu.org/gnu/gdb/gdb-18.1.tar.xz : cd9fc3fe2b47743840e42c1592d3d87f8302eb18639c0b8b4ba0898002e2348f
summary     : The GNU debugger
description : |
    GDB, the GNU Project debugger, allows you to see what is going on "inside" another program while it executes - or what another program was doing at the moment it crashed.
license     :
    - GPL-3.0-or-later
builddeps   :
    - binary(makeinfo)
    - binary(msgfmt)
    - pkgconfig(expat)
    - pkgconfig(gmp)
    - pkgconfig(libdebuginfod)
    - pkgconfig(liblzma)
    - pkgconfig(libxxhash)
    - pkgconfig(libzstd)
    - pkgconfig(mpfr)
    - pkgconfig(python3)
    - pkgconfig(readline)
    - pkgconfig(zlib)
    # TODO: libguile, libipt, source-highlight
setup       : |
    %configure \
        --enable-tui \
        --with-python=%(bindir)/python3 \
        --with-system-readline \
        --with-system-zlib \
        --with-zstd
build       : |
    %make
install     : |
    %make_install -C gdb
    %make_install -C gdbserver

    rm -rv %(installroot)/usr/share/info/dir

    %install_dir %(installroot)/%(docdir)/replace/%(name)-devel
    echo "Removed" > %(installroot)/%(docdir)/replace/%(name)-devel/TRANSITION
packages    :
    - "%(name)":
        paths:
            - /usr/include
            - /usr/lib/*.so

    - "%(name)-devel":
        paths:
            - /usr/share/doc
