name        : gspell
version     : "1.14.5"
release     : 4
homepage    : https://gitlab.gnome.org/GNOME/gspell
upstreams   :
    - https://download.gnome.org/sources/gspell/1.14/gspell-1.14.5.tar.xz : 788783b56fc3d03283b3aa29302d0b958aeca88835e10b1ec61f19e0efc7e8a4
summary     : Spell-checking library for GTK+ applications
description : |
    Spell-checking library for GTK+ applications
license     :
    - LGPL-2.1-or-later
builddeps   :
    - binary(gtkdoc-scan)
    - binary(vapigen)
    - pkgconfig(enchant-2)
    - pkgconfig(gio-2.0)
    - pkgconfig(gobject-introspection-1.0)
    - pkgconfig(gtk+-3.0)
    - docbook-xsl
environment : |
    %export_docbook_catalogs
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
