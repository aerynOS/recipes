name        : gspell
version     : "1.14.6"
release     : 5
homepage    : https://gitlab.gnome.org/GNOME/gspell
upstreams   :
    - https://download.gnome.org/sources/gspell/1.14/gspell-1.14.6.tar.xz : d02a6f1ff3cf324798f184062a6777302ef4b325deab277d8469d3816c69282d
summary     : Spell-checking library for GTK+ applications
description : |
    Spell-checking library for GTK+ applications
license     :
    - LGPL-2.1-or-later
builddeps   :
    - binary(gtkdoc-scan)
    - binary(vapigen)
    - pkgconfig(enchant-2)
    - pkgconfig(gio-2.0)
    - pkgconfig(gobject-introspection-1.0)
    - pkgconfig(gtk+-3.0)
    - docbook-xsl
environment : |
    %export_docbook_catalogs
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
