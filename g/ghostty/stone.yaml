name        : ghostty
version     : "1.4.0"
release     : 12
homepage    : https://github.com/ghostty-org/ghostty
upstreams   :
    - https://github.com/ghostty-org/ghostty/archive/refs/tags/v1.4.0.tar.gz : 2e2a2516f9bea89a4991ad7c9401b77682eed366387a5b1d7c629472b5d11a43
summary     : Ghostty is a fast, feature-rich, and cross-platform terminal emulator that uses platform-native UI and GPU acceleration
description : |
    Ghostty is a terminal emulator that differentiates itself by being fast, feature-rich, and native. While there are many excellent terminal emulators available, they all force you to choose between speed, features, or native UIs. Ghostty provides all three.
license     : MIT
networking  : true
builddeps   :
    - binary(gettext)
    - binary(pandoc)
    - binary(tic)
    - binary(zig-0.17)
    - pkgconfig(blueprint-compiler)
    - pkgconfig(egl)
    - pkgconfig(freetype2)
    - pkgconfig(gtk4)
    - pkgconfig(gtk4-layer-shell-0)
    - pkgconfig(harfbuzz)
    - pkgconfig(libadwaita-1)
    - pkgconfig(libhwy)
    - pkgconfig(libpng)
    - pkgconfig(libxml-2.0)
    - pkgconfig(oniguruma)
    - pkgconfig(zlib)
    - glslang-devel
environment : |
    if [ -z "${ZIG_GLOBAL_CACHE_DIR:-}" ]; then
        export ZIG_GLOBAL_CACHE_DIR="%(builddir)/zig-cache"
    fi
    export DESTDIR=%(installroot)
setup       : |
    %patch %(pkgdir)/0001-Do-not-build-static-libghostty-vt.patch
    %patch %(pkgdir)/0002-Source-stateless-bash-defaults.patch

    # Fetch the full dependency tree (including lazy deps) into the global cache
    zig-0.17 build --fetch=all

    # zig 0.17 caches packages as tarballs but --system wants unpacked dirs
    mkdir -p "offline"
    for f in "$ZIG_GLOBAL_CACHE_DIR"/p/*.tar.gz; do
        bsdtar-static -xf "$f" -C "offline"
    done
build       : |
    zig-0.17 build \
      -j%(jobs) \
      --prefix %(prefix) \
      --system "offline" \
      --summary all \
      --verbose \
      -Doptimize=ReleaseFast \
      -Dstrip=false \
      -Dcpu=x86_64_v2 \
      -Dversion-string="%(version)-aerynos"
packages     :
    - "%(name)":
        rundeps:
            - "terminfo-%(name)"

    - "terminfo-%(name)":
        summary: Terminfo for %(name)
        description: Terminfo for %(name), split out so that it can be used from ncurses
        paths:
            - /usr/share/terminfo/
