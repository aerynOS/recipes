name        : grantleetheme
version     : "26.08.3"
release     : 20
homepage    : https://invent.kde.org/pim/grantleetheme
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/grantleetheme-26.08.3.tar.xz : 17d50f800a51f87671d8f21fcf4d275401372f918a20edd90ecad30b5572ba4a
summary     : GrantleeTheme library provides a class for loading theme packages containing sets of templates
description : |
    GrantleeTheme library provides a class for loading theme packages containing sets of templates.
license     : LGPL-2.1-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6GuiAddons)
    - cmake(KF6I18n)
    - cmake(KF6IconThemes)
    - cmake(KF6NewStuff)
    - cmake(KF6TextTemplate)
    - cmake(KF6XmlGui)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-devel":
        rundeps:
            - cmake(KF6TextTemplate)
