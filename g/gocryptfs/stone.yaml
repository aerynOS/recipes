name        : gocryptfs
version     : "2.7.0"
release     : 3
homepage    : https://github.com/rfjakob/gocryptfs 
upstreams   :
    - https://github.com/rfjakob/gocryptfs/releases/download/v2.7.0/gocryptfs_v2.7.0_src-deps.tar.gz : 52a271a12bcab3b2e51c0e7baa53a2beeebc9f811d8b28d6b23662a2b70e5680
