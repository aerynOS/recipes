name        : gnome-control-center
version     : "51.0"
release     : 39
homepage    : https://apps.gnome.org/Settings/
upstreams   :
    - https://download.gnome.org/sources/gnome-control-center/51/gnome-control-center-51.0.tar.xz : c8ca5b6a0ae44fd0d64aac5aa3b79a83c2445095b159a9d13d1c9cc172ac4fb9
summary     : Utility to configure the GNOME desktop
description : |
    Settings is the primary interface for configuring your system.
license     :
    - GPL-2.0-or-later
    - JSON
builddeps   :
    - binary(blueprint-compiler)
    - binary(msgfmt)
    - binary(setxkbmap)
    - pkgconfig(accountsservice)
    - pkgconfig(cairo-gobject)
    - pkgconfig(colord)
    - pkgconfig(colord-gtk4)
    - pkgconfig(cups)
    - pkgconfig(epoxy)
    - pkgconfig(gcr-4)
    - pkgconfig(gdk-pixbuf-2.0)
    - pkgconfig(gio-2.0)
    - pkgconfig(gio-unix-2.0)
    - pkgconfig(glib-2.0)
    - pkgconfig(gnome-bg-4)
    - pkgconfig(gnome-bluetooth-ui-3.0)
    - pkgconfig(gnome-desktop-4)
    - pkgconfig(gnome-settings-daemon)
    - pkgconfig(gnutls)
    - pkgconfig(goa-1.0)
    - pkgconfig(goa-backend-1.0)
    - pkgconfig(gsettings-desktop-schemas)
    - pkgconfig(gsound)
    - pkgconfig(gthread-2.0)
    - pkgconfig(gtk4)
    - pkgconfig(gudev-1.0)
    - pkgconfig(json-glib-1.0)
    - pkgconfig(ibus-1.0)
    - pkgconfig(krb5)
    - pkgconfig(libadwaita-1)
    - pkgconfig(libgtop-2.0)
    - pkgconfig(libnm)
    - pkgconfig(libnma)
    - pkgconfig(libnma-gtk4)
    - pkgconfig(libpulse)
    - pkgconfig(libpulse-mainloop-glib)
    - pkgconfig(libsecret-1)
    - pkgconfig(libsoup-3.0)
    - pkgconfig(libwacom)
    - pkgconfig(libxml-2.0)
    - pkgconfig(mm-glib)
    - pkgconfig(polkit-gobject-1)
    - pkgconfig(pwquality)
    - pkgconfig(smbclient)
    - pkgconfig(tecla)
    - pkgconfig(udisks2)
    - pkgconfig(upower-glib)
    - pkgconfig(wayland-client)
    - pkgconfig(x11)
    # gmobile
rundeps     :
    - cups-pk-helper
    - gnome-online-accounts
    - gnome-remote-desktop
    - tecla
setup       : |
    %meson \
        -Ddark_mode_distributor_logo=%(datadir)/icons/aerynos-logo-dark.svg \
        -Ddistributor_logo=%(datadir)/icons/aerynos-logo.svg
build       : |
    %meson_build
install     : |
    %meson_install
