name        : gpu-screen-recorder
version     : "6.1.7"
release     : 4
homepage    : https://git.dec05eba.com/gpu-screen-recorder/about/
upstreams   :
    - https://dec05eba.com/snapshot/gpu-screen-recorder.git.6.1.7.tar.gz:
        hash: 17be095ed8c6200c467c1477cc127c97b056b25071443d015e0ef026cf3fcd73
        stripdirs: 0
summary     : An extremely fast hardware-accelerated screen recorder
description : |
    GPU Screen Recorder is a high-performance screen recorder for Linux that
    minimizes system overhead by leveraging GPU hardware encoding. It can be
    used for local recording, streaming, and instant-replay workflows.
license     : GPL-3.0-only
builddeps   :
    - pkgconfig(dbus-1)
    - pkgconfig(libavcodec)
    - pkgconfig(libavfilter)
    - pkgconfig(libavformat)
    - pkgconfig(libcap)
    - pkgconfig(libdrm)
    - pkgconfig(libglvnd)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libpulse)
    - pkgconfig(libva)
    - pkgconfig(vulkan)
    - pkgconfig(wayland-client)
    - pkgconfig(x11)
    - pkgconfig(xcomposite)
    - pkgconfig(xdamage)
    - pkgconfig(xrandr)
setup       : |
    %meson \
        -Dcapabilities=false
build       : |
    %meson_build
install     : |
    %meson_install
