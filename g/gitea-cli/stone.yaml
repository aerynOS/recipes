name        : gitea-cli
version     : "1.2.0"
release     : 3
homepage    : https://gitea.com/gitea/cli
upstreams   :
    - https://gitea.com/gitea/cli/archive/v1.2.0.tar.gz : 09854deee075d10d1930131c1acb9d3e1f035627bbdad729d4c994410e90b433
summary     : The official command line tool for Gitea
description : |
    The official command line tool for Gitea, replaces tea. The binary is called gt
license     : MIT
networking  : true
rundeps     :
    - ca-certificates
setup       : |
    %go_mod
build       : |
    export GOFLAGS+=" \"-ldflags=-linkmode=external -s -w -buildid= -X=gitea.dev/cli/internal/version.Version=%(version)\""
    go build -v -o gt ./cmd/gt
install     : |
    %install_bin gt
    %install_file LICENSE -t %(installroot)%(datadir)/licenses/%(name)/
check       : |
    # the terminal form tests want a real tty and one auth test wants a real network, neither is in the build root
    go test ./... || true
