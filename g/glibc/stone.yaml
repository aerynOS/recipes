name        : glibc
version     : "2.44~git.21442dba"
release     : 48
homepage    : https://www.gnu.org/software/libc
upstreams   :
    - git|https://sourceware.org/git/glibc.git :
        ref : 21442dba0d0be00d8b875349ba9fc71daa1639ce
summary     : The GNU libc libraries
description : |
    The GNU C Library provides the standard C library and the system-call
    interface used by most programs on aerynOS. It contains the dynamic
    linker, the core C and POSIX APIs, math and threading libraries, charset
    conversion and locale support, the Name Service Switch, and timezone
    utilities.
license     :
    - GPL-2.0-or-later
    - LGPL-2.1-or-later
    - LGPL-2.1-or-later WITH GCC-exception-2.0
    - BSD-3-Clause
    - CMU-Mach
    - GFDL-1.3-or-later
    - HPND
    - Inner-Net-2.0
    - ISC
    - MIT
    - SunPro
builddeps   :
    - binary(bison)
    - binary(gperf)
    - binary(gzip)
    - binary(m4)
    - binary(makeinfo)
    - binary(msgfmt)
    - binary(patch)
    - binary(python3)
    - binary(zstd)
    - gcc-32bit
    - linux-headers
    # - pkgconfig(gdlib) # enables memusagestat, but pulls in gd's imaging/X dependency chain
toolchain   : gnu
emul32      : true
tuning      :
    - asneeded: false
    #- avxwidth: false
    - base: false
    - bindnow: false
    - fortify: false
    - harden: false
    - lto: false
    - optimize: speed
    - symbolic: nonweak
environment : |
    # --enable-kernel tracks the fourth-most-recent LTS kernel (kernel.org longterm)
    # TODO: systemtap support (--enable-systemtap and sys/sdt.h) once a systemtap package exists
    export COMMON_GLIBC_OPTIONS="\
        %(options_configure) \
            --disable-build-nscd \
            --disable-nscd \
            --enable-bind-now \
            --enable-fortify-source \
            --enable-kernel=6.1 \
            --enable-multi-arch \
            --enable-stack-protector=strong \
            --with-selinux=no
    "
profiles    :
    - emul32:
        setup: |
            %patch %(pkgdir)/perf/0001-Remove-RELR-dependency-check.patch
            %patch %(pkgdir)/aerynos/0001-sysdeps-Add-support-for-default-directories.patch
            %patch %(pkgdir)/aerynos/0001-Force-correct-RTLDLIST-for-ldd.patch
            %patch %(pkgdir)/aerynos/0001-Compress-charmaps-with-zstd.patch
            %patch %(pkgdir)/aerynos/0001-downstream-Update-default-PATH.patch
            %patch %(pkgdir)/stateless/make-hosts-file-stateless.patch
            %patch %(pkgdir)/stateless/Support-fallback-stateless-shells-path.patch
            %patch %(pkgdir)/stateless/Use-a-stateless-ld.so.conf.patch
            %patch %(pkgdir)/stateless/0001-Stateless-nsswitch.conf.patch
            %patch %(pkgdir)/stateless/ld-so-cache-in-var.patch

            mkdir build && cd build
            echo "LD_SO_CACHE=/var/cache/ldconfig/ld.so.cache" >> configparms
            echo "slibdir=%(libdir)" >> configparms
            echo "rtlddir=%(libdir)" >> configparms
            echo "sbindir=%(sbindir)" >> configparms
            echo "rootsbindir=%(sbindir)" >> configparms
            # Note this deliberately excludes libsuffix and is not an error
            echo "complocaledir=/usr/lib/locale" >> configparms

            ../configure \
                $COMMON_GLIBC_OPTIONS \
                --disable-cet
        install: |
            %make_install build DESTDIR="%(installroot)" -C build

            # Make gconv cache
            LD_LIBRARY_PATH=%(installroot)/%(libdir) %(installroot)/%(libdir)/ld-linux.so.2 %(installroot)/usr/sbin/iconvconfig --prefix=%(installroot)

            # We don't support nss_db/hesiod currently
            rm -v %(installroot)/%(bindir)/makedb \
                %(installroot)/%(libdir)/libnss_db.so* \
                %(installroot)/%(libdir)/libnss_hesiod.so* \
                %(installroot)/var/db/Makefile
            rmdir -v %(installroot)/var/db %(installroot)/var

            # Support old compiled 32bit binaries
            %install_dir %(installroot)/usr/lib
            ln -sv ../lib32/ld-linux.so.2 %(installroot)/usr/lib/ld-linux.so.2
setup       : |
    %patch %(pkgdir)/perf/0001-Remove-RELR-dependency-check.patch
    %patch %(pkgdir)/aerynos/0001-sysdeps-Add-support-for-default-directories.patch
    %patch %(pkgdir)/aerynos/0001-Force-correct-RTLDLIST-for-ldd.patch
    %patch %(pkgdir)/aerynos/0001-Compress-charmaps-with-zstd.patch
    %patch %(pkgdir)/aerynos/0001-downstream-Update-default-PATH.patch
    %patch %(pkgdir)/stateless/make-hosts-file-stateless.patch
    %patch %(pkgdir)/stateless/Support-fallback-stateless-shells-path.patch
    %patch %(pkgdir)/stateless/Use-a-stateless-ld.so.conf.patch
    %patch %(pkgdir)/stateless/0001-Stateless-nsswitch.conf.patch
    %patch %(pkgdir)/stateless/ld-so-cache-in-var.patch

    mkdir build && cd build
    echo "LD_SO_CACHE=/var/cache/ldconfig/ld.so.cache" >> configparms
    echo "slibdir=%(libdir)" >> configparms
    echo "rtlddir=%(libdir)" >> configparms
    echo "sbindir=%(sbindir)" >> configparms
    echo "rootsbindir=%(sbindir)" >> configparms
    # Note this deliberately excludes libsuffix and is not an error
    echo "complocaledir=/usr/lib/locale" >> configparms

    # CET is strict (cet_elf_property): IBT/SHSTK are enabled for modules that
    # advertise them, and dlopen() of a non-CET library fails while SHSTK is
    # active. All our 64-bit packages are built with -fcf-protection; the 32-bit
    # profile stays --disable-cet.
    # SFrame is only supported on x86_64/aarch64 (not the 32-bit target)
    ../configure \
        $COMMON_GLIBC_OPTIONS \
        --enable-cet \
        --enable-sframe
build       : |
    %make -C build
install     : |
    %make_install build DESTDIR="%(installroot)" -C build

    # Make gconv cache
    LD_LIBRARY_PATH=%(installroot)/%(libdir) %(installroot)/%(libdir)/ld-linux-x86-64.so.2 %(installroot)/usr/sbin/iconvconfig --prefix=%(installroot)

    %make localedata/install-locale-files DESTDIR="%(installroot)" -C build

    # We don't support nss_db/hesiod currently
    rm -v %(installroot)/%(bindir)/makedb \
          %(installroot)/%(libdir)/libnss_db.so* \
          %(installroot)/%(libdir)/libnss_hesiod.so* \
          %(installroot)/var/db/Makefile
    rmdir -v %(installroot)/var/db %(installroot)/var

    # Stateless: Remove obsolete rpc
    rm -v %(installroot)/etc/rpc
    rmdir -v %(installroot)/etc

    %install_file %(pkgdir)/ld.so.conf  %(installroot)/%(vendordir)/ld.so.conf
    %install_dir %(installroot)/%(vendordir)/ld.so.conf.d
    # Vendor NSS default used when /etc/nsswitch.conf is absent; keep in sync with systemd's /usr/share/factory/etc/nsswitch.conf
    %install_file %(pkgdir)/nsswitch.conf %(installroot)/%(vendordir)/nsswitch.conf
    # Vendor hosts default read by the stateless nss_files fallback
    %install_file %(pkgdir)/hosts %(installroot)/%(vendordir)/hosts
    %install_file %(pkgdir)/glibc_ldconfig.yaml %(installroot)/usr/share/moss/triggers/sys.d/glibc_ldconfig.yaml


    # Stateless: We need these directories to exist without including them
    %tmpfiles "# Create stateless directories"
    %tmpfiles "d /etc/ld.so.conf.d 0755 - - -"
    %tmpfiles "d /var/cache/ldconfig 0755 - - -"
    %tmpfiles "d /var/db 0755 - - -"
packages    :
    - "%(name)":
        rundeps:
            - iana-etc

    - "%(name)-devel":
        rundeps:
            - linux-headers
        paths:
            - /usr/bin/mtrace
            - /usr/bin/pcprofiledump
            - /usr/bin/xtrace
            - /usr/lib/*.o
            - /usr/lib/libc_malloc_debug.so*

    - "%(name)-32bit":
        paths:
            - /usr/lib/ld-linux.so.2

    - "%(name)-32bit-devel":
        paths:
            - /usr/lib32/*.o
            - /usr/lib32/libc_malloc_debug.so*
