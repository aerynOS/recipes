name        : gnome-online-accounts-gtk
version     : "3.50.12"
release     : 3
homepage    : https://github.com/xapp-project/gnome-online-accounts-gtk
upstreams   :
    - https://github.com/xapp-project/gnome-online-accounts-gtk/archive/refs/tags/3.50.12.tar.gz : d60d7acba51f0df6c92360067b106ef9f4bc756f43c1334488722cc68f403d92
summary     : A GTK Frontend for GNOME Online Accounts
description : |
    A GTK Frontend for GNOME Online Accounts
license     : GPL-3.0-or-later
builddeps   :
    - binary(msgfmt)
    - pkgconfig(gio-2.0)
    - pkgconfig(glib-2.0)
    - pkgconfig(goa-1.0)
    - pkgconfig(goa-backend-1.0)
    - pkgconfig(gtk4)
    - pkgconfig(libadwaita-1)
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
packages    :
    - "%(name)":
        rundeps:
            - gvfs-goa
            - xapp-symbolic-icons
