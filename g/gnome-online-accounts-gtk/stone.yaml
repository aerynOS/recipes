name        : gnome-online-accounts-gtk
version     : "3.50.13"
release     : 4
upstreams   :
    - https://github.com/xapp-project/gnome-online-accounts-gtk/archive/refs/tags/3.50.13.tar.gz : fa11c5db202515220aee861c57966e89777556f31636967c2c63fab6abafc591
homepage    : https://github.com/xapp-project/gnome-online-accounts-gtk
license     : GPL-3.0-or-later
summary     : A GTK Frontend for GNOME Online Accounts
description : |
    A GTK Frontend for GNOME Online Accounts
builddeps   :
    - binary(msgfmt)
    - pkgconfig(gio-2.0)
    - pkgconfig(glib-2.0)
    - pkgconfig(goa-1.0)
    - pkgconfig(goa-backend-1.0)
    - pkgconfig(gtk4)
    - pkgconfig(libadwaita-1)
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
packages    :
    - "%(name)":
        rundeps:
            - gvfs-goa
            - xapp-symbolic-icons
