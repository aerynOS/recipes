name        : gtklock
version     : "5.0.1"
release     : 3
homepage    : https://github.com/jovanlanik/gtklock
upstreams   :
    - https://github.com/jovanlanik/gtklock/archive/refs/tags/v5.0.1.tar.gz : b51bce5d81643dc3dcb422554d28e919f95d418ef54a082509763dfb6fdfb145
summary     : Lock screen based on gtkgreet
description : |
    A lock screen based on gtkgreet. It uses the ext-session-lock Wayland protocol. Works on sway and other wlroots-based compositors.
license     : GPL-3.0-only
builddeps   :
    - binary(msgfmt)
    - binary(scdoc)
    - pkgconfig(gmodule-export-2.0)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(gtk-session-lock-0)
    - pkgconfig(pam)
setup       : |
    %meson --sysconfdir=%(vendordir)
build       : |
    %meson_build
install     : |
    %meson_install
