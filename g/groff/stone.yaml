name        : groff
version     : "1.24.2"
release     : 10
homepage    : https://www.gnu.org/software/groff/
upstreams   :
    - https://mirrors.rit.edu/gnu/groff/groff-1.24.2.tar.gz : f9c1efd5bebbe37fc6e1063db7473ce8df1e3e0be4ff0f43ce04fce57e9c5dd9
summary     : groff (Typesetting package to read formatted files)
description : |
    groff (GNU troff) is a typesetting package which reads plain text mixed with formatting commands and produces formatted output
license     :
    - GPL-3.0-or-later
builddeps   :
    - binary(bison)
    - binary(lp)
    - binary(makeinfo)
setup       : |
    %configure
build       : |
    %make AR=llvm-ar
install     : |
    %make_install
    rm -rf %(installroot)/usr/share/info/dir
