name        : groff
version     : "1.25.0"
release     : 11
homepage    : https://www.gnu.org/software/groff/
upstreams   :
    - https://mirrors.rit.edu/gnu/groff/groff-1.25.0.tar.gz : 24d103a07eb79e418963bce206c8771b649871f83bda2fd4c2e65529c1c56921
summary     : groff (Typesetting package to read formatted files)
description : |
    groff (GNU troff) is a typesetting package which reads plain text mixed with formatting commands and produces formatted output
license     :
    - GPL-3.0-or-later
builddeps   :
    - binary(bison)
    - binary(lp)
    - binary(makeinfo)
    - binary(perl)
setup       : |
    %configure
build       : |
    %make AR=llvm-ar
install     : |
    %make_install
    rm -rf %(installroot)/usr/share/info/dir
