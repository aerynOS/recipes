name        : gram
version     : "3.3.0"
release     : 7
homepage    : https://gram-editor.com/
upstreams   :
    - https://codeberg.org/GramEditor/gram/archive/3.3.0.tar.gz : eda5c167ed2c29ebd03310b236a06f3f29fd0007be3c58bd341992e52f765629
summary     : A code editor for humanoid apes and grumpy toads
description : |
    Gram is a powerful and modern source code editor.
license     :
    - AGPL-3.0-or-later
    - Apache-2.0
    - GPL-3.0-or-later
# everything below is copypasta from zed's stone.yaml
networking  : true
tuning      :
    - lto: false
builddeps   :
    - binary(cmake)
    - binary(envsubst)
    - binary(jq)
    - binary(make)
    - binary(mold)
    - pkgconfig(alsa)
    - pkgconfig(fontconfig)
    - pkgconfig(gl)
    - pkgconfig(glib-2.0)
    - pkgconfig(libcurl)
    - pkgconfig(libdrm)
    - pkgconfig(libelf)
    - pkgconfig(libssl)
    - pkgconfig(libzstd)
    - pkgconfig(protobuf)
    - pkgconfig(sqlite3)
    - pkgconfig(vulkan)
    - pkgconfig(wayland-client)
    - pkgconfig(x11)
    - pkgconfig(xkbcommon)
    - pkgconfig(xkbcommon-x11)
    - libstdc++-devel
rundeps     :
    - binary(unzip)
environment : |
    export RUSTFLAGS="$RUSTFLAGS -Clink-arg=-fuse-ld=mold"
    # enable LTO here instead
    export CARGO_PROFILE_RELEASE_LTO="thin"
    export GRAM_UPDATE_EXPLANATION="Package updates are provided via moss"
    export LIBSQLITE3_SYS_USE_PKG_CONFIG=1
    export OPENSSL_NO_VENDOR=true
    export RUST_FONTCONFIG_DLOPEN=1
    export ZSTD_SYS_USE_PKG_CONFIG=1
setup       : |
    %cargo_fetch
build       : |
    export GRAM_NO_BUNDLED_UNINSTALL="Use moss to uninstall"
    export RELEASE_VERSION="%(version)"
    RUST_BACKTRACE=1 %cargo_build -p gram -p cli
install     : |
    %install_exe %(cargo_target_dir)/cli %(installroot)%(bindir)/gram
    %install_exe %(cargo_target_dir)/gram %(installroot)%(libexecdir)/gram-editor

    # stolen from zed's bundle-linux script
    export DO_STARTUP_NOTIFY="true"
    export APP_CLI="gram"
    export APP_ICON="gram"
    export APP_ARGS="%%U"
    export APP_NAME="Gram"
    export APP_ID="app.liten.Gram"

    # desktop file.
    %install_dir %(installroot)%(datadir)/applications
    envsubst < "crates/gram/resources/gram.desktop.in" > "%(installroot)%(datadir)/applications/app.liten.Gram.desktop"

    # icon
    %install_file crates/gram/resources/app-icon.png %(installroot)%(datadir)/icons/hicolor/512x512/apps/gram.png
    %install_file crates/gram/resources/app-icon@2x.png %(installroot)%(datadir)/icons/hicolor/512x512@2/apps/gram.png
    %install_file crates/gram/resources/app.liten.Gram.svg %(installroot)%(datadir)/hicolor/scalable/apps/gram.svg
# check       : |
#     %cargo_test
