name        : dux-shell
version     : "2.1.0"
release     : 2
homepage    : https://duxlabs.dev/
upstreams   :
    - https://github.com/duxlabs-dev/dux-shell/releases/download/v2.1.0/dms-source.tar.gz : 7940c60a776b1280609d0eb80ea8845d4f388b28cd087599c70ab15da659543c
summary     : Desktop shell for wayland compositor
description : |
    Dux Shell (dms) is a Wayland desktop shell built with Quickshell and Go. It serves a purpose similar to GNOME Shell or KDE Plasma, providing a unified interface for launching applications, managing windows, managing hardware interfaces, notifications, and much more.
license     : MIT
builddeps   :
    - binary(tar)
rundeps     :
    - binary(quickshell)
    - accountsservice # User integration
    - ca-certificates
    - dux-gop # Process information widgets
networking  : true
setup       : |
    cd core
    %go_mod
build       : |
    pushd core

    %make sync-shell

    go build -o bin/dms \
        -tags distro_binary \
        -tags withshell \
        -ldflags "-X main.Version=v%(version)" \
        ./cmd/dms
    popd
install     : |
    # TODO: Fix this in the makefile
    %install_dir %(installroot)%(bindir)

    %make_install \
        PREFIX=%(prefix) \
        SYSTEMD_USER_DIR=%(installroot)%(libdir)/systemd/user

    # Fix the service
    # sed -i "s|%(installroot)||g" %(installroot)%(libdir)/systemd/user/dms.service
