name        : dbus
version     : "1.16.4"
release     : 16
summary     : D-Bus Message Bus System
license     :
    - AFL-2.1
    - GPL-2.0-or-later
homepage    : https://www.freedesktop.org/wiki/Software/dbus
description : |
    D-Bus Message Bus System
upstreams   :
    - https://dbus.freedesktop.org/releases/dbus/dbus-1.16.4.tar.xz: d08b05526c2cb7966a5fb79210d6112b1aca3d135f315c1b302e14b4b0297dac
builddeps   :
    - pkgconfig(audit)
    - pkgconfig32(expat)
    - pkgconfig32(glib-2.0)
    - pkgconfig32(libsystemd)
emul32      : true
setup       : |
    %meson \
        -Druntime_dir=/run
build       : |
    %meson_build
install     : |
    %meson_install

    # Trigger to reload dbus whenever necessary
    %install_file %(pkgdir)/trigger.yaml %(installroot)/usr/share/moss/triggers/sys.d/reload_dbus.yaml

    # Need to ensure /var/run becomes a symlink to /run for compatibility
    %tmpfiles "# Create run/dbus directory"
    %tmpfiles "d /run/dbus 0755 - - -"

    # Kill dbus default enabling
    rm -rf %(installroot)/usr/lib/systemd/system/multi-user.target.wants
    mv %(installroot)/usr/lib/systemd/system/dbus.service %(installroot)/usr/lib/systemd/system/dbus-daemon.service
    mv %(installroot)/usr/lib/systemd/user/dbus.service %(installroot)/usr/lib/systemd/user/dbus-daemon.service

# TODO: add a check phase (%meson_test) once the suite passes in the build sandbox;
# currently the daemon-fork tests fail and two monitor/server tests time out there
packages    :
    - "%(name)":
        rundeps:
            - systemd # Reload trigger
