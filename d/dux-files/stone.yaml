name        : dux-files
version     : "2.1.1"
release     : 3
homepage    : https://duxlabs.dev/
upstreams   :
    - https://github.com/duxlabs-dev/dux-files/releases/download/v2.1.1/dfiles-2.1.1.tar.gz : fd2fc2583a736349ae2cac1dbe71caaa4f279d052d554d77f057b72d96c0b875
summary     : File manager from Dux Labs
description : |
    File manager from Dux Labs
license     : MIT
builddeps   :
    - binary(go)
    - binary(tar)
rundeps     :
    - binary(quickshell)
    - ca-certificates
networking  : true
setup       : |
    cd core
    %go_mod
build       : |
    cd core

    %make sync-shell

    go build -o bin/dfiles \
        -tags withshell \
        -ldflags "-X main.Version=v%(version)" \
        ./cmd/dfiles
install     : |
    %make_install install-systemd \
        PREFIX=%(prefix) \
        SYSTEMD_USER_DIR=%(installroot)%(libdir)/systemd/user
