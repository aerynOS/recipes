name        : dux-files
version     : "2.1.2"
release     : 4
homepage    : https://duxlabs.dev/
upstreams   :
    - https://github.com/duxlabs-dev/dux-files/releases/download/v2.1.2/dfiles-2.1.2.tar.gz : 0d90a4c3e9338db1a6fecffbf86e91b9e07d545d4b7edb8cb14d757887fc6cf5
summary     : File manager from Dux Labs
description : |
    File manager from Dux Labs
license     : MIT
builddeps   :
    - binary(go)
    - binary(tar)
rundeps     :
    - binary(quickshell)
    - ca-certificates
networking  : true
setup       : |
    cd core
    %go_mod
build       : |
    cd core

    %make sync-shell

    go build -o bin/dfiles \
        -tags withshell \
        -ldflags "-X main.Version=v%(version)" \
        ./cmd/dfiles
install     : |
    %make_install install-systemd \
        PREFIX=%(prefix) \
        SYSTEMD_USER_DIR=%(installroot)%(libdir)/systemd/user
