name        : dux-files
version     : "2.1.0"
release     : 2
homepage    : https://duxlabs.dev/
upstreams   :
    - https://github.com/duxlabs-dev/dux-files/releases/download/v2.1.0/dfiles-2.1.0.tar.gz : 4a43c2bdd543322d7cf8f28a6bb72165e554024063ddc60aec2012b3c39f33be
summary     : File manager from Dux Labs
description : |
    File manager from Dux Labs
license     : MIT
builddeps   :
    - binary(go)
    - binary(tar)
rundeps     :
    - binary(quickshell)
    - ca-certificates
networking  : true
setup       : |
    cd core
    %go_mod
build       : |
    cd core

    %make sync-shell

    go build -o bin/dfiles \
        -tags withshell \
        -ldflags "-X main.Version=v%(version)" \
        ./cmd/dfiles
install     : |
    %make_install install-systemd \
        PREFIX=%(prefix) \
        SYSTEMD_USER_DIR=%(installroot)%(libdir)/systemd/user
