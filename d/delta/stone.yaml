name        : delta
version     : "0.20.1"
release     : 5
homepage    : https://dandavison.github.io/delta/
upstreams   :
    - https://github.com/dandavison/delta/archive/refs/tags/0.20.1.tar.gz :
        hash: d9d502396e3595ee8fd926f1ed2e54ac9935baabd3569a3753efab36304f90fa
summary     : A syntax-highlighting pager for git, diff, grep, and blame output
description : |
    A syntax-highlighting pager for git, diff, grep, and blame output.
license     : MIT
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    %cargo_install

    # completions (Makefile shell-completion target)
    %(cargo_target_dir)/delta --generate-completion bash | %install_file /dev/stdin %(installroot)%(bashcompletionsdir)/delta
    %(cargo_target_dir)/delta --generate-completion fish | %install_file /dev/stdin %(installroot)%(fishcompletionsdir)/delta.fish
    %(cargo_target_dir)/delta --generate-completion zsh | %install_file /dev/stdin %(installroot)%(zshcompletionsdir)/_delta
check       : |
    %cargo_test
