name        : djvulibre
version     : "3.5.30.1"
release     : 3
homepage    : http://djvu.sourceforge.net/
upstreams   :
    - git|https://git.code.sf.net/p/djvu/djvulibre-git : af7431e5b024cc24eb04f8609c271ae68542fd5e # release.3.5.30.1
summary     : A web-centric format and software platform for distributing documents and images
description : |
    DjVu (pronounced "déjà vu") a set of compression technologies, a file format, and a software platform for the delivery over the Web of digital documents, scanned documents, and high resolution images.
license     : GPL-2.0-or-later
builddeps   :
    - binary(gzip)
    - binary(rsvg-convert)
    - pkgconfig(libjpeg)
    - pkgconfig(libtiff-4)
setup       : |
    %patch %(pkgdir)/CVE-2021-3500.patch

    %autogen
build       : |
    %make
install     : |
    %make_install
packages    :
    - "%(name)-libs":
        paths:
            - /usr/lib/libdjvulibre.so.*
