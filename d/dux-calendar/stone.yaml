name        : dux-calendar
version     : "2.1.1"
release     : 3
homepage    : https://duxlabs.dev/
upstreams   :
    - https://github.com/duxlabs-dev/dux-calendar/releases/download/v2.1.1/dankcalendar-2.1.1.tar.gz : 04e0b15389f0f5b766406f93ce09d5a6f68a93dd08496f0f632c6bef9aff19f2
summary     : Calendar from the Dux Suite
description : |
    Dux Calendar is a standalone calendar app that brings your Local, Google, Microsoft, CalDAV, and iCloud calendars together in one place. It runs as a lightweight daemon with a tray icon, keeps your accounts in sync, and reminds you about events — all with the look and feel of Dux Shell.
license     : MIT
builddeps   :
    - binary(go)
    - binary(tar)
rundeps     :
    - binary(quickshell)
    - ca-certificates
networking  : true
setup       : |
    cd core
    %go_mod
build       : |
    cd core

    %make sync-shell

    go build -o bin/dcal \
        -tags withshell \
        -ldflags "-X main.Version=v%(version)" \
        ./cmd/dcal

    mkdir ../completions
    bin/dcal completion bash > ../completions/dcal
    bin/dcal completion zsh > ../completions/_dcal
    bin/dcal completion fish > ../completions/dcal.fish
install     : |
    %make_install install-systemd \
        PREFIX=%(prefix) \
        SYSTEMD_USER_DIR=%(installroot)%(libdir)/systemd/user

    %install_file completions/dcal -t %(installroot)%(bashcompletionsdir)
    %install_file completions/_dcal -t %(installroot)%(zshcompletionsdir)
    %install_file completions/dcal.fish -t %(installroot)%(fishcompletionsdir)
