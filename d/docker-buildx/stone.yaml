name        : docker-buildx
version     : "0.37.0"
release     : 18
homepage    : https://github.com/docker/buildx
upstreams   :
    - https://github.com/docker/buildx/archive/refs/tags/v0.37.0.tar.gz : c6e3efdfb9778d9ef69e005ea43abc3041511f088760c927637e3cf6be7cb410
summary     : Docker CLI plugin for extended build capabilities with BuildKit
description : |
    Docker CLI plugin for extended build capabilities with BuildKit
license     : Apache-2.0
networking  : true
builddeps   :
    - binary(git)
environment : |
    export _buildx_r=github.com/docker/buildx
    export _cli_plugins_dir=%(libdir)/docker/cli-plugins
setup       : |
    %go_mod
build       : |
    # Git commit corresponding to the version tag
    export GITCOMMIT=$(git ls-remote https://github.com/docker/buildx refs/tags/v%(version)^{} |awk '{print $1}')

    export GOFLAGS+=" -ldflags=-X=${_buildx_r}/version.Version=v%(version) \
        -ldflags=-X=${_buildx_r}/version.Revision=${GITCOMMIT} \
        -ldflags=-X=${_buildx_r}/version.Package=${_buildx_r}"

    go build -o docker-buildx ./cmd/buildx
install     : |
    %install_exe docker-buildx -t %(installroot)/${_cli_plugins_dir}
