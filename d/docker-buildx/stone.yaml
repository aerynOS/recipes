name        : docker-buildx
version     : "0.37.2"
release     : 20
homepage    : https://github.com/docker/buildx
upstreams   :
    - https://github.com/docker/buildx/archive/refs/tags/v0.37.2.tar.gz : 6b4cdf64fd6b919b65be75fdfcfb6a42c9738730ee18453e26641132ecc177b4
summary     : Docker CLI plugin for extended build capabilities with BuildKit
description : |
    Docker CLI plugin for extended build capabilities with BuildKit
license     : Apache-2.0
networking  : true
environment : |
    export _buildx_r=github.com/docker/buildx
    export _cli_plugins_dir=%(libdir)/docker/cli-plugins
setup       : |
    %go_mod
build       : |
    # Git commit corresponding to the version tag
    GITCOMMIT=$(git ls-remote https://github.com/docker/buildx "refs/tags/v%(version)^{}" | awk '{print $1}')

    _xflags="-X ${_buildx_r}/version.Version=v%(version) -X ${_buildx_r}/version.Revision=${GITCOMMIT} -X ${_buildx_r}/version.Package=${_buildx_r}"
    export GOFLAGS="$(echo "${GOFLAGS}" | sed "s#-ldflags=[^ ]*#\"& ${_xflags}\"#")"

    go build -o docker-buildx ./cmd/buildx
install     : |
    %install_exe docker-buildx -t %(installroot)/${_cli_plugins_dir}
