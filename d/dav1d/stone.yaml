name        : dav1d
version     : "1.5.5"
release     : 7
homepage    : https://code.videolan.org/videolan/dav1d
upstreams   :
    - https://code.videolan.org/videolan/dav1d/-/archive/1.5.5/dav1d-1.5.5.tar.bz2:
        hash: afc5378daba30eafd11d7b4f0ec863270d7b175f38393a2e1e0ff76f3a45c8b9
        unpackdir: dav1d
    - https://code.videolan.org/videolan/dav1d-test-data/-/archive/1.5.5/dav1d-test-data-1.5.5.tar.gz:
        hash: 4c669b60f8f5e4ea4a7808787a1ee3a2de9cc01a6a4c1101d7d2a698a66c06ff
        unpackdir: dav1d/tests/dav1d-test-data
summary     : AV1 decoder targeted to be small and fast
description : |
    dav1d is a new AV1 cross-platform Decoder, open-source, and focused on speed and correctness.
license     : BSD-2-Clause
builddeps   :
    - binary(nasm)
    - pkgconfig(libxxhash)
tuning      :
    - lto: full
setup       : |
    %meson \
        -Dtestdata_tests=true
build       : |
    %meson_build
install     : |
    %meson_install
check       : |
    %meson_test
packages    :
    - "lib%(name)":
        summary: Library files for dav1d
        description: |
            Library files for dav1d, the AV1 cross-platform Decoder
        paths:
            - /usr/lib/libdav1d.so.*
