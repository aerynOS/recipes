name        : wluma
version     : "5.0.4"
release     : 9
upstreams   :
    - https://github.com/max-baz/wluma/releases/download/5.0.4/wluma-5.0.4-vendored.tar.gz : e72adfc95c1251c4d950414fc77393080abae82e88339b9cc3c5d137e8909890
homepage    : https://github.com/maximbaz/wluma
license     : ISC
summary     : Automatic brightness adjustment
description : |
    Automatic brightness adjustment based on screen contents and ALS
builddeps   :
    - pkgconfig(dbus-1)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libudev)
    - pkgconfig(libv4l2)
    - pkgconfig(vulkan)
    # marked-man for man pages
build       : |
    %cargo_build
install     : |
    %cargo_install

    %install_file 90-wluma-backlight.rules -t %(installroot)%(udevrulesdir)
    %install_file wluma.service -t %(installroot)%(libdir)/systemd/user/
