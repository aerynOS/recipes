name        : wireshark
version     : "4.6.9"
release     : 10
homepage    : https://www.wireshark.org/
upstreams   :
    - https://gitlab.com/wireshark/wireshark/-/archive/v4.6.9/wireshark-v4.6.9.tar.gz : dba1b5c79b668963160457b9a0792e7b00644ed36879e532cbf9ced2dcb138b1
summary     : Wireshark is the world's foremost network protocol analyzer.
description : |
    Wireshark is the world's foremost network protocol analyzer. It lets you see what's happening on your network at a microscopic level.
license     :
    - GPL-2.0-or-later
    - BSD-2-Clause
    - BSD-3-Clause
builddeps   :
    - binary(asciidoctor)
    - binary(doxygen)
    - binary(flex)
    - binary(msgfmt)
    - binary(msgmerge)
    - binary(perl)
    - binary(xsltproc)
    - pkgconfig(Qt6Core5Compat)
    - pkgconfig(Qt6Help)
    - pkgconfig(Qt6Multimedia)
    - pkgconfig(Qt6Svg)
    - pkgconfig(glib-2.0)
    - pkgconfig(gnutls)
    - pkgconfig(krb5)
    - pkgconfig(libbrotlicommon)
    - pkgconfig(libcap)
    - pkgconfig(libcares)
    - pkgconfig(libgcrypt)
    - pkgconfig(liblz4)
    - pkgconfig(libmaxminddb)
    - pkgconfig(libnghttp2)
    - pkgconfig(libnghttp3)
    - pkgconfig(libnl-3.0)
    - pkgconfig(libpcap)
    - pkgconfig(libssh)
    - pkgconfig(libzstd)
    - pkgconfig(lua)
    - pkgconfig(minizip)
    - pkgconfig(minizip-ng) # TODO: Figure out why this isn't detected
    - pkgconfig(opus)
    - pkgconfig(sbc)
    - pkgconfig(snappy)
    - pkgconfig(speexdsp)
    - sysbinary(setcap)
    # TODO: libsmi
rundeps   :
    - qt6-wayland
setup       : |
    %cmake \
        -DBUILD_tfshark=ON
build       : |
    %cmake_build
install     : |
    %cmake_install

    # TODO fix this when we support caps
    %sysusers "g wireshark 150 -"
    chmod 750 %(installroot)/usr/bin/dumpcap
    chown :150 %(installroot)/usr/bin/dumpcap

    %tmpfiles "z /usr/bin/dumpcap 0750 root wireshark - -"
    %tmpfiles "k /usr/bin/dumpcap - - - - cap_net_admin,cap_net_raw=ep"
packages    :
    - "%(name)-cli":
        summary: Network traffic analyzer
        description: This package contains command-line utilities, plugins, and documentation for Wireshark
        paths:
            - /usr/bin/
            - /usr/lib/lib*.so.*
            - /usr/lib/sysusers.d/
            - /usr/lib/tmpfiles.d/
            - /usr/lib/wireshark/
            - /usr/share/doc/
            - /usr/share/man/man1/
            - /usr/share/man/man4/
            - /usr/share/wireshark/

    - "%(name)":
        paths:
            - /usr/bin/wireshark
            - /usr/share/man/man1/wireshark.1*
