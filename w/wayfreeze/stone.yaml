name        : wayfreeze
version     : "0.2.1"
release     : 3
homepage    : https://github.com/Jappie3/wayfreeze
upstreams   :
  - https://github.com/Jappie3/wayfreeze/archive/refs/tags/0.2.1.tar.gz : 4e7bb0eb5655f39fddde2106fd8a8b4475d1ce817cf53d104b8d69aead9a9531
summary     : Tool to freeze the screen of a Wayland compositor
description : |
  A small CLI tool to freeze the screen of a wlroots compositor, this can be useful to, for example, take a screenshot. Supports multiple monitors & fractional scaling.
license     :
  - AGPL-3.0-or-later
  - AGPL-3.0-only
networking  : true
builddeps   :
  - pkgconfig(xkbcommon)
setup       : |
  %cargo_fetch
build       : |
  %cargo_build
install     : |
  %cargo_install
