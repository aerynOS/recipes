name        : waybar
version     : "0.16.0"
release     : 14
homepage    : https://github.com/Alexays/Waybar
upstreams   :
    - https://github.com/Alexays/Waybar/archive/refs/tags/0.16.0.tar.gz : ce74962053002c35e80f569298baebd6887088c80454d0ce9a2c9ca5e21e97c7
summary     : Highly customizable Wayland bar for Sway and Wlroots based compositors
description : |
    Highly customizable Wayland bar for Sway and Wlroots based compositors.
license     : MIT
networking  : true
builddeps   :
    - binary(clang-tidy)
    - binary(git)
    - pkgconfig(dbusmenu-gtk3-0.4)
    # - pkgconfig(epoll-shim)
    - pkgconfig(fftw3)
    - pkgconfig(fmt)
    - pkgconfig(gio-unix-2.0)
    - pkgconfig(giomm-2.4)
    - pkgconfig(gtk-layer-shell-0)
    - pkgconfig(gtkmm-3.0)
    - pkgconfig(jack)
    - pkgconfig(jsoncpp)
    - pkgconfig(libcava)
    - pkgconfig(libevdev)
    # - pkgconfig(libinotify)
    - pkgconfig(libinput)
    # - pkgconfig(libmpdclient)
    - pkgconfig(libnl-3.0)
    - pkgconfig(libnl-genl-3.0)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libpulse)
    - pkgconfig(libsystemd)
    - pkgconfig(libudev)
    - pkgconfig(mm-glib)
    - pkgconfig(playerctl)
    - pkgconfig(scdoc)
    - pkgconfig(sigc++-2.0)
    - pkgconfig(sndio)
    - pkgconfig(spdlog)
    - pkgconfig(systemd)
    # - pkgconfig(threads)
    - pkgconfig(upower-glib)
    - pkgconfig(wayland-client)
    - pkgconfig(wayland-cursor)
    - pkgconfig(wayland-protocols)
    - pkgconfig(wireplumber-0.5)
    - pkgconfig(xkbregistry)
    - catch2
    # - libgps
setup       : |
    %patch %(pkgdir)/0001-make-stateless.patch

    %meson
build       : |
    %meson_build
install     : |
    %meson_install
