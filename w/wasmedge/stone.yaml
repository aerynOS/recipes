name        : wasmedge
version     : "0.18.0"
release     : 3
upstreams   :
    - https://github.com/WasmEdge/WasmEdge/releases/download/0.18.0/WasmEdge-0.18.0-src.tar.gz : c3ef59723d8e5e09021bb9ed7ec55c596b33969b95bc1fbfb0ce1d21075e061e
homepage    : https://wasmedge.org/
license     : Apache-2.0 AND CC0-1.0
summary     : High performance WebAssembly Virtual Machine
description : |
    High performance WebAssembly Virtual Machine
builddeps   :
    - binary(llvm-config-23)
    - cmake(LLVM)
    - cmake(blake3)
    - pkgconfig(fmt)
    - pkgconfig(spdlog)
    - lld-devel
setup       : |
    %cmake \
        -DCMAKE_DISABLE_FIND_PACKAGE_blake3=OFF
build       : |
    %cmake_build
install     : |
    %cmake_install
