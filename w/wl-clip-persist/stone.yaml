name        : wl-clip-persist
version     : "0.5.0"
release     : 1
homepage    : https://github.com/Linus789/wl-clip-persist
upstreams   :
    - https://github.com/Linus789/wl-clip-persist/archive/refs/tags/v0.5.0.tar.gz : fdd2506e6556dda943a164d891fe498985838fdd0e94c54e595a8f1cd8c49b66
summary     : Keep Wayland clipboard even after programs close
description : |
    Keep Wayland clipboard even after programs close.
