name        : nerd-fonts
version     : "3.5.1"
release     : 6
homepage    : https://github.com/ryanoasis/nerd-fonts
upstreams   :
    - https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/NerdFontsSymbolsOnly.tar.xz:
        hash: 01172f37db8543edb102e5cb5c64101c9f4686630804d49b419aa07b23a69996
        unpack: false
    - https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/CascadiaCode.tar.xz:
        hash: ae598e9401e2846aa3ee364513715de0490b844a4b54f0768991f45f23aa8369
        unpack: false
    - https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/FiraCode.tar.xz:
        hash: 68e3bd6164864b8b514605bc34e3a87ac401c8c48682fcce6478c70263340207
        unpack: false
    - https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/IBMPlexMono.tar.xz:
        hash: 3d226683be9fc35f98683837568497f300307bc9b7aefc1617a368f190ef963a
        unpack: false
    - https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/RobotoMono.tar.xz:
        hash: 61f53438b240a00c87c92dc2c372db0bbb264473b36a8144ea62babf787f8383
        unpack: false
    - https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/Terminus.tar.xz:
        hash: 80c6431f5789a72dc7464ecce3ee820cdc0f0123585befada87b13876d2fda90
        unpack: false
    - https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/ZedMono.tar.xz:
        hash: 0411af0883248778335d34bbad8e400466b638d5d896e15c2eb37cd9d4518321
        unpack: false
summary     : Nerd fonts
description : |
    Nerd fonts
license     : MIT
install     : |
    %install_dir %(installroot)%(datadir)/{fonts/truetype,fontconfig/conf.avail}

    for i in %(sourcedir)/*; do
        bsdtar-static --no-same-owner -xf ${i} --strip-components=0 -C %(installroot)%(datadir)/fonts/truetype
    done

    # Fontconfig config files
    mv %(installroot)%(datadir)/fonts/truetype/*.conf %(installroot)%(datadir)/fontconfig/conf.avail/

    # Cleanup
    rm -fv %(installroot)%(datadir)/fonts/truetype/LICENSE \
           %(installroot)%(datadir)/fonts/truetype/LICENSE.txt \
           %(installroot)%(datadir)/fonts/truetype/README.md

packages    :
    - "font-symbols-nerd":
        summary: Symbols only nerd font
        description: Nerd font with symbols only
        license: MIT
        paths:
            - /usr/share/fontconfig/conf.avail/10-nerd-font-symbols.conf
            - /usr/share/fonts/truetype/SymbolsNerdFont*.ttf

    - "font-firacode-nerd":
        summary: Patched font Fira (Fura) Code from nerd fonts library
        description: Patched font Fira (Fura) Code from nerd fonts library
        license: MIT
        paths:
            - /usr/share/fonts/truetype/FiraCodeNerdFont*.ttf

    - "font-cascadia-code":
        summary: Patched font Cascadia Code (Caskaydia) from nerd fonts library
        description: Patched font Cascadia Code (Caskaydia) from nerd fonts library
        license: OFL-1.1-RFN
        paths:
            - /usr/share/fonts/truetype/CaskaydiaCoveNerdFont*.ttf

    - "font-ibmplex-mono-nerd":
        summary: Patched font IBM Plex Mono (Blex) from nerd fonts library
        description: Patched font IBM Plex Mono (Blex) from nerd fonts library
        license: OFL-1.1-RFN
        paths:
            - /usr/share/fonts/truetype/BlexMonoNerdFont*.ttf

    - "font-roboto-mono-nerd":
        summary: Patched font Roboto Mono from nerd fonts library
        description: Patched font Roboto Mono from nerd fonts library
        license: Apache-2.0
        paths:
            - /usr/share/fonts/truetype/RobotoMonoNerdFont*.ttf

    - "font-terminus-nerd":
        summary: Patched font Terminus (Terminess) from nerd fonts library
        description: Patched font Terminus (Terminess) from nerd fonts library
        license: OFL-1.1-RFN
        paths:
            - /usr/share/fonts/truetype/TerminessNerdFont*.ttf

    - "font-zed-mono-nerd":
        summary: Patched font Zed Mono from nerd fonts library
        description: Patched font Zed Mono from nerd fonts library
        license: OFL-1.1-RFN
        paths:
            - /usr/share/fonts/truetype/ZedMonoNerdFont*.ttf
