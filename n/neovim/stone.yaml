name        : neovim
version     : "0.12.5"
release     : 4
homepage    : https://neovim.io/
upstreams   :
    - https://github.com/neovim/neovim/archive/refs/tags/v0.12.5.tar.gz : a810c95332317bd0017e1ca07e376a8472c79075cbed00fa3737d190a8a0a45a
summary     : Vim-fork focused on extensibility and usability
description : |
    Neovim is a project that seeks to aggressively refactor Vim.
license     : Apache-2.0
builddeps   :
    - binary(make)
    - pkgconfig(libluv)
    - pkgconfig(libutf8proc)
    - pkgconfig(libuv)
    - pkgconfig(luajit)
    - pkgconfig(tree-sitter)
    - pkgconfig(unibilium)
    - lua51-lpeg
rundeps     :
    - lua51-lpeg
rundeps-exclude:
    # This is linked by the full path which boulder doesn't support. We have it as a manual rundep above
    - 'soname\(/usr/lib/.*/lpeg.so.*\)'
setup       : |
    %cmake \
        -DUSE_BUNDLED=OFF
build       : |
    %cmake_build
install     : |
    %cmake_install
