name        : noctalia
version     : "5.4.0"
release     : 11
homepage    : https://github.com/noctalia-dev/noctalia
upstreams   :
    - https://github.com/noctalia-dev/noctalia/archive/refs/tags/v5.4.0.tar.gz : 47130d9cf1cdd637f5fe6f88f1706e7be900faa3e62c83390499d3daef32de59
summary     : A sleek and minimal desktop shell thoughtfully crafted for Wayland
description : |
    Noctalia is a native Wayland desktop shell providing the shell layer around
    your compositor: bars, widgets, dock, launcher, control center, notifications,
    wallpaper, lock screen, clipboard history, OSDs and tray integration. Built
    directly on Wayland and OpenGL ES with no Qt or GTK dependency.
license     : MIT
builddeps   :
    - pkgconfig(epoxy)
    - pkgconfig(fontconfig)
    - pkgconfig(freetype2)
    - pkgconfig(jemalloc)
    - pkgconfig(libical)
    - pkgconfig(libjxl)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libqalculate)
    - pkgconfig(librsvg-2.0)
    - pkgconfig(libsecret-1)
    - pkgconfig(libsodium)
    - pkgconfig(libwebp)
    - pkgconfig(md4c)
    - pkgconfig(nlohmann_json)
    - pkgconfig(pam)
    - pkgconfig(pangocairo)
    - pkgconfig(polkit-agent-1)
    - pkgconfig(sdbus-c++)
    - pkgconfig(sndfile)
    - pkgconfig(tomlplusplus)
    - pkgconfig(wayland-client)
    - pkgconfig(wayland-protocols)
    - pkgconfig(wireplumber-0.5)
    - pkgconfig(xkbregistry)
    - stb
rundeps:
    - binary(ddcutil)
    - binary(git)
    - binary(powerprofilesctl)
    - binary(upower)
    - sound-theme-freedesktop
setup       : |
    export CFLAGS+=" -I%(includedir)/stb"
    export CXXFLAGS+=" -I%(includedir)/stb"

    %meson \
        -Djemalloc=enabled \
        -Dtests=disabled
build       : |
    %meson_build
install     : |
    %meson_install

    # Shell completions
    for shell in bash fish zsh; do
        %(installroot)%(bindir)/noctalia completions "${shell}" > "${shell}-completions"
    done

    %install_file bash-completions %(installroot)%(bashcompletionsdir)/noctalia
    %install_file zsh-completions  %(installroot)%(zshcompletionsdir)/_noctalia
    %install_file fish-completions %(installroot)%(fishcompletionsdir)/noctalia.fish
