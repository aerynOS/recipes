name        : nghttp2
version     : "1.71.0"
release     : 18
homepage    : https://nghttp2.org
upstreams   :
    - https://github.com/nghttp2/nghttp2/releases/download/v1.71.0/nghttp2-1.71.0.tar.xz : c0f55121d88650e4b9227aec28cebaf664d2417ca60fe70be0f8d38829f52116
summary     : C implementation of the HTTP/2.0 protocol
description : |
   nghttp2 is an implementation of the Hypertext Transfer Protocol version 2 in C.

   The framing layer of HTTP/2 is implemented as a reusable C library. On top of that, we have implemented an HTTP/2 client, server and proxy. We have also developed load test and benchmarking tools for HTTP/2.
license     : MIT
builddeps   :
    - binary(python3)
    - pkgconfig(jansson)
    - pkgconfig(jemalloc)
    - pkgconfig(libbpf)
    - pkgconfig(libbrotlidec)
    - pkgconfig(libcares)
    - pkgconfig(libevent)
    - pkgconfig(libnghttp3)
    - pkgconfig(libngtcp2)
    - pkgconfig(libxml-2.0)
    - pkgconfig(openssl)
    - pkgconfig(systemd)
    # libev
emul32      : true
profiles    :
    - emul32:
        setup: |
            %cmake \
                -DCMAKE_INSTALL_LIBDIR=%(libdir) \
                -DENABLE_LIB_ONLY=ON \
                -DENABLE_STATIC_LIB=OFF
setup       : |
    %cmake \
        -DCMAKE_INSTALL_LIBDIR=%(libdir) \
        -DENABLE_STATIC_LIB=OFF
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-libs":
        paths:
            - /usr/lib/libnghttp2.so.*
