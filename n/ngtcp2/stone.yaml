name        : ngtcp2
version     : "1.26.0"
release     : 6
upstreams   :
    - https://github.com/ngtcp2/ngtcp2/releases/download/v1.26.0/ngtcp2-1.26.0.tar.gz : 85174d674e7f8fd911a827c6e483fd417b21b1f54d7853dac464cee446c8d35f
homepage    : https://nghttp2.org/ngtcp2/
license     : MIT
summary     : QUIC protocol implementation
description : |
    ngtcp2 project is an effort to implement IETF QUIC protocol
builddeps   :
    - pkgconfig(gnutls)
    - pkgconfig(libnghttp3)
    - pkgconfig(openssl)
    # libev
setup       : |
    %configure \
        --disable-static \
        --with-gnutls \
        --with-openssl
build       : |
    %make
install     : |
    %make_install
check       : |
    %make check
packages    :
    - "%(name)-crypto-gnutls":
        summary: gnutls support for %(name)
        description: gnutls support for %(name)
        paths:
            - /usr/lib/libngtcp2_crypto_gnutls.so.*

    - "%(name)-devel":
        rundeps:
            - "%(name)-crypto-gnutls"
