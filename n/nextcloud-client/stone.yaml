name       : nextcloud-client
version    : "4.0.11"
release    : 11
homepage   : https://nextcloud.com/
upstreams  :
    - https://github.com/nextcloud/desktop/archive/refs/tags/v4.0.11.tar.gz : f2384199657f674c0af76e9bf6d7fea89dd838289b87cf8a678fb22f4b3f3d37
summary    : Nextcloud client for nextcloud server
description: Nextcloud client enables you to connect to your private Nextcloud Server. With it you can create directories in your home directory, and keep the contents of those directories synced with the server
license    : GPL-2.0-or-later
builddeps  :
    - binary(rsvg-convert)
    - cmake(ECM)
    - cmake(KF6Archive)
    - cmake(KF6CoreAddons)
    - cmake(KF6GuiAddons)
    - cmake(KF6KIO)
    - cmake(Qt6Core)
    - cmake(Qt6Core5Compat)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6Gui)
    - cmake(Qt6Keychain)
    - cmake(Qt6QuickControls2)
    - cmake(Qt6Svg)
    - cmake(Qt6UiTools)
    - cmake(Qt6WebEngineCore)
    - cmake(Qt6WebSockets)
    - pkgconfig(cloudproviders)
    - pkgconfig(cmocka)
    - pkgconfig(libp11)
    - pkgconfig(openssl)
    - pkgconfig(sqlite3)
setup      : |
    %patch %(pkgdir)/ftbfs-openssl-4.patch
    %patch %(pkgdir)/ftbfs-openssl-4-2.patch

    %cmake \
        -DCMAKE_BUILD_TYPE=Release \
        -DUNIT_TESTING=false \
        -DBUILD_SHELL_INTEGRATION_DOLPHIN=true \
        -DBUILD_UPDATER=false
build      : |
    %cmake_build
install    : |
    %cmake_install
