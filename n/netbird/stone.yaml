name        : netbird
version     : "0.82.1"
release     : 2
homepage    : https://github.com/netbirdio/netbird
upstreams   :
    - https://github.com/netbirdio/netbird/archive/refs/tags/v0.82.1.tar.gz : faea65ed0321a285818ad4458da5b0441c6f6f766c9fd963cb7dfc5cd9bf4445
summary     : Open Source Zero Trust Networking client
description : |
    NetBird securely connects people, machines and AI agents across any network with one identity-based Zero Trust platform. Powered by p2p WireGuard®
license     :
    - AGPL-3.0
    - BSD-3-Clause
networking  : true
setup       : |
    %go_mod
build       : |
    go build \
       -ldflags "-s -w -X 'github.com/netbirdio/netbird/version.version=%(version)' -X 'main.builtBy=aerynOS'" \
       -o build/ ./client

    # Build Completions
    build/client completion bash > build/netbird
    build/client completion zsh > build/_netbird
    build/client completion fish > build/netbird.fish
install     : |
    %install_exe build/client %(installroot)%(bindir)/netbird

    # Install systemd units
    %install_file release_files/systemd/netbird@.service %(installroot)%(libdir)/systemd/system/netbird@.service
    
    # Install Completion
    %install_file build/netbird %(installroot)%(bashcompletionsdir)/netbird
    %install_file build/_netbird %(installroot)%(zshcompletionsdir)/_netbird
    %install_file build/netbird.fish %(installroot)%(fishcompletionsdir)/netbird.fish
