name        : nano
version     : "9.3"
release     : 44
homepage    : https://www.nano-editor.org/
upstreams   :
    - https://www.nano-editor.org/dist/v9/nano-9.3.tar.xz : a9affc52c9596ee0682bcdd4ceb3c0b235eb221d83d733dfd9b0dff45897cb0d
summary     : GNU Text Editor
description : |
    Nano is a small and simple text editor for use on the terminal.
    It copied the interface and key bindings of the Pico editor but
    added several missing features: undo/redo, syntax highlighting,
    line numbers, softwrapping, multiple buffers, selecting text by
    holding Shift, search-and-replace with regular expressions, and
    several other conveniences.
license     : GPL-3.0-or-later
builddeps   :
    - binary(msgfmt)
    - pkgconfig(libmagic)
    - pkgconfig(ncursesw)
    - pkgconfig(zlib)
setup       : |
    %patch %(pkgdir)/0001-Fall-back-to-nanorc-in-stateless-directory.patch
    %configure
build       : |
    %make
install     : |
    %make_install
    %install_file %(pkgdir)/nanorc -t %(installroot)/%(vendordir)/nano
