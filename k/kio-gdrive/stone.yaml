name        : kio-gdrive
version     : "26.08.2"
release     : 20
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.2/src/kio-gdrive-26.08.2.tar.xz : b9ce4d10e34d060747fb3346a8c4d3875a7ed87c21035b143bfb1410139a4b43
homepage    : https://apps.kde.org/kio_gdrive/
license     : GPL-2.0-only
summary     : KIO access for Google Drive
description : |
    KIO GDrive enables KIO-aware applications (such as Dolphin, Kate or Gwenview) to access and edit Google Drive files on the cloud.
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KAccounts6)
    - cmake(KF6DocTools)
    - cmake(KF6I18n)
    - cmake(KF6KIO)
    - cmake(KF6Notifications)
    - cmake(KF6Purpose)
    - cmake(KPim6GAPI)
rundeps     :
    - accounts-qml-module-qt6 # QML dep
    - kaccounts-providers
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
