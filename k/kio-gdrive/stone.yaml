name        : kio-gdrive
version     : "26.08.3"
release     : 21
homepage    : https://apps.kde.org/kio_gdrive/
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/kio-gdrive-26.08.3.tar.xz : c8558cbbacc73d182833efe85d3b909607b6de2df43dd0cbaaac2de81fdaad42
summary     : KIO access for Google Drive
description : |
    KIO GDrive enables KIO-aware applications (such as Dolphin, Kate or Gwenview) to access and edit Google Drive files on the cloud.
license     : GPL-2.0-only
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KAccounts6)
    - cmake(KF6DocTools)
    - cmake(KF6I18n)
    - cmake(KF6KIO)
    - cmake(KF6Notifications)
    - cmake(KF6Purpose)
    - cmake(KPim6GAPI)
rundeps     :
    - accounts-qml-module-qt6 # QML dep
    - kaccounts-providers
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
