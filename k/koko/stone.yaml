name        : koko
version     : "26.08.3"
release     : 2
homepage    : https://apps.kde.org/koko/
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/koko-26.08.3.tar.xz : 51a91aae40c7c606235c218eee32f59048a528394ba68994a7ce34d26bcf3e5e
summary     : Image viewer for desktop and touch devices
description : |
    Koko is an image viewer designed for desktop and touch devices.
license     :
    - BSD-2-Clause
    - BSD-3-Clause
    - CC-BY-4.0
    - GPL-2.0-only
    - GPL-2.0-or-later
    - GPL-3.0-only
    - LGPL-2.0-or-later
    - LGPL-2.1-only
    - LGPL-2.1-or-later
    - LGPL-3.0-only
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Config)
    - cmake(KF6ConfigWidgets)
    - cmake(KF6CoreAddons)
    - cmake(KF6Crash)
    - cmake(KF6DBusAddons)
    - cmake(KF6Declarative)
    - cmake(KF6FileMetaData)
    - cmake(KF6GuiAddons)
    - cmake(KF6I18n)
    - cmake(KF6KIO)
    - cmake(KF6Kirigami)
    - cmake(KF6KirigamiAddons)
    - cmake(KF6KirigamiAppComponents)
    - cmake(KF6Notifications)
    - cmake(KF6Purpose)
    - cmake(KQuickImageEditor)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6Positioning)
    - cmake(Qt6Qml)
    - cmake(Qt6QuickControls2)
    - cmake(Qt6Svg)
    - pkgconfig(exiv2)
    - pkgconfig(xcb-util)
rundeps     :
    # org.kde.kquickcontrolsaddons QML module; QtMultimedia QML module for video playback
    - kf6-kdeclarative
    - kf6-kirigami-addons
    - qt6-multimedia
    - qt6-wayland
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
