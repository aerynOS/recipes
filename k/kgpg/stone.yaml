name        : kgpg
version     : "26.08.3"
release     : 2
homepage    : https://apps.kde.org/kgpg/
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/kgpg-26.08.3.tar.xz : 7ebc207545aeac3b8797d2dd3dd06e28f25e87fa4e0410407100869dbcd1d361
summary     : Graphical interface for GnuPG
description : |
    KGpg is a GUI frontend for GnuPG based on the KDE stack.
license     :
    - GPL-2.0-only
    - GPL-2.0-or-later
    - GPL-3.0-only
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Archive)
    - cmake(KF6Codecs)
    - cmake(KF6Contacts)
    - cmake(KF6CoreAddons)
    - cmake(KF6Crash)
    - cmake(KF6DBusAddons)
    - cmake(KF6DocTools)
    - cmake(KF6I18n)
    - cmake(KF6JobWidgets)
    - cmake(KF6KIO)
    - cmake(KF6Notifications)
    - cmake(KF6Service)
    - cmake(KF6StatusNotifierItem)
    - cmake(KF6TextWidgets)
    - cmake(KF6WidgetsAddons)
    - cmake(KF6WindowSystem)
    - cmake(KF6XmlGui)
    - cmake(KPim6AkonadiContactWidgets)
    - pkgconfig(gpgme)
rundeps     :
    - qt6-wayland
setup       : |
    %patch %(pkgdir)/0001-Restrict-the-autostart-entry-to-KDE.patch

    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-docs":
        paths:
            - /usr/share/doc
