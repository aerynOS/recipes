name        : kwallet-pam
version     : "6.8.3"
release     : 27
homepage    : https://kde.org/plasma-desktop/
upstreams   :
    - https://download.kde.org/stable/plasma/6.8.3/kwallet-pam-6.8.3.tar.xz : c72d451babc36b0b784ba8e2bad02dd52e416f21a89b7372444ec28afc772ea7
summary     : KWallet PAM integration
description : |
    KWallet PAM integration
license     : LGPL-2.1-only
builddeps   :
    - binary(socat)
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Wallet)
    - pkgconfig(libgcrypt)
    - pkgconfig(pam)
rundeps     :
    - binary(socat)
    # Doesn't make any sense to have it without the kwallet service
    - kf6-kwallet
tuning      :
    - lto: full
    - optimize: speed
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
