name        : kf6-kdoctools
version     : "6.32.0"
release     : 26
homepage    : https://invent.kde.org/frameworks/kdoctools
upstreams   :
    - https://download.kde.org/stable/frameworks/6.32/kdoctools-6.32.0.tar.xz : 431b6cb8c419576ed86d38a2488db35c26b720abf7b6f9bc2cfd28056229a10d
summary     : Create documentation from DocBook
description : |
    Create documentation from DocBook
license     :
    - BSD-3-Clause
    - GPL-2.0-or-later
    - LGPL-2.1-or-later
    - LGPL-2.1-only
builddeps   :
