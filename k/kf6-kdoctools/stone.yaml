name        : kf6-kdoctools
version     : "6.29.0"
release     : 23
upstreams   :
    - https://download.kde.org/stable/frameworks/6.29/kdoctools-6.29.0.tar.xz : 1e1cb8bbf53e4f0482a916e1db9e202c8a8e8f4f2264dbcf98e837876ef83fae
homepage    : https://community.kde.org/Frameworks
license     :
    - BSD-3-Clause
    - GPL-2.0-or-later
    - LGPL-2.1-or-later
    - LGPL-2.1-only
summary     : Create documentation from DocBook
