name        : kf6-knotifications
version     : "6.32.0"
release     : 33
homepage    : https://invent.kde.org/frameworks/knotifications
upstreams   :
    - https://download.kde.org/stable/frameworks/6.32/knotifications-6.32.0.tar.xz : 5da86674bfbe532427f2ea52c86e6d5220cdfb8d0fadb8cbec2ba53d48ec5be9
summary     : Desktop notifications.
description : |
    Desktop notifications.
license     :
    - BSD-3-Clause
    - LGPL-2.0-only
    - LGPL-2.0-or-later
    - LGPL-2.1-only
builddeps   :
    # TODO package pyside bindings, note that they need to be subpackaged. Let's wait till something needs them
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Config)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6Qml)
    - pkgconfig(libcanberra)
setup       : |
    %cmake_kf6 -DBUILD_PYTHON_BINDINGS=OFF
build       : |
    %cmake_build
install     : |
    %cmake_install
