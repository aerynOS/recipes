name        : kf6-kcolorscheme
version     : "6.32.0"
release     : 34
homepage    : https://invent.kde.org/frameworks/kcolorscheme
upstreams   :
    - https://download.kde.org/stable/frameworks/6.32/kcolorscheme-6.32.0.tar.xz : 235c73afa46669c41cbe2e3a14c5a6ae1f8ad8cbb386b3f65261f65449d2b915
summary     : Classes to read and interact with KColorScheme
description : |
    Classes to read and interact with KColorScheme
license     :
    - GPL-3.0-only
    - LGPL-2.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Config)
    - cmake(KF6GuiAddons)
    - cmake(KF6I18n)
    - cmake(Qt6CorePrivate)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-devel":
        rundeps:
            - cmake(KF6Config)
