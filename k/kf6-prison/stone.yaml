name        : kf6-prison
version     : "6.32.0"
release     : 30
homepage    : https://invent.kde.org/frameworks/prison
upstreams   :
    - https://download.kde.org/stable/frameworks/6.32/prison-6.32.0.tar.xz : 13d904f7514ffe32e49fe09a2b5e10125f825d42c26ee52294c15ce1bfab3970
summary     : Qt api to produce QRCode barcode
description : |
    Qt api to produce QRCode barcode
license     :
    - BSD-3-Clause
    - MIT
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6Multimedia)
    - cmake(Qt6Quick)
    - pkgconfig(libdmtx)
    - pkgconfig(libqrencode)
    - pkgconfig(zxing)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
