name        : kleopatra
version     : "26.08.3"
release     : 2
homepage    : https://apps.kde.org/kleopatra/
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/kleopatra-26.08.3.tar.xz : 6900d058f29fb395ea6e637f8d60557036bdad7e3dc387b39a80bfeab9ac38b4
summary     : Certificate manager and GUI for GnuPG
description : |
    Kleopatra is a certificate manager and GUI for GnuPG. It needs a working GnuPG setup.
license     :
    - BSD-3-Clause
    - CC0-1.0
    - GFDL-1.2-or-later
    - GPL-2.0-only
    - GPL-2.0-or-later
    - LGPL-2.0-only
    - LGPL-2.0-or-later
    - LGPL-2.1-only
    - LGPL-2.1-or-later
    - LGPL-3.0-only
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(Gpgmepp)
    - cmake(KDSingleApplication-qt6)
    - cmake(KF6Codecs)
    - cmake(KF6ColorScheme)
    - cmake(KF6Config)
    - cmake(KF6CoreAddons)
    - cmake(KF6Crash)
    - cmake(KF6DocTools)
    - cmake(KF6I18n)
    - cmake(KF6IconThemes)
    - cmake(KF6ItemModels)
    - cmake(KF6KIO)
    - cmake(KF6Mime)
    - cmake(KF6Notifications)
    - cmake(KF6WidgetsAddons)
    - cmake(KF6WindowSystem)
    - cmake(KF6XmlGui)
    - cmake(KPim6AkonadiMime)
    - cmake(KPim6IdentityManagementCore)
    - cmake(KPim6Libkleo)
    - cmake(KPim6MailTransport)
    - cmake(KPim6Mbox)
    - cmake(KPim6MimeTreeParserWidgets)
    - cmake(QGpgmeQt6)
    - pkgconfig(gpg-error)
    - pkgconfig(libassuan)
rundeps     :
    - qt6-wayland
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-docs":
        paths:
            - /usr/share/doc
