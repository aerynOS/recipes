name        : kldap
version     : "26.08.3"
release     : 19
homepage    : https://invent.kde.org/pim/kldap
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/kldap-26.08.3.tar.xz : a3460ece61ab2bb48f6eef24375317c22e897336912bc95ba9fecfb0d21597c2
summary     : Allows LDAP accessing with a convenient Qt style C++ API
description : |
    Allows LDAP accessing with a convenient Qt style C++ API.
license     : LGPL-2.1-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6DocTools)
    - cmake(KF6I18n)
    - cmake(KF6KIO)
    - cmake(Qt6Keychain)
    - pkgconfig(ldap)
    - pkgconfig(libsasl2)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
