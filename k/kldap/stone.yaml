name        : kldap
version     : "26.08.2"
release     : 18
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.2/src/kldap-26.08.2.tar.xz : 17fb3e289692599b6aa0ad2c3d409e13f52dabcd6273544eb568cf6f025bac59
homepage    : https://kde.org
license     : LGPL-2.1-or-later
summary     : Allows LDAP accessing with a convenient Qt style C++ API
description : |
    Allows LDAP accessing with a convenient Qt style C++ API.
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6DocTools)
    - cmake(KF6I18n)
    - cmake(KF6KIO)
    - cmake(Qt6Keychain)
    - pkgconfig(ldap)
    - pkgconfig(libsasl2)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
