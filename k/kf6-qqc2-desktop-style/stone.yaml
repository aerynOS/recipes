name        : kf6-qqc2-desktop-style
version     : "6.32.0"
release     : 29
homepage    : https://invent.kde.org/frameworks/qqc2-desktop-style
upstreams   :
    - https://download.kde.org/stable/frameworks/6.32/qqc2-desktop-style-6.32.0.tar.xz : 57269c662c25d0ccea96e128a54bc57c3abe0b6b97ef586ea1195c147afc3a38
summary     : QtQuickControls 2 style that integrates with the desktop
description : |
    QtQuickControls 2 style that integrates with the desktop
license     :
    - LGPL-2.0-or-later
    - LGPL-3.0-only
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6ColorScheme)
    - cmake(KF6Config)
    - cmake(KF6IconThemes)
    - cmake(KF6KirigamiPlatform)
    - cmake(KF6Sonnet)
    - cmake(Qt6CorePrivate)
    - pkgconfig(x11)
rundeps     :
    - kf6-sonnet
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
