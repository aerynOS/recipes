name        : kamoso
version     : "26.08.3"
release     : 2
homepage    : https://apps.kde.org/kamoso/
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/kamoso-26.08.3.tar.xz : 624187492dd4ca1fae17d5e48681b3b3ad3bab1be92a010cd2cf74b386f8e5e9
summary     : Webcam photo and video capture
description : |
    Kamoso is a simple and friendly program to use your camera. Use it to take pictures and make videos to share.
license     :
    - GFDL-1.2-or-later
    - GPL-2.0-or-later
    - LGPL-2.1-only
    - LGPL-2.1-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Config)
    - cmake(KF6DocTools)
    - cmake(KF6I18n)
    - cmake(KF6KIO)
    - cmake(KF6Kirigami)
    - cmake(KF6Notifications)
    - cmake(KF6Purpose)
    - cmake(Qt6Quick)
    - pkgconfig(gstreamer-video-1.0)
rundeps     :
    # GStreamer plugins backing the camerabin pipeline (wrappercamerabinsrc, qml6glsink, v4l2src, jpeg/png encoders)
    - gstreamer-plugin-qt6
    - gstreamer-plugins-bad
    - gstreamer-plugins-good
    - kf6-kirigami
    - kf6-kitemmodels
    - kf6-purpose
    - qt6-wayland
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-docs":
        paths:
            - /usr/share/doc
