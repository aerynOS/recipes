name        : kf6-kwindowsystem
version     : "6.32.0"
release     : 32
homepage    : https://invent.kde.org/frameworks/kwindowsystem
upstreams   :
    - https://download.kde.org/stable/frameworks/6.32/kwindowsystem-6.32.0.tar.xz : 43a32eb940c740f5acc917ce24c4939ba08b9e08c26091dbb5577ad0ef74f3a0
summary     : Access to the windowing system.
description : |
    Access to the windowing system.
license     :
    - LGPL-2.0-only
    - LGPL-2.1-only
    - LGPL-2.1-or-later
    - MIT
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(PlasmaWaylandProtocols)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6Qml)
    - cmake(Qt6WaylandClient)
    - pkgconfig(wayland-protocols)
    - pkgconfig(x11)
    - pkgconfig(xcb-icccm)
    - pkgconfig(xcb-keysyms)
    - pkgconfig(xfixes)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-devel":
        rundeps:
            - pkgconfig(x11)
