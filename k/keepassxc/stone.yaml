name        : keepassxc
version     : "2.8.0"
release     : 12
homepage    : https://keepassxc.org/
upstreams   :
    - https://github.com/keepassxreboot/keepassxc/archive/refs/tags/2.8.0.tar.gz : ea44ba7ced55c8437eade22e6ed22b3c48950220a789d63f422b23c401f95db8
summary     : Cross-platform community-driven port of Keepass password manager
description : |
    Cross-platform community-driven port of Keepass password manager
license     :
    - GPL-2.0
    - GPL-3.0
    - LGPL-2.1
builddeps   :
    - binary(asciidoctor)
    - cmake(Qt6Concurrent)
    - cmake(Qt6Core)
    - cmake(Qt6DBus)
    - cmake(Qt6Gui)
    - cmake(Qt6LinguistTools)
    - cmake(Qt6Network)
    - cmake(Qt6Svg)
    - cmake(Qt6Test)
    - cmake(Qt6Widgets)
    - pkgconfig(botan-3)
    - pkgconfig(libkeyutils)
    - pkgconfig(libpcsclite)
    - pkgconfig(libqrencode)
    - pkgconfig(libusb-1.0)
    - pkgconfig(minizip)
    - pkgconfig(readline)
    - pkgconfig(xtst)
rundeps     :
    - qt6-wayland
setup       : |
    %patch %(pkgdir)/botan-3.14-randomized-ecdsa.patch

    %cmake \
        -DKEEPASSXC_BUILD_TYPE=Release \
        -DKPXC_FEATURE_UPDATES=OFF
build       : |
    %cmake_build
install     : |
    %cmake_install
check       : |
    # C locale fails https://github.com/keepassxreboot/keepassxc/issues/11813
    env LC_ALL=en_US.UTF-8 %cmake_test -E testcli
