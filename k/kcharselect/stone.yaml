name        : kcharselect
version     : "26.08.3"
release     : 2
homepage    : https://apps.kde.org/kcharselect/
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/kcharselect-26.08.3.tar.xz : b7295c2869507f5be79b988434533a390f110a1794380c63887612bcbd50a6e9
summary     : Character and Unicode selector
description : |
    KCharSelect is a tool to select special characters from all installed fonts and copy them into the clipboard.
license     :
    - BSD-3-Clause
    - CC0-1.0
    - GPL-2.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Bookmarks)
    - cmake(KF6ConfigWidgets)
    - cmake(KF6CoreAddons)
    - cmake(KF6Crash)
    - cmake(KF6DocTools)
    - cmake(KF6I18n)
    - cmake(KF6IconThemes)
    - cmake(KF6WidgetsAddons)
    - cmake(KF6XmlGui)
rundeps     :
    - qt6-wayland
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-docs":
        paths:
            - /usr/share/doc
