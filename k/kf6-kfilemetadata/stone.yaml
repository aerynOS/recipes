name        : kf6-kfilemetadata
version     : "6.32.0"
release     : 27
homepage    : https://invent.kde.org/frameworks/kfilemetadata
upstreams   :
    - https://download.kde.org/stable/frameworks/6.32/kfilemetadata-6.32.0.tar.xz : f74fcb857e52613095d9b264ac6e8ddf0eca326c884e8c83fd536e70b111241a
summary     : Simple library for extracting the text and metadata
description : |
    Simple library for extracting the text and metadata
license     :
    - BSD-3-Clause
    - LGPL-2.1-only
    - LGPL-2.1-or-later
builddeps   :
    # Todo:
    # - libappimage
    # - CatDoc
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Archive)
    - cmake(KF6Codecs)
    - cmake(KF6Config)
    - cmake(KF6CoreAddons)
    - cmake(KF6I18n)
    - cmake(QMobipocket6)
    - cmake(exiv2)
    - cmake(taglib)
    - pkgconfig(libattr)
    - pkgconfig(libavcodec)
    - pkgconfig(libavformat)
    - pkgconfig(poppler-qt6)
    - ebook-tools-devel
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
