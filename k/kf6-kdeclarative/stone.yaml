name        : kf6-kdeclarative
version     : "6.32.0"
release     : 34
homepage    : https://invent.kde.org/frameworks/kdeclarative
upstreams   :
    - https://download.kde.org/stable/frameworks/6.32/kdeclarative-6.32.0.tar.xz : 9e187056b3e1d49ecde29b30e4a4f5f2633639b622dd596369eac86c45c7f167
summary     : Integration of QML and KDE work spaces
description : |
    Integration of QML and KDE work spaces
license     :
    - BSD-3-Clause
    - GPL-2.0-only
    - LGPL-2.0-or-later
    - LGPL-2.1-only
    - LGPL-2.1-or-later
    - MIT
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Config)
    - cmake(KF6GlobalAccel)
    - cmake(KF6GuiAddons)
    - cmake(KF6I18n)
    - cmake(KF6WidgetsAddons)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6ShaderTools)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
