name        : kf6-kcmutils
version     : "6.32.0"
release     : 35
homepage    : https://invent.kde.org/frameworks/kcmutils
upstreams   :
    - https://download.kde.org/stable/frameworks/6.32/kcmutils-6.32.0.tar.xz : 473395787e6921d37298e191cc1718f8818f630b98bdf312583ad25606f6a09e
summary     : Utilities for interacting with KCModules
description : |
    Utilities for interacting with KCModules
license     :
    - LGPL-2.0-only
    - LGPL-2.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6ConfigWidgets)
    - cmake(KF6GuiAddons)
    - cmake(KF6I18n)
    - cmake(KF6KIO)
    - cmake(KF6XmlGui)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6Qml)
    - kf6-kirigami
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)":
        rundeps:
            - kf6-kirigami

    - "%(name)-devel":
        rundeps:
            - cmake(KF6ConfigWidgets)
            - cmake(KF6CoreAddons)
