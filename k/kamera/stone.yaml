name        : kamera
version     : "26.08.3"
release     : 2
homepage    : https://apps.kde.org/kamera/
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/kamera-26.08.3.tar.xz : 1ea2ecaed044f76d5c943b37b9fbd874a0a7e77f7c9d982c409f5aaf1dad51cd
summary     : KDE integration for gphoto2 cameras
description : |
    KDE integration for gphoto2 cameras.
license     :
    - BSD-3-Clause
    - GFDL-1.2-or-later
    - GPL-2.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Config)
    - cmake(KF6ConfigWidgets)
    - cmake(KF6DocTools)
    - cmake(KF6I18n)
    - cmake(KF6KCMUtils)
    - cmake(KF6KIO)
    - cmake(KF6XmlGui)
    - pkgconfig(libgphoto2)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-docs":
        paths:
            - /usr/share/doc
