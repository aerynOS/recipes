name        : kdegraphics-mobipocket
version     : "26.08.3"
release     : 19
homepage    : https://invent.kde.org/graphics/kdegraphics-mobipocket
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/kdegraphics-mobipocket-26.08.3.tar.xz : ea5d978c66332fd377f97d683b4c3902133f22b7aec586fcc9e810307f2f1f38
summary     : Plugins for mobipocket
description : |
    A collection of plugins to handle mobipocket files.
license     : GPL-2.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(Qt6Core5Compat)
setup       : |
    %cmake_kf6 \
        -DBUILD_WITH_QT6=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
