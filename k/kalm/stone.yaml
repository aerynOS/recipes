name        : kalm
version     : "26.08.3"
release     : 2
homepage    : https://apps.kde.org/kalm/
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/kalm-26.08.3.tar.xz : 0ce0d27288157e6e1aa36c9ae2b05e427111a7230cc5a64726d5d1f8ad59beb0
summary     : Breathing exercise trainer
description : |
    Kalm can teach you different breathing techniques to help you relax and focus.
license     :
    - BSD-2-Clause
    - CC-BY-SA-4.0
    - CC0-1.0
    - LGPL-2.1-or-later
builddeps   :
    - binary(python3)
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Config)
    - cmake(KF6CoreAddons)
    - cmake(KF6Crash)
    - cmake(KF6I18n)
    - cmake(KF6Kirigami)
    - cmake(KF6KirigamiAddons)
    - cmake(KF6QQC2DesktopStyle)
    - cmake(Qt6QuickControls2)
rundeps     :
    - kf6-kirigami-addons
    - kf6-qqc2-desktop-style
    - qt6-wayland
setup       : |
    %cmake_kf6 \
        -DBUILD_TESTING=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
check       : |
    env QT_QPA_PLATFORM=offscreen %cmake_test
