name        : kf6-karchive
version     : "6.29.0"
release     : 23
upstreams   :
    - https://download.kde.org/stable/frameworks/6.29/karchive-6.29.0.tar.xz : 3d66cd9d71fbbebc3cea68757111002666b366898b01178b6fa7203715574287
homepage    : https://community.kde.org/Frameworks
license     : LGPL-2.0-or-later
summary     : Reading, creating, and manipulating file archives.
description : |
    Reading, creating, and manipulating file archives.
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - pkgconfig(bzip2)
    - pkgconfig(liblzma)
    - pkgconfig(openssl)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
