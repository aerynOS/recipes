name        : kf6-karchive
version     : "6.32.0"
release     : 27
homepage    : https://invent.kde.org/frameworks/karchive
upstreams   :
    - https://download.kde.org/stable/frameworks/6.32/karchive-6.32.0.tar.xz : 30687d9be0aea05a4ef887212abd91d7c4337cb9f166610f98eac2b01407fb1f
summary     : Reading, creating, and manipulating file archives.
description : |
    Reading, creating, and manipulating file archives.
license     : LGPL-2.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - pkgconfig(bzip2)
    - pkgconfig(liblzma)
    - pkgconfig(openssl)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
