name        : kontactinterface
version     : "26.08.3"
release     : 28
homepage    : https://invent.kde.org/pim/kontactinterface
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/kontactinterface-26.08.3.tar.xz : 035f6d8dec6b578d7b0f9ab7f6dbee05163fb39606b37bb1c410157f03eb2fe5
summary     : Kontact Plugin Interface Library
description : |
    Kontact Plugin Interface Library.
license     : LGPL-2.1-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6CoreAddons)
    - cmake(KF6I18n)
    - cmake(KF6Parts)
    - cmake(KF6WindowSystem)
    - cmake(KF6XmlGui)
    - cmake(Qt6CorePrivate)
    - pkgconfig(x11)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-devel":
        rundeps:
            - cmake(KF6Parts)
