name        : kf6-kservice
version     : "6.32.0"
release     : 26
homepage    : https://invent.kde.org/frameworks/kservice
upstreams   :
    - https://download.kde.org/stable/frameworks/6.32/kservice-6.32.0.tar.xz : 495545ac7120305e3c13d5d1c7760c5607527db5816c6ceedf8c9a623b051e2e
summary     : Plugin framework for desktop services.
description : |
    Plugin framework for desktop services.
license     :
    - GPL-2.0-only
    - LGPL-2.0-only
    - LGPL-2.0-or-later
builddeps   :
