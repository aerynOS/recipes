name        : kf6-kdesu
version     : "6.32.0"
release     : 18
homepage    : https://invent.kde.org/frameworks/kdesu
upstreams   :
    - https://download.kde.org/stable/frameworks/6.32/kdesu-6.32.0.tar.xz : db3f46d8f293be7e2d4ccf6dd3da724b691fb6f816bd96352f65a72ed838c08a
summary     : User interface for running shell commands with root privileges
description : |
    User interface for running shell commands with root privileges
license     :
    - GPL-2.0-only
    - LGPL-2.0-or-later
    - LGPL-2.1-only
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Config)
    - cmake(KF6CoreAddons)
    - cmake(KF6I18n)
    - cmake(KF6Pty)
    - pkgconfig(x11)
rundeps     :
    - binary(sudo)
setup       : |
    %cmake_kf6 \
        -DKDESU_USE_SUDO_DEFAULT=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)":
        rundeps:
            - binary(sudo)

    - "%(name)-devel":
        rundeps:
            - cmake(KF6Pty)
