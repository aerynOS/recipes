name        : kpmcore
version     : "26.08.3"
release     : 19
homepage    : https://invent.kde.org/system/kpmcore
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/kpmcore-26.08.3.tar.xz : de84307a2233e761a9d37ac1ab411363613312a5abc2ce348b366ae081da644b
summary     : Library for managing partitions
description : |
    Common code for KDE Partition Manager and other projects. Library for managing partitions.
license     : GPL-3.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6CoreAddons)
    - cmake(KF6I18n)
    - cmake(KF6WidgetsAddons)
    - cmake(PolkitQt6-1)
    - pkgconfig(blkid)
# rundeps     :
#     - qt6-wayland
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
