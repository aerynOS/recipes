name        : kf6-kcompletion
version     : "6.32.0"
release     : 24
homepage    : https://invent.kde.org/frameworks/kcompletion
upstreams   :
    - https://download.kde.org/stable/frameworks/6.32/kcompletion-6.32.0.tar.xz : 1ec8c0f952af1b18b07c30265610c220acadf429ef1a16558d2c64679b93dcc7
summary     : Powerful completion framework, including completion-enabled lineedit and combobox.
description : |
    Powerful completion framework, including completion-enabled lineedit and combobox.
license     :
    - BSD-3-Clause
    - LGPL-2.0-or-later
    - LGPL-2.1-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Codecs)
    - cmake(KF6Config)
    - cmake(KF6WidgetsAddons)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
