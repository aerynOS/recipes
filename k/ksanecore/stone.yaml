name        : ksanecore
version     : "26.08.3"
release     : 16
homepage    : https://invent.kde.org/libraries/ksanecore
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/ksanecore-26.08.3.tar.xz : 360f87193ed6dd6729e67ce09096df1743f892e13db43b6e03b02a8a036524dd
summary     : Library providing logic to interface scanners
description : |
    KSaneCore is a library that provides a Qt interface for the SANE library for scanner hardware.
license     :
    - LGPL-2.1-only
    - LGPL-3.0-only
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6I18n)
    - pkgconfig(sane-backends)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
