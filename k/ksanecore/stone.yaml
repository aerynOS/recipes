name        : ksanecore
version     : "26.08.1"
release     : 14
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.1/src/ksanecore-26.08.1.tar.xz : 0555c4109b6132a774ce4081c12d9deeed8fdb152fa65714f7f73cb20965494d
homepage    : https://invent.kde.org/libraries/ksanecore
license     :
    - LGPL-2.1-only
    - LGPL-3.0-only
summary     : Library providing logic to interface scanners
description : |
    KSaneCore is a library that provides a Qt interface for the SANE library for scanner hardware.
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6I18n)
    - pkgconfig(sane-backends)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
