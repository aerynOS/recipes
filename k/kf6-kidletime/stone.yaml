name        : kf6-kidletime
version     : "6.32.0"
release     : 28
homepage    : https://invent.kde.org/frameworks/kidletime
upstreams   :
    - https://download.kde.org/stable/frameworks/6.32/kidletime-6.32.0.tar.xz : a7b53ff5a5f80bf8b8869b377de11594c9e5bccf84064c96efd6bab16974c1be
summary     : Reporting of idle time of user and system
description : |
    Reporting of idle time of user and system
license     :
    - GPL-2.0-or-later
    - LGPL-2.0-only
    - MIT
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(PlasmaWaylandProtocols)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6WaylandClient)
    - pkgconfig(wayland-protocols)
    - pkgconfig(x11)
    - pkgconfig(xext)
    - pkgconfig(xscrnsaver)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
