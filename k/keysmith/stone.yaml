name        : keysmith
version     : "26.08.3"
release     : 2
homepage    : https://apps.kde.org/keysmith/
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/keysmith-26.08.3.tar.xz : eb339ea7185d1cfb740aa40ade9712fc3d31693e5dc3b52a19ed940c9f987d61
summary     : OTP (two-factor) token generator
description : |
    Keysmith is an application to generate two-factor authentication (2FA) tokens when logging in to your accounts. It supports both HOTP and TOTP tokens.
license     :
    - BSD-2-Clause
    - BSD-3-Clause
    - CC-BY-SA-4.0
    - CC0-1.0
    - GPL-3.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Config)
    - cmake(KF6CoreAddons)
    - cmake(KF6DBusAddons)
    - cmake(KF6I18n)
    - cmake(KF6Kirigami)
    - cmake(KF6KirigamiAddons)
    - cmake(KF6Prison)
    - cmake(KF6QQC2DesktopStyle)
    - cmake(KF6WindowSystem)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6QuickControls2)
    - cmake(Qt6Svg)
    - pkgconfig(libsodium)
    - pkgconfig(openssl)
rundeps     :
    - kf6-kirigami-addons
    - kf6-prison
    - kf6-qqc2-desktop-style
    - qt6-wayland
setup       : |
    %cmake_kf6 \
        -DBUILD_TESTING=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
check       : |
    env QT_QPA_PLATFORM=offscreen %cmake_test
