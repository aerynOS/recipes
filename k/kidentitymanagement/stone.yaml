name        : kidentitymanagement
version     : "26.08.3"
release     : 28
homepage    : https://invent.kde.org/pim/kidentitymanagement
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/kidentitymanagement-26.08.3.tar.xz : 1472ce2572d2126c5cdd6f028eb1e974e4bba05eecfce9ea431236caf14b64a5
summary     : Manage PIM identity
description : |
    Manage PIM identity.
license     : LGPL-2.1-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6CoreAddons)
    - cmake(KF6I18n)
    - cmake(KF6KIO)
    - cmake(KF6KirigamiAddons)
    - cmake(KF6TextCustomEditor)
    - cmake(KF6XmlGui)
    - cmake(KPim6TextEdit)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6Quick)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-devel":
        rundeps:
            - cmake(KF6CoreAddons)
            - cmake(KPim6TextEdit)
        paths:
            - /usr/share/dbus-1/interfaces/
