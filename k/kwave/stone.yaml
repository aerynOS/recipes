name        : kwave
version     : "26.08.3"
release     : 2
homepage    : https://apps.kde.org/kwave/
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/kwave-26.08.3.tar.xz : 8eca30668b13c8331721d4e9cf619b3bb1def5caf461944244abf8c25eb5fd6a
summary     : Sound editor
description : |
    With Kwave you can record, play back, import and edit many sorts of audio files including multi channel files.
license     : GPL-2.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Archive)
    - cmake(KF6Completion)
    - cmake(KF6Config)
    - cmake(KF6ConfigWidgets)
    - cmake(KF6CoreAddons)
    - cmake(KF6Crash)
    - cmake(KF6DBusAddons)
    - cmake(KF6DocTools)
    - cmake(KF6I18n)
    - cmake(KF6IconThemes)
    - cmake(KF6KIO)
    - cmake(KF6TextWidgets)
    - cmake(KF6WidgetsAddons)
    - cmake(KF6XmlGui)
    - cmake(Qt6Multimedia)
    - cmake(Qt6Test)
    - pkgconfig(alsa)
    - pkgconfig(audiofile)
    - pkgconfig(fftw3)
    - pkgconfig(flac)
    - pkgconfig(libpulse)
    - pkgconfig(mad)
    - pkgconfig(opus)
    - pkgconfig(samplerate)
    - pkgconfig(vorbis)
    - id3lib-devel
rundeps     :
    - qt6-wayland
setup       : |
    %cmake_kf6 \
        -DBUILD_TESTING=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
check       : |
    env QT_QPA_PLATFORM=offscreen %cmake_test
packages    :
    - "%(name)-docs":
        paths:
            - /usr/share/doc
