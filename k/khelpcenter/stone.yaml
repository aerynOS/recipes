name        : khelpcenter
version     : "26.08.3"
release     : 2
homepage    : https://apps.kde.org/khelpcenter/
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/khelpcenter-26.08.3.tar.xz : 8a3119f1ce9b954e2cd9861fab347d584341911c96c313cc63bf069a5ccc384c
summary     : Help center
description : |
    KHelpCenter is the central documentation viewer for KDE applications, providing access to application handbooks and KDE documentation.
license     :
    - GFDL-1.2-or-later
    - GPL-2.0-only
    - GPL-2.0-or-later
    - GPL-3.0-only
builddeps   :
    - binary(perl)
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Archive)
    - cmake(KF6Bookmarks)
    - cmake(KF6Completion)
    - cmake(KF6Config)
    - cmake(KF6ConfigWidgets)
    - cmake(KF6CoreAddons)
    - cmake(KF6DBusAddons)
    - cmake(KF6DocTools)
    - cmake(KF6I18n)
    - cmake(KF6KIO)
    - cmake(KF6Parts)
    - cmake(KF6Service)
    - cmake(KF6TextTemplate)
    - cmake(KF6WidgetsAddons)
    - cmake(KF6WindowSystem)
    - cmake(KF6XmlGui)
    - cmake(Qt6WebEngineWidgets)
    - cmake(xapian)
    - pkgconfig(libxml-2.0)
rundeps     :
    - qt6-wayland
setup       : |
    %cmake_kf6 \
        -DBUILD_TESTING=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
check       : |
    env QT_QPA_PLATFORM=offscreen %cmake_test
packages    :
    - "%(name)-docs":
        paths:
            - /usr/share/doc
