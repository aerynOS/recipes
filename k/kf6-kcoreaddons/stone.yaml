name        : kf6-kcoreaddons
version     : "6.32.0"
release     : 33
homepage    : https://invent.kde.org/frameworks/kcoreaddons
upstreams   :
    - https://download.kde.org/stable/frameworks/6.32/kcoreaddons-6.32.0.tar.xz : f7373a77afae97099de4359fba13987b46618ccb952f94ddc11c9d31277fe651
summary     : Qt addon library with a collection of non-GUI utilities
description : |
    Qt addon library with a collection of non-GUI utilities
license     :
    - GPL-2.0-only
    - LGPL-2.0-only
    - LGPL-2.0-or-later
    - LGPL-2.1-only
builddeps   :
    # TODO package pyside bindings, note that they need to be subpackaged. Let's wait till something needs them
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6Qml)
    - pkgconfig(mount)
setup       : |
    %cmake_kf6 \
        -DBUILD_PYTHON_BINDINGS=OFF
build       : |
    %cmake_build
install     : |
    %cmake_install
