name        : kdecoration
version     : "6.8.3"
release     : 29
homepage    : https://kde.org/plasma-desktop/
upstreams   :
    - https://download.kde.org/stable/plasma/6.8.3/kdecoration-6.8.3.tar.xz : 77435cc9dda43ff14e6b99cfb08498ace7730f995fc4ab4c21d6be2d1a6c73a1
summary     : Plugin based library to create window decorations
description : |
    Plugin based library to create window decorations
