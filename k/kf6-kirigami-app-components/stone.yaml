name        : kf6-kirigami-app-components
version     : "1.0.2"
release     : 1
homepage    : https://invent.kde.org/libraries/kirigami-app-components
upstreams   :
    - https://download.kde.org/stable/kirigami-app-components/kirigami-app-components-1.0.2.tar.xz : 6bfd9e0a3a4b7d17505f0c3c0c395628165973b6f4cf1e4a7a1f3342873b44d0
summary     : Kirigami addons for full-featured KDE applications
description : |
    Kirigami addons and modules necessary to do a full featured KDE application, such as integration with configurable keyboard shortcuts and standard actions.
license     :
    - LGPL-2.0-or-later
    - LGPL-2.1-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Config)
    - cmake(KF6GuiAddons)
    - cmake(KF6I18n)
    - cmake(KF6KirigamiPlatform)
    - cmake(Qt6Quick)
tuning      :
    - lto: full
    - optimize: speed
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
