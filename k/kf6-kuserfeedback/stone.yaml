name        : kf6-kuserfeedback
version     : "6.32.0"
release     : 32
homepage    : https://invent.kde.org/frameworks/kuserfeedback
upstreams   :
    - https://download.kde.org/stable/frameworks/6.32/kuserfeedback-6.32.0.tar.xz : 156cadff9de487538440a7f6cfce4a4f0240dc22ccbe4d48f37fb1bd84c75ee5
summary     : Framework for collecting user feedback for applications via telemetry and surveys
description : |
    Framework for collecting user feedback for applications via telemetry and surveys
license     : MIT
builddeps   :
    - binary(bison)
    - binary(flex)
    - binary(php)
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6Qml)
setup       : |
    %cmake_kf6 -DENABLE_CONSOLE=ON \
               -DENABLE_CLI=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
