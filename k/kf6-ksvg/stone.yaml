name        : kf6-ksvg
version     : "6.32.0"
release     : 27
homepage    : https://invent.kde.org/frameworks/ksvg
upstreams   :
    - https://download.kde.org/stable/frameworks/6.32/ksvg-6.32.0.tar.xz : 8299498d46373a84811d29415f9e5a115f491bd7b5fa11c1648fc36ca9374ad6
summary     : Components for handling SVGs
description : |
    Components for handling SVGs
license     :
    - GPL-2.0-or-later
    - LGPL-2.0-or-later

builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Archive)
    - cmake(KF6ColorScheme)
    - cmake(KF6Config)
    - cmake(KF6CoreAddons)
    - cmake(KF6GuiAddons)
    - cmake(KF6KirigamiPlatform)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6Quick)
    - cmake(Qt6Svg)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
