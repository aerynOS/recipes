name        : kdialog
version     : "26.08.3"
release     : 3
homepage    : https://invent.kde.org/utilities/kdialog
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/kdialog-26.08.3.tar.xz : 64cbdf30d29f26c0535d66494a3032860e700922deb44b3839e2ab171e639a66
summary     : Show KDE dialogs from shell scripts
description : |
    KDialog allows you to display dialog boxes from shell scripts. The syntax is very much inspired by the dialog command.
license     : GPL-2.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6DBusAddons)
    - cmake(KF6GuiAddons)
    - cmake(KF6I18n)
    - cmake(KF6IconThemes)
    - cmake(KF6KIO)
    - cmake(KF6Notifications)
    - cmake(KF6TextWidgets)
    - cmake(KF6WindowSystem)
    - pkgconfig(x11)
rundeps     :
    - qt6-wayland
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
