name        : kdf
version     : "26.08.3"
release     : 2
homepage    : https://apps.kde.org/kdf/
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/kdf-26.08.3.tar.xz : 7a72a2a79d57d6aa75cae58548db10a54f0bf46ea08b5dea2c9a7edfc8ff7d6f
summary     : Disk usage viewer
description : |
    KDF displays the usage of the mounted file systems and other storage devices, and lets you unmount or eject them.
license     :
    - CC0-1.0
    - GPL-2.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Completion)
    - cmake(KF6Config)
    - cmake(KF6ConfigWidgets)
    - cmake(KF6CoreAddons)
    - cmake(KF6Crash)
    - cmake(KF6DocTools)
    - cmake(KF6I18n)
    - cmake(KF6IconThemes)
    - cmake(KF6JobWidgets)
    - cmake(KF6KCMUtils)
    - cmake(KF6KIO)
    - cmake(KF6Notifications)
    - cmake(KF6Service)
    - cmake(KF6StatusNotifierItem)
    - cmake(KF6WidgetsAddons)
    - cmake(KF6XmlGui)
rundeps     :
    - qt6-wayland
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-docs":
        paths:
            - /usr/share/doc
