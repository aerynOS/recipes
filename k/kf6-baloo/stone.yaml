name        : kf6-baloo
version     : "6.32.0"
release     : 34
homepage    : https://invent.kde.org/frameworks/baloo
upstreams   :
    - https://download.kde.org/stable/frameworks/6.32/baloo-6.32.0.tar.xz : 305c0e41dab070cac27d2e9530a81aab95157dd76c1c00ffe87d1ad08734dad7
summary     : Baloo provides file searching and indexing
description : |
    Baloo provides file searching and indexing
license     :
    - GPL-2.0-or-later
    - LGPL-2.0-or-later
    - LGPL-2.1-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Config)
    - cmake(KF6CoreAddons)
    - cmake(KF6Crash)
    - cmake(KF6DBusAddons)
    - cmake(KF6FileMetaData)
    - cmake(KF6I18n)
    - cmake(KF6IdleTime)
    - cmake(KF6KIO)
    - cmake(KF6Solid)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6Qml)
    - lmdb-devel
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-devel":
        rundeps:
            - cmake(KF6FileMetaData)
