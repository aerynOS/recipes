name        : kcachegrind
version     : "26.08.3"
release     : 2
homepage    : https://apps.kde.org/kcachegrind/
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/kcachegrind-26.08.3.tar.xz : e402e384dffbcf9fee583716ef6b9a788be4421988fee9cc8da1b178b9962a37
summary     : Visualization of performance profiling data
description : |
    kcachegrind is a KDE GUI to visualize profiling data. It is mainly used as a visualization frontend for data measured by the Cachegrind/Callgrind tools from the Valgrind package.
license     :
    - GFDL-1.2-or-later
    - GPL-2.0-only
    - LGPL-2.1-only
    - LGPL-3.0-only
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Archive)
    - cmake(KF6Config)
    - cmake(KF6CoreAddons)
    - cmake(KF6DBusAddons)
    - cmake(KF6DocTools)
    - cmake(KF6I18n)
    - cmake(KF6KIO)
    - cmake(KF6WidgetsAddons)
    - cmake(KF6XmlGui)
    - cmake(Qt6CorePrivate)
rundeps     :
    - binary(valgrind)
    - qt6-wayland
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-docs":
        paths:
            - /usr/share/doc
