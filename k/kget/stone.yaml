name        : kget
version     : "26.08.3"
release     : 2
homepage    : https://apps.kde.org/kget/
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/kget-26.08.3.tar.xz : 63803251d8915de653c73eb177c66b786369cf7bbc8cfe80f4f96bcc21f941a3
summary     : Download manager
description : |
    KGet is a versatile and user-friendly download manager.
license     :
    - GFDL-1.2-or-later
    - GPL-2.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(Gpgmepp)
    - cmake(KF6Completion)
    - cmake(KF6Config)
    - cmake(KF6ConfigWidgets)
    - cmake(KF6CoreAddons)
    - cmake(KF6Crash)
    - cmake(KF6DBusAddons)
    - cmake(KF6DocTools)
    - cmake(KF6I18n)
    - cmake(KF6IconThemes)
    - cmake(KF6ItemViews)
    - cmake(KF6KCMUtils)
    - cmake(KF6KIO)
    - cmake(KF6Notifications)
    - cmake(KF6NotifyConfig)
    - cmake(KF6StatusNotifierItem)
    - cmake(KF6Wallet)
    - cmake(KF6WidgetsAddons)
    - cmake(KF6WindowSystem)
    - cmake(KF6XmlGui)
    - cmake(KTorrent6)
    - cmake(QGpgmeQt6)
    - pkgconfig(sqlite3)
    # - pkgconfig(libmms) # enables the MMS transfer plugin
rundeps     :
    - qt6-wayland
setup       : |
    %cmake_kf6 \
        -DBUILD_TESTING=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
check       : |
    # schedulertest fails and filedeletertest hangs (Gentoo bug 756817)
    env QT_QPA_PLATFORM=offscreen %cmake_test -E "(schedulertest|filedeletertest)"
packages    :
    # libkgetcore is an internal, unversioned library used by the app; keep it with the app
    - "%(name)":
        paths:
            - /usr/lib/libkgetcore.so

    - "%(name)-docs":
        paths:
            - /usr/share/doc
