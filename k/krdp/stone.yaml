name        : krdp
version     : "6.8.3"
release     : 35
homepage    : https://kde.org/plasma-desktop/
upstreams   :
    - https://download.kde.org/stable/plasma/6.8.3/krdp-6.8.3.tar.xz : 8a80e5a5e0f3e7b665752a60264ac36367431d6d8865cd5797370010a819a40b
summary     : Library and examples for creating an RDP server
description : |
    Library and examples for creating an RDP server
license     : LGPL-2.1-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(FreeRDP)
    - cmake(KF6Config)
    - cmake(KF6CoreAddons)
    - cmake(KF6Crash)
    - cmake(KF6DBusAddons)
    - cmake(KF6GuiAddons)
    - cmake(KF6I18n)
    - cmake(KF6KCMUtils)
    - cmake(KF6StatusNotifierItem)
    - cmake(KPipeWire)
    - cmake(PlasmaWaylandProtocols)
    - cmake(Qt6Concurrent)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6Keychain)
    - cmake(Qt6Quick)
    - cmake(Qt6WaylandClient)
    - pkgconfig(libei-1.0)
    - pkgconfig(pam)
    - kf6-kirigami-addons
rundeps     :
    - binary(openssl)
    - kf6-kirigami-addons
tuning      :
    - lto: full
    - optimize: speed
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
