name        : kolourpaint
version     : "26.08.3"
release     : 2
homepage    : https://apps.kde.org/kolourpaint/
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/kolourpaint-26.08.3.tar.xz : f555380d7ef529f3c3a130ca39c0094fe4bef31eab052a8604a25560d8321424
summary     : Simple raster paint program
description : |
    KolourPaint is a free, easy-to-use paint program for KDE.
license     :
    - BSD-2-Clause
    - CC0-1.0
    - LGPL-2.0-only
    - LGPL-2.0-or-later
    - LGPL-2.1-only
    - LGPL-3.0-only
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Crash)
    - cmake(KF6DocTools)
    - cmake(KF6GuiAddons)
    - cmake(KF6I18n)
    - cmake(KF6JobWidgets)
    - cmake(KF6KIO)
    - cmake(KF6TextWidgets)
    - cmake(KF6WidgetsAddons)
    - cmake(KF6XmlGui)
    - cmake(KSaneWidgets6)
    - cmake(Qt6PrintSupport)
rundeps     :
    - breeze
    - kf6-breeze-icons
    - kf6-kimageformats
    - qt6-wayland
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    # libkolourpaint_lgpl is an internal, unversioned library used by the app; keep it with the app
    - "%(name)":
        paths:
            - /usr/lib/libkolourpaint_lgpl.so

    - "%(name)-docs":
        paths:
            - /usr/share/doc
