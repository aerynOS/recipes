name        : kmod
version     : "34.3"
release     : 13
homepage    : https://github.com/kmod-project/kmod
upstreams   :
    - https://mirrors.edge.kernel.org/pub/linux/utils/kernel/kmod/kmod-34.3.tar.xz : 985554de49c21a58abd68c6cda2251384e1e5bb08b3b14c7f02b51f4c90c2958
summary     : Linux kernel module handling
description : |
    kmod is a set of tools to handle common tasks with Linux kernel modules like insert, remove, list, check properties, resolve dependencies and aliases.
license     :
    - GPL-2.0-or-later
    - LGPL-2.1-or-later
builddeps   :
    - binary(scdoc)
    - pkgconfig(liblzma)
    - pkgconfig(libssl)
    - pkgconfig(libzstd)
    - pkgconfig(zlib)
tuning      :
    - lto: full
    - optimize: size
setup       : |
    # On Aeryn we compress kernel modules with zstd. Users may use
    # lzma/zlib so build support for those but use dlopen() if necessary
    %meson \
        -Ddlopen=xz,zlib
build       : |
    %meson_build
install     : |
    %meson_install

    %install_file %(pkgdir)/trigger.yaml %(installroot)/usr/share/moss/triggers/tx.d/kmod.yaml
packages    :
    - "%(name)-libs":
        summary: "Library files for %(name)"
        description: |
            Library files for %(name), typically pulled in as a dependency of another package.
        paths:
            - /usr/lib/lib*.so.*

    # Moss upgrade bug
    - "%(name)":
        rundeps:
            - "%(name)-libs"
