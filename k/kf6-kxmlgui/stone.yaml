name        : kf6-kxmlgui
version     : "6.32.0"
release     : 32
homepage    : https://invent.kde.org/frameworks/kxmlgui
upstreams   :
    - https://download.kde.org/stable/frameworks/6.32/kxmlgui-6.32.0.tar.xz : 3b9be65d4f30e372bc9b77321da5a31dec9fe997a946a6a8a03b64377856ab38
summary     : Framework for managing menu and toolbar actions.
description : |
    Framework for managing menu and toolbar actions.
license     :
    - LGPL-2.0-only
    - LGPL-2.0-or-later
    - LGPL-2.1-or-later
builddeps   :
    # TODO package pyside bindings, note that they need to be subpackaged. Let's wait till something needs them
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Config)
    - cmake(KF6ConfigWidgets)
    - cmake(KF6CoreAddons)
    - cmake(KF6GlobalAccel)
    - cmake(KF6GuiAddons)
    - cmake(KF6I18n)
    - cmake(KF6IconThemes)
    - cmake(KF6ItemViews)
    - cmake(Qt6CorePrivate)
setup       : |
    %cmake_kf6 -DBUILD_PYTHON_BINDINGS=OFF
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-devel":
        rundeps:
            - cmake(KF6ConfigWidgets)
            - cmake(KF6GuiAddons)
