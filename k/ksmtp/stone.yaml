name        : ksmtp
version     : "26.08.3"
release     : 19
homepage    : https://invent.kde.org/pim/ksmtp
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/ksmtp-26.08.3.tar.xz : 91b0ea13523c314a628d3dd8d4d22598f3ec1de0daa68ce79ae7324afd26e8d5
summary     : Job-based library to send email through an SMTP server
description : |
    Job-based library to send email through an SMTP server.
license     : LGPL-2.1-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6CoreAddons)
    - cmake(KF6I18n)
    - cmake(KF6KIO)
    - pkgconfig(libsasl2)
rundeps     :
    - cyrus-sasl-gssapi
    - cyrus-sasl-md5
    - cyrus-sasl-plain
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
