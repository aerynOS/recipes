name        : kmag
version     : "26.08.3"
release     : 16
homepage    : https://apps.kde.org/kmag/
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/kmag-26.08.3.tar.xz : cfd5b94d572e8f98385f5c0a9cf3ce639ce720ca27089ad12a0699d947d24a08
summary     : KMag is a screen magnifier
description : |
    KMag is a screen magnifier
license     :
    - GFDL-1.2-or-later
    - GPL-2.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Crash)
    - cmake(KF6DocTools)
    - cmake(KF6I18n)
    - cmake(KF6KIO)
    - cmake(KF6XmlGui)
    - cmake(QAccessibilityClient6)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-docs":
        paths:
            - /usr/share/doc
