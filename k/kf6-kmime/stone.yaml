name        : kf6-kmime
version     : "6.31.0"
release     : 5
upstreams   :
    - https://download.kde.org/stable/frameworks/6.31/kmime-6.31.0.tar.xz : 859a5c233ef0a70af76fe678da3b1d519086de9cd410826342bdf2c02eadcf90
homepage    : https://kde.org
license     : LGPL-2.1-or-later
summary     : KMime is a library for handling mail messages and newsgroup articles
description : |
    KMime is a library for handling mail messages and newsgroup articles.
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Codecs)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-devel":
        rundeps:
            - cmake(KF6Codecs)
