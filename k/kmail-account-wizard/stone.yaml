name        : kmail-account-wizard
version     : "26.08.3"
release     : 2
homepage    : https://invent.kde.org/pim/kmail-account-wizard
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/kmail-account-wizard-26.08.3.tar.xz : dd4427f5ae2a113dac138bcd2ff06a1d73e70ca57ea0f2e723de50e55641d05d
summary     : KMail account setup wizard
description : |
    An application which assists you with the configuration of accounts in KMail.
license     :
    - BSD-3-Clause
    - CC0-1.0
    - GFDL-1.2-or-later
    - GPL-2.0-or-later
    - LGPL-2.0-or-later
    - MIT
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Crash)
    - cmake(KF6DBusAddons)
    - cmake(KF6I18n)
    - cmake(KF6IconThemes)
    - cmake(KF6KIO)
    - cmake(KF6Mime)
    - cmake(KPim6Akonadi)
    - cmake(KPim6IdentityManagementCore)
    - cmake(KPim6MailTransport)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6Keychain)
    - cmake(Qt6Qml)
    - cmake(Qt6Quick)
    - cmake(Qt6QuickControls2)
rundeps     :
    - kf6-kirigami
    - kf6-kirigami-addons
    - qt6-wayland
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
