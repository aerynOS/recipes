name        : kf6-kholidays
version     : "6.29.0"
release     : 22
upstreams   :
    - https://download.kde.org/stable/frameworks/6.29/kholidays-6.29.0.tar.xz : bcb204c0cca063b071e4bc986ef418b03b57e28cfc7fea45e368d1cb8b56b3f2
homepage    : https://community.kde.org/Frameworks
license     :
    - BSD-2-Clause
    - BSD-3-Clause
    - GPL-3.0-or-later
    - LGPL-2.0-or-later
summary     : KDE library for regional holiday information
description : |
    KDE library for regional holiday information
builddeps   :
    - binary(bison)
    - binary(flex)
