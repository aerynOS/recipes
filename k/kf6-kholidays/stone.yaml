name        : kf6-kholidays
version     : "6.32.0"
release     : 27
homepage    : https://invent.kde.org/frameworks/kholidays
upstreams   :
    - https://download.kde.org/stable/frameworks/6.32/kholidays-6.32.0.tar.xz : a6aeede0b1c5bba93f7e60d7c6fe84051cb32d90d3981202c4f90237b5fc17a7
summary     : KDE library for regional holiday information
description : |
    KDE library for regional holiday information
license     :
    - BSD-2-Clause
    - BSD-3-Clause
    - GPL-3.0-or-later
    - LGPL-2.0-or-later
builddeps   :
    - binary(bison)
    - binary(flex)
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6Qml)
setup       : |
    # Bundled FlexLexer.h is too old for flex 2.6.11
    %patch %(pkgdir)/0001-Update-FlexLexer.h-for-flex-2.6.11.patch

    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
