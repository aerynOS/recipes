name        : kbackup
version     : "26.08.3"
release     : 2
homepage    : https://apps.kde.org/kbackup/
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/kbackup-26.08.3.tar.xz : ad1947d145163f323a5be25e8fb5d5999a494ab10ade87ddc9ab0e548fbdb041
summary     : Simple backup application
description : |
    KBackup is an application which lets you back up your data in a simple, user friendly way.
license     : GPL-2.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Archive)
    - cmake(KF6DocTools)
    - cmake(KF6GuiAddons)
    - cmake(KF6I18n)
    - cmake(KF6IconThemes)
    - cmake(KF6KIO)
    - cmake(KF6Notifications)
    - cmake(KF6StatusNotifierItem)
    - cmake(KF6WidgetsAddons)
    - cmake(KF6XmlGui)
    - cmake(Qt6Core5Compat)
    - pkgconfig(libarchive)
    - pkgconfig(shared-mime-info)
rundeps     :
    - qt6-wayland
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-docs":
        paths:
            - /usr/share/doc
