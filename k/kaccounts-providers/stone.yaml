name        : kaccounts-providers
version     : "26.08.3"
release     : 22
homepage    : https://invent.kde.org/network/kaccounts-providers
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/kaccounts-providers-26.08.3.tar.xz : bec64fd9f9098969b12136af44c0b9b3a983cfba10a5fd25a035b8e9a09c743b
summary     : KDE Providers
description : |
    KDE providers for accounts sign-on Provides additional configuration files for libaccounts and libsignon to recognize online services such as Facebook and Google.
license     : GPL-2.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KAccounts6)
    - cmake(KF6CoreAddons)
    - cmake(KF6I18n)
    - cmake(KF6KIO)
    - cmake(KF6Package)
    - cmake(QCoro6)
    - cmake(Qt6Qml)
    - cmake(Qt6WebEngineQuick)
rundeps     :
    - binary(signon-ui)
    - signon-plugin-oauth2 # Google provider
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install

    # Presumably unused config files (no reference in any related source project)
    rm -rfv %(installroot)/etc/signon-ui
    rmdir -v %(installroot)/etc
