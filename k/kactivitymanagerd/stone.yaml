name        : kactivitymanagerd
version     : "6.8.3"
release     : 28
homepage    : https://kde.org/plasma-desktop/
upstreams   :
    - https://download.kde.org/stable/plasma/6.8.3/kactivitymanagerd-6.8.3.tar.xz : ace8726d6a3f95769dd3c8614d4c0a432ce756bd60ab12584b2d13280db471f1
summary     : Core components for the KDE Activity concept
description : |
    Core components for the KDE Activity concept
license     :
    - GPL-2.0-or-later
    - GPL-3.0-or-later
builddeps   :
    - cmake(Boost)
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Crash)
    - cmake(KF6DBusAddons)
    - cmake(KF6GlobalAccel)
    - cmake(KF6I18n)
    - cmake(KF6KIO)
    - cmake(KF6XmlGui)
tuning      :
    - lto: full
    - optimize: speed
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)":
        paths:
            - /usr/lib/libkactivitymanagerd_plugin.so
