name        : kunifiedpush
version     : "26.08.3"
release     : 20
homepage    : https://invent.kde.org/libraries/kunifiedpush
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/kunifiedpush-26.08.3.tar.xz : 01508999563915689401c2fe4dd608a61bb1f7a37dd095a91befcdb79823e6d1
summary     : UnifiedPush client library
description : |
    UnifiedPush client library and distributor daemon
