name        : kdebugsettings
version     : "26.08.3"
release     : 2
homepage    : https://apps.kde.org/kdebugsettings/
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/kdebugsettings-26.08.3.tar.xz : c9c5ee899a276601e20af861b42f7376af836fcebac2ed15439144aaf12ec9bc
summary     : Configure Qt logging categories
description : |
    An application to enable/disable qCDebug logging categories.
license     :
    - BSD-3-Clause
    - CC0-1.0
    - LGPL-2.0-or-later
    - MIT
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Completion)
    - cmake(KF6Config)
    - cmake(KF6ConfigWidgets)
    - cmake(KF6CoreAddons)
    - cmake(KF6Crash)
    - cmake(KF6DBusAddons)
    - cmake(KF6I18n)
    - cmake(KF6IconThemes)
    - cmake(KF6WidgetsAddons)
    - cmake(KF6WindowSystem)
    - cmake(KF6XmlGui)
rundeps     :
    - qt6-wayland
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
