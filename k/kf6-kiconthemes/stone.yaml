name        : kf6-kiconthemes
version     : "6.32.0"
release     : 33
homepage    : https://invent.kde.org/frameworks/kiconthemes
upstreams   :
    - https://download.kde.org/stable/frameworks/6.32/kiconthemes-6.32.0.tar.xz : 1bd4fe3246af5527c136afc650703e5231b8b2de32ca1eac48fa310adece8db8
summary     : Icon GUI utilities.
description : |
    Icon GUI utilities.
license     :
    - GPL-2.0-only
    - LGPL-2.0-only
    - LGPL-2.0-or-later
    - LGPL-2.1-only
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Archive)
    - cmake(KF6BreezeIcons)
    - cmake(KF6ColorScheme)
    - cmake(KF6I18n)
    - cmake(KF6WidgetsAddons)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6Qml)
    - cmake(Qt6Svg)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
