name        : kjournald
version     : "26.08.3"
release     : 23
homepage    : https://apps.kde.org/kjournaldbrowser/
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/kjournald-26.08.3.tar.xz : 8796104c0ce9b3b15c2612d28cf5d1f148502cc87fedcb3f84ae82739e23b04f
summary     : Framework for interacting with systemd-journald
description : |
    Framework for interacting with systemd-journald
license     : GPL-2.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Config)
    - cmake(KF6CoreAddons)
    - cmake(KF6Crash)
    - cmake(KF6I18n)
    - cmake(KF6Kirigami)
    - cmake(KF6KirigamiAddons)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6Qml)
    - pkgconfig(libsystemd)
rundeps     :
    - kf6-qqc2-desktop-style
    - qt6-wayland
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)":
        paths:
            - /usr/lib/libkjournald.so
