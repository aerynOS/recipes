name        : kmbox
version     : "26.08.1"
release     : 19
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.1/src/kmbox-26.08.1.tar.xz : 4bda0a789e010d383db7a56294941853cc2d878ddd57b33f1e08daeb2714a75b
homepage    : https://kde.org
license     : LGPL-2.1-or-later
summary     : KMBox provides API to access emails in storages in the MBox format
description : |
    KMBox provides API to access emails in storages in the MBox format.
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Mime)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-devel":
        rundeps:
            - cmake(KF6Mime)
