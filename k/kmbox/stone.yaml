name        : kmbox
version     : "26.08.3"
release     : 21
homepage    : https://invent.kde.org/pim/kmbox
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/kmbox-26.08.3.tar.xz : b897e2c360b2b2e0d34ab196cef4c9e840920e6001df73538fa05407c4270bad
summary     : KMBox provides API to access emails in storages in the MBox format
description : |
    KMBox provides API to access emails in storages in the MBox format.
license     : LGPL-2.1-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Mime)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-devel":
        rundeps:
            - cmake(KF6Mime)
