name        : kmbox
version     : "26.08.2"
release     : 20
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.2/src/kmbox-26.08.2.tar.xz : a4b08915584d0b7ec5fa28adae1eb3d0bc63a1d95f15e40bfae529505d0307a5
homepage    : https://kde.org
license     : LGPL-2.1-or-later
summary     : KMBox provides API to access emails in storages in the MBox format
description : |
    KMBox provides API to access emails in storages in the MBox format.
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Mime)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-devel":
        rundeps:
            - cmake(KF6Mime)
