name        : kwin
version     : "6.8.1"
release     : 45
upstreams   :
    - https://download.kde.org/stable/plasma/6.8.1/kwin-6.8.1.tar.xz : f3d725f81061c1ba97fdef8aeb2101a5c5e03c77f11e9a2abaa1dfed4489d3b6
homepage    : https://kde.org/plasma-desktop/
license     :
    - GFDL-1.2-only
    - GPL-2.0-only
summary     : KDE window manager
description : |
    KWin is the window manager for the KDE Plasma Desktop. It gives you complete control over your windows, making sure they're not in the way but aid you in your task. It paints the window decoration, the bar on top of every window with (configurable) buttons like close, maximize and minimize. It also handles placing of windows and switching between them.
builddeps   :
    - binary(Xwayland)
    - binary(glslangValidator)
    - binary(glslc)
    - cmake(Aurorae)
    - cmake(Breeze)
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KDecoration3)
    - cmake(KF6Auth)
    - cmake(KF6ColorScheme)
    - cmake(KF6Config)
    - cmake(KF6CoreAddons)
    - cmake(KF6Crash)
    - cmake(KF6DBusAddons)
    - cmake(KF6Declarative)
    - cmake(KF6DocTools)
    - cmake(KF6GlobalAccel)
    - cmake(KF6GuiAddons)
    - cmake(KF6I18n)
    - cmake(KF6IdleTime)
    - cmake(KF6KCMUtils)
    - cmake(KF6Kirigami)
    - cmake(KF6NewStuff)
    - cmake(KF6Notifications)
    - cmake(KF6Package)
    - cmake(KF6Runner)
    - cmake(KF6Service)
    - cmake(KF6Svg)
    - cmake(KF6WidgetsAddons)
    - cmake(KF6WindowSystem)
    - cmake(KF6XmlGui)
    - cmake(KGlobalAccelD)
    - cmake(KNightTime)
    - cmake(KScreenLocker)
    - cmake(KWayland)
    - cmake(Plasma)
    - cmake(PlasmaActivities)
    - cmake(PlasmaWaylandProtocols)
    - cmake(QAccessibilityClient6)
    - cmake(Qt6Core5Compat)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6Quick)
    - cmake(Qt6Sensors)
    - cmake(Qt6Svg)
    - cmake(Qt6WaylandClient)
    - cmake(VulkanLoader)
    - pkgconfig(egl)
    - pkgconfig(epoxy)
    - pkgconfig(fontconfig)
    - pkgconfig(freetype2)
    - pkgconfig(gbm)
    - pkgconfig(hwdata)
    - pkgconfig(lcms2)
    - pkgconfig(libcanberra)
    - pkgconfig(libdisplay-info)
    - pkgconfig(libdrm)
    - pkgconfig(libeis-1.0)
    - pkgconfig(libevdev)
    - pkgconfig(libinput)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libsystemd)
    - pkgconfig(libxcvt)
    - pkgconfig(udev)
    - pkgconfig(wayland-protocols)
    - pkgconfig(xkbcommon)
    - pkgconfig(xkbcommon-x11)
    - milou
tuning      :
    - lto: full
    - optimize: speed
setup       : |
    %patch %(pkgdir)/revert-cap-sys-nice.patch
    # Fix glitches on NVIDIA
    %patch %(pkgdir)/64850f8.patch
    %patch %(pkgdir)/83ad326.patch

    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install

    rm -rfv %(installroot)%(docdir)

    # TODO: When we support capabilities make sure to add CAP_SYS_NICE to the kwin binary
packages    :
    - "%(name)":
        rundeps:
            - aurorae # Support for downloaded themeable window decorations
            - kf6-kdeclarative # QML dep
            - kf6-kirigami # QML dep
            - libplasma # QML dep
            - milou # QML dep
            - binary(Xwayland)

    - "%(name)-libs":
        summary: ~
        paths:
            - /usr/lib/libkwin.so.*
            - /usr/lib/libkcmkwincommon.so.*
            - /usr/share/qlogging-categories6

    - "%(name)-devel":
        paths:
            - /usr/share/dbus-1/interfaces
