name        : kde-inotify-survey
version     : "26.08.3"
release     : 2
homepage    : https://invent.kde.org/system/kde-inotify-survey
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/kde-inotify-survey-26.08.3.tar.xz : 0c36382b51ece4e82e6079b41931ee4f815c64dd89fce3b0d730ee64e01f40e2
summary     : Monitor inotify limits
description : |
    Tooling for monitoring inotify limits and informing the user when they have been or are about to be reached.
license     :
    - BSD-3-Clause
    - CC0-1.0
    - FSFAP
    - GPL-2.0-only
    - GPL-3.0-only
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Auth)
    - cmake(KF6CoreAddons)
    - cmake(KF6DBusAddons)
    - cmake(KF6I18n)
    - cmake(KF6Notifications)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
