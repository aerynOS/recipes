name        : kf6-kimageformats
version     : "6.32.0"
release     : 29
homepage    : https://invent.kde.org/frameworks/kimageformats
upstreams   :
    - https://download.kde.org/stable/frameworks/6.32/kimageformats-6.32.0.tar.xz : 298069eab84d34b909fc271d818b0762c6c63cc8490f2d8b0fe48dc0d8804b5c
summary     : Additional image formats for Qt6/KF6
description : |
    Additional image formats for Qt6/KF6
license     :
    - GPL-2.0-only
    - LGPL-2.0-or-later
    - LGPL-2.1-or-later
    - LGPL-2.1-only
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Archive)
    - cmake(OpenEXR)
    - cmake(OpenJPEG)
    - pkgconfig(libavif)
    - pkgconfig(libheif)
    - pkgconfig(libjxl)
    - pkgconfig(libraw)
rundeps    :
    - qt6-imageformats
setup       : |
    %cmake_kf6 \
        -DKIMAGEFORMATS_HEIF=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
