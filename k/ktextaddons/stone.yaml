name        : ktextaddons
version     : "2.1.2"
release     : 15
upstreams   :
    - https://download.kde.org/stable/ktextaddons/ktextaddons-2.1.2.tar.xz : f3b4448904f1656d6d7cd5a557d22fe1c50624eb32ed369f34726beff9ce0589
homepage    : https://invent.kde.org/libraries/ktextaddons
license     :
    - GPL-2.0-or-later
    - LGPL-2.1-or-later
summary     : Various text handling addons
description : |
    Text addons (autocorrection, text to speak, grammar checking, text translator, emoticon support)
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Archive)
    - cmake(KF6ColorScheme)
    - cmake(KF6CoreAddons)
    - cmake(KF6I18n)
    - cmake(KF6IconThemes)
    - cmake(KF6KIO)
    - cmake(KF6Sonnet)
    - cmake(KF6SyntaxHighlighting)
    - cmake(KF6TextWidgets)
    - cmake(KF6WidgetsAddons)
    - cmake(Qt6Keychain)
    - cmake(Qt6MultimediaWidgets)
    - cmake(Qt6TextToSpeech)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-qt6":
        summary: Various text handling addons - Qt6 bindings
        description: Various text handling addons - Qt6 bindings
        paths:
            - /usr/lib/libKF6*.so.*
            - /usr/lib/libmcpprotocol*.so.*
            - /usr/lib/libtextautogenerate*.so.*
            - /usr/lib/libtextutils-cmark-rc-copy.so.*
            - /usr/lib/qt6/plugins/kf6/speechtotext/
            - /usr/lib/qt6/plugins/kf6/textautogeneratetext/
            - /usr/lib/qt6/plugins/kf6/translator/
            - /usr/share/config.kcfg/
            - /usr/share/locale/
            - /usr/share/qlogging-categories6/

    - "%(name)-qt6-devel":
        summary: Various text handling addons - Qt6 bindings - Devel files
        description: Various text handling addons - Qt6 bindings - Devel files
        rundeps:
            - "%(name)-qt6"
            - cmake(KF6Sonnet)
            - cmake(KF6SyntaxHighlighting)
            - cmake(Qt6TextToSpeech)
        paths:
            - /usr/include/KF6/
            - /usr/lib/cmake/KF6*/
            - /usr/lib/cmake/textutils-cmark-rc-copy/
            - /usr/lib/libKF6*.so
            - /usr/lib/libtextutils-cmark-rc-copy.so
            - /usr/lib/qt6/plugins/designer/
            - /usr/share/doc/qt6/
