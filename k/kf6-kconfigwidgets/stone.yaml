name        : kf6-kconfigwidgets
version     : "6.32.0"
release     : 33
homepage    : https://invent.kde.org/frameworks/kconfigwidgets
upstreams   :
    - https://download.kde.org/stable/frameworks/6.32/kconfigwidgets-6.32.0.tar.xz : 9d7f60aec2c8153e944d0916852942abb7a28459146b1383f3c540e49dd3da8d
summary     : Widgets for configuration dialogs
description : |
    Widgets for configuration dialogs
license     :
    - BSD-3-Clause
    - GPL-2.0-or-later
    - LGPL-2.0-only
    - LGPL-2.0-or-later
    - LGPL-2.1-only
    - MIT
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Codecs)
    - cmake(KF6ColorScheme)
    - cmake(KF6Config)
    - cmake(KF6CoreAddons)
    - cmake(KF6GuiAddons)
    - cmake(KF6I18n)
    - cmake(KF6WidgetsAddons)
    - cmake(Qt6CorePrivate)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-devel":
        rundeps:
            - cmake(KF6Codecs)
            - cmake(KF6ColorScheme)
            - cmake(KF6WidgetsAddons)
