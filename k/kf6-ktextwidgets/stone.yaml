name        : kf6-ktextwidgets
version     : "6.32.0"
release     : 24
homepage    : https://invent.kde.org/frameworks/ktextwidgets
upstreams   :
    - https://download.kde.org/stable/frameworks/6.32/ktextwidgets-6.32.0.tar.xz : 7d8bf911d600bd695d2c9a9bdd0ff26e40092195aa18926adf89aef46a330e84
summary     : Text editing widgets.
description : |
    Text editing widgets.
license     :
    - LGPL-2.0-only
    - LGPL-2.0-or-later
    - LGPL-2.1-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Completion)
    - cmake(KF6Config)
    - cmake(KF6ConfigWidgets)
    - cmake(KF6I18n)
    - cmake(KF6Sonnet)
    - cmake(KF6WidgetsAddons)
    - cmake(Qt6TextToSpeech)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-devel":
        rundeps:
            - cmake(KF6Sonnet)
