name        : kf6-networkmanager-qt
version     : "6.32.0"
release     : 27
homepage    : https://invent.kde.org/frameworks/networkmanager-qt
upstreams   :
    - https://download.kde.org/stable/frameworks/6.32/networkmanager-qt-6.32.0.tar.xz : 028134ebcb8aba0394377775a15741c8dc3fc33af9651508a6d819ac1e7f31a0
summary     : Qt wrapper for NetworkManager DBus API
description : |
    Qt wrapper for NetworkManager DBus API
license     :
    - BSD-3-Clause
    - GPL-2.0-only
    - LGPL-2.1-only
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6Qml)
    - pkgconfig(gio-2.0)
    - pkgconfig(libnm)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-devel":
        rundeps:
            - pkgconfig(libnm)
