name        : krfb
version     : "26.08.3"
release     : 2
homepage    : https://apps.kde.org/krfb/
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/krfb-26.08.3.tar.xz : 33d557b274684c3af8193a7ccd9a2096f5853ceef899f5ee2620b2030f32807b
summary     : Desktop sharing server
description : |
    Krfb is a desktop sharing server that lets others view or control your desktop session over VNC.
license     :
    - BSD-3-Clause
    - CC0-1.0
    - GPL-2.0-or-later
    - GPL-3.0-or-later
    - LGPL-2.1-only
    - LGPL-3.0-only
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Config)
    - cmake(KF6CoreAddons)
    - cmake(KF6Crash)
    - cmake(KF6DBusAddons)
    - cmake(KF6DNSSD)
    - cmake(KF6DocTools)
    - cmake(KF6I18n)
    - cmake(KF6Notifications)
    - cmake(KF6StatusNotifierItem)
    - cmake(KF6Wallet)
    - cmake(KF6WidgetsAddons)
    - cmake(KF6WindowSystem)
    - cmake(KF6XmlGui)
    - cmake(KPipeWire)
    - cmake(KWayland)
    - cmake(PlasmaWaylandProtocols)
    - cmake(Qt6GuiPrivate)
    - cmake(Qt6WaylandClient)
    - pkgconfig(libvncserver)
    - pkgconfig(x11)
    - pkgconfig(xcb)
    - pkgconfig(xcb-image)
    - pkgconfig(xdamage)
    - pkgconfig(xext)
    - pkgconfig(xtst)
rundeps     :
    - qt6-wayland
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-docs":
        paths:
            - /usr/share/doc
