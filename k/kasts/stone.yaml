name        : kasts
version     : "26.08.3"
release     : 2
homepage    : https://apps.kde.org/kasts/
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/kasts-26.08.3.tar.xz : b0ccdadaa78f5a250b3ca8c257986e618b123a8b6a489ec2526dca7dc88457fb
summary     : Podcast client
description : |
    Kasts is a convergent podcast application that looks good on desktop and mobile, with features such as episode management through a play queue, sync through gpodder.net and variable playback speed.
license     :
    - BSD-2-Clause
    - BSD-3-Clause
    - CC-BY-SA-4.0
    - CC0-1.0
    - GPL-2.0-only
    - GPL-2.0-or-later
    - GPL-3.0-only
    - GPL-3.0-or-later
    - LGPL-2.1-only
    - LGPL-2.1-or-later
    - LGPL-3.0-only
    - LGPL-3.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6BreezeIcons)
    - cmake(KF6ColorScheme)
    - cmake(KF6Config)
    - cmake(KF6CoreAddons)
    - cmake(KF6Crash)
    - cmake(KF6DBusAddons)
    - cmake(KF6I18n)
    - cmake(KF6IconThemes)
    - cmake(KF6Kirigami)
    - cmake(KF6KirigamiAddons)
    - cmake(KF6Syndication)
    - cmake(KF6ThreadWeaver)
    - cmake(KF6WindowSystem)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6Keychain)
    - cmake(Qt6Multimedia)
    - cmake(Qt6QuickControls2)
    - cmake(Qt6Svg)
    - pkgconfig(gstreamer-1.0)
    - pkgconfig(taglib)
    - pkgconfig(vlc-plugin)
rundeps     :
    - kf6-kirigami-addons
    - qt6-wayland
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    # libKMediaSession is an internal, unversioned library used by the QML plugin; keep it with the app
    - "%(name)":
        paths:
            - /usr/lib/libKMediaSession.so
