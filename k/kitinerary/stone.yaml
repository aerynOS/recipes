name        : kitinerary
version     : "26.08.1"
release     : 33
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.1/src/kitinerary-26.08.1.tar.xz : 0969f558a912506d52a06a4ca10a52f3b400e8671fd1451efe1b74b2b5bec907
homepage    : https://invent.kde.org/pim/kitinerary
license     : LGPL-2.1-or-later
summary     : Data Model and Extraction System for Travel Reservation information
description : |
    A library containing itinerary data model and itinerary extraction code.
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6CalendarCore)
    - cmake(KF6Contacts)
    - cmake(KF6I18n)
    - cmake(KF6Mime)
    - cmake(KPim6PkPass)
    - cmake(Qt6Qml)
    - cmake(libphonenumber)
    - pkgconfig(libxml-2.0)
    - pkgconfig(openssl)
    - pkgconfig(poppler)
    - pkgconfig(poppler-cpp)
    - pkgconfig(shared-mime-info)
    - pkgconfig(zlib)
    - pkgconfig(zxing)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
