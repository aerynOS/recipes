name        : kf6-kconfig
version     : "6.32.0"
release     : 34
homepage    : https://invent.kde.org/frameworks/kconfig
upstreams   :
    - https://download.kde.org/stable/frameworks/6.32/kconfig-6.32.0.tar.xz : 5ec91eeb6b02db8a8c2e31e3ffdd85165bfa815729a45ca11922369098fd3fcf
summary     : Persistent platform-independent application settings.
description : |
    Persistent platform-independent application settings.
license     :
    - BSD-2-Clause
    - BSD-3-Clause
    - GPL-2.0-or-later
    - LGPL-2.0-only
    - LGPL-2.0-or-later
    - LGPL-2.1-only
    - MIT
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6Qml)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-devel":
        rundeps:
            - cmake(Qt6Qml)
