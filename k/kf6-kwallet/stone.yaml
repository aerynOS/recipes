name        : kf6-kwallet
version     : "6.32.0"
release     : 27
homepage    : https://invent.kde.org/frameworks/kwallet
upstreams   :
    - https://download.kde.org/stable/frameworks/6.32/kwallet-6.32.0.tar.xz : d68f74617519d1ebc88f152c29d51333f600b9f0aa8757c0a4fe49a40a5107fa
summary     : Safe desktop-wide storage for passwords
description : |
    This framework contains two main components:
    * Interface to KWallet, the safe desktop-wide storage for passwords on KDE work spaces.
    * The kwalletd used to safely store the passwords on KDE work spaces.
license     :
    - BSD-3-Clause
    - LGPL-2.0-only
    - LGPL-2.0-or-later
    - LGPL-3.0-or-later
    - LGPL-2.1-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6ColorScheme)
    - cmake(KF6Config)
    - cmake(KF6CoreAddons)
    - cmake(KF6Crash)
    - cmake(KF6DBusAddons)
    - cmake(KF6DocTools)
    - cmake(KF6I18n)
    - cmake(KF6Notifications)
    - cmake(KF6WidgetsAddons)
    - cmake(KF6WindowSystem)
    - cmake(Qca-qt6)
    - pkgconfig(gpgmepp)
    - pkgconfig(libgcrypt)
    - pkgconfig(libsecret-1)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)":
        rundeps:
            - pinentry

    - "%(name)-libs":
        paths:
            - /usr/lib/libKF6Wallet.so.*
            - /usr/lib/libKF6WalletBackend.so.*
