name        : kf6-kcontacts
version     : "6.32.0"
release     : 27
homepage    : https://invent.kde.org/frameworks/kcontacts
upstreams   :
    - https://download.kde.org/stable/frameworks/6.32/kcontacts-6.32.0.tar.xz : 8c67fafff1c9cb84fdc7ca6bb66988e3084bb44ba1b2e5fd0f2ebe40ca8f2198
summary     : Address book API for KDE
description : |
    Address book API for KDE
license     :
    - BSD-3-Clause
    - LGPL-2.0-or-later
    - MIT
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Codecs)
    - cmake(KF6Config)
    - cmake(KF6CoreAddons)
    - cmake(KF6I18n)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6Qml)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-devel":
        rundeps:
            - cmake(KF6Codecs)
            - cmake(KF6Config)
            - cmake(KF6CoreAddons)
            - cmake(KF6I18n)
