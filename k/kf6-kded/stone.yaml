name        : kf6-kded
version     : "6.32.0"
release     : 23
homepage    : https://invent.kde.org/frameworks/kded
upstreams   :
    - https://download.kde.org/stable/frameworks/6.32/kded-6.32.0.tar.xz : eade144d1e197b883529f7e262035134d7ff46b859d0beff34ab778cb5ef683b
summary     : Central daemon of KDE work spaces
description : |
    KDED runs in the background and performs a number of small tasks. Some of these tasks are built in, others are started on demand.
license     :
    - LGPL-2.0-only
    - LGPL-2.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Config)
    - cmake(KF6CoreAddons)
    - cmake(KF6Crash)
    - cmake(KF6DBusAddons)
    - cmake(KF6DocTools)
    - cmake(KF6Service)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
