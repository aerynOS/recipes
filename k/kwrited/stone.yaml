name        : kwrited
version     : "6.8.3"
release     : 26
homepage    : https://kde.org/plasma-desktop/
upstreams   :
    - https://download.kde.org/stable/plasma/6.8.3/kwrited-6.8.3.tar.xz : f3038d5bdee825475ba3ef6c61a63279d7e725c64e6dc00a39eb46759ff9d4ea
summary     : KDE daemon listening for wall and write messages
description : |
    KDE daemon listening for wall and write messages.
license     : GPL-2.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6CoreAddons)
    - cmake(KF6I18n)
    - cmake(KF6Notifications)
    - cmake(KF6Pty)
tuning      :
    - lto: full
    - optimize: speed
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
