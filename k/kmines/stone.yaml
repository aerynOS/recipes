name        : kmines
version     : "26.08.3"
release     : 2
homepage    : https://apps.kde.org/kmines/
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/kmines-26.08.3.tar.xz : aa7ffa2138ae8a0d8680e2deb328aec150e43cb525231b0eb78559f8f1ab6da8
summary     : Minesweeper game
description : |
    KMines is a classic Minesweeper game. The idea is to uncover all the squares without blowing up any mines.
license     :
    - BSD-3-Clause
    - CC-BY-SA-4.0
    - CC0-1.0
    - GFDL-1.2-or-later
    - GPL-2.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KDEGames6)
    - cmake(KF6Config)
    - cmake(KF6ConfigWidgets)
    - cmake(KF6CoreAddons)
    - cmake(KF6Crash)
    - cmake(KF6DBusAddons)
    - cmake(KF6DocTools)
    - cmake(KF6I18n)
    - cmake(KF6IconThemes)
    - cmake(KF6TextWidgets)
    - cmake(KF6WidgetsAddons)
    - cmake(KF6XmlGui)
rundeps     :
    - qt6-wayland
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-docs":
        paths:
            - /usr/share/doc
