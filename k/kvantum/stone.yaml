name        : kvantum
version     : "1.1.9"
release     : 7
upstreams   :
    - https://github.com/tsujan/Kvantum/releases/download/V1.1.9/Kvantum-1.1.9.tar.xz : a9ca7d108b73e932227c10e435dc6c46b53306d752a8720f91813039770513df
