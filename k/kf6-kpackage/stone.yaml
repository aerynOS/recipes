name        : kf6-kpackage
version     : "6.29.0"
release     : 20
upstreams   :
    - https://download.kde.org/stable/frameworks/6.29/kpackage-6.29.0.tar.xz : aee3405475bfed6187abc483df6baf48e89b2b2505ee0acc1c8d37728fb9c786
homepage    : https://community.kde.org/Frameworks
license     :
    - GPL-2.0-or-later
    - LGPL-2.0-or-later
summary     : Installation and loading of additional content as packages
description : |
    Installation and loading of additional content (scripts, images...) as packages.
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Archive)
    - cmake(KF6CoreAddons)
    - cmake(KF6DocTools)
    - cmake(KF6I18n)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
