name        : kf6-kpackage
version     : "6.32.0"
release     : 23
homepage    : https://invent.kde.org/frameworks/kpackage
upstreams   :
    - https://download.kde.org/stable/frameworks/6.32/kpackage-6.32.0.tar.xz : f3959f4a5956a29ce9bd083410d7df63d4f93a1a4e451cb87c2ccf834995e3ca
summary     : Installation and loading of additional content as packages
description : |
    Installation and loading of additional content (scripts, images...) as packages.
license     :
    - GPL-2.0-or-later
    - LGPL-2.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Archive)
    - cmake(KF6CoreAddons)
    - cmake(KF6DocTools)
    - cmake(KF6I18n)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
