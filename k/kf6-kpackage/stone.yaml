name        : kf6-kpackage
version     : "6.31.0"
release     : 22
upstreams   :
    - https://download.kde.org/stable/frameworks/6.31/kpackage-6.31.0.tar.xz : cdfdc95ccc31f753f30d62918c8098d8544b08c10b70835628839198671c13a3
homepage    : https://community.kde.org/Frameworks
license     :
    - GPL-2.0-or-later
    - LGPL-2.0-or-later
summary     : Installation and loading of additional content as packages
description : |
    Installation and loading of additional content (scripts, images...) as packages.
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Archive)
    - cmake(KF6CoreAddons)
    - cmake(KF6DocTools)
    - cmake(KF6I18n)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
