name        : kcolorchooser
version     : "26.08.3"
release     : 2
homepage    : https://apps.kde.org/kcolorchooser/
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/kcolorchooser-26.08.3.tar.xz : 23b5b4a6a081cb775631059a7b2ea29fed669354c970a28db6256d06b84a6a90
summary     : Color chooser and palette editor
description : |
    KColorChooser is a color palette tool, used to mix colors and create custom color palettes. Using the dropper, it can obtain the color of any pixel on the screen.
license     : MIT
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6CoreAddons)
    - cmake(KF6I18n)
    - cmake(KF6XmlGui)
rundeps     :
    - qt6-wayland
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
