name        : kscreen
version     : "6.8.3"
release     : 37
homepage    : https://kde.org/plasma-desktop/
upstreams   :
    - https://download.kde.org/stable/plasma/6.8.3/kscreen-6.8.3.tar.xz : 866dead8b6bb3f974a64f18c930e219b358118213e510fcdaabafc37ee7a8a73
summary     : KDE Plasma screen management
description : |
    KDE Plasma screen management
license     :
    - GPL-2.0-or-later
    - LGPL-2.1-only
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Config)
    - cmake(KF6Crash)
    - cmake(KF6DBusAddons)
    - cmake(KF6I18n)
    - cmake(KF6ImageFormats)
    - cmake(KF6ItemModels)
    - cmake(KF6KCMUtils)
    - cmake(KF6Screen)
    - cmake(KF6Svg)
    - cmake(KF6XmlGui)
    - cmake(LayerShellQt)
    - cmake(Plasma)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6WaylandClient)
    - pkgconfig(wayland-protocols)
    - pkgconfig(xi)
    - plasma5support # QML dep
rundeps     :
    - kf6-kimageformats # Required to load HDR test image
    - kf6-kirigami # QML dep for HDR calibrator
    - plasma5support # QML dep
tuning      :
    - lto: full
    - optimize: speed
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
