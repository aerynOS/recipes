name        : kf6-solid
version     : "6.32.0"
release     : 36
homepage    : https://invent.kde.org/frameworks/solid
upstreams   :
    - https://download.kde.org/stable/frameworks/6.32/solid-6.32.0.tar.xz : 9620a6065403c5097fce0518abb7d4f038f4f11327e7ce94094ae9561bce0008
summary     : Desktop hardware abstraction.
description : |
    Desktop hardware abstraction.
license     :
    - BSD-3-Clause
    - LGPL-2.1-only
    - LGPL-2.1-or-later
builddeps   :
    # TODO add mediaplayerinfo
    - binary(bison)
    - binary(flex)
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(Qt6CorePrivate)
    - pkgconfig(libimobiledevice-1.0)
    - pkgconfig(libplist-2.0)
    - pkgconfig(mount)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)":
        rundeps:
            - udisks
            - udisks-btrfs
            - udisks-lvm2
            - upower
