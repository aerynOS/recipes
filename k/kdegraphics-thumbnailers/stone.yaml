name        : kdegraphics-thumbnailers
version     : "26.08.3"
release     : 18
homepage    : https://apps.kde.org/kdegraphics_thumbnailers/
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/kdegraphics-thumbnailers-26.08.3.tar.xz : 529ea393d10d8cf6d6767b739e816b570dc6490d009d95ad8ff411d0bf935b80
summary     : Thumbnailers for various graphics file formats
description : |
    Thumbnailers for various graphics file formats
license     : GPL-2.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KDcrawQt6)
    - cmake(KExiv2Qt6)
    - cmake(KF6Archive)
    - cmake(KF6KIO)
    - cmake(QMobipocket6)
setup       : |
    %cmake_kf6 \
        -DBUILD_WITH_QT6=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
