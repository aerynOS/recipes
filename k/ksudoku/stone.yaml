name        : ksudoku
version     : "26.08.3"
release     : 2
homepage    : https://apps.kde.org/ksudoku/
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/ksudoku-26.08.3.tar.xz : 09ab0cebbad0a15e95a39f972faa0ddd004b5376fec6fd8be6f6a3ebd3580b20
summary     : Sudoku game
description : |
    KSudoku is a logic-based symbol placement puzzle game, offering several Sudoku variants and other grid-based puzzles.
license     :
    - BSD-3-Clause
    - GPL-2.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KDEGames6)
    - cmake(KF6Archive)
    - cmake(KF6Config)
    - cmake(KF6ConfigWidgets)
    - cmake(KF6CoreAddons)
    - cmake(KF6Crash)
    - cmake(KF6DBusAddons)
    - cmake(KF6DocTools)
    - cmake(KF6GuiAddons)
    - cmake(KF6I18n)
    - cmake(KF6JobWidgets)
    - cmake(KF6KIO)
    - cmake(KF6WidgetsAddons)
    - cmake(KF6XmlGui)
    - cmake(Qt6Svg)
    - pkgconfig(gl)
rundeps     :
    - qt6-wayland
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-docs":
        paths:
            - /usr/share/doc
