name        : kf6-ki18n
version     : "6.32.0"
release     : 33
homepage    : https://invent.kde.org/frameworks/ki18n
upstreams   :
    - https://download.kde.org/stable/frameworks/6.32/ki18n-6.32.0.tar.xz : b574b381e7510cf3b14d6a16f6ed5670220f10df7f2494c21a579d20ca1d017f
summary     : KDE Gettext-based UI text internationalization.
description : |
    KDE Gettext-based UI text internationalization.
license     :
    - BSD-3-Clause
    - LGPL-2.0-only
    - LGPL-2.0-or-later
    - LGPL-2.1-only
builddeps   :
    - binary(msgmerge) # gettext
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6Qml)
    - pkgconfig(iso-codes)
rundeps     :
    - binary(msgmerge)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
