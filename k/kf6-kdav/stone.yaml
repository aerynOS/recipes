name        : kf6-kdav
version     : "6.31.0"
release     : 17
upstreams   :
    - https://download.kde.org/stable/frameworks/6.31/kdav-6.31.0.tar.xz : da8e92d3201c5566b9318cf52788a4e9e034fbe556ea1e7a6ca8ee7de03df4d0
homepage    : https://community.kde.org/Frameworks
license     :
    - GPL-2.0-or-later
