name        : kf6-kdav
version     : "6.32.0"
release     : 18
homepage    : https://invent.kde.org/frameworks/kdav
upstreams   :
    - https://download.kde.org/stable/frameworks/6.32/kdav-6.32.0.tar.xz : 58c91b163ccc680bf04e2b72112eafef623d51b8b74eec14ab4faad109691612
summary     : DAV protocol implementation with KJobs
description : |
    DAV protocol implementation with KJobs
license     :
    - GPL-2.0-or-later
    - LGPL-2.0-or-later
builddeps   :
