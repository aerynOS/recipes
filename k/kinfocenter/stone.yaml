name        : kinfocenter
version     : "6.8.3"
release     : 39
homepage    : https://kde.org/plasma-desktop/
upstreams   :
    - https://download.kde.org/stable/plasma/6.8.3/kinfocenter-6.8.3.tar.xz : f14e80ce9c634ed5316dba727e3216ef734c7f0827dd2140596215009ba31a03
summary     : KDE Info Center
description : |
    KDE Info Center
license     :
    - GFDL-1.2-only
    - GPL-2.0-or-later
    - LGPL-2.1-or-later
builddeps   :
    - binary(clinfo)
    - binary(di-edid-decode)
    - binary(eglinfo)
    - binary(glxinfo)
    - binary(lspci)
    - binary(pactl)
    - binary(sensors)
    - binary(vainfo)
    - binary(vulkaninfo)
    - binary(wayland-info)
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Auth)
    - cmake(KF6Config)
    - cmake(KF6CoreAddons)
    - cmake(KF6DocTools)
    - cmake(KF6I18n)
    - cmake(KF6KCMUtils)
    - cmake(KF6KIO)
    - cmake(KF6Kirigami)
    - cmake(KF6Service)
    - cmake(KF6Solid)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6Graphs)
    - pkgconfig(libdrm)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libusb-1.0)
    - pkgconfig(udev)
    - sysbinary(dmidecode)
    - sysbinary(ip)
    # TODO: xdpyinfo(?), fwupdmgr
rundeps     :
    - binary(aha)
    - binary(clinfo)
    - binary(di-edid-decode)
    - binary(eglinfo)
    - binary(glxinfo)
    - binary(lspci)
    - binary(pactl)
    - binary(sensors)
    - binary(vainfo)
    - binary(vulkaninfo)
    - binary(wayland-info)
    - sysbinary(dmidecode)
    - sysbinary(ip)
    - kf6-kirigami
    - systemsettings
tuning      :
    - lto: full
    - optimize: speed
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install

    # TODO: Needs to be rebuilt once we support capabilities
packages     :
    - "%(name)":
        paths:
            - /usr/lib/libKInfoCenterInternal.so

    - "%(name)-docs":
        paths:
            - /usr/share/doc
