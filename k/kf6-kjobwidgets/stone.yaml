name        : kf6-kjobwidgets
version     : "6.32.0"
release     : 32
homepage    : https://invent.kde.org/frameworks/kjobwidgets
upstreams   :
    - https://download.kde.org/stable/frameworks/6.32/kjobwidgets-6.32.0.tar.xz : 98eaee2846181b82b357067db00ac65e3bcf02c11322bb636aa6021a6eb65dd2
summary     : Widgets for showing progress of asynchronous jobs.
description : |
    Widgets for showing progress of asynchronous jobs.
license     :
    - LGPL-2.0-only
    - LGPL-2.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6CoreAddons)
    - cmake(KF6Notifications)
    - cmake(KF6WidgetsAddons)
    - cmake(Qt6CorePrivate)
setup       : |
    %cmake_kf6 -DBUILD_PYTHON_BINDINGS=OFF
build       : |
    %cmake_build
install     : |
    %cmake_install
