name        : kgraphviewer
version     : "26.08.3"
release     : 2
homepage    : https://apps.kde.org/kgraphviewer/
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/kgraphviewer-26.08.3.tar.xz : 04fea783ee146267dfeb14c44d125e98b30241ff776494255dc026b2344164e8
summary     : Graphviz dot graph file viewer
description : |
    Graphviz dot graph file viewer.
license     : GPL-2.0-only
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(Boost)
    - cmake(ECM)
    - cmake(KF6CoreAddons)
    - cmake(KF6DocTools)
    - cmake(KF6I18n)
    - cmake(KF6Parts)
    - cmake(KF6WidgetsAddons)
    - cmake(KF6XmlGui)
    - cmake(Qt6Core5Compat)
    - cmake(Qt6Svg)
    - pkgconfig(libgvc)
rundeps     :
    # - binary(dot) - only needed for the "external" parsing mode; could be an optional/recommends dependency
    - qt6-wayland
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-docs":
        paths:
            - /usr/share/doc
