name        : kompare
version     : "26.08.3"
release     : 2
homepage    : https://apps.kde.org/kompare/
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/kompare-26.08.3.tar.xz : 23b414d2d2a69b24a18b8e63aa45d18cd96e97f8dca02c8c93bfb6551fbbec96
summary     : Diff and merge file comparator
description : |
    Tool to visualize changes between two versions of a file.
license     :
    - GFDL-1.2-or-later
    - GPL-2.0-only
    - GPL-2.0-or-later
    - GPL-3.0-only
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Codecs)
    - cmake(KF6Config)
    - cmake(KF6CoreAddons)
    - cmake(KF6DocTools)
    - cmake(KF6I18n)
    - cmake(KF6IconThemes)
    - cmake(KF6JobWidgets)
    - cmake(KF6Parts)
    - cmake(KF6TextEditor)
    - cmake(KF6WidgetsAddons)
    - cmake(KompareDiff2)
    - cmake(Qt6PrintSupport)
rundeps     :
    - qt6-wayland
setup       : |
    %patch %(pkgdir)/0001-Fix-clipped-text-in-diff-view.patch

    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-docs":
        paths:
            - /usr/share/doc
