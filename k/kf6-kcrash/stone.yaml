name        : kf6-kcrash
version     : "6.32.0"
release     : 23
homepage    : https://invent.kde.org/frameworks/kcrash
upstreams   :
    - https://download.kde.org/stable/frameworks/6.32/kcrash-6.32.0.tar.xz : fe627df1797fa92a24e53a7f33de07111c7556070028d39f258035a0c3bdb5df
summary     : Graceful handling of application crashes.
description : |
