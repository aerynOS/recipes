name        : kpkpass
version     : "26.08.3"
release     : 22
homepage    : https://invent.kde.org/pim/kpkpass
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/kpkpass-26.08.3.tar.xz : 8dc57d083b02d5f1777547ffee25b55c46b866969e5c11eddb2e82b1e0f151dc
summary     : Apple Wallet Pass reader
description : |
    Library to deal with Apple Wallet pass files.
license     : LGPL-2.1-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Archive)
    - cmake(Qt6Qml)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-devel":
        rundeps:
            - cmake(KF6Archive)
