name        : kpkpass
version     : "26.08.1"
release     : 20
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.1/src/kpkpass-26.08.1.tar.xz : d1b9f52e266d7be21e818780a1a4578c3d8cf574925f5c0265e583f82408c903
homepage    : https://invent.kde.org/pim/kpkpass
license     : LGPL-2.1-or-later
summary     : Apple Wallet Pass reader
description : |
    Library to deal with Apple Wallet pass files.
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Archive)
    - cmake(Qt6Qml)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-devel":
        rundeps:
            - cmake(KF6Archive)
