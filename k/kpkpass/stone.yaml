name        : kpkpass
version     : "26.08.2"
release     : 21
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.2/src/kpkpass-26.08.2.tar.xz : 1e269e2a1517f91ccd0776dc137fece81b9f1bc23edc8cced9028b138a95cc1e
homepage    : https://invent.kde.org/pim/kpkpass
license     : LGPL-2.1-or-later
summary     : Apple Wallet Pass reader
description : |
    Library to deal with Apple Wallet pass files.
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Archive)
    - cmake(Qt6Qml)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-devel":
        rundeps:
            - cmake(KF6Archive)
