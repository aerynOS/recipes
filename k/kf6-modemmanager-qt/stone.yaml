name        : kf6-modemmanager-qt
version     : "6.29.0"
release     : 16
upstreams   :
    - https://download.kde.org/stable/frameworks/6.29/modemmanager-qt-6.29.0.tar.xz : 4af60497e5331b41a3b34e194c1fb4293cd5eae7b50b5ecf5959a9718b223b47
homepage    : https://community.kde.org/Frameworks
license     :
    - BSD-3-Clause
    - GPL-2.0-only
    - LGPL-2.1-only
summary     : Qt wrapper for ModemManager DBus API
description : |
    Qt wrapper for ModemManager DBus API
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - pkgconfig(ModemManager)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-devel":
        rundeps:
            - pkgconfig(ModemManager)
