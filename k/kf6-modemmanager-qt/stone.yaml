name        : kf6-modemmanager-qt
version     : "6.31.0"
release     : 18
upstreams   :
    - https://download.kde.org/stable/frameworks/6.31/modemmanager-qt-6.31.0.tar.xz : e816565ce4b915fa885a6b039e582a477e84bb01bca3229df5f1b79dfa01b810
homepage    : https://community.kde.org/Frameworks
license     :
    - BSD-3-Clause
    - GPL-2.0-only
    - LGPL-2.1-only
summary     : Qt wrapper for ModemManager DBus API
description : |
    Qt wrapper for ModemManager DBus API
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - pkgconfig(ModemManager)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-devel":
        rundeps:
            - pkgconfig(ModemManager)
