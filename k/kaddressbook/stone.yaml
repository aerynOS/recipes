name        : kaddressbook
version     : "26.08.1"
release     : 18
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.1/src/kaddressbook-26.08.1.tar.xz : fb37324db737ccdb3f8680ed7b1f03ac24418aeb6f1545e78486c2b9b05cdec9
homepage    : https://apps.kde.org/kaddressbook/
license     :
    - GFDL-1.2-or-later
    - GPL-2.0-or-later
summary     : KDE Contact Manager
description : |
    KAddressBook stores all the personal details of your family, friends and other contacts.
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6ColorScheme)
    - cmake(KF6CoreAddons)
    - cmake(KF6Crash)
    - cmake(KF6DBusAddons)
    - cmake(KF6DocTools)
    - cmake(KF6IconThemes)
    - cmake(KF6KCMUtils)
    - cmake(KF6UserFeedback)
    - cmake(KPim6Akonadi)
    - cmake(KPim6AkonadiContactWidgets)
    - cmake(KPim6AkonadiSearch)
    - cmake(KPim6GrantleeTheme)
    - cmake(KPim6KontactInterface)
    - cmake(KPim6LdapCore)
    - cmake(KPim6LdapWidgets)
    - cmake(KPim6Libkdepim)
    - cmake(KPim6PimCommonActivities)
    - cmake(KPim6PimCommonAkonadi)
    - cmake(PlasmaActivities)
rundeps     :
    - kdepim-runtime
    - qt6-wayland
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-libs":
        paths:
            - /usr/lib/libKPim6AddressbookImportExport.so.*
            - /usr/lib/libkaddressbookprivate.so.*
            - /usr/lib/qt6/plugins/kaddressbookpart.so
            - /usr/lib/qt6/plugins/pim6/kcms/kaddressbook/
            - /usr/lib/qt6/plugins/pim6/kontact/

    - "%(name)-docs":
        paths:
            - /usr/share/doc
