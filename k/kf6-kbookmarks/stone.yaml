name        : kf6-kbookmarks
version     : "6.32.0"
release     : 25
homepage    : https://invent.kde.org/frameworks/kbookmarks
upstreams   :
    - https://download.kde.org/stable/frameworks/6.32/kbookmarks-6.32.0.tar.xz : a796db0d6f91bd8795ef3319f85f75074d76be315119335c339cf37c1552a472
summary     : Bookmarks management library.
description : |
    Bookmarks management library.
license     :
    - GPL-2.0-or-later
    - LGPL-2.0-only
    - LGPL-2.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Config)
    - cmake(KF6CoreAddons)
    - cmake(KF6WidgetsAddons)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-devel":
        rundeps:
            - cmake(KF6WidgetsAddons)
