name        : rssguard
version     : "5.2.5"
release     : 13
homepage    : https://github.com/martinrotter/rssguard
upstreams   :
    - https://github.com/martinrotter/rssguard/releases/download/5.2.5/rssguard-5.2.5-src.tar.gz : 5051308aaff854e5b1948e23b02871cd8d4fb4b870bdb688a8b98e907e6a0614
summary     : Simple (yet powerful) Qt feed reader
description : |
    Simple (yet powerful) Qt feed reader
license     : GPL-3.0-or-later
builddeps   :
    - binary(go)
    # - cmake(Qt6CorePrivate) # This is listed as an optional dependency but only used on Windows
    - cmake(Qt6LinguistTools)
    - cmake(Qt6Multimedia)
    - cmake(Qt6Qml)
    - cmake(Qt6Sql)
    - cmake(Qt6WebEngineWidgets)
    - pkgconfig(mpv)
setup       : |
    %patch %(pkgdir)/0001-default-settings.patch

    %cmake \
        -DNO_UPDATE_CHECK=ON \
        -DREVISION_FROM_GIT=OFF
build       : |
    %cmake_build
install     : |
    %cmake_install
tuning      :
    - golang-modflags: false
packages    :
    - "%(name)":
        rundeps:
            - qt6-wayland
        paths:
            - /usr/lib/lib*.so
