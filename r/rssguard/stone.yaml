name        : rssguard
version     : "5.3.0"
release     : 14
homepage    : https://github.com/martinrotter/rssguard
upstreams   :
    - https://github.com/martinrotter/rssguard/releases/download/5.3.0/rssguard-5.3.0-src.tar.gz : a7fea1a5b3f5838bc85f5ef1bd7188362d6dc04b7efa0f7511383376b927d3c3
summary     : Simple (yet powerful) Qt feed reader
description : |
    Simple (yet powerful) Qt feed reader
license     : GPL-3.0-or-later
builddeps   :
    - binary(go)
    # - cmake(Qt6CorePrivate) # This is listed as an optional dependency but only used on Windows
    - cmake(Qt6LinguistTools)
    - cmake(Qt6Multimedia)
    - cmake(Qt6Qml)
    - cmake(Qt6Sql)
    - cmake(Qt6WebEngineWidgets)
    - pkgconfig(mpv)
setup       : |
    %patch %(pkgdir)/0001-default-settings.patch

    %cmake \
        -DNO_UPDATE_CHECK=ON \
        -DREVISION_FROM_GIT=OFF
build       : |
    %cmake_build
install     : |
    %cmake_install
tuning      :
    - golang-modflags: false
packages    :
    - "%(name)":
        rundeps:
            - qt6-wayland
        paths:
            - /usr/lib/lib*.so
