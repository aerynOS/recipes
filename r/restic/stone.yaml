name        : restic
version     : "0.20.0"
release     : 14
homepage    : https://restic.net
upstreams   :
    - https://github.com/restic/restic/archive/refs/tags/v0.20.0.tar.gz : 7def5bbe05e62640f7b030b865b6f304701fd876f7836f5a6a603b56e1f4e30a
summary     : Fast, secure, efficient backup program
description : |
    Restic is a program that does backups right and was designed with the following principles in mind: easy, fast, verifiable, secure and efficient.
license     : BSD-2-Clause
networking  : true
checkdeps   :
    - binary(python)
    - binary(tar)
rundeps     :
    - ca-certificates
setup       : |
    %go_mod
build       : |
    %make
install     : |
    %install_bin restic

    %install_file doc/man/*.1 -t %(installroot)/%(mandir)
    %install_file doc/bash-completion.sh %(installroot)/%(bashcompletionsdir)/restic
    %install_file doc/zsh-completion.zsh %(installroot)/%(zshcompletionsdir)/_restic
    %install_file doc/fish-completion.fish %(installroot)/%(fishcompletionsdir)/restic.fish
check       : |
    # Skip FUSE and root-permission tests that fail in the build container.
    RESTIC_TEST_FUSE=0 go test \
        -skip 'TestBackupErrors|TestArchiverErrorReporting|TestScannerError' \
        ./cmd/... ./internal/...
