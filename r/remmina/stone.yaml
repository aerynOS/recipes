name        : remmina
version     : "1.4.44"
release     : 3
homepage    : https://www.remmina.org/
upstreams   :
    - https://gitlab.com/Remmina/Remmina/-/archive/v1.4.44/Remmina-v1.4.44.tar.gz : 67199bb48657e8b42892924f005781542f50f8b029597f8b6c1ee9ed8a80b68e
summary     : Remmina GTK+ Remote Desktop Client
description : |
    Remmina is a remote desktop client written in GTK+, aiming to be useful for system administrators and travellers, who need to work with lots of remote computers in front of either large monitors or tiny netbooks. Remmina supports multiple network protocols in an integrated and consistant user interface. Currently RDP, VNC, NX, XDMCP and SSH are supported.
license     :
    - GPL-2.0-or-later
    - OpenSSL
builddeps   :
    - binary(msgfmt)
    - pkgconfig(atk)
    - pkgconfig(avahi-client)
    - pkgconfig(ayatana-appindicator3-0.1)
    - pkgconfig(cups)
    - pkgconfig(freerdp-client3)
    - pkgconfig(freerdp3)
    - pkgconfig(gdk-3.0)
    - pkgconfig(gdk-pixbuf-2.0)
    - pkgconfig(gio-unix-2.0)
    - pkgconfig(glib-2.0)
    - pkgconfig(gmodule-2.0)
    - pkgconfig(harfbuzz)
    - pkgconfig(json-glib-1.0)
    - pkgconfig(libcrypto)
    - pkgconfig(libcurl)
    - pkgconfig(libgcrypt)
    - pkgconfig(libpcre2-8)
    - pkgconfig(libsecret-1)
    - pkgconfig(libsodium)
    - pkgconfig(libsoup-3.0)
    - pkgconfig(libssh)
    - pkgconfig(libvncclient)
    - pkgconfig(pango)
    - pkgconfig(python3)
    - pkgconfig(spice-client-gtk-3.0)
    - pkgconfig(vte-2.91)
    - pkgconfig(wayland-client)
    - pkgconfig(webkit2gtk-4.1)
setup       : |
    %cmake \
        -DWITH_FREERDP3=ON \
        -DWITH_NEWS=OFF \
        -DWITH_STATS=OFF \
        -DWITH_TIP=OFF \
        -DWITH_ICON_CACHE=OFF \
        -DWITH_UPDATE_DESKTOP_DB=OFF
build       : |
    %cmake_build
install     : |
    %cmake_install
