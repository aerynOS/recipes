name        : re2
version     : "2025-11-05"
release     : 16
upstreams   :
    - https://github.com/google/re2/releases/download/2025-11-05/re2-2025-11-05.tar.gz : 87f6029d2f6de8aa023654240a03ada90e876ce9a4676e258dd01ea4c26ffd67
license     : BSD-3-Clause
homepage    : https://github.com/google/re2/
summary     : RE2 is a fast, safe, thread-friendly alternative to backtracking regular expression engines
description : |
    RE2 is a fast, safe, thread-friendly alternative to backtracking regular expression engines
builddeps   :
    - cmake(GTest)
    - pkgconfig(absl_config)
    - pkgconfig(benchmark)
    - pkgconfig(icu-i18n)
tuning      :
    - lto: full
setup       : |
    %cmake \
        -DBUILD_SHARED_LIBS=ON \
        -DRE2_BUILD_TESTING=ON \
        -DRE2_USE_ICU=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
check       : |
    # %cmake_test's --verbose floods the container log with the exhaustive tests'
    # progress output; run ctest quietly and only show output for failures.
    ctest --test-dir %(builddir) --output-on-failure --parallel %(jobs) --force-new-ctest-process
