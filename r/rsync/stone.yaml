name        : rsync
version     : "3.5.2"
release     : 10
homepage    : https://rsync.samba.org/
upstreams   :
    - https://rsync.samba.org/ftp/rsync/src/rsync-3.5.2.tar.gz : a10d591825251e070f74c98df3daad195def4ed81b4a2de16169026aea33f6c8
summary     : File transfer program to keep remote files in sync.
description : |
    Rsync is an open source utility that provides fast incremental file transfer.
license     : GPL-3.0+
builddeps   :
    - binary(python3)
    - pkgconfig(libacl)
    - pkgconfig(libidn2)
    - pkgconfig(liblz4)
    - pkgconfig(libxxhash)
    - pkgconfig(libzstd)
    - pkgconfig(openssl)
    - pkgconfig(popt)
    - pkgconfig(zlib)
setup       : |
    %configure \
        --with-included-popt=no \
        --with-included-zlib=no
build       : |
    %make
install     : |
    %make_install
check       : |
    %make check
