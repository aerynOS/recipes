name        : riftbar
version     : "0.2.7"
release     : 4
homepage    : https://codeberg.org/sorashii/riftbar
upstreams   :
    - https://codeberg.org/sorashii/riftbar/archive/v0.2.7.tar.gz : 5e3c90e1d5fc928983031c841cac9f988d53ecc4bbf388a26cddccc18c3501a1
summary     : Highly customizable GTK4 bar for Wayland written in Rust.
description : |
    Riftbar is a Waybar-like status bar writen in Rust designed to be fast, safe and modern.
license     : GPL-3.0-or-later
builddeps   :
    - pkgconfig(cairo)
    - pkgconfig(cairo-gobject)
    - pkgconfig(dbus-1)
    - pkgconfig(gdk-pixbuf-2.0)
    - pkgconfig(glib-2.0)
    - pkgconfig(graphene-gobject-1.0)
    - pkgconfig(gtk4)
    - pkgconfig(gtk4-layer-shell-0)
    - pkgconfig(pango)
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    %cargo_install
