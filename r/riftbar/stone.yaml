name        : riftbar
version     : "0.3.2"
release     : 6
homepage    : https://codeberg.org/sorashii/riftbar
upstreams   :
    - https://codeberg.org/sorashii/riftbar/archive/v0.3.2.tar.gz : c8f90bf2fb7feefa721e4c329ed5ef75db22aec301f1f1256c2460bad26291e4
summary     : Highly customizable GTK4 bar for Wayland written in Rust.
description : |
    Riftbar is a Waybar-like status bar writen in Rust designed to be fast, safe and modern.
license     : GPL-3.0-or-later
builddeps   :
    - pkgconfig(cairo)
    - pkgconfig(cairo-gobject)
    - pkgconfig(dbus-1)
    - pkgconfig(gdk-pixbuf-2.0)
    - pkgconfig(glib-2.0)
    - pkgconfig(graphene-gobject-1.0)
    - pkgconfig(gtk4)
    - pkgconfig(gtk4-layer-shell-0)
    - pkgconfig(pango)
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    %cargo_install
