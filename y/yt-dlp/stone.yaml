name        : yt-dlp
version     : "2026.11.23"
release     : 7
homepage    : https://github.com/yt-dlp/yt-dlp
upstreams   :
    - https://github.com/yt-dlp/yt-dlp/archive/refs/tags/2026.11.23.tar.gz : 129f357ae3d81191a02bcd2c7af591d1c2c6b3346053e91ae041ab5a5c7877d8
summary     : yt-dlp is a feature-rich command-line audio/video downloader with support for thousands of sites
description : |
    yt-dlp is a feature-rich command-line audio/video downloader with support for thousands of sites. The project is a fork of youtube-dl based on the now inactive youtube-dlc.
license     : Unlicense
builddeps   :
    - python(hatchling)
rundeps     :
    - binary(ffmpeg)
    - binary(ffprobe)
    - binary(node)
    - binary(python)
    - python(yt-dlp-ejs)
build       : |
    %pyproject_build
install     : |
    %pyproject_install
