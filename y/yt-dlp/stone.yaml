name        : yt-dlp
version     : "2026.10.26"
release     : 6
homepage    : https://github.com/yt-dlp/yt-dlp
upstreams   :
    - https://github.com/yt-dlp/yt-dlp/archive/refs/tags/2026.10.26.tar.gz : 7d5da51731c3f5f5db13d16249fae085e170cc58807c43d68dcb41b7ede99a0d
summary     : yt-dlp is a feature-rich command-line audio/video downloader with support for thousands of sites
description : |
    yt-dlp is a feature-rich command-line audio/video downloader with support for thousands of sites. The project is a fork of youtube-dl based on the now inactive youtube-dlc.
license     :
    - Unlicense
builddeps   :
    - python(hatchling)
rundeps     :
    - binary(ffmpeg)
    - binary(ffprobe)
    - binary(node)
    - binary(python)
    - python(yt-dlp-ejs)
build       : |
    %pyproject_build
install     : |
    %pyproject_install
