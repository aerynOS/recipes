name        : yaml-cpp
version     : "0.9.0"
release     : 1
homepage    : https://github.com/jbeder/yaml-cpp
upstreams   :
    - https://github.com/jbeder/yaml-cpp/archive/refs/tags/yaml-cpp-0.9.0.tar.gz : 25cb043240f828a8c51beb830569634bc7ac603978e0f69d6b63558dadefd49a
summary     : A YAML parser and emitter in C++
description : |
    YAML parser and emitter in C++, written around the YAML 1.2 spec
license     : MIT
builddeps   :
    - binary(python)
setup       : |
    %cmake \
        -DYAML_CPP_BUILD_TESTS=ON \
        -DYAML_BUILD_SHARED_LIBS=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
check       : |
    %cmake_test
