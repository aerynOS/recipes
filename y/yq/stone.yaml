name        : yq
version     : "4.54.1"
release     : 18
homepage    : https://mikefarah.gitbook.io/yq/
upstreams   :
    - https://github.com/mikefarah/yq/archive/refs/tags/v4.54.1.tar.gz : 0cec36e7035dd56c508bda56245cbd71e4495d2317bc2528165c4162bce79335
summary     : yq is a lightweight command-line YAML processor
description : |
    A lightweight and portable command-line YAML processor. yq uses jq like syntax but works with yaml files as well as json. It doesn't yet support everything jq does - but it does support the most common operations and functions, and more is being added continuously.
license     :
    - MIT
checkdeps   :
    # Some of the tests need timezone data
    - tzdata
networking  : true
setup       : |
    %go_mod
build       : |
    go build -v ./yq.go
install     : |
    %install_bin yq

    ./yq shell-completion bash | %install_file /dev/stdin %(installroot)%(bashcompletionsdir)/yq
    ./yq shell-completion zsh | %install_file /dev/stdin %(installroot)%(zshcompletionsdir)/_yq
    ./yq shell-completion fish | %install_file /dev/stdin %(installroot)%(fishcompletionsdir)/yq.fish
check       : |
    go test ./...
