name        : vscodium
version     : "1.135.06055"
release     : 13
homepage    : https://vscodium.com/
upstreams   :
    - https://github.com/VSCodium/vscodium/releases/download/1.135.06055/VSCodium-linux-x64-1.135.06055.tar.gz:
        hash: c09d8ac8dd7f52b09ee159ee24b440541dfd8f937a0f6f88cc428c78e48ee1f2
    - https://raw.githubusercontent.com/vscodium/vscodium/1.135.06055/src/stable/resources/linux/code.desktop:
        hash: 8a6102fddc1a472345589c2eb2e32e9734df9539b421055c8039d82fa0ce5423
        unpack: false
        rename: codium.desktop
    - https://raw.githubusercontent.com/vscodium/vscodium/1.135.06055/src/stable/resources/linux/code-url-handler.desktop:
        hash: 50cecb7af4e7aaff14fb4d4b1a9caad707367003ee0ebc304ffd31762c4f7e20
        unpack: false
        rename: codium-url-handler.desktop
summary     : VSCodium - Free/Libre Open Source Software Binaries of Visual Studio Code
description : |
    Visual Studio Code (vscode) - Free/Libre Open Source Software Binaries of Visual Studio Code
license     : MIT
rundeps     :
    - binary(git)
    - ca-certificates
 # Causes extension signature validation to fail
debug       : false
strip       : false
environment : |
    function meta_info() {
        sed 's/@@NAME_LONG@@/VSCodium/g' "$1" |\
        sed 's/@@NAME_SHORT@@/codium/g' |\
        sed 's/@@NAME@@/codium/g' |\
        sed 's#@@EXEC@@#/usr/bin/codium#g' |\
        sed 's/@@ICON@@/vscodium/g' |\
        sed 's/@@URLPROTOCOL@@/codium/g'
    }
install     : |
    export vsdir=%(libdir)/vscodium
    %install_dir %(installroot)/$vsdir
    cp -R %(workdir)/* %(installroot)/$vsdir/

    # Remove non-x86_64 binaries.
    rm -rfv %(installroot)%(libdir)/vscodium/resources/app/node_modules.asar.unpacked/@microsoft/mxc-sdk/bin/arm64
    rm -rfv %(installroot)%(libdir)/vscodium/resources/app/node_modules.asar.unpacked/@vscode/ripgrep-universal/bin/{darwin-*,linux-arm*,linux-ia32,linux-ppc64,linux-riscv64,linux-s390x,win32-*}

    %install_exe %(pkgdir)/vscodium.sh %(installroot)%(bindir)/codium

    meta_info %(sourcedir)/codium.desktop \
        | %install_file /dev/stdin "%(installroot)%(datadir)/applications/codium.desktop"
    meta_info %(sourcedir)/codium-url-handler.desktop \
        | %install_file /dev/stdin "%(installroot)%(datadir)/applications/codium-url-handler.desktop"

    %install_file %(pkgdir)/vscodium.svg %(installroot)%(datadir)/icons/hicolor/scalable/apps/vscodium.svg

    %install_dir %(installroot)%(bashcompletionsdir) %(installroot)%(zshcompletionsdir)
    ln -srv %(installroot)${vsdir}/resources/completions/bash/codium %(installroot)%(bashcompletionsdir)/codium
    ln -srv %(installroot)${vsdir}/resources/completions/zsh/_codium %(installroot)%(zshcompletionsdir)/_codium
