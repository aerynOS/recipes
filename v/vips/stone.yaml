name        : vips
version     : "8.18.7"
release     : 4
upstreams   :
    - https://github.com/libvips/libvips/releases/download/v8.18.7/vips-8.18.7.tar.xz : 5baaead3b0bb20ffdb9e9ff09aa9fda08620923df77b63b436654cb5e0b3bf94
homepage    : https://www.libvips.org/
license     : LGPL-2.1-or-later
summary     : C/C++ library for processing large images
description : |
    C/C++ library for processing large images
builddeps   :
    - binary(g-ir-scanner)
    - binary(msgfmt)
    - pkgconfig(ImageMagick)
    - pkgconfig(MagickCore)
    - pkgconfig(OpenEXR)
    - pkgconfig(cairo)
    - pkgconfig(expat)
    - pkgconfig(fftw3)
    - pkgconfig(fontconfig)
    - pkgconfig(gio-2.0)
    - pkgconfig(glib-2.0)
    - pkgconfig(gmodule-no-export-2.0)
    - pkgconfig(gobject-2.0)
    - pkgconfig(lcms2)
    - pkgconfig(libarchive)
    - pkgconfig(libexif)
    - pkgconfig(libheif)
    - pkgconfig(libhwy)
    - pkgconfig(libjpeg)
    - pkgconfig(libjxl)
    - pkgconfig(libjxl_threads)
    - pkgconfig(libopenjp2)
    - pkgconfig(libpng)
    - pkgconfig(libraw_r)
    - pkgconfig(librsvg-2.0)
    - pkgconfig(libtiff-4)
    - pkgconfig(libwebp)
    - pkgconfig(orc-0.4)
    - pkgconfig(pangocairo)
    - pkgconfig(pangoft2)
    - pkgconfig(poppler-glib)
    - pkgconfig(zlib)
    # cfitsio
    # imagequant
    # quantizr
    # spng
    # openslide
    # matio
    # pdfium
    # nifti
    # libuhdr
setup       : |
    # TODO: Docs?

    # Upstream recommends enabling auto-vectorization of inner loops:
    # https://github.com/libvips/libvips/pull/212#issuecomment-68177930
    export CFLAGS+=" -ftree-vectorize"
    export CXXFLAGS+=" -ftree-vectorize"

    # ld.lld: error: undefined reference: __kmpc_global_thread_num
    # Somehow libraw related
    export LDFLAGS+=" -lomp"

    %meson
build       : |
    %meson_build
install     : |
    %meson_install
packages    :
    - "%(name)-tools":
        summary: Command-line tools for %(name)
        description: Command-line tools for %(name)
        paths:
            - /usr/bin/
            - /usr/share/man/man1/

    - "%(name)-magick":
        summary: Magick support for %(name)
        description: Magick support for %(name)
        paths:
            - /usr/lib/vips-modules*/vips-magick.so

    - "%(name)-poppler":
        summary: Poppler support for %(name)
        description: Poppler support for %(name)
        paths:
            - /usr/lib/vips-modules*/vips-poppler.so
