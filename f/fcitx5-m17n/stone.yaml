name        : fcitx5-m17n
version     : "5.1.8"
release     : 3
homepage    : https://github.com/fcitx/fcitx5-m17n
upstreams   :
    - https://github.com/fcitx/fcitx5-m17n/archive/refs/tags/5.1.8.tar.gz : 596d3f64f1e6f63d1232ff2b04b9ab1d88de53a788b70339e869185624242abf
