name        : firefox
version     : "155.0.1"
release     : 84
homepage    : https://www.mozilla.org/
upstreams   :
    - https://releases.mozilla.org/pub/firefox/releases/155.0.1/source/firefox-155.0.1.source.tar.xz:
        hash: 7548acd4788d4d0dce7ef9e14e62f7041df8746d9cfe4c05e923747954370d13
        unpackdir: firefox

    # This should _usually_ be the latest version unless it's somehow incompatible with the used LLVM toolchain
    - https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz:
        hash: b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4
        unpackdir: firefox/wasi-sdk
summary     : Firefox web browser
description : |
    Firefox web browser
license     : MPL-2.0
builddeps   :
    - binary(cbindgen)
    - binary(clang-22)
    - binary(dbus-run-session) # PGO
    - binary(m4)
    - binary(make)
    - binary(nasm)
    - binary(node)
    - binary(python3)
    - binary(rustc)
    - binary(tar)
    - binary(unzip)
    - binary(weston) # PGO
    - binary(wlheadless-run) # PGO
    - pkgconfig(alsa)
    - pkgconfig(gbm)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(icu-uc)
    - pkgconfig(libdrm)
    - pkgconfig(libevent)
    - pkgconfig(libjpeg)
    - pkgconfig(libpipewire-0.3)
    # - pkgconfig(libpng) # Not patched with APNG support
    - pkgconfig(libpulse)
    - pkgconfig(libwebp)
    - pkgconfig(nspr)
    - pkgconfig(nss)
    - pkgconfig(pango)
    - pkgconfig(pixman-1)
    - pkgconfig(vpx)
    - pkgconfig(xkbcommon)
rundeps     :
    - firefox-langpacks
    - soname(libavcodec.so.63(x86_64)) # dlopened, check dom/media/platforms/ffmpeg/FFmpegLibWrapper.h for latest supported
    - xdg-desktop-portal
networking  : true # PGO
environment : |
    # Set this to 1 if you want to create a release build, 0 if you're just doing builds locally for testing purposes
    # Note that you still need to do a full release build locally and test it before pushing it
    FULL_BUILD=1

    # Skip desktop notifications for build events
    export MOZ_NOSPAM=1

    # Saves some time compressing the archive when we're just going to immediately decompress it to install it
    # Saves about 23 seconds on the build server. Very important.
    export MOZ_PKG_FORMAT=TAR

    # When built with Clang 23 it segfaults as soon as the PGO training run starts
    # Upstream mozilla bug for Clang 23 doesn't seem to have anything relevant: https://bugzilla.mozilla.org/show_bug.cgi?id=2039813
    # Check if this is fixed by future versions of Firefox, LLVM, and Rust
    export CC=clang-22
    export CXX=clang++-22
    export LLVM_PROFDATA="llvm-profdata-22"

    # Temporarily disabled due to mozshellutil build failure
    # 2026-09-02 Update: Still bork
    # export MACH_BUILD_PYTHON_NATIVE_PACKAGE_SOURCE="none"
    export PIP_NETWORK_INSTALL_RESTRICTED_VIRTUALENVS=mach

    export MOZ_BUILD_DATE="$(date -u${SOURCE_DATE_EPOCH:+d @$SOURCE_DATE_EPOCH} +%%Y%%m%%d%%H%%M%%S)"
setup       : |
    %patch %(pkgdir)/patches/0001-Fix-Firefox-Thunderbird-envvar-conflicts.patch
    %patch %(pkgdir)/patches/0001-Allow-installing-addons-from-user-scope.patch
    %patch %(pkgdir)/patches/wasm-sdk.patch

    # Fixes a build issue with PGO introduced with f1d273acc9442cc43a8c340a86056fbc4ad85d57. Unknown if there's an upstream fix
    %patch %(pkgdir)/patches/pgo-simple-programs-2.patch

    # TODO: Figure out if we still need to enable unsigned addon loading considering we switched back to unmodified langpacks

    cp %(pkgdir)/build/mozconfig mozconfig.save
    sed -e 's|@@JOBCOUNT@@|%(jobs)|' \
        -e 's|@@LIBDIR@@|%(libdir)|' \
        -e 's|@@WASI@@|%(workdir)/wasi-sdk|' \
        -i mozconfig.save

    WASI_SDK_LLVM_VER=$(grep llvm-version wasi-sdk/VERSION | cut -d ' ' -f2 | cut -d '.' -f1)

    sed -i \
        -e 's|@@BOULDER_WORKDIR@@|%(workdir)|' \
        -e "s|@@WASI_SDK_LLVM_VER@@|${WASI_SDK_LLVM_VER}|" \
        toolkit/moz.configure

    cp mozconfig.save mozconfig

    if [ $FULL_BUILD -ne 0 ]; then
        # PGO build, no LTO
        echo "ac_add_options --enable-profile-generate=cross" >> mozconfig
    else
        # Might as well do it with full LTO
        echo "ac_add_options MOZ_LTO=cross,full" >> mozconfig
        echo "ac_add_options --enable-lto=cross,full" >> mozconfig
    fi

    # Set up google safe browsing API key for AerynOS
    cp %(pkgdir)/build/aerynos-google-safebrowsing-api-key .
    echo "ac_add_options --with-google-safebrowsing-api-keyfile=%(workdir)/aerynos-google-safebrowsing-api-key" >> mozconfig

    ./mach configure
build       : |
    ./mach build
    if [ $FULL_BUILD -ne 0 ]; then
        ./mach package

        # PGO
        # Much of this taken from https://github.com/chaotic-aur/packages/blob/main/firefox-nightly/PKGBUILD
        env \
            JARLOG_FILE="${PWD}/jarlog" \
            LIBGL_ALWAYS_SOFTWARE=true \
            LLVM_PROFDATA="${LLVM_PROFDATA:-llvm-profdata}" \
            MOZ_REMOTE_SETTINGS_DEVTOOLS=1 \
            XDG_RUNTIME_DIR="$(mktemp -p $(pwd) -d xdg-runtime-XXXXXX)" \
        dbus-run-session \
            wlheadless-run \
                -c weston --width=1920 --height=1080 \
                -- ./mach python build/pgo/profileserver.py

        # Make sure PGO data is present
        stat -c "Profile data found (%%s bytes)" merged.profdata
        test -s merged.profdata
        stat -c "Jar log found (%%s bytes)" jarlog
        test -s jarlog

        # Delete instrumented browser
        ./mach clobber objdir

        # Reset mozconfig
        cp mozconfig.save mozconfig

        # Enable LTO
        echo "ac_add_options MOZ_LTO=cross,full" >> mozconfig
        echo "ac_add_options --enable-lto=cross,full" >> mozconfig

        # PGO
        echo "ac_add_options --enable-profile-use=cross" >> mozconfig
        echo "ac_add_options --with-pgo-profile-path=${PWD}/merged.profdata" >> mozconfig
        echo "ac_add_options --with-pgo-jarlog=${PWD}/jarlog" >> mozconfig

        ./mach build
    fi
install     : |
    DESTDIR=%(installroot) ./mach install

    for i in 16 32 48 64 128; do
        %install_dir %(installroot)/%(datadir)/icons/hicolor/${i}x${i}/apps
        ln -srv %(installroot)/%(libdir)/firefox/browser/chrome/icons/default/default${i}.png %(installroot)/%(datadir)/icons/hicolor/${i}x${i}/apps/org.mozilla.firefox.png
    done

    %install_file browser/branding/official/content/about-logo.png %(installroot)/%(datadir)/icons/hicolor/192x192/apps/org.mozilla.firefox.png
    %install_file browser/branding/official/content/about-logo.svg %(installroot)/%(datadir)/icons/hicolor/scalable/apps/org.mozilla.firefox.svg

    %install_file %(pkgdir)/install/firefox-symbolic.svg %(installroot)%(datadir)/icons/hicolor/symbolic/apps/firefox-symbolic.svg
    %install_file %(pkgdir)/install/org.mozilla.firefox.desktop %(installroot)%(datadir)/applications/org.mozilla.firefox.desktop

    %install_file %(pkgdir)/install/distribution.ini %(installroot)%(libdir)/firefox/distribution/distribution.ini
    %install_file %(pkgdir)/install/prefs.js %(installroot)/%(libdir)/firefox/defaults/pref/prefs.js
    %install_file %(pkgdir)/install/firefox-l10n.js %(installroot)/%(libdir)/firefox/defaults/pref/firefox-l10n.js

    # gnome search provider
    %install_file %(pkgdir)/install/org.mozilla.firefox.SearchProvider.service %(installroot)/usr/share/dbus-1/services/org.mozilla.firefox.SearchProvider.service
    %install_file %(pkgdir)/install/org.mozilla.firefox.search-provider.ini %(installroot)/usr/share/gnome-shell/search-providers/org.mozilla.firefox.search-provider.ini

    # Use a wrapper script to configure langpacks
    rm -v %(installroot)/%(bindir)/firefox
    install -D -m 00755 %(pkgdir)/install/firefox-wrapper.sh %(installroot)/%(bindir)/firefox
tuning      :
    - lto: false # Controlled by the build
    - thread-exceptions: false # #  error "STL code can only be used with -fno-exceptions"
