name        : fcitx5-rime
version     : "5.1.16"
release     : 2
homepage    : https://github.com/fcitx/fcitx5-rime
upstreams   :
    - https://github.com/fcitx/fcitx5-rime/archive/refs/tags/5.1.16.tar.gz : 30cc0a39099dd1b36a2bd291947c137c85eb0339acfabc1412b9e14b70128f66
