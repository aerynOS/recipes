name        : fcitx5-rime
version     : "5.1.17"
release     : 3
homepage    : https://github.com/fcitx/fcitx5-rime
upstreams   :
    - https://github.com/fcitx/fcitx5-rime/archive/refs/tags/5.1.17.tar.gz : 79ba2e606e0d2ef5ed4f39c73d39631df68b6e7b7be4bcfe4b40c3be96f37a4c
