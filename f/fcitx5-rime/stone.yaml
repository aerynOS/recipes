name        : fcitx5-rime
version     : "5.1.15"
release     : 1
homepage    : https://github.com/fcitx/fcitx5-rime
upstreams   :
    - https://github.com/fcitx/fcitx5-rime/archive/refs/tags/5.1.15.tar.gz : fcfccd3e0342b706243d7510b70f6fc2c8c6640f55ce60b7bbf40ae97869c37f
