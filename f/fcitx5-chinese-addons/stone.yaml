name        : fcitx5-chinese-addons
version     : "5.1.14"
release     : 2
homepage    : https://github.com/fcitx/fcitx5-chinese-addons
upstreams   :
    - https://github.com/fcitx/fcitx5-chinese-addons/archive/refs/tags/5.1.14.tar.gz:
        hash: 12be9ccbc0601f0848f0ec312dfd56ac1dc34318d2fb7927b90201793ec10ecf
        unpackdir: fcitx5
    - https://download.fcitx-im.org/data/py_stroke-20250329.tar.gz:
        hash: c1a7ca7225d3614ab83353fc827503006a980447762018f53760425d7b5303a6
        unpack: false
    - https://download.fcitx-im.org/data/py_table-20121124.tar.gz:
        hash: 42146ac97de6c13d55f9e99ed873915f4c66739e9c11532a34556badf9792c04
        unpack: false
summary     : Addons related to Chinese, including IME previous bundled inside fcitx4
description : |
    This provides pinyin and table input method support for fcitx5
license     : GPL-2.0-or-later
builddeps   :
    - cmake(Boost)
    - cmake(ECM)
    - cmake(Fcitx5Core)
    - cmake(Fcitx5ModuleLuaAddonLoader)
    - cmake(Fcitx5Qt6WidgetsAddons)
    - cmake(LibIMEPinyin)
    - cmake(OpenCC)
    - cmake(Qt6WebEngineWidgets)
    - cmake(nlohmann_json)
    - pkgconfig(cups)
    - pkgconfig(libcurl)
    - gettext-devel
rundeps     :
    - fcitx5-lua
setup       : |
    # Verify version match with CMakeLists.txt. If not match, update
    for file in %(sourcedir)/py_{stroke,table}-*.tar.gz; do
        mv "${file}" modules/pinyinhelper/
        grep -F "${file//[^0-9]/}" modules/pinyinhelper/CMakeLists.txt
    done

    %cmake
build       : |
    %cmake_build
install     : |
    %cmake_install
check       : |
    %cmake_test
