name        : flyline
version     : "1.8.0"
release     : 2
homepage    : https://github.com/HalFrgrd/flyline
upstreams   :
    - https://github.com/HalFrgrd/flyline/archive/refs/tags/v1.8.0.tar.gz : 9cd8bf72365cf88a76a46ac7f3fc90c6377ec5667ae9434b442fb7b300ab2e5e
summary     : A Bash plugin to replace readline for a modern line editing experience
description : |
    Flyline is a readline replacement for Bash that provides syntax highlighting,
    intellisense-style autosuggestions, fuzzy history search, rich prompts,
    mouse support, and agent-assisted command writing.
license     :
    - GPL-3.0-only
    - MIT
networking  : true
rundeps     :
    - bash
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    # Bash loadable, found via BASH_LOADABLES_PATH as "flyline"
    %install_exe %(cargo_target_dir)/libflyline.so %(installroot)%(libdir)/bash/flyline

    %install_file %(pkgdir)/50-flyline.sh %(installroot)%(vendordir)/profile.d/50-flyline.sh
check       : |
    bash --noprofile --norc -i -c 'enable -f %(cargo_target_dir)/libflyline.so flyline'
