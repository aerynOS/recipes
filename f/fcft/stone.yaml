name        : fcft
version     : "3.3.3"
release     : 3
homepage    : https://codeberg.org/dnkl/fcft
upstreams   :
    - https://codeberg.org/dnkl/fcft/archive/3.3.3.tar.gz : b0c0f4a599f43723736c8565b8b84337c4195077f07f1bb8bb3252bb13a2306a
summary     : A simple library for font loading and glyph rasterization using FontConfig, FreeType and pixman.
description : |
    A simple library for font loading and glyph rasterization using FontConfig, FreeType and pixman.
license     : MIT
builddeps   :
    - pkgconfig(cairo)
    - pkgconfig(check)
    - pkgconfig(fontconfig)
    - pkgconfig(freetype2)
    - pkgconfig(harfbuzz)
    - pkgconfig(librsvg-2.0)
    - pkgconfig(pixman-1)
    - pkgconfig(scdoc)
    - pkgconfig(tllist)
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
