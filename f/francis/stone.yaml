name        : francis
version     : "26.08.3"
release     : 2
homepage    : https://apps.kde.org/francis/
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/francis-26.08.3.tar.xz : 8335b771df6d0e4e54f5bf6d0a53ecffe8acadd1d2539280956e1db102a5fa75
summary     : Time tracking app based on the Pomodoro Technique
description : |
    Francis is a time-tracking application that helps you stay productive using the Pomodoro Technique.
license     :
    - BSD-2-Clause
    - BSD-3-Clause
    - CC0-1.0
    - GPL-3.0-or-later
    - LGPL-2.0-or-later
    - LGPL-2.1-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Config)
    - cmake(KF6CoreAddons)
    - cmake(KF6DBusAddons)
    - cmake(KF6I18n)
    - cmake(KF6Kirigami)
    - cmake(KF6KirigamiAddons)
    - cmake(Qt6QuickControls2)
    - cmake(Qt6Svg)
rundeps     :
    - kf6-kirigami-addons
    - kf6-qqc2-desktop-style
    - qt6-wayland
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
