name        : fcitx5
version     : "5.1.24"
release     : 5
homepage    : https://github.com/fcitx/fcitx5
upstreams   :
    - https://github.com/fcitx/fcitx5/archive/refs/tags/5.1.24.tar.gz:
        hash: 6261de0839526683d4156aa036b3353fae0adcb642393547640da1dfb34cd754
        unpackdir: fcitx5
    - https://github.com/react/yoga/archive/refs/tags/v3.2.1.tar.gz:
        hash: 86b399ac31fd820d8ffa823c3fae31bb690b6fc45301b2a8a966c09b5a088b55
        unpackdir: fcitx5/third_party/yoga
summary     : Fcitx 5 is a generic input method framework released under LGPL-2.1+
description : |
    Fcitx 5 is a generic input method framework released under LGPL-2.1+.
license     :
    - LGPL-2.1-or-later
    - Unicode-DFS-2016
networking  : true
builddeps   :
    - binary(doxygen)
    - cmake(ECM)
    - cmake(PlasmaWaylandProtocols)
    - pkgconfig(cairo-xcb)
    - pkgconfig(enchant-2)
    - pkgconfig(expat)
    - pkgconfig(fmt)
    - pkgconfig(gdk-pixbuf-2.0)
    - pkgconfig(iso-codes)
    - pkgconfig(json-c)
    - pkgconfig(librsvg-2.0)
    - pkgconfig(nlohmann_json)
    - pkgconfig(pango)
    - pkgconfig(systemd)
    - pkgconfig(uuid)
    - pkgconfig(wayland-client)
    - pkgconfig(wayland-protocols)
    - pkgconfig(wayland-scanner)
    - pkgconfig(xcb)
    - pkgconfig(xcb-imdkit)
    - pkgconfig(xkbcommon)
    - pkgconfig(xkbcommon-x11)
    - pkgconfig(xkbfile)
    - pkgconfig(xkeyboard-config)
    - pkgconfig(zlib)
    - gettext-devel
setup       : |
    # we save xdg/autostart to %(datadir) instead of /etc
    %cmake \
        -DCMAKE_INSTALL_SYSCONFDIR=%(datadir)
build       : |
    %cmake_build
install     : |
    %cmake_install
check       : |
    %cmake_test
