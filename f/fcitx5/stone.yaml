name        : fcitx5
version     : "5.1.23"
release     : 4
homepage    : https://github.com/fcitx/fcitx5
upstreams   :
    - https://github.com/fcitx/fcitx5/archive/refs/tags/5.1.23.tar.gz : adeeafdba468111573233fb09e5cabf2e2c240cdc85e74ead498c2d702c795b8
    - https://github.com/facebook/yoga/archive/042f5013152eb81c1552dec945b88f7b95ca350f.tar.gz :
        hash: 4742f41722a16f181e3da37abf943390db1e928f00f26402cb154662ae7f110f
        unpackdir: yoga
summary     : Fcitx 5 is a generic input method framework released under LGPL-2.1+
description : |
    Fcitx 5 is a generic input method framework released under LGPL-2.1+.
license     :
    - LGPL-2.1-or-later
    - Unicode-DFS-2016
networking  : true
builddeps   :
    - binary(doxygen)
    - cmake(ECM)
    - cmake(PlasmaWaylandProtocols)
    - pkgconfig(cairo-xcb)
    - pkgconfig(enchant-2)
    - pkgconfig(expat)
    - pkgconfig(fmt)
    - pkgconfig(gdk-pixbuf-2.0)
    - pkgconfig(iso-codes)
    - pkgconfig(json-c)
    - pkgconfig(librsvg-2.0)
    - pkgconfig(nlohmann_json)
    - pkgconfig(pango)
    - pkgconfig(systemd)
    - pkgconfig(uuid)
    - pkgconfig(wayland-client)
    - pkgconfig(wayland-protocols)
    - pkgconfig(wayland-scanner)
    - pkgconfig(xcb)
    - pkgconfig(xcb-imdkit)
    - pkgconfig(xkbcommon)
    - pkgconfig(xkbcommon-x11)
    - pkgconfig(xkbfile)
    - pkgconfig(xkeyboard-config)
    - pkgconfig(zlib)
    - gettext-devel
setup       : |
    rmdir third_party/yoga
    mv /mason/build/x86_64/yoga third_party/yoga
    # we save xdg/autostart to %(datadir) instead of /etc
    %cmake -DCMAKE_INSTALL_SYSCONFDIR=%(datadir)
build       : |
    %cmake_build
install     : |
    %cmake_install
