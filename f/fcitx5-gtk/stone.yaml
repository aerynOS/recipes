name        : fcitx5-gtk
version     : "5.1.8"
release     : 3
homepage    : https://github.com/fcitx/fcitx5-gtk
upstreams   :
    - https://github.com/fcitx/fcitx5-gtk/archive/refs/tags/5.1.8.tar.gz : 377f91d3c681184fbb3f7164fd44706c33f531d12e8c7fd87a5cc6cd3dc40080
summary     : gtk im module and glib based dbus client library
description : |
    gtk im module and glib based dbus client library
license     : LGPL-2.1-or-later
builddeps   :
    - cmake(ECM)
    - pkgconfig(gio-2.0)
    - pkgconfig(gio-unix-2.0)
    - pkgconfig(glib-2.0)
    - pkgconfig(gobject-2.0)
    - pkgconfig(gobject-introspection-1.0)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(gtk4)
    - pkgconfig(xkbcommon)
    - pkgconfig(xkbcommon-x11)
setup       : |
    %cmake \
        -DENABLE_GTK2_IM_MODULE=OFF
build       : |
    %cmake_build
install     : |
    %cmake_install
