name        : fzf
version     : "0.75.0"
release     : 13
homepage    : https://junegunn.github.io/fzf/
upstreams   :
    - https://github.com/junegunn/fzf/archive/refs/tags/v0.75.0.tar.gz : 165f6e0c1b9ba082346233681e3f1d1374e37f9fd3c1d7b6dfe09659ab893faa
summary     : A command-line fuzzy finder
description : |
    It's an interactive filter program for any kind of list; files, command history, processes, hostnames, bookmarks, git commits, etc. It implements a "fuzzy" matching algorithm, so you can quickly type in patterns with omitted characters and still get the results you want.
license     : MIT
networking  : true
setup       : |
    %go_mod
build       : |
    export GOFLAGS+=" \"-ldflags=-linkmode=external -s -w -buildid= -X=main.version=%(version) -X=main.revision=tarball\""
    go build -v -o fzf .
install     : |
    %install_file man/man1/fzf.1 %(installroot)%(mandir)/man1/fzf.1
    %install_file man/man1/fzf-tmux.1 %(installroot)%(mandir)/man1/fzf-tmux.1

    %install_file LICENSE %(installroot)%(datadir)/licenses/fzf/LICENSE

    %install_bin fzf
    %install_bin bin/fzf-tmux

    # Key bindings
    %install_file shell/key-bindings.bash shell/key-bindings.zsh -t %(installroot)%(datadir)/fzf
    %install_file shell/key-bindings.fish %(installroot)%(datadir)/fish/vendor_functions.d/fzf_key_bindings.fish

    # Shell completions
    %install_file shell/completion.bash %(installroot)%(bashcompletionsdir)/fzf
    %install_file shell/completion.zsh %(installroot)%(zshcompletionsdir)/_fzf
    %install_file shell/completion.fish %(installroot)%(fishcompletionsdir)/fzf.fish

    %install_file doc/fzf.txt %(installroot)%(datadir)/vim/vimfiles/doc/fzf.txt
    %install_file plugin/fzf.vim %(installroot)%(datadir)/vim/vimfiles/plugin/fzf.vim
check       : |
    go test -v ./...
