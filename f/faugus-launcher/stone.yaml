name        : faugus-launcher
version     : "2.4.0"
release     : 21
homepage    : https://github.com/Faugus/faugus-launcher
upstreams   :
    - https://github.com/Faugus/faugus-launcher/archive/refs/tags/2.4.0.tar.gz : 81b40664128c35bc841ae89e95574fe50ff997f52db10298b2150f95cc9f3330
summary     : A simple and lightweight app for running Windows games using UMU-Launcher
description : |
    A simple and lightweight app for running Windows games using UMU-Launcher
license     : MIT
builddeps   :
    - binary(gtk4-update-icon-cache)
    - binary(msgfmt)
rundeps     :
    - binary(python3)
    - python(dbus-python)
    - python(icoextract)
    - python(pillow)
    - python(psutil)
    - python(pygobject)
    - python(requests)
    - python(vdf)
    - gtk-4
    - libadwaita
    - libmanette
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
