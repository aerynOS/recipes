name        : faugus-launcher
version     : "2.2.0"
release     : 17
homepage    : https://github.com/Faugus/faugus-launcher
upstreams   :
    - https://github.com/Faugus/faugus-launcher/archive/refs/tags/2.2.0.tar.gz : db4e9d8a13d5dcff050023a73b9ad77e9f838a6db989d5ef8f0e5315242fce91
summary     : A simple and lightweight app for running Windows games using UMU-Launcher
description : |
    A simple and lightweight app for running Windows games using UMU-Launcher
license     : MIT
builddeps   :
    - binary(gtk4-update-icon-cache)
    - binary(msgfmt)
rundeps     :
    - binary(python3)
    - python(dbus-python)
    - python(icoextract)
    - python(pillow)
    - python(psutil)
    - python(pygobject)
    - python(requests)
    - python(vdf)
    - gtk-4
    - libadwaita
    - libmanette
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
