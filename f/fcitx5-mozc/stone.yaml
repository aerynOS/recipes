summary     : fcitx5 plugin for Mozc - a Japanese Input Method Editor designed for multi-platform
description : |
    Mozc is a Japanese Input Method Editor (IME) designed for multi-platform such as Android OS, Apple macOS, Chromium OS, GNU/Linux and Microsoft Windows. This is the fcitx5 plugin
license     : BSD-3-Clause
builddeps   :
    - binary(python)
    - cmake(Fcitx5Core)
    - cmake(Fcitx5Module)
    - cmake(Qt6Core)
    - cmake(Qt6Gui)
    - cmake(Qt6Widgets)
    - gettext-devel
build       : |
    export USE_BAZEL_VERSION="$(echo %(sourcedir)/bazel-*-linux-x86_64)"

    cd src
    %bazel_build \
        --config oss_linux \
        --config stable_channel \
        --config release_build \
        --distdir="%(sourcedir)" \
        --host_cxxopt=-Wno-uninitialized \
        --registry="file://%(buildroot)/bazel-central-registry" \
        --nostart_end_lib \
        //server:mozc_server \
        //gui/tool:mozc_tool \
        //unix/fcitx5:fcitx5-mozc.so
install     : |
    cd src
    export PREFIX="%(installroot)%(prefix)"
    ../scripts/install_server_bazel
    ../scripts/install_fcitx5_bazel

    # svgs
    %install_file data/images/icon.svg          %(installroot)%(datadir)/icons/hicolor/scalable/apps/fcitx_mozc.svg
    %install_file data/images/direct.svg        %(installroot)%(datadir)/icons/hicolor/scalable/apps/fcitx_mozc_direct.svg
    %install_file data/images/hiragana.svg      %(installroot)%(datadir)/icons/hicolor/scalable/apps/fcitx_mozc_hiragana.svg
    %install_file data/images/full_katakana.svg %(installroot)%(datadir)/icons/hicolor/scalable/apps/fcitx_mozc_katakana_full.svg
    %install_file data/images/half_katakana.svg %(installroot)%(datadir)/icons/hicolor/scalable/apps/fcitx_mozc_katakana_half.svg
    %install_file data/images/full_ascii.svg    %(installroot)%(datadir)/icons/hicolor/scalable/apps/fcitx_mozc_alpha_full.svg
    %install_file data/images/half_ascii.svg    %(installroot)%(datadir)/icons/hicolor/scalable/apps/fcitx_mozc_alpha_half.svg

    # replace the symlinks with the pngs (we dont use org.fcitx.Fcitx5.*)
    for d in %(installroot)%(datadir)/icons/hicolor/*/apps; do
        cd "${d}"
        for f in org.fcitx.Fcitx5.fcitx_mozc*.png; do
            [ -e "${f}" ] || continue
            mv -f "${f}" "${f#org.fcitx.Fcitx5.}"
        done
    done
