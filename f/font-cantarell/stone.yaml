name        : font-cantarell
version     : "0.311"
release     : 3
homepage    : https://cantarell.gnome.org/
upstreams   :
    - https://gitlab.gnome.org/GNOME/cantarell-fonts/-/package_files/1276/download : 706778e6f9468d534d7afe05e4f6e1586110395ef37d24df259746736fd6b702
summary     : Cantarell Typeface Family (cantarell-fonts)
description : |
    The Cantarell typeface family is a contemporary Humanist sans serif, and is used by the GNOME project for its user interface.
license     :
    - OFL-1.1
builddeps   :
    - binary(bsdtar-static)
    - binary(msgfmt)
setup       : |
    %meson \
        -Dbuildappstream=true \
        -Duseprebuilt=true \
        -Dfontsdir=/usr/share/fonts/opentype/cantarell/
build       : |
    %meson_build
install     : |
    %meson_install
