name        : ffmpegthumbs
version     : "26.08.3"
release     : 28
homepage    : https://apps.kde.org/ffmpegthumbs/
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/ffmpegthumbs-26.08.3.tar.xz : e55a6db0c4582648a6912fb2eebbd5a8cc60e6ef50a90dac03c75e7e69eb6347
summary     : Video thumbnail generator
description : |
    FFMpegThumbs is a video thumbnail generator for KDE file managers.
license     : GPL-2.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Config)
    - cmake(KF6KIO)
    - pkgconfig(libavcodec)
    - pkgconfig(libavdevice)
    - pkgconfig(libavfilter)
    - pkgconfig(libavformat)
    - pkgconfig(libavutil)
    - pkgconfig(libswscale)
setup       : |
    %cmake_kf6 \
        -DBUILD_WITH_QT6=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
