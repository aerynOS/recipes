name        : fcitx5-qt
version     : "5.1.15"
release     : 3
homepage    : https://github.com/fcitx/fcitx5-qt
upstreams   :
    - https://github.com/fcitx/fcitx5-qt/archive/refs/tags/5.1.15.tar.gz : 62613bb0db7ae0661f088753e36203b1b488432d4499481e6dcaab59ef39c75d
summary     : Qt library and IM module for fcitx5
description : |
    Qt library and IM module for fcitx5
license     :
    - BSD-3-Clause
    - LGPL-2.1-or-later
builddeps   :
    - cmake(ECM)
    - cmake(Fcitx5Utils)
    - cmake(Qt5)
    - cmake(Qt6)
    - cmake(Qt6WaylandClient)
    - cmake(Qt6WaylandGlobalPrivate)
    - pkgconfig(xcb)
    - pkgconfig(xkbcommon)
    - pkgconfig(xkbcommon-x11)
    - gettext-devel
setup       : |
    %cmake
build       : |
    %cmake_build
install     : |
    %cmake_install
