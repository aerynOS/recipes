name        : fcitx5-qt
version     : "5.1.16"
release     : 5
homepage    : https://github.com/fcitx/fcitx5-qt
upstreams   :
    - https://github.com/fcitx/fcitx5-qt/archive/refs/tags/5.1.16.tar.gz : 94883b1f5501b9e8e994ce1790932750457d284dae992603cb40675c00eedea5
summary     : Qt library and IM module for fcitx5
description : |
    Qt library and IM module for fcitx5
license     :
    - BSD-3-Clause
    - LGPL-2.1-or-later
builddeps   :
    - cmake(ECM)
    - cmake(Fcitx5Utils)
    - cmake(Qt5)
    - cmake(Qt6)
    - cmake(Qt6WaylandClient)
    - cmake(Qt6WaylandGlobalPrivate)
    - pkgconfig(xcb)
    - pkgconfig(xkbcommon)
    - pkgconfig(xkbcommon-x11)
    - gettext-devel
setup       : |
    %cmake
build       : |
    %cmake_build
install     : |
    %cmake_install
