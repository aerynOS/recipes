name        : fcitx5-qt
version     : "5.1.17"
release     : 7
homepage    : https://github.com/fcitx/fcitx5-qt
upstreams   :
    - https://github.com/fcitx/fcitx5-qt/archive/refs/tags/5.1.17.tar.gz : 6c919e9e5a4c5525aaf11727bfb37cb92b3107a8a880f3e331443816806c54f9
summary     : Qt library and IM module for fcitx5
description : |
    Qt library and IM module for fcitx5
license     :
    - BSD-3-Clause
    - LGPL-2.1-or-later
builddeps   :
    - cmake(ECM)
    - cmake(Fcitx5Utils)
    - cmake(Qt5)
    - cmake(Qt6)
    - cmake(Qt6WaylandClient)
    - cmake(Qt6WaylandGlobalPrivate)
    - pkgconfig(xcb)
    - pkgconfig(xkbcommon)
    - pkgconfig(xkbcommon-x11)
    - gettext-devel
setup       : |
    %cmake
build       : |
    %cmake_build
install     : |
    %cmake_install
