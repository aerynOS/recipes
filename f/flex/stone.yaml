name        : flex
version     : "2.7.0"
release     : 14
homepage    : https://westes.github.io/flex/
upstreams   :
    - https://github.com/westes/flex/releases/download/v2.7.0/flex-2.7.0.tar.gz : ec91c8997dcd1fa40f298f9bb8776d42eb21cacc0e1a19b6f890f3adbdde3f5d
summary     : The Fast Lexical Analyzer
description : |
    The Fast Lexical Analyzer
license     : BSD-3-Clause-flex
checkdeps   :
    - binary(bison)
rundeps     :
    - binary(m4)
setup       : |
    export CC_FOR_BUILD="$CC"
    %configure \
        --disable-static
build       : |
    %make
install     : |
    %make_install
check       : |
    %make check
