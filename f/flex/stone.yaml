name        : flex
version     : "2.7.11"
release     : 19
homepage    : https://westes.github.io/flex/
upstreams   :
    - https://github.com/westes/flex/releases/download/v2.7.11/flex-2.7.11.tar.gz : 99a3ede5f61b63bef3136c5cae16d0f453e8d887c18ddc9e50bb01a4db561ace
summary     : The Fast Lexical Analyzer
description : |
    The Fast Lexical Analyzer
license     : BSD-3-Clause-flex
checkdeps   :
    - binary(bison)
rundeps     :
    - binary(m4)
setup       : |
    export CC_FOR_BUILD="$CC"
    %configure \
        --disable-static
build       : |
    %make
install     : |
    %make_install
check       : |
    %make check
