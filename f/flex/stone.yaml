name        : flex
version     : "2.6.11"
release     : 11
homepage    : https://westes.github.io/flex/
upstreams   :
    - https://github.com/westes/flex/releases/download/v2.6.11/flex-2.6.11.tar.gz : 188e9c96b8fc032b2a0bdd24d4f0b692480c1854511c2fcc3034946f14fdf49a
summary     : The Fast Lexical Analyzer
description : |
    The Fast Lexical Analyzer
license     : BSD-3-Clause-flex
checkdeps   :
    - binary(bison)
rundeps     :
    - binary(m4)
setup       : |
    export CC_FOR_BUILD="$CC"
    %configure \
        --disable-static
build       : |
    %make
install     : |
    %make_install
check       : |
    %make check
