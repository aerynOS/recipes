name        : flex
version     : "2.6.13"
release     : 12
homepage    : https://westes.github.io/flex/
upstreams   :
    - https://github.com/westes/flex/releases/download/v2.6.13/flex-2.6.13.tar.gz : a54de3a79dc191d9d9a3acd07b8981be160d1be588261ef7687ccfdaeb1190ed
summary     : The Fast Lexical Analyzer
description : |
    The Fast Lexical Analyzer
license     : BSD-3-Clause-flex
checkdeps   :
    - binary(bison)
rundeps     :
    - binary(m4)
setup       : |
    export CC_FOR_BUILD="$CC"
    %configure \
        --disable-static
build       : |
    %make
install     : |
    %make_install
check       : |
    %make check
