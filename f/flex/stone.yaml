name        : flex
version     : "2.6.15"
release     : 13
homepage    : https://westes.github.io/flex/
upstreams   :
    - https://github.com/westes/flex/releases/download/v2.6.15/flex-2.6.15.tar.gz : ba38801d12d38782e36f2ddd66c118aa9ed3cbed9849194c4e68d9894cd739d9
summary     : The Fast Lexical Analyzer
description : |
    The Fast Lexical Analyzer
license     : BSD-3-Clause-flex
checkdeps   :
    - binary(bison)
rundeps     :
    - binary(m4)
setup       : |
    export CC_FOR_BUILD="$CC"
    %configure \
        --disable-static
build       : |
    %make
install     : |
    %make_install
check       : |
    %make check
