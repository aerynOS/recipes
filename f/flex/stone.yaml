name        : flex
version     : "2.7.9"
release     : 17
homepage    : https://westes.github.io/flex/
upstreams   :
    - https://github.com/westes/flex/releases/download/v2.7.9/flex-2.7.9.tar.gz : eda7d158abe845c49956554488a0749a637891124824a77ab16dadbe0ce58eb7
summary     : The Fast Lexical Analyzer
description : |
    The Fast Lexical Analyzer
license     : BSD-3-Clause-flex
checkdeps   :
    - binary(bison)
rundeps     :
    - binary(m4)
setup       : |
    export CC_FOR_BUILD="$CC"
    %configure \
        --disable-static
build       : |
    %make
install     : |
    %make_install
check       : |
    %make check
