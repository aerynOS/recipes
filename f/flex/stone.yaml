name        : flex
version     : "2.6.4"
release     : 8
homepage    : https://westes.github.io/flex/
upstreams   :
    - https://github.com/westes/flex/releases/download/v2.6.4/flex-2.6.4.tar.gz : e87aae032bf07c26f85ac0ed3250998c37621d95f8bd748b31f15b33c45ee995
summary     : The Fast Lexical Analyzer
description : |
    The Fast Lexical Analyzer
license     : BSD-3-Clause-flex
checkdeps   :
    - binary(bison)
rundeps     :
    - binary(m4)
setup       : |
    export CC_FOR_BUILD="$CC"
    %configure \
        --disable-static
build       : |
    %make
install     : |
    %make_install
check       : |
    %make check
