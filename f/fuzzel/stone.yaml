name        : fuzzel
version     : "1.15.0"
release     : 3
homepage    : https://codeberg.org/dnkl/fuzzel
upstreams   :
    - https://codeberg.org/dnkl/fuzzel/releases/download/1.15.0/fuzzel-1.15.0.tar.gz : 11bee600e19ee1638db592e41980445673224716fbedbd0213b25153325f4182
summary     : App launcher and fuzzy finder for Wayland, inspired by rofi and dmenu.
description : |
    Fuzzel is a Wayland-native application launcher and fuzzy finder, inspired by rofi and dmenu.
license     : MIT
builddeps   :
    - pkgconfig(fcft)
    - pkgconfig(librsvg-2.0)
    - pkgconfig(scdoc)
    - pkgconfig(tllist)
    - pkgconfig(wayland-client)
    - pkgconfig(wayland-protocols)
    - pkgconfig(xkbcommon)
setup       : |
    %meson \
        -Dsvg-backend=librsvg \
        --sysconfdir=%(datadir)
build       : |
    %meson_build
install     : |
    %meson_install
