# Default AerynOS SSH configuration

# Do not modify this file. If you wish to make any changes please create
# your own configuration in /etc/ssh/ssh_config.d/ ending in .conf

Host *
    # Send keep-alive packet every 120 seconds by default
    ServerAliveInterval 120

    # Forward locale, terminal color and NO_COLOR hints to the remote session
    SendEnv LANG LC_* COLORTERM NO_COLOR
