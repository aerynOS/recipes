name        : oxygen
version     : "6.8.2"
release     : 8
homepage    : https://kde.org/plasma-desktop/
upstreams   :
    - https://download.kde.org/stable/plasma/6.8.2/oxygen-6.8.2.tar.xz: 487ac7441c5242e5b5fd4259bfaf78920f56338ba4b071d2a26e37750226b65c
summary     : Qt Oxygen Theme
description : |
    The Oxygen Style for Qt/KDE Applications
license     : LGPL-3.0-or-later
tuning      :
    - lto: full
    - optimize: speed
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    # NOTE: this comment was taken from the kde breeze package
    - cmake(ECM)
    - cmake(KDecoration3)
    - cmake(KF6Completion)
    - cmake(KF6CoreAddons)
    - cmake(KF6FrameworkIntegration)
    - cmake(KF6GuiAddons)
    - cmake(KF6I18n)
    - cmake(KF6IconThemes)
    - cmake(KF6KCMUtils)
    - cmake(KF6Service)
    - cmake(KF6WindowSystem)
    - cmake(Plasma)
    - cmake(Qt6GuiPrivate)
    - cmake(Qt6Svg)
setup       : |
    %cmake_kf6 \
        -DBUILD_QT5=OFF \
        -DBUILD_QT6=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)":
        rundeps:
            - "%(name)-cursor-themes"
            - oxygen-icon-theme
            - oxygen-sounds

    - "%(name)-cursor-themes":
        summary: Oxygen cursor themes
        description: Oxygen cursor themes
        paths:
            - /usr/share/icons/
