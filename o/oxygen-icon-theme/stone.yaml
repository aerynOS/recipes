name        : oxygen-icon-theme
version     : "6.32.0"
release     : 5
homepage    : https://invent.kde.org/frameworks/oxygen-icons
upstreams   :
    - https://download.kde.org/stable/frameworks/6.32/oxygen-icons-6.32.0.tar.xz : 743b5277c63592d84a51a643e5381d6afbc5c7563ff775faae6005311d1bfccd
