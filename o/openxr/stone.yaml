name        : openxr
version     : "1.1.65"
release     : 11
homepage    : https://www.khronos.org/openxr/
upstreams   :
    - https://github.com/KhronosGroup/OpenXR-SDK-Source/releases/download/release-1.1.65/OpenXR-SDK-Source-release-1.1.65.tar.gz : 24594e93e43c93f734c55f6f857ed3950583f087636c36e1548ca7759bdbf329
summary     : An open standard for virtual reality and augmented reality platforms and devices
description : |
    An open standard for virtual reality and augmented reality platforms and devices
license     : Apache-2.0
builddeps   :
    - binary(glslangValidator)
    - binary(glslc)
    - binary(python3)
    - pkgconfig(jsoncpp)
    - pkgconfig(opengl)
    - pkgconfig(vulkan)
    - pkgconfig(wayland-client)
    - pkgconfig(x11)
    - pkgconfig(xrandr)
    - pkgconfig(xxf86vm)
setup       : |
    %cmake \
        -DBUILD_ALL_EXTENSIONS=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
check      : |
    %cmake_test
packages   :
    - "%(name)":
        paths:
            - /usr/lib/libXrApiLayer_*.so

    - "%(name)-libs":
        summary: OpenXR runtime loader library
        description: OpenXR runtime loader library
        paths:
            - /usr/lib/libopenxr_loader.so.*
