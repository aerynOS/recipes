name        : openssl
version     : "4.0.3"
release     : 43
summary     : OpenSSL cryptography library
license     :
    - OpenSSL
    - SSLeay
homepage    : https://www.openssl.org
description : |
    OpenSSL cryptography library.
upstreams   :
    - https://www.openssl.org/source/openssl-4.0.3.tar.gz:
        hash: 325b5c806167c13b40b1ffeadfe0248197c00eccc4cf123ec1e28d2d2fd216d9
        unpackdir: current

    - https://www.openssl.org/source/openssl-3.5.9.tar.gz:
        hash: 603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a
        unpackdir: compat
builddeps   :
    - binary(perl)
    - pkgconfig32(libbrotlidec)
    - pkgconfig32(libzstd)
    - pkgconfig32(zlib)
    - libatomic-32bit
emul32      : true
environment : |
    # OpenSSL is rife with strict aliasing violations and we really need to build it with this flag to be safe
    # https://github.com/openssl/openssl/issues/12247
    export CFLAGS+=" -fno-strict-aliasing"
setup       : |
    if [[ %(target_triple) = i686* ]]; then
        export OSSL_TARGET="linux-x86-clang"
        _extra_opts=""
    else
        export OSSL_TARGET=linux-x86_64-clang""
        _extra_opts="enable-ec_nistp_64_gcc_128"
    fi

    if [ -d ../compat ]; then
        pushd ../compat

        %patch %(pkgdir)/openssl3/0001-Use-OS-provided-copy-of-openssl.cnf-as-fallback.patch
        %patch %(pkgdir)/openssl3/0001-openssl3.cnf.patch
        %patch %(pkgdir)/openssl3/ossl-modules3.patch
        %patch %(pkgdir)/openssl3/0001-pkgconfig3.patch
        %patch %(pkgdir)/config.patch
        %patch %(pkgdir)/0001-Fix-soname-dynamic-loading.patch

        if [[ ! %(target_triple) = i686* ]]; then
            ./Configure $OSSL_TARGET \
                --prefix=/usr \
                --libdir=lib%(libsuffix) \
                --openssldir=/etc/ssl \
                enable-brotli-dynamic \
                enable-ktls \
                enable-zstd-dynamic \
                no-rc4 \
                shared \
                zlib \
                ${_extra_opts}
        fi
        popd
    fi

    %patch %(pkgdir)/stateless/0001-Use-OS-provided-copy-of-openssl.cnf-as-fallback.patch
    %patch %(pkgdir)/config.patch
    %patch %(pkgdir)/0001-Fix-soname-dynamic-loading.patch

    ./Configure $OSSL_TARGET \
        --prefix=/usr \
        --libdir=lib%(libsuffix) \
        --openssldir=/etc/ssl \
        enable-brotli-dynamic \
        enable-ktls \
        enable-zstd-dynamic \
        no-rc4 \
        shared \
        zlib \
        ${_extra_opts}
build       : |
    if [ -d ../compat ]; then
        pushd ../compat
        if [[ ! %(target_triple) = i686* ]]; then
            %ccache_zero
            env CCACHE_BASEDIR="${PWD}" %make
            %ccache_stats
        fi
        popd
    fi

    %ccache_zero
    env CCACHE_BASEDIR="${PWD}" %make
    %ccache_stats
install     : |
    if [ -d ../compat ]; then
        pushd ../compat
            if [[ ! %(target_triple) = i686* ]]; then
                mkdir tmp
                make install DESTDIR="${PWD}/tmp" MANSUFFIX=openssl

                # Only copy the libraries and config
                %install_dir %(installroot)/%(libdir)/engines-3 \
                             %(installroot)/%(libdir)/ossl-modules-3 \
                             %(installroot)/%(vendordir)/ssl
                mv tmp/%(libdir)/*.so.* %(installroot)/%(libdir)
                mv tmp/%(libdir)/engines-3/*.so %(installroot)/%(libdir)/engines-3/
                mv tmp/%(libdir)/ossl-modules-3/*.so %(installroot)/%(libdir)/ossl-modules-3/
                mv tmp/%(sysconfdir)/ssl/openssl3* %(installroot)/%(vendordir)/ssl/
            fi
        popd
    fi

    %make_install MANSUFFIX=openssl
    rm -v %(installroot)%(libdir)/*.a

    if [[ %(target_triple) = i686* ]]; then
        exit 0
    fi

    # Stateless
    %install_dir %(installroot)/%(vendordir)/ssl/
    mv --force --update=all %(installroot)/etc/ssl/* %(installroot)/%(vendordir)/ssl/
    rmdir %(installroot)/etc/ssl %(installroot)/etc
    rmdir %(installroot)/%(vendordir)/ssl/certs
    rmdir %(installroot)/%(vendordir)/ssl/private
tuning      :
    - lto: false # https://github.com/openssl/openssl/issues/18663
packages    :
    - "%(name)-libs":
        summary: "Library files for %(name)"
        description: |
            Library files for %(name), typically pulled in as a dependency of another package.
        rundeps:
            # These are dlopened()
            - soname(libzstd.so.1(x86_64))
        paths:
            - /usr/lib/libcrypto.so.*
            - /usr/lib/libssl.so.*
            - /usr/lib/engines-*
            - /usr/lib/ossl-modules*
            - /usr/share/defaults/ssl/openssl*.cnf*
            - /usr/share/defaults/ssl/ct_log_list.cnf*

    - "%(name)-32bit":
        rundeps:
            - soname(libzstd.so.1(386))
    - "%(name)-docs":
        paths:
            - /usr/share/doc/*
