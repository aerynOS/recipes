name        : openvpn
version     : "2.7.9"
release     : 16
upstreams   :
    - https://swupdate.openvpn.net/community/releases/openvpn-2.7.9.tar.gz : c42a6ed892ddfe2d6e3317a5040f19bec5827564affb2fe3f2b3904a94daacb1
homepage    : https://openvpn.net/community/
license     :
    - GPL-2.0-only
    - BSD-4-Clause
    - OpenSSL
    - Zlib
summary     : OpenVPN Client
description : |
    An easy-to-use, robust, and highly configurable VPN (Virtual Private Network)
builddeps   :
    - binary(rst2man)
    - pkgconfig(libcap-ng)
    - pkgconfig(liblz4)
    - pkgconfig(libnl-genl-3.0)
    - pkgconfig(libpkcs11-helper-1)
    - pkgconfig(libsystemd)
    - pkgconfig(lzo2)
    - pkgconfig(openssl)
    - pkgconfig(p11-kit-1)
    - pkgconfig(pam)
checkdeps   :
    - pkgconfig(cmocka)
    - sysbinary(ip)
setup       : |
    %reconfigure \
        --enable-async-push \
        --enable-pkcs11 \
        --enable-systemd \
        --with-crypto-library=openssl
build       : |
    %make
install     : |
    %make_install
check       : |
    # t_net.sh calls ip, which lives in /usr/sbin
    export PATH="/usr/sbin:${PATH}"
    %make check
