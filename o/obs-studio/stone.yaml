name        : obs-studio
version     : "33.0.0"
release     : 5
homepage    : https://github.com/obsproject/obs-studio
upstreams   :
    - https://github.com/obsproject/obs-studio/releases/download/33.0.0/OBS-Studio-33.0.0-Sources.tar.gz:
        hash: c1ae3c98c1bb70ebdced33e894a526fcbbbda9bfd95806970a3fc31f74b08f6c
        unpackdir: obs
    # Check for bundled version of CEF in 'build-aux/com.obsproject.Studio.json'
    # Example for v33.0.0: https://github.com/obsproject/obs-studio/blob/72e8665/build-aux/com.obsproject.Studio.json#L124
    - https://cdn-fastly.obsproject.com/downloads/cef_binary_7871_linux_x86_64.tar.xz:
        hash: 8ffc64d06ea74da613eeda7f2aa5d4e98661af6fa3ed8c68724c9a6e4e89ea8e
        unpackdir: cef
summary     : Free and open source software for live streaming and screen recording
description : |
    OBS Studio is software designed for capturing, compositing, encoding, recording, and streaming video content, efficiently.
license     : GPL-2.0-only
builddeps   :
    - binary(gio)
    - binary(objdump)
    - binary(swig)
    - cmake(ECM)
    - cmake(LibDataChannel)
    - cmake(Qt6Svg)
    - cmake(ajantv2)
    - cmake(fdk-aac)
    - cmake(jansson)
    - cmake(nlohmann_json)
    - cmake(qrcodegencpp)
    - cmake(websocketpp)
    - pkgconfig(alsa)
    - pkgconfig(asio)
    - pkgconfig(ffnvcodec)
    - pkgconfig(fontconfig)
    - pkgconfig(freetype2)
    - pkgconfig(jack)
    - pkgconfig(libavcodec)
    - pkgconfig(libavdevice)
    - pkgconfig(libavfilter)
    - pkgconfig(libavformat)
    - pkgconfig(libavutil)
    - pkgconfig(libcurl)
    - pkgconfig(libdrm)
    - pkgconfig(libpci)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libpulse)
    - pkgconfig(librist)
    - pkgconfig(libswresample)
    - pkgconfig(libswscale)
    - pkgconfig(libv4l2)
    - pkgconfig(libva)
    - pkgconfig(libvlc)
    - pkgconfig(luajit)
    - pkgconfig(mbedtls)
    - pkgconfig(python3)
    - pkgconfig(rnnoise)
    - pkgconfig(simde)
    - pkgconfig(sndio)
    - pkgconfig(speexdsp)
    - pkgconfig(srt)
    - pkgconfig(uuid)
    - pkgconfig(vpl)
    - pkgconfig(x264)
    - uthash
tuning      :
    - optimize: speed
setup       : |
    %patch %(pkgdir)/0001-load-distro-crlset.patch

    # failing to load a core module stops the rest of
    # the modules from loading. keep obs-browser last
    # since it may or may not exist
    %patch %(pkgdir)/0002-load-obs-browser-last.patch

    # Must rebuild libcef_dll_wrapper, using the prebuilt wrapper
    # causes obs to segfault whenever a browser source is added
    cmake \
        -G Ninja \
        -S %(buildroot)/cef \
        -B %(buildroot)/cef-wrapper-build \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_ARCHIVE_OUTPUT_DIRECTORY=%(buildroot)/cef/libcef_dll_wrapper
    cmake --build %(buildroot)/cef-wrapper-build --target libcef_dll_wrapper

    %cmake \
        -DCEF_ROOT_DIR="%(buildroot)/cef" \
        -DENABLE_BROWSER=ON \
        -DENABLE_JACK=ON \
        -DENABLE_LIBFDK=ON \
        -DENABLE_SNDIO=ON \
        -DOBS_VERSION_OVERRIDE="%(version)"
build       : |
    %cmake_build
install     : |
    %cmake_install

    %install_file %(pkgdir)/crlset -t %(installroot)%(datadir)/obs/obs-modules/core/obs-browser
packages    :
    - "%(name)-plugin-browser":
        summary: Open Broadcaster Software Studio - CEF-based browser plugin
        description: Open Broadcaster Software Studio - CEF-based browser plugin
        rundeps:
            - "%(name)"
        # To update this list build with -DENABLE_BROWSER=OFF and see what files disappear
        paths:
            - /usr/lib/obs-modules/core/**/*.pak
            - /usr/lib/obs-modules/core/chrome-sandbox
            - /usr/lib/obs-modules/core/icudtl.dat
            - /usr/lib/obs-modules/core/libEGL.so
            - /usr/lib/obs-modules/core/libGLESv2.so
            - /usr/lib/obs-modules/core/libcef.so
            - /usr/lib/obs-modules/core/libvk_swiftshader.so
            - /usr/lib/obs-modules/core/libvulkan.so.1
            - /usr/lib/obs-modules/core/obs-browser-page
            - /usr/lib/obs-modules/core/obs-browser.so
            - /usr/lib/obs-modules/core/v8_context_snapshot.bin
            - /usr/lib/obs-modules/core/vk_swiftshader_icd.json
            - /usr/share/obs/obs-modules/core/obs-browser/
