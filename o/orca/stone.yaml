name        : orca
version     : "51.2"
release     : 5
homepage    : https://orca.gnome.org/
upstreams   :
    - https://download.gnome.org/sources/orca/51/orca-51.2.tar.xz : 5051c84a2892d80ded876404dbb712b7dbf7b9276ee56fedffdf66df40f0e2d2
summary     : Screen reader for individuals who are blind or visually impaired
description : |
    Screen reader for individuals who are blind or visually impaired
license     : LGPL-2.1-or-later
networking  : true
builddeps   :
    - binary(cargo)
    - binary(itstool)
    - binary(msgfmt)
    - pkgconfig(atk-bridge-2.0)
    - pkgconfig(atspi-2)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(pygobject-3.0)
    - pkgconfig(systemd)
    - python(dasbus)
    - python(psutil)
    - python-speechd
    # python-brlapi, python-louis, libwnck (might be x11-only)
rundeps     :
    - binary(python3)
    - python(dasbus)
    - python(psutil) # Could probably be a recommends
    - at-spi2-core # Python bindings
    - python-speechd
    - speech-dispatcher
setup       : |
    %meson \
        --sysconfdir=%(datadir)
build       : |
    %meson_build
install     : |
    %meson_install
