name        : libtorrent-rasterbar
version     : "2.1.3"
release     : 13
homepage    : https://libtorrent.org/
upstreams   :
    - https://github.com/arvidn/libtorrent/releases/download/v2.1.3/libtorrent-rasterbar-2.1.3.tar.gz : de05681acc564651211b4351af7d633a7a225587f0604611d657729dec299ae6
summary     : libtorrent is a C++ implementation of the BitTorrent protocol
description : |
    libtorrent is a C++ implementation of the BitTorrent protocol.
license     : BSD-2-Clause
builddeps   :
    - cmake(Boost)
    - pkgconfig(openssl)
    - pkgconfig(python3)
    - python(setuptools)
setup       : |
    %cmake \
        -Dpython-bindings=ON \
        -Dpython-egg-info=ON \
        -Dpython-install-system-dir=ON \
        -Dwebtorrent=OFF
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-devel":
        paths:
            - /usr/share/cmake/

    - "python-libtorrent":
        summary: Python bindings for %(name)
        description: Python bindings for %(name)
        paths:
            - /usr/lib/python*/site-packages
tuning      :
    - fortify: lvl2 # https://github.com/arvidn/libtorrent/issues/7519
