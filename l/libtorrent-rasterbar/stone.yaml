name        : libtorrent-rasterbar
version     : "2.1.1"
release     : 10
homepage    : https://libtorrent.org/
upstreams   :
    - https://github.com/arvidn/libtorrent/releases/download/v2.1.1/libtorrent-rasterbar-2.1.1.tar.gz : 0f163516ecef2e3331500266751de3098835a3c3ae0c2290448046c632bc0e93
summary     : libtorrent is a C++ implementation of the BitTorrent protocol
description : |
    libtorrent is a C++ implementation of the BitTorrent protocol.
license     : BSD-2-Clause
builddeps   :
    - cmake(Boost)
    - pkgconfig(openssl)
    - pkgconfig(python3)
    - python(setuptools)
setup       : |
    %cmake \
        -Dpython-bindings=ON \
        -Dpython-egg-info=ON \
        -Dpython-install-system-dir=ON \
        -Dwebtorrent=OFF
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-devel":
        paths:
            - /usr/share/cmake/

    - "python-libtorrent":
        summary: Python bindings for %(name)
        description: Python bindings for %(name)
        paths:
            - /usr/lib/python*/site-packages
tuning      :
    - fortify: lvl2 # https://github.com/arvidn/libtorrent/issues/7519
