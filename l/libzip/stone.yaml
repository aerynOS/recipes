name        : libzip
version     : "1.12"
release     : 6
upstreams   :
    - https://libzip.org/download/libzip-1.12.tar.xz : 376908d0f0fda13180a19fdc4f7062a1abfb59e09ca07a392d361253b8e60c2b
homepage    : https://libzip.org/
license     : BSD-3-Clause
summary     : libzip is a C library for reading, creating, and modifying zip archives
description : |
    libzip is a C library for reading, creating, and modifying zip archives
builddeps   :
    - pkgconfig(bzip2)
    - pkgconfig(libcrypto)
    - pkgconfig(liblzma)
    - pkgconfig(libzstd)
    - pkgconfig(zlib)
setup       : |
    %cmake -DBUILD_REGRESS=OFF \
           -DDOCUMENTATION_FORMAT=man \
           -DENABLE_GNUTLS=OFF \
           -DENABLE_OPENSSL=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
# TODO package nihtest so that we can run the testsuite (needs -DBUILD_REGRESS=ON)
# check     : |
#     cmake_check
tuning      :
    - lto: full
