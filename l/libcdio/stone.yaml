name        : libcdio
version     : "2.4.0"
release     : 4
upstreams   :
    - https://github.com/libcdio/libcdio/releases/download/2.4.0/libcdio-2.4.0.tar.gz : bf7cde63762bb12db7755c395c441e49406fde7e1d9f9a9be7e3b940b1f405d7
homepage    : https://github.com/libcdio/libcdio
license     : GPL-3.0-or-later
summary     : A library to encapsulate CD-ROM reading and control
description : |
    This library provides an interface for CD-ROM access. It can be used by applications that need OS- and device-independent access to CD-ROM devices.
builddeps   :
    - pkgconfig(libcddb)
    - pkgconfig(ncurses)
setup       : |
    %configure \
        --disable-static
build       : |
    %make
install     : |
    %make_install
