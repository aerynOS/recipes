name        : libsoup
version     : "3.8.0"
release     : 13
homepage    : https://gitlab.gnome.org/GNOME/libsoup
upstreams   :
    - https://download.gnome.org/sources/libsoup/3.8/libsoup-3.8.0.tar.xz : bbf08fa3e03a88c31a3d27a0d87cb422e9490f2d08e149211103df6d638a2238
summary     : libsoup is an HTTP client/server library for GNOME.
description : |
    libsoup is an HTTP client/server library for GNOME. It uses GObjects and the glib main loop, to integrate well with GNOME applications.
license     :
    - LGPL-2.0-or-later
builddeps   :
    # binary(apachectl)
    - binary(g-ir-scanner)
    - binary(gi-docgen)
    - binary(ntlm_auth)
    - binary(valac)
    # binary(httpd2)
    # binary(wstest)
    - binary(xgettext)
    - pkgconfig(gio-2.0)
    - pkgconfig(glib-2.0)
    - pkgconfig(gmodule-2.0)
    - pkgconfig(gnutls)
    - pkgconfig(gobject-2.0)
    - pkgconfig(krb5-gssapi)
    - pkgconfig(libbrotlidec)
    - pkgconfig(libnghttp2)
    - pkgconfig(libpsl)
    - pkgconfig(libzstd)
    - pkgconfig(sqlite3)
    - pkgconfig(sysprof-capture-4)
    - pkgconfig(zlib)
    - glib-networking
rundeps     :
    - glib-networking
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
packages    :
    - "%(name)-docs":
        paths:
            - /usr/share/doc/
