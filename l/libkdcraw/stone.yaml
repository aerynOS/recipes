name        : libkdcraw
version     : "26.08.2"
release     : 20
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.2/src/libkdcraw-26.08.2.tar.xz : 1e4efcc416d8c2a3f5c1e3c1d458938ca243975fcda094b9101999175f505959
homepage    : https://kde.org/
license     :
    - GFDL-1.2-or-later
    - GPL-2.0-or-later
summary     : C++ interface to LibRaw
description : |
    Libkdcraw is a C++ interface around LibRaw library used to decode RAW picture files.
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - pkgconfig(libraw)
setup       : |
    %cmake_kf6 \
        -DBUILD_WITH_QT6=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
