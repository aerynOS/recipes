name        : libkdcraw
version     : "26.08.1"
release     : 19
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.1/src/libkdcraw-26.08.1.tar.xz : cf49479043a75557f82b0213019c45291d612267e454b66d939f04b189c4f182
homepage    : https://kde.org/
license     :
    - GFDL-1.2-or-later
    - GPL-2.0-or-later
summary     : C++ interface to LibRaw
description : |
    Libkdcraw is a C++ interface around LibRaw library used to decode RAW picture files.
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - pkgconfig(libraw)
setup       : |
    %cmake_kf6 \
        -DBUILD_WITH_QT6=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
