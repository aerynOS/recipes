name        : libuv
version     : "1.53.0"
release     : 10
homepage    : https://libuv.org/
upstreams   :
    - https://dist.libuv.org/dist/v1.53.0/libuv-v1.53.0.tar.gz : cb0d6dd2128d5a95bd242c6cc982a24fe608fa93da57b6b4ec763b0018c53e64
summary     : Cross-platform asynchronous I/O library
description : |
    libuv is a multi-platform support library with a focus on asynchronous I/O.
license     :
    - BSD-2-Clause
    - ISC
    - MIT
setup       : |
    %cmake
build       : |
    %cmake_build
install     : |
    %cmake_install
    rm -v %(installroot)%(libdir)/pkgconfig/libuv-static.pc
    rm -v %(installroot)%(libdir)/libuv.a
tuning      :
    - lto
    - optimize: speed
