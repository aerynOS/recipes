name        : libxfont2
version     : "2.0.10"
release     : 6
homepage    : https://gitlab.freedesktop.org/xorg/lib/libxfont
upstreams   :
    - https://www.x.org/archive/individual/lib/libXfont2-2.0.10.tar.xz : cef1f4ad9cd69f439bb1ac484bdc8f9d7f8e70215b92d8ca86b96e31513e5f9c
summary     : X font handling library for server & utilities
description : |
    X font handling library for server & utilities
license     :
    - MIT
builddeps   :
    - pkgconfig(fontenc)
    - pkgconfig(fontsproto)
    - pkgconfig(freetype2)
    - pkgconfig(x11)
    - pkgconfig(xproto)
    - pkgconfig(xtrans)
setup       : |
    %configure --disable-static
build       : |
    %make
install     : |
    %make_install
