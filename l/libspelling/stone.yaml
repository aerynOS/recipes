name        : libspelling
version     : "0.4.11"
release     : 11
homepage    : https://gitlab.gnome.org/GNOME/libspelling
upstreams   :
    - https://download.gnome.org/sources/libspelling/0.4/libspelling-0.4.11.tar.xz : 52e53ec3fba0f604cfd0931e26af7f7241a0d4f0208dd5574f43b3589f6d28b2
summary     : A spellcheck library for GTK 4
description : |
    A spellcheck library for GTK 4.
license     : LGPL-2.1-or-later
builddeps   :
    - binary(msgfmt)
    - binary(vapigen)
    - pkgconfig(enchant-2)
    - pkgconfig(gio-2.0)
    - pkgconfig(gobject-introspection-1.0)
    - pkgconfig(gtk4)
    - pkgconfig(gtksourceview-5)
    - pkgconfig(sysprof-capture-4)
setup       : |
    %meson \
        -Ddocs=false
build       : |
    %meson_build
install     : |
    %meson_install
packages    :
    - "%(name)-devel":
        paths:
            - /usr/share/vala/
