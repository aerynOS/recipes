name        : libcbor
version     : "0.15.0"
release     : 8
homepage    : https://github.com/PJK/libcbor
upstreams   :
    - https://github.com/PJK/libcbor/archive/refs/tags/v0.15.0.tar.gz : c94145d3c22e67cff9a3325dc036b4545a49a42231553995be4947d52cf2ef57
summary     : CBOR protocol implementation for C
description : |
    C library for parsing and generating CBOR, the general-purpose schema-less
    binary data format.
license     : MIT
builddeps   :
    - pkgconfig(cmocka)
setup       : |
    %cmake \
        -DBUILD_SHARED_LIBS=ON \
        -DWITH_TESTS=ON \
        -DWITH_EXAMPLES=OFF
build       : |
    %ninja
install     : |
    %ninja_install
check       : |
    %ninja_test
