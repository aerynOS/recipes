name        : libxml2
version     : "2.15.4"
release     : 24
summary     : XML parsing library
license     : MIT
homepage    : http://www.xmlsoft.org/
description : |
    XML parsing library
upstreams   :
    - https://download.gnome.org/sources/libxml2/2.15/libxml2-2.15.4.tar.xz:
        hash: 98087fd181d9070724f3fbc65c7377db03038eb92bd882374daff44940138821
        unpackdir: current

    # Don't delete this section, just comment it out if it's not needed. The build recipe accounts for it possibly not existing
    # - https://download.gnome.org/sources/libxml2/2.13/libxml2-2.13.8.tar.xz:
    #     hash: 277294cb33119ab71b2bc81f2f445e9bc9435b893ad15bb2cd2b0e859a0ee84a
    #     unpackdir: compat
builddeps   :
    - binary(doxygen)
    - binary(xsltproc)
    - pkgconfig(icu-i18n)
    - pkgconfig(python3)
    - pkgconfig32(readline)
    - pkgconfig32(zlib)
    - docbook-xsl
    - perl
emul32      : true
profiles    :
    - emul32:
        setup: |
            if [ -d ../compat ]; then
                pushd ../compat
                %meson \
                    -Dhistory=true \
                    -Dicu=disabled \
                    -Dlegacy=true \
                    -Dpython=false
                popd
            fi

            %meson \
                -Dhistory=enabled \
                -Dlegacy=enabled \
                -Dpython=disabled
environment : |
    %export_docbook_catalogs

    # Help out PGO
    export CFLAGS="${CFLAGS} -mllvm -vp-counters-per-site=6"
setup       : |
    if [ -d ../compat ]; then
        pushd ../compat
        %patch %(pkgdir)/0001-build-Check-for-icu-uc-instead-of-icu-i18n.patch

        %meson \
           -Dhistory=true \
           -Dicu=enabled \
           -Dlegacy=true \
           -Dpython=false
        popd
    fi

    # Build the static library so that we can build a static version of bsdtar
    %meson \
        -Ddefault_library=both \
        -Ddocs=enabled \
        -Dhistory=enabled \
        -Dicu=enabled \
        -Dlegacy=enabled \
        -Dpython=enabled
build       : |
    if [ -d ../compat ]; then
        pushd ../compat
            %ccache_zero
            env CCACHE_BASEDIR="${PWD}" %meson_build
            %ccache_stats
        popd
    fi

    %ccache_zero
    env CCACHE_BASEDIR="${PWD}" %meson_build
    %ccache_stats

    # These are no longer built by default but they are required by the tests
    %meson_build runsuite runtest runxmlconf testapi testcatalog testchar testdict testlimits testparser testrecurse example/io1
install     : |
    if [ -d ../compat ]; then
        pushd ../compat
            mkdir tmp
            DESTDIR="${PWD}/tmp" meson install --no-rebuild -C "%(builddir)"

            # Only copy the sonames
            %install_dir %(installroot)/%(libdir)
            find ${PWD}/tmp/%(libdir) -name "libxml2.so.*" -print -exec mv {} %(installroot)/%(libdir) \;
        popd
    fi

    %meson_install
check       : |
    %meson_test
workload    : |
    %meson_test || :

    # Script is no longer included with the source tarballs and so has been vendored
    perl %(pkgdir)/dbgenattr.pl 100000 > dba100000.xml

    %(builddir)/xmllint --noout %(workdir)/dba100000.xml
    %(builddir)/xmllint --stream %(workdir)/dba100000.xml
    %(builddir)/xmllint --noout --valid test/valid/REC-xml-19980210.xml
    %(builddir)/xmllint --stream --valid test/valid/REC-xml-19980210.xml
tuning      :
    - lto: full
    - optimize : speed
packages    :
    - "python-%(name)":
        summary: "XML parsing library - Python support"
        description: |
            XML parsing library - Python support
        rundeps:
            - python-libs
        paths:
            - /usr/lib/python*

    - "%(name)-devel":
        paths:
            - /usr/bin/xml2-config
            - /usr/share/man/man1/xml2-config*

    - "%(name)-static":
        summary: "Development files for libxml2 - static libraries"
        description: |
            Development files for libxml2 - static libraries
        paths:
            - /usr/lib/lib*.a
        rundeps:
            - "%(name)-devel"
            - icu-static
            - zlib-static

    - "%(name)-docs":
        paths:
            - /usr/share/doc/*
