name        : libktorrent
version     : "26.08.3"
release     : 2
homepage    : https://invent.kde.org/network/libktorrent
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/libktorrent-26.08.3.tar.xz : cc9a3f42dedaa686cf0167305c28f009a5896e520207305a5d1957d5ce1dea2b
summary     : BitTorrent protocol implementation
description : |
    libktorrent is a BitTorrent protocol implementation for KDE.
license     :
    - BSD-3-Clause
    - CC0-1.0
    - GPL-2.0-or-later
    - MIT
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(Boost)
    - cmake(ECM)
    - cmake(KF6Archive)
    - cmake(KF6Crash)
    - cmake(KF6I18n)
    - cmake(KF6KIO)
    - cmake(KF6Solid)
    - cmake(Qt6CorePrivate)
    - pkgconfig(gmp)
    - pkgconfig(openssl)
setup       : |
    %cmake_kf6 \
        -DUSE_CRYPTO_BACKEND=OpenSSL
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    # KTorrent6Config.cmake find_dependency()s these, so consumers need them present
    - "%(name)-devel":
        rundeps:
            - cmake(Boost)
            - cmake(KF6Archive)
            - cmake(KF6Config)
            - cmake(KF6KIO)
            - pkgconfig(gmp)
            - pkgconfig(openssl)
