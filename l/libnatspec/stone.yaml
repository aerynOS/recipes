name        : libnatspec
version     : "0.4.0"
release     : 3
homepage    : https://github.com/Etersoft/libnatspec
upstreams   :
    - https://github.com/Etersoft/libnatspec/releases/download/0.4.0/libnatspec-0.4.0.tar.gz : ac436c05ddf9daaecb548538bb87f5cca1ad977931f61709074391f8f38bfae5
summary     : Library for national and language-specific issues
description : |
    A collection of functions for request various charsets and locales for host system and for other system.
license     : LGPL-2.1-or-later
builddeps   :
    - binary(bison)
    - binary(flex)
    - pkgconfig(popt)
setup       : |
    %configure
build       : |
    %make
install     : |
    %make_install
check       : |
    %make check
packages    :
    - "%(name)-tools":
        paths:
            - /usr/bin/
            - /usr/share/man/
