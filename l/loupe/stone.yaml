name        : loupe
version     : "51.2"
release     : 21
homepage    : https://apps.gnome.org/Loupe/
upstreams   :
    - https://download.gnome.org/sources/loupe/51/loupe-51.2.tar.xz : 64ae1f9b381227eada39cb659edf29656ff7e42348823391678fcc01cdac01b8
summary     : Image Viewer
description : |
    Browse through your images and inspect their metadata with:
    - Fast GPU accelerated image rendering
    - Tiled rendering for vector graphics
    - Extendable and sandboxed image decoding
    - Accessible presentation of the most important metadata.
license     : GPL-3.0-or-later
networking  : true
builddeps   :
    - binary(appstreamcli)
    - binary(cargo)
    - binary(itstool)
    - binary(msgfmt)
    - binary(update-desktop-database)
    - pkgconfig(gtk4)
    - pkgconfig(gweather4)
    - pkgconfig(libadwaita-1)
    - pkgconfig(libseccomp)
rundeps     :
    - glycin-loaders
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
check       : |
    %meson_test
