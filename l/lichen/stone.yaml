name        : lichen
version     : "0.1.0+git.34e0aa2"
release     : 57
summary     : OS installer
license     : MPL-2.0
homepage    : https://github.com/AerynOS/lichen
upstreams   :
    - git|https://github.com/AerynOS/lichen.git :
        ref : 34e0aa2740e9c02ecf3219f0b94fa8a3e1195aa3 # 34e0aa2
description : |
    Experimental OS installer
builddeps   :
    - binary(cargo)
networking  : true
rundeps     :
    - binary(moss)
    - sysbinary(mkfs.ext4)
    - sysbinary(mkfs.f2fs)
    - sysbinary(mkfs.vfat)
    - sysbinary(mkfs.xfs)
    - iso-codes
setup       : |
    %cargo_fetch
build       : |
    %cargo_build -p lichen_cli
install     : |
    %cargo_install lichen_cli
    %install_file %(pkgdir)/lichen-legacy.desktop -t %(installroot)%(datadir)/applications/
    %install_file %(pkgdir)/org.freedesktop.policykit.pkexec.lichen-legacy.policy -t %(installroot)%(datadir)/polkit-1/actions/
    %install_exe %(pkgdir)/lichen-legacy.sh %(installroot)%(bindir)/lichen-legacy
    # Until lichen-installer is ready to take over ownership of `lichen`
    ln -srv %(installroot)%(bindir)/lichen-legacy %(installroot)%(bindir)/lichen
