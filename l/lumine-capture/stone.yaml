name        : lumine-capture
version     : "0.5.0"
release     : 5
homepage    : https://github.com/Netflate/LumineCapture
upstreams   :
    - https://github.com/Netflate/LumineCapture/archive/refs/tags/v0.5.0.tar.gz : 2adb47f46ab5f63dd120de8a4eb87bb2a3d2b63c3d1ceb1ee74e0b96b3628dd6
summary     : Fast, lightweight Wayland screenshot tool
description : |
    Screenshot and annotation tool for Wayland with built-in OCR (OCR models are downloaded at runtime)
license     :
    - Apache-2.0 OR MIT
    - MIT # statically linked ONNX Runtime
    - BSD-3-Clause # libwebgpu_dawn.so
    - OFL-1.1
networking  : true
builddeps   :
    - binary(nasm)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libspa-0.2)
    - pkgconfig(openssl)
    - pkgconfig(xkbcommon)
setup       : |
    %cargo_fetch
build       : |
    %cargo_build --features asm,ocr-gpu
install     : |
    %cargo_install

    # this is dlopen() at runtime
    %install_file %(buildroot)/.cache/ort.pyke.io/dfbin/*/*/libwebgpu_dawn.so \
        -t %(installroot)%(libdir)/LumineCapture/

    %install_file assets/lumine-capture.desktop -t %(installroot)%(datadir)/applications/

    for icon in assets/hicolor/*/apps/*; do
        %install_file "$icon" %(installroot)%(datadir)/icons/${icon#assets/}
    done

    # gnome-shell-extension
    %install_file gnome-extension/lumine-capture@netflate.github.io/* \
        -t %(installroot)%(datadir)/gnome-shell/extensions/lumine-capture@netflate.github.io/

    %install_file LICENSE-MIT LICENSE-APACHE -t %(installroot)%(datadir)/licenses/%(name)/
    %install_file assets/fonts/LICENSE-OFL.txt %(installroot)%(datadir)/licenses/%(name)/LICENSE-OFL-Inter.txt
    %install_file README.md docs/lumine-capture-shortcuts-kde.kksrc -t %(installroot)%(docdir)/%(name)/
check       : |
    %cargo_test --features asm,ocr-gpu
packages    :
    - "gnome-shell-extension-%(name)":
        rundeps:
            - "%(name)"
            - gnome-shell
        paths:
            - /usr/share/gnome-shell/
