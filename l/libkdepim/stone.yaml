name        : libkdepim
version     : "26.08.3"
release     : 20
homepage    : https://invent.kde.org/pim/libkdepim
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/libkdepim-26.08.3.tar.xz : e68637f6b5224542c3ca8d042fc3eb104969313ee0148119b9f93fa32711f378
summary     : Libraries for KDE PIM applications
description : |
    Libraries for KDE PIM applications.
license     : GPL-2.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Completion)
    - cmake(KF6I18n)
    - cmake(KF6WidgetsAddons)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    # KPim6LibkdepimConfig.cmake find_dependency()s this, so consumers need it present
    - "%(name)-devel":
        rundeps:
            - cmake(KF6Completion)
