name        : libghostty-vt
version     : "1.0.2"
release     : 1
homepage    : https://ghostty.org/
upstreams   :
    - https://release.files.ghostty.org/libghostty-vt/1.0.2/libghostty-vt-1.0.2.tar.gz :
        hash: 1dcafa8a3357f3a6bbf4f2696e61de611400c5469518716793dfffd35f008b3e
        unpackdir: libghostty-vt
    - https://release.files.ghostty.org/libghostty-vt/1.0.2/libghostty-vt-1.0.2-deps.tar.gz :
        hash: c56156dbea82fdf71f13bf0d704cdf4393b6a04208d7f9691e0d7f60c7f9ca4d
        unpackdir: libghostty-vt-deps
summary     : Portable C library for terminal emulation
description : |
    libghostty-vt is a portable, high-performance C library for terminal
    emulation, released separately from the Ghostty terminal application.
license     : MIT
builddeps   :
    - binary(zig-0.17)
environment : |
    if [ -z "${ZIG_GLOBAL_CACHE_DIR:-}" ]; then
        export ZIG_GLOBAL_CACHE_DIR="%(builddir)/zig-cache"
    fi
    export DESTDIR=%(installroot)
build       : |
    zig-0.17 build \
      -j%(jobs) \
      --prefix %(prefix) \
      --system "%(workdir)/../libghostty-vt-deps" \
      --summary all \
      -Doptimize=ReleaseFast \
      -Dstrip=false \
      -Dcpu=x86_64_v2
install     : |
    # Shared library only; static archive is for Zig consumers, not distro use
    rm -f %(installroot)%(libdir)/libghostty-vt.a
    rm -f %(installroot)%(libdir)/pkgconfig/libghostty-vt-static.pc
