name        : libkexiv2
version     : "26.08.3"
release     : 19
homepage    : https://invent.kde.org/graphics/libkexiv2
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/libkexiv2-26.08.3.tar.xz : 7f4a9daa7bc050d8350ee4d5feb207121e31988de0c9883478d9fbde55bed927
summary     : Exiv2 library interface for KDE
description : |
    Libkexiv2 is a wrapper around Exiv2 library to manipulate pictures metadata as EXIF/IPTC and XMP.
license     : GPL-2.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(exiv2)
setup       : |
    %cmake_kf6 \
        -DBUILD_WITH_QT6=ON
build       : |
    %cmake_build
install     : |
    %cmake_install

    # remove docs
    rm -rf %(installroot)/%(datadir)/doc
