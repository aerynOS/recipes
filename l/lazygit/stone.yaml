name        : lazygit
version     : "0.65.0"
release     : 13
homepage    : https://github.com/jesseduffield/lazygit
upstreams   :
    - https://github.com/jesseduffield/lazygit/archive/refs/tags/v0.65.0.tar.gz : 972151d83d8fdfa5c7c881c34349ba4a38c37b7085667696b85c443d2fca97ed
summary     : A simple terminal UI for git commands
description : |
    A simple terminal UI for git commands
license     : MIT
networking  : true
setup       : |
    %go_mod
build       : |
    export GOFLAGS+=" -ldflags=-X=main.version=%(version) \
        -ldflags=-X=main.commit=v%(version)"
    go build -v
install     : |
    %install_bin lazygit
    %install_file LICENSE -t %(installroot)%(datadir)/licenses/%(name)/
