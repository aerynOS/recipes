name        : lazygit
version     : "0.66.3"
release     : 19
homepage    : https://github.com/jesseduffield/lazygit
upstreams   :
    - https://github.com/jesseduffield/lazygit/archive/refs/tags/v0.66.3.tar.gz : 49e80d28e03e53048105f6ebb5afefbe5caacffa8549347d8a59eab3a00dafe1
summary     : A simple terminal UI for git commands
description : |
    A simple terminal UI for git commands
license     : MIT
networking  : true
rundeps     :
    - ca-certificates
setup       : |
    %go_mod
build       : |
    export GOFLAGS+=" \"-ldflags=-linkmode=external -s -w -buildid= -X=main.version=%(version) -X=main.commit=v%(version)\""
    go build -v .
install     : |
    %install_bin lazygit
    %install_file LICENSE -t %(installroot)%(datadir)/licenses/%(name)/
check       : |
    go test ./...
