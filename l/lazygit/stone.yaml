name        : lazygit
version     : "0.65.1"
release     : 14
homepage    : https://github.com/jesseduffield/lazygit
upstreams   :
    - https://github.com/jesseduffield/lazygit/archive/refs/tags/v0.65.1.tar.gz : df30ec1a5032b3c5672a30090fe787fb32d4122fd996d6d85e1d10135acfbc89
summary     : A simple terminal UI for git commands
description : |
    A simple terminal UI for git commands
license     : MIT
networking  : true
setup       : |
    %go_mod
build       : |
    export GOFLAGS+=" -ldflags=-X=main.version=%(version) \
        -ldflags=-X=main.commit=v%(version)"
    go build -v
install     : |
    %install_bin lazygit
    %install_file LICENSE -t %(installroot)%(datadir)/licenses/%(name)/
