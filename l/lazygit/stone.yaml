name        : lazygit
version     : "0.66.0"
release     : 15
homepage    : https://github.com/jesseduffield/lazygit
upstreams   :
    - https://github.com/jesseduffield/lazygit/archive/refs/tags/v0.66.0.tar.gz : 704b14509dae4c0212754d60d1c00181aea79c0734aafa2c83c89301dba1aefd
summary     : A simple terminal UI for git commands
description : |
    A simple terminal UI for git commands
license     : MIT
networking  : true
setup       : |
    %go_mod
build       : |
    export GOFLAGS+=" \"-ldflags=-linkmode=external -s -w -buildid= -X=main.version=%(version) -X=main.commit=v%(version)\""
    go build -v .
install     : |
    %install_bin lazygit
    %install_file LICENSE -t %(installroot)%(datadir)/licenses/%(name)/
check       : |
    go test ./...
