name        : libime
version     : "1.1.17"
release     : 2
homepage    : https://github.com/fcitx/libime
upstreams   :
    - https://github.com/fcitx/libime/archive/refs/tags/1.1.17.tar.gz:
        hash: 6af056717edf99be8d4b83717de01b6404398d2fc47a301b609ca7d31331cafb
        unpackdir: ime
    - git|https://github.com/kpu/kenlm.git:
        ref: 4cb443e60b7bf2c0ddf3c745378f76cb59e254e5
        clonedir: ime/src/libime/core/kenlm
    - https://download.fcitx-im.org/data/lm_sc.arpa-20260629.tar.zst:
        hash: 06808333b9173e5374cf2cb5afc12d08f5625bf9abb536489cac376fc05f2e7f
        unpack: false
    - https://download.fcitx-im.org/data/dict-20260907.tar.zst:
        hash: fb75a179065e690dfc4559ce1807cbaf4fbe4f0111a5005615be9f435e6b9d76
        unpack: false
    - https://download.fcitx-im.org/data/table-20240108.tar.zst:
        hash: 3e9d87b04a393f131723472c8eaa860dd23c378a3d4f6a9005513b2a95b3614b
        unpack: false
summary     : A library to support generic input method implementation
description : |
    A library to support generic input method implementation
license     : LGPL-2.1-or-later
builddeps   :
    - cmake(Boost)
    - cmake(ECM)
    - cmake(Fcitx5Utils)
setup       : |
    # Verify version match with CMakeLists.txt. If not match, update
    for file in %(sourcedir)/{lm_sc.arpa,dict,table}-*.tar.zst; do
        mv "${file}" data/
        grep -F "$(basename "${file}")" data/CMakeLists.txt
    done

    %cmake
build       : |
    %cmake_build
install     : |
    %cmake_install
check       : |
    %cmake_test
