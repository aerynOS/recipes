name        : libkscreen
version     : "6.8.2"
release     : 34
upstreams   :
    - https://download.kde.org/stable/plasma/6.8.2/libkscreen-6.8.2.tar.xz : 6229bbcde7664a14f9cbf1e4e241e3dd88186a96295004c2749bdd0bebd627e3
homepage    : https://kde.org/plasma-desktop/
license     :
    - GPL-2.0-or-later
    - LGPL-2.1-only
summary     : KDE's screen management software
description : |
    KDE's screen management software
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(PlasmaWaylandProtocols)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6WaylandClient)
tuning      :
    - lto: full
    - optimize: speed
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
