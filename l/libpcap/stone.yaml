name        : libpcap
version     : "1.11.1"
release     : 12
homepage    : https://www.tcpdump.org/
upstreams   :
    - https://www.tcpdump.org/release/libpcap-1.11.1.tar.gz : 7985b1d20ff82c1e384115038046e0b15034648c6f45c92e08601d4ee1b369ed
summary     : Platform-independent network traffic capture library
description : |
    Platform-independent network traffic capture library
license     : BSD-3-Clause
builddeps   :
    - binary(flex)
    - binary(yacc)
    - pkgconfig(bluez)
    - pkgconfig(dbus-1)
    - pkgconfig(libnl-3.0)
setup       : |
    %configure \
        --with-libnl
build       : |
    %make
install     : |
    %make_install
    rm -v %(installroot)/%(libdir)/libpcap.a
packages    :
    - "%(name)-devel":
        paths:
            - /usr/bin/pcap-config
            - /usr/share/man/man1/pcap-config*
            - /usr/share/man/man5/
