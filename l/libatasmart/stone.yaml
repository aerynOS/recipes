name        : libatasmart
version     : "0.19"
release     : 4
homepage    : http://0pointer.de
upstreams   :
    - https://0pointer.de/public/libatasmart-0.19.tar.xz : 61f0ea345f63d28ab2ff0dc352c22271661b66bf09642db3a4049ac9dbdb0f8d
summary     : Disk reporting library
description : |
    The libatasmart package is a disk reporting library. It only supports a subset of the ATA S.M.A.R.T. functionality.
license     : GPL-2.0-or-later
builddeps   :
    - binary(bison)
    - binary(flex)
    - pkgconfig(libudev)
    - pkgconfig(vapigen)
setup       : |
    %reconfigure \
        --disable-static
build       : |
    %make
install     : |
    %make_install
packages    :
    - "%(name)":
        paths:
            - /usr/share/vala
