name        : libkomparediff2
version     : "26.08.3"
release     : 2
homepage    : https://invent.kde.org/sdk/libkomparediff2
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/libkomparediff2-26.08.3.tar.xz : 87c9e6b5dcf64463442f3748e4b7b79a85748def48c4d649152627e0b1836d4f
summary     : Library to compare files and strings
description : |
    Library to compare files and strings, used in Kompare and KDevelop.
license     :
    - GPL-2.0-or-later
    - LGPL-2.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Config)
    - cmake(KF6CoreAddons)
    - cmake(KF6I18n)
    - cmake(KF6KIO)
    - cmake(KF6XmlGui)
setup       : |
    %cmake_kf6 \
        -DBUILD_TESTING=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
check       : |
    %cmake_test
packages    :
    # KompareDiff2Config.cmake find_dependency()s these, so consumers need them present
    - "%(name)-devel":
        rundeps:
            - cmake(KF6Config)
            - cmake(KF6XmlGui)
