name        : libkgapi
version     : "26.08.3"
release     : 20
homepage    : https://invent.kde.org/pim/libkgapi
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/libkgapi-26.08.3.tar.xz : 204b05b32d50f269c0a633201d21d66bf6ae93a72ce572a24c6afd38aeffe5c4
summary     : Libkgapi is a KDE-based library for accessing various Google services via their public API
description : |
    Libkgapi is a KDE-based library for accessing various Google services via their public API.
license     : LGPL-2.1-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6CalendarCore)
    - cmake(KF6Contacts)
    - cmake(KF6Wallet)
    - pkgconfig(libsasl2)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-devel":
        rundeps:
            - cmake(KF6CalendarCore)
            - cmake(KF6Contacts)
