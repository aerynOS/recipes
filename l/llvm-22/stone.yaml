name        : llvm-22
version     : "22.1.8"
release     : 2
summary     : Low Level Virtual Machine
license     :
    - Apache-2.0 WITH LLVM-exception
    - NCSA
homepage    : https://www.llvm.org
description : |
    Low Level Virtual Machine
upstreams   :
    - https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/llvm-project-22.1.8.src.tar.xz : 922f1817a0df7b1489272d18134ee0087a8b068828f87ac63b9861b1a9965888
builddeps   :
    - binary(clang-23) # Ensure correct build ordering
    - binary(perl)
    - binary(python3)
    - binary(sed)
    - binary(swig)
    - pkgconfig(hwloc)
    - pkgconfig(libedit)
    - pkgconfig(liblzma)
    - pkgconfig(mimalloc)
    - pkgconfig(ncurses)
    - pkgconfig(python3)
    - pkgconfig32(libffi)
    - pkgconfig32(libxcrypt)
    - pkgconfig32(libxml-2.0)
    - pkgconfig32(libzstd)
    - pkgconfig32(zlib)
    - python(myst-parser)
    - python(sphinx)
    - binutils-devel
    - gcc-32bit
    - libquadmath-devel
    - libstdc++-32bit-devel
    - mimalloc-static # TODO: Figure out if we can actually split mimalloc-static, or if it needs to go back in.
tuning      :
    - fortify: false
    - frame-pointer: false
    - harden: false
    - icf: all
    - lto: false # LTO needs to be set in LLVM cmake flags so it adds -fno-lto where needed
    - nosemantic
    - optimize: speed
    - symbolic
environment : |
    # Full-fat (in the milk sense) build suitable for cross-compilation
    _BUILD_TARGETS="AArch64;AMDGPU;ARM;AVR;BPF;Hexagon;Lanai;LoongArch;Mips;MSP430;NVPTX;PowerPC;RISCV;Sparc;SPIRV;SystemZ;VE;WebAssembly;X86;XCore"
    _PROJECTS="clang;lld;llvm"
    _RUNTIMES="compiler-rt"

    EXTRA_LLVM_FLAGS=""
    if [[ " ${PATH[*]} " =~ "ccache" ]]; then
        EXTRA_LLVM_FLAGS="-DLLVM_CCACHE_BUILD=ON"
    fi

    _MAJOR_VERSION=$(echo %(version) | cut -d. -f1)

    function apply_llvm_patches() {
        # Build-related patches, achieving adjustments/fixes to the build that cannot be done via cmake flags
        %patch %(pkgdir)/patches/build/0001-Build-lld-libraries-shared.patch
        %patch %(pkgdir)/patches/build/0001-Build-polly-libraries-shared.patch
        %patch %(pkgdir)/patches/build/0001-PATCH-clang-Don-t-install-static-libraries.patch
        %patch %(pkgdir)/patches/build/0001-downstream-Suppress-runpath-in-openmp.patch
        %patch %(pkgdir)/patches/build/0001-bolt-Set-version-string.patch
        %patch %(pkgdir)/patches/build/0001-openmp-Don-t-install-static-libarcher.patch
        %patch %(pkgdir)/patches/build/0001-polly-Create-targets-for-headers-cmake.patch
        %patch %(pkgdir)/patches/build/0001-offload-Fix-build-failure-with-icf-all.patch
        %patch %(pkgdir)/patches/build/0001-Emit-relocations-for-BOLT.patch

        # Runtime config changes. These often duplicate settings set by our CFLAGS/LDFLAGS and are intended as sane
        # defaults when a build either doesn't respect our flags or when a user is building a project outside of
        # our build system
        %patch %(pkgdir)/patches/config/0001-Make-gnuhash-the-default-when-not-specified.patch
        %patch %(pkgdir)/patches/config/0001-lld-Use-zstd-compression-for-debug-symbols-by-defaul.patch
        %patch %(pkgdir)/patches/config/0001-lld-Always-enable-build-id-and-use-20-byte-hashes.patch

        # Aeryn-specific patches
        %patch %(pkgdir)/patches/aerynos/0001-Support-aeryn-solus-as-a-distro.patch
        %patch %(pkgdir)/patches/aerynos/0001-Use-correct-Serpent-OS-multilib-paths-for-ld.patch
        %patch %(pkgdir)/patches/aerynos/0001-Update-binutils-version-to-match-Serpent-OS.patch

        # Performance-related patches
        %patch %(pkgdir)/patches/perf/0001-Use-mimalloc-for-clang-lld-llvm.patch

        ## Upstream backports/reverts
        %patch %(pkgdir)/patches/upstream/0001-Backport-177953.patch
        # Fix ffmpeg build
        %patch %(pkgdir)/patches/upstream/0001-SLP-Support-for-tree-throttling-in-SLP-graphs-with-g.patch
        %patch %(pkgdir)/patches/upstream/0002-X86-vectorizeExtractedCast-don-t-assume-vector-sourc.patch
        # Fixes rust 1.97 miscompilation
        %patch %(pkgdir)/patches/upstream/208683.patch
        # Fix rustc bpf support + prereq
        %patch %(pkgdir)/patches/upstream/0001-bpf-Support-aggregate-returns-190894.patch
        %patch %(pkgdir)/patches/upstream/0002-Fixes-for-compile-rust-code-192134.patch
    }

    function cmake_llvm_configure() {
        %cmake \
            -DCMAKE_INSTALL_PREFIX=%(libdir)/%(name) \
            -DCMAKE_SKIP_INSTALL_RPATH=ON \
            -DBOLT_PACKAGE_VERSION=%(version) \
            -DCLANG_DEFAULT_LINKER=lld \
            -DCLANG_DEFAULT_OBJCOPY=llvm-objcopy \
            -DCLANG_DEFAULT_PIE_ON_LINUX=ON \
            -DCLANG_LINK_CLANG_DYLIB=ON \
            -DCLANG_PLUGIN_SUPPORT=ON \
            -DCLANG_REPOSITORY_STRING="AerynOS" \
            -DENABLE_LINKER_BUILD_ID=ON \
            -DFLANG_RT_ENABLE_SHARED=OFF \
            -DFLANG_RT_ENABLE_STATIC=OFF \
            -DFLANG_RT_INSTALL_RESOURCE_LIB_PATH=%(libdir) \
            -DFLANG_RT_OUTPUT_RESOURCE_LIB_DIR=%(libdir) \
            -DLIBCXX_ENABLE_ABI_LINKER_SCRIPT=ON \
            -DLIBCXX_STATICALLY_LINK_ABI_IN_STATIC_LIBRARY=ON \
            -DLIBCXXABI_USE_LLVM_UNWINDER=OFF \
            -DLIBOMP_INSTALL_ALIASES=OFF \
            -DLIBOMP_USE_HWLOC=ON \
            -DLIBUNWIND_INSTALL_HEADERS=OFF \
            -DLIBUNWIND_INSTALL_LIBRARY=OFF \
            -DLLDB_ENABLE_LIBEDIT=ON \
            -DLLDB_ENABLE_CURSES=ON \
            -DLLDB_ENABLE_LZMA=ON \
            -DLLDB_ENABLE_LIBXML2=ON \
            -DLLDB_ENABLE_PYTHON=ON \
            -DLLDB_ENABLE_LUA=OFF \
            -DLLDB_NO_INSTALL_DEFAULT_RPATH=ON \
            -DLLDB_SKIP_STRIP=ON \
            -DLLVM_APPEND_VC_REV=OFF \
            -DLLVM_BINUTILS_INCDIR=/usr/include \
            -DLLVM_BUILD_DOCS=OFF \
            -DLLVM_BUILD_LLVM_DYLIB=ON \
            -DLLVM_BUILD_TOOLS=ON \
            -DLLVM_DEFAULT_TARGET_TRIPLE=%(build_platform) \
            -DLLVM_DYLIB_COMPONENTS="all" \
            -DLLVM_ENABLE_DOXYGEN=OFF \
            -DLLVM_ENABLE_FFI=ON \
            -DLLVM_ENABLE_LIBXML2=ON \
            -DLLVM_ENABLE_LTO=Thin \
            -DLLVM_ENABLE_MIMALLOC=ON \
            -DLLVM_ENABLE_MODULES=OFF \
            -DLLVM_ENABLE_PER_TARGET_RUNTIME_DIR=OFF \
            -DLLVM_ENABLE_PLUGINS=ON \
            -DLLVM_ENABLE_PROJECTS=$_PROJECTS \
            -DLLVM_ENABLE_RTTI=ON \
            -DLLVM_ENABLE_RUNTIMES=$_RUNTIMES \
            -DLLVM_ENABLE_SPHINX=ON \
            -DLLVM_ENABLE_ZLIB=ON \
            -DLLVM_ENABLE_ZSTD=ON \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_DOCS=ON \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_UTILS=ON \
            -DLLVM_INSTALL_UTILS=ON \
            -DLLVM_LIBDIR_SUFFIX=%(libsuffix) \
            -DLLVM_LINK_LLVM_DYLIB=ON \
            -DLLVM_PARALLEL_LINK_JOBS=1 \
            -DLLVM_POLLY_LINK_INTO_TOOLS=OFF \
            -DLLVM_RUNTIME_TARGETS="i686-unknown-linux-gnu;default" \
            -DLLVM_TARGET_ARCH=x86_64 \
            -DLLVM_TARGETS_TO_BUILD=$_BUILD_TARGETS \
            -DLLVM_TOOL_OPENMP_BUILD=ON \
            -DLLVM_USE_PERF=ON \
            -DLLVM_USE_SANITIZER=OFF \
            -DMLIR_BUILD_MLIR_C_DYLIB=ON \
            -DMLIR_INSTALL_AGGREGATE_OBJECTS=OFF \
            -DMLIR_LINK_MLIR_DYLIB=ON \
            -DOPENMP_INSTALL_LIBDIR="%(libdir)" \
            -DSPHINX_OUTPUT_MAN=ON \
            -DSPHINX_OUTPUT_HTML=OFF \
            -DSPHINX_WARNINGS_AS_ERRORS=OFF \
            $EXTRA_LLVM_FLAGS \
            "$@"
    }

    # "Inspired by"/"Gratuitously copied from" Gentoo, use LLVM_DISTRIBUTION_COMPONENTS to avoid installing static libs
    # and other unnecessary things. This works by extracting the target list from ninja and
    # filtering it to only have the things we really need. This way when cmake target files
    # are generated it results in the components we didn't include not being added to the
    # searched for objects.
    ## NOTE: New versions of LLVM should be built without this in order to see what's been
    ## added/removed and this list updated correspondingly.
    function get_distribution_components() {
        # This generates a lot of output that we don't need to see
        set +x
        local target
        ninja -C "%(builddir)" -t targets | grep -Po 'install-\K.*(?=-stripped:)' | while read -r target; do
            case $target in
                distribution)
                    continue
                    ;;

                ### LLVM
                llvm-libraries)
                    continue
                    ;;
                # shared libraries
                LLVM|LLVMgold|LTO|Remarks)
                    ;;
                # Used by LDC
                LLVMTableGen|LLVMSupport|LLVMDemangle|LLVMDebuginfod)
                    ;;
                # Devel
                llvm-headers|cmake-exports)
                    ;;
                # Bins
                FileCheck|UnicodeNameMappingGenerator|bugpoint|dsymutil|llc|lli|obj2yaml|opt|opt-viewer|reduce-chunk-list|sancov|sanstats|split-file|verify-uselistorder|yaml2obj)
                    ;;
                # Devel bins
                count|lli-child-target|not|yaml-bench)
                    ;;
                # Various binaries (everything we don't want has already been excluded)
                llvm-*)
                    ;;

                ### Clang
                clang-libraries)
                    continue
                    ;;
                clang-tidy-headers)
                    continue
                    ;;
                # Libs
                libclang|clang-cpp)
                    ;;
                clang|clangd|clang-*|bash-autocomplete)
                    ;;
                # Other clang tools
                c-index-test|diagtool|find-all-symbols|hmaptool|modularize|offload-arch|pp-trace|scan-view|scan-build*)
                    ;;
                clang*|findAllSymbols)
                    continue
                    ;;

                ### LLD
                # Shared libraries
                lld|lld-libraries)
                    ;;
                # Devel
                lld-headers|lld-cmake-exports)
                    ;;

                ### LLDB
                # bin
                lldb|lldb-python-scripts|lldb-argdumper|lldb-dap|lldb-instr|lldb-mcp|lldb-server)
                    ;;
                # libs
                liblldb|lldbIntelFeatures)
                    ;;
                # Devel
                lldb-headers)
                    ;;

                ### Polly
                # Libs
                Polly|PollyISL|LLVMPolly)
                    ;;
                # Devel
                polly-headers|polly-cmake-exports)
                    ;;

                ### BOLT
                bolt)
                    ;;

                ### MLIR
                mlir-libraries)
                    continue
                    ;;
                # Shared libs
                MLIR|MLIR-C|MLIRExecutionEngineShared)
                    ;;
                # Target libs
                mlir_*)
                    ;;
                # MLIR tools
                mlir-*|tblgen-lsp-server|tblgen-to-irdl)
                    ;;
                # Devel
                mlir-headers|mlir-cmake-exports)
                    ;;
                # MLIR dependencies
                MLIRSparseTensorRuntime|MLIRSparseTensorEnums)
                    ;;

                ### Flang
                # Flang itself
                flang)
                    ;;
                # Supporting tools
                bbc|tco|f18-parse-demo|fir-*)
                    ;;
                # Fortran build files
                flang-binding|flang-module-interfaces|flang-fortran-binding)
                    ;;

                ### built-ins, Runtimes
                builtins|runtimes)
                    ;;

                ### Deny everything else
                *)
                    continue
                    ;;
            esac
            echo $target
        done
        set -x
    }
setup:   |
    apply_llvm_patches

    # cmake_llvm_configure -S llvm \
    #     -C clang/cmake/caches/PGO.cmake \
    #     -DPGO_INSTRUMENT_LTO=Thin \
    #     -B pgo-training

    # cmake_build -C pgo-training stage2-instrumented-generate-profdata

    # find pgo-training -name "clang.profdata" -exec mv {} %(workdir) \;

    cmake_llvm_configure llvm

    distribution_components=$(get_distribution_components | paste -sd\;)
    test -n "$distribution_components"
    cmake_llvm_configure llvm \
        -DLLVM_DISTRIBUTION_COMPONENTS="$distribution_components"
build:   |
    %ccache_zero
    %cmake_build --target distribution
    %ccache_stats
install: |
    DESTDIR="%(installroot)" cmake --build "%(builddir)" --verbose --target install-distribution

    export LD_LIBRARY_PATH="%(installroot)/%(libdir)/llvm-${_MAJOR_VERSION}/lib/"

    export BOLTED_BINS="%(libdir)/llvm-${_MAJOR_VERSION}/lib/libclang-cpp.so.${_MAJOR_VERSION}.1 %(libdir)/llvm-${_MAJOR_VERSION}/lib/libLLVM.so.${_MAJOR_VERSION}.1"

    for i in ${BOLTED_BINS}; do
        %bolt_instr %(installroot)/$i
    done

    cmake -G Ninja -B bolt-clang -S runtimes \
        -DCMAKE_C_COMPILER="%(installroot)%(libdir)/llvm-${_MAJOR_VERSION}/bin/clang" \
        -DCMAKE_CXX_COMPILER="%(installroot)%(libdir)/llvm-${_MAJOR_VERSION}/bin/clang++" \
        -DLLVM_ENABLE_RUNTIMES='libcxx;libcxxabi;libunwind' \
        -DLLVM_USE_LINKER="%(installroot)%(libdir)/llvm-${_MAJOR_VERSION}/bin/ld.lld" \
        -DLLVM_ENABLE_LTO=Full
    ninja -C bolt-clang

    for i in ${BOLTED_BINS}; do
        %bolt_merge %(installroot)/$i
        %bolt_opt %(installroot)/$i
        # Clean-up
        rm -v %(installroot)/$i.{bolt,orig}
    done

    # Versioned bins
    %install_dir %(installroot)%(bindir)
    pushd %(installroot)%(libdir)/llvm-${_MAJOR_VERSION}/bin/
    for i in *; do
        ln -srv ${i} %(installroot)%(bindir)/${i}-${_MAJOR_VERSION}
    done
    popd
    # Double versioned
    rm -v %(installroot)%(bindir)/clang-${_MAJOR_VERSION}-${_MAJOR_VERSION}

    ### LLVM (begin)
    pushd %(installroot)%(libdir)/llvm-${_MAJOR_VERSION}/lib/
    for i in libLLVM.so.* libLTO.so.* libRemarks.so.*; do
        ln -Pv ${i} %(installroot)%(libdir)/${i}
    done
    popd
    # LLVM (end)

    ### Clang (begin)
    pushd %(installroot)%(libdir)/llvm-${_MAJOR_VERSION}/lib/
    for i in libclang.so.* libclang-cpp.so.*; do
        ln -Pv ${i} %(installroot)%(libdir)/${i}
    done
    popd
    ### Clang (end)

    ### lld (begin)
    pushd %(installroot)%(libdir)/llvm-${_MAJOR_VERSION}/lib/
    for i in liblld*.so.*; do
        ln -Pv ${i} %(installroot)%(libdir)/${i}
    done
    popd
    ### lld (end)

    %python_compile
packages    :
    - "%(name)-libs":
        summary: "Library files for %(name)"
        description: |
            Library files for %(name), typically pulled in as a dependency of another package.
        paths:
            - /usr/lib/libLLVM.so.*
            - /usr/lib/libLTO.so.*
            - /usr/lib/libRemarks.so.*
            - /usr/lib/llvm-22/lib/libLLVM.so.*
            - /usr/lib/llvm-22/lib/libLTO.so.*
            - /usr/lib/llvm-22/lib/libRemarks.so.*
