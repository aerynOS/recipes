name        : leveldb
version     : "1.23"
release     : 1
homepage    : https://github.com/google/leveldb
upstreams   :
    - https://github.com/google/leveldb/archive/refs/tags/1.23.tar.gz : 9a37f8a6174f09bd622bc723b55881dc541cd50747cbd08831c2a82d620f6d76
summary     : LevelDB is a fast key-value storage library written at Google that provides an ordered mapping from string keys to string values.
description : |
    LevelDB is a fast key-value storage library written at Google that provides an ordered mapping from string keys to string values.
license     : BSD-3-Clause
builddeps   :
    - cmake(GTest)
    - cmake(benchmark)
    - pkgconfig(snappy)
    - pkgconfig(sqlite3)
setup       : |
    # Patches from Arch
    %patch %(pkgdir)/010-leveldb-unbundle-gtest-and-benchmark.patch
    %patch %(pkgdir)/020-leveldb-do-not-disable-rtti.patch

    %cmake \
        -DCMAKE_CXX_STANDARD:STRING='17' \
        -DBUILD_SHARED_LIBS:BOOL='1'
build       : |
    %cmake_build
install     : |
    %cmake_install
check       : |
    %cmake_test
