name        : lact
version     : "0.10.1"
release     : 4
homepage    : https://github.com/ilya-zlobintsev/LACT
upstreams   :
    - https://github.com/ilya-zlobintsev/LACT/archive/refs/tags/v0.10.1.tar.gz : cbbbd0336fb65ce539ea29d99fe2e38f7c82de08c07d26dfab355735a88d853c
summary     : Linux GPU Configuration Tool
description : |
    Linux GPU Configuration Tool
license     : MIT
networking  : true
builddeps   :
    - binary(cargo)
    - binary(vulkaninfo)
    - pkgconfig(OpenCL)
    - pkgconfig(gobject-2.0)
    - pkgconfig(graphene-gobject-1.0)
    - pkgconfig(libadwaita-1)
    - pkgconfig(libdisplay-info)
    - pkgconfig(libdrm)
rundeps     :
    - binary(vulkaninfo)
    - hwdata
setup       : |
    %patch %(pkgdir)/0001-Adapt-to-our-amdgpu-kernel-argument.patch
    %patch %(pkgdir)/863.patch
build       : |
    %make build-release
install     : |
    %make_install PREFIX=%(prefix)
    %install_file %(pkgdir)/kernel-lact.cmdline %(installroot)%(libdir)/kernel/cmdline.d/70-lact.cmdline
