name        : libnfs
version     : "7.0.2"
release     : 4
homepage    : https://github.com/sahlberg/libnfs
upstreams   :
    - https://github.com/sahlberg/libnfs/archive/libnfs-7.0.2.tar.gz : 188a8a5de2ad2099a2e97e42f34721bfc4c16c8d33808de0f7484f99d714a3df
summary     : A client library for accessing NFS shares over a network
description : |
    LIBNFS offers three different APIs: RAW, NFS ASYNC and NFS SYNC.
license     :
    - BSD-2-Clause
    - GPL-3.0-or-later
    - LGPL-2.1-or-later
builddeps   :
    - pkgconfig(gnutls)
setup       : |
    %cmake \
        -DENABLE_DOCUMENTATION=ON \
        -DENABLE_MULTITHREADING=ON \
        -DENABLE_UTILS=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-utils":
        summary: Utilities for accessing NFS servers
        description: Utilities for accessing NFS servers
        paths:
            - /usr/bin/
            - /usr/share/man/man1/
