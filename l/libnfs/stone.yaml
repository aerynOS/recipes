name        : libnfs
version     : "8.0.1"
release     : 6
homepage    : https://github.com/sahlberg/libnfs
upstreams   :
    - https://github.com/sahlberg/libnfs/archive/libnfs-8.0.1.tar.gz : 03653086471ceddd846077151adc6fda9ebc47118010a196e27f4f2e3e5e32f0
summary     : A client library for accessing NFS shares over a network
description : |
    LIBNFS offers three different APIs: RAW, NFS ASYNC and NFS SYNC.
license     :
    - BSD-2-Clause
    - GPL-3.0-or-later
    - LGPL-2.1-or-later
builddeps   :
    - pkgconfig(gnutls)
setup       : |
    %cmake \
        -DENABLE_DOCUMENTATION=ON \
        -DENABLE_MULTITHREADING=ON \
        -DENABLE_UTILS=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-utils":
        summary: Utilities for accessing NFS servers
        description: Utilities for accessing NFS servers
        paths:
            - /usr/bin/
            - /usr/share/man/man1/
