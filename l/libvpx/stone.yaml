name        : libvpx
version     : "1.17.0"
release     : 9
homepage    : https://www.webmproject.org/code/
upstreams   :
    - https://github.com/webmproject/libvpx/archive/refs/tags/v1.17.0.tar.gz:
        hash: 1020f184046187baa2985dbde38e0691f49c44088bca7a1842b0236c6081dc0a
        unpackdir: current

    # - https://github.com/webmproject/libvpx/archive/refs/tags/v1.15.2.tar.gz:
    #     hash: 26fcd3db88045dee380e581862a6ef106f49b74b6396ee95c2993a260b4636aa
    #     unpackdir: compat
summary     : WebM VP8/VP9 Codec SDK
description : |
    WebM VP8/VP9 Codec SDK
license     : BSD-3-Clause
builddeps   :
    - binary(curl)
    - binary(eu-strip)
    - binary(nasm)
    - binary(perl)
    - binary(readelf)
tuning      :
    - lto
    - optimize: speed
networking  : true
environment : |
    export AS=nasm
    export STRIP=eu-strip
setup       : |
    if [ -d ../compat ]; then
        pushd ../compat
        mkdir _build && cd _build
        ../configure --prefix=%(prefix) \
                --libdir=%(libdir) \
                --disable-static \
                --enable-shared \
                --enable-unit-tests \
                --enable-decode-perf-tests
        popd
    fi

    mkdir _build && cd _build
    ../configure --prefix=%(prefix) \
                --libdir=%(libdir) \
                --disable-static \
                --enable-shared \
                --enable-unit-tests \
                --enable-decode-perf-tests
build       : |
    if [ -d ../compat ]; then
        pushd ../compat
            export CCACHE_BASEDIR="${PWD}"
            pushd _build
            %ccache_zero
            %make
            %ccache_stats
            popd
        popd
    fi

    export CCACHE_BASEDIR="${PWD}"
    pushd _build
    %ccache_zero
    %make
    %ccache_stats
    popd
install     : |
    if [ -d ../compat ]; then
        pushd ../compat
            pushd _build
            mkdir tmp
            make install DESTDIR="${PWD}/tmp"

            # Only copy the sonames
            %install_dir %(installroot)/%(libdir)
            find ${PWD}/tmp%(libdir) -name "libvpx.so.*" -type l -print -exec mv {} %(installroot)%(libdir) \;
            find ${PWD}/tmp%(libdir) -name "libvpx.so.*" -type f -print -exec mv {} %(installroot)%(libdir) \;
            popd
        popd
    fi

    pushd _build
    %make_install
# Needs a long time. Consider a specific set of encoding tests.
# workload    : |
#     export LD_LIBRARY_PATH=$(pwd)
#     pushd _build
#     %make test
