name        : libkleo
version     : "26.08.3"
release     : 24
homepage    : https://invent.kde.org/pim/libkleo
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/libkleo-26.08.3.tar.xz : cd95679340af60bdbba0139c039dca4b5a334c03180dbaf7ba520e3d514cb7a7
summary     : KDE PIM cryptographic library
description : |
    KDE PIM cryptographic library.
license     : GPL-2.0-or-later
builddeps   :
    - cmake(Boost)
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Codecs)
    - cmake(KF6ColorScheme)
    - cmake(KF6Completion)
    - cmake(KF6Config)
    - cmake(KF6CoreAddons)
    - cmake(KF6I18n)
    - cmake(KF6ItemModels)
    - cmake(KF6WidgetsAddons)
    - cmake(QGpgmeQt6)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    # KPim6LibkleoConfig.cmake find_dependency()s these, so consumers need them present
    - "%(name)-devel":
        rundeps:
            - cmake(Gpgmepp)
            - cmake(QGpgmeQt6)
        paths:
            - /usr/share/KPim6Libkleo/
