name        : libgravatar
version     : "26.08.2"
release     : 18
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.2/src/libgravatar-26.08.2.tar.xz : bd71ec6fefd98402683dd00447e0cab8c29f1f690784462dbfaab1ec95234069
homepage    : https://kde.org
license     :
    - GPL-2.0-only
    - LGPL-2.1-or-later
summary     : KDE PIM library providing Gravatar support
description : |
    KDE PIM library providing Gravatar support.
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Config)
    - cmake(KF6ConfigWidgets)
    - cmake(KF6CoreAddons)
    - cmake(KF6I18n)
    - cmake(KF6WidgetsAddons)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
