name        : libgravatar
version     : "26.08.1"
release     : 17
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.1/src/libgravatar-26.08.1.tar.xz : 459e245db0872ee5f780d4cc90808e90d9fcb63f0ee9c22552c15d60754c388f
homepage    : https://kde.org
license     :
    - GPL-2.0-only
    - LGPL-2.1-or-later
summary     : KDE PIM library providing Gravatar support
description : |
    KDE PIM library providing Gravatar support.
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Config)
    - cmake(KF6ConfigWidgets)
    - cmake(KF6CoreAddons)
    - cmake(KF6I18n)
    - cmake(KF6WidgetsAddons)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
