name        : libgravatar
version     : "26.08.3"
release     : 19
homepage    : https://invent.kde.org/pim/libgravatar
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/libgravatar-26.08.3.tar.xz : 264a7e7bbd66067c7613367143ff13705682d6381864c85991634a9f993fddac
summary     : KDE PIM library providing Gravatar support
description : |
    KDE PIM library providing Gravatar support.
license     :
    - GPL-2.0-only
    - LGPL-2.1-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Config)
    - cmake(KF6ConfigWidgets)
    - cmake(KF6CoreAddons)
    - cmake(KF6I18n)
    - cmake(KF6WidgetsAddons)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
