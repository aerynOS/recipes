name        : lz4
version     : "1.11.1"
release     : 7
homepage    : https://lz4.github.io/lz4
upstreams   :
    - https://github.com/lz4/lz4/releases/download/v1.11.1/lz4-1.11.1.tar.gz : 683fed08a844ad012196381e40badf80c0bbe4962959761416d41c9e67d77ec7
summary     : Extremely fast lossless compression algorithm
description : |
    LZ4 is lossless compression algorithm, providing compression speed > 500 MB/s per core, scalable with multi-cores CPU. It features an extremely fast decoder, with speed in multiple GB/s per core, typically reaching RAM speed limits on multi-core systems.
license     :
    - BSD-2-Clause
    - GPL-2.0-or-later
emul32      : true
setup       : |
    pushd build/meson
    %meson \
        -Dprograms=true \
        -Dtests=true
build       : |
    pushd build/meson
    %meson_build
install     : |
    pushd build/meson
    %meson_install
check       : |
    pushd build/meson
    # the tests call lz4cat, which meson doesn't build; point it at the new binary
    ln -sf lz4 %(builddir)/meson/programs/lz4cat
    # hugefile tests compress several GB of generated data
    %meson_test \
        --exclude hugefile
