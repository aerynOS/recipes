name        : libgtop
version     : "2.41.4"
release     : 6
homepage    : https://gitlab.gnome.org/GNOME/libgtop
upstreams   :
    - https://download.gnome.org/sources/libgtop/2.41/libgtop-2.41.4.tar.xz : d3c18158549218835a00517d9c454a2de825ac7808efe84101a8b7e2a8ab6663
