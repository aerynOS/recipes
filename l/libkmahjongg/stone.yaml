name        : libkmahjongg
version     : "26.08.3"
release     : 2
homepage    : https://invent.kde.org/games/libkmahjongg
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/libkmahjongg-26.08.3.tar.xz : d13c7184dfee6596c23ad4f3b72d4c2fd9b0671383a7bdc7c0c9b657be2db267
summary     : Common code and assets for KMahjongg
description : |
    Library providing common code and assets for KMahjongg.
license     :
    - BSD-3-Clause
    - CC0-1.0
    - GPL-2.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Config)
    - cmake(KF6ConfigWidgets)
    - cmake(KF6CoreAddons)
    - cmake(KF6I18n)
    - cmake(KF6WidgetsAddons)
    - cmake(Qt6Svg)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    # KMahjongglib6Config.cmake find_dependency()s these, so consumers need them present
    - "%(name)-devel":
        rundeps:
            - cmake(KF6ConfigWidgets)
