name        : libsrtp
version     : "2.8.2"
release     : 6
upstreams   :
    - https://github.com/cisco/libsrtp/archive/v2.8.2.tar.gz : 02e8326e12381e27a205ded888a803c6ff55ec7be170cd5e5506251f731fee92
homepage    : https://github.com/cisco/libsrtp
license     : BSD-3-Clause
summary     : Secure Real-Time Transport Protocol
description : |
    This package provides an implementation of the Secure Real-time Transport Protocol (SRTP), the Universal Security Transform (UST), and a supporting cryptographic kernel.
builddeps   :
    - binary(doxygen)
    - pkgconfig(libcrypto)
    - pkgconfig(libpcap)
checkdeps   :
    - binary(ps)
setup       : |
    %meson \
        -Dcrypto-library=openssl
build       : |
    %meson_build
install     : |
    %meson_install
check       : |
    %meson_test
