name        : libcap
version     : "2.78"
release     : 14
summary     : Library for getting and setting POSIX.1e capabilities
license     :
    - BSD-3-Clause
    - GPL-2.0-only
homepage    : https://sites.google.com/site/fullycapable
description : |
    Library for getting and setting POSIX.1e capabilities
upstreams   :
    - https://mirrors.edge.kernel.org/pub/linux/libs/security/linux-privs/libcap2/libcap-2.78.tar.xz: 0d621e562fd932ccf67b9660fb018e468a683d7b827541df27813228c996bb11
builddeps   :
    - binary(as)
    - binary(go)
    - pkgconfig32(pam)
    - linux-headers
emul32      : true
setup       : |
    # Static linking broken
    sed -i Makefile -e '/\-C tests/d'
build       : |
    _extra_opts="GOLANG=no"
    if [[ %(target_triple) != i686* ]]; then
        _extra_opts="all"
    fi

    %make \
        BUILD_CC="%(cc)" \
        CC="%(cc)" \
        AR=%(ar) \
        RANLIB=%(ranlib) \
        OBJCOPY=%(objcopy) \
        DYNAMIC=yes \
        KERNEL_HEADERS=%(includedir) \
        CGO_REQUIRED=1 \
        CGO_CFLAGS="${CFLAGS}" \
        CGO_LDFLAGS="${LDFLAGS}" \
        GO_BUILD_FLAGS="-buildmode=pie -a -v -x -ldflags='-compressdwarf=false -B gobuildid'" \
        $_extra_opts
install     : |
    %make_install CGO_REQUIRED=1 RAISE_SETFCAP=no prefix=/usr lib=lib%(libsuffix)

    # Don't need 32bit static libs
    if [[ %(target_triple) == i686* ]]; then
        rm -fv %(installroot)%(libdir)/lib*.a
    fi
packages    :
    - "%(name)-staticlib":
        rundeps:
            - "%(name)-devel"
        paths:
            - /usr/lib/lib*.a

    - "captree":
        summary: Capability inspection utility
        description: Capability inspection utility
        paths:
            - /usr/sbin/captree
            - /usr/share/man/man8/captree.8*
