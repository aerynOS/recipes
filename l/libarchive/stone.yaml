name        : libarchive
version     : "3.8.10"
release     : 30
summary     : Multi-format archive and compression library
license     : BSD-2-Clause
homepage    : https://www.libarchive.org
description : |
    Multi-format archive and compression library
upstreams   :
    - https://www.libarchive.org/downloads/libarchive-3.8.10.tar.gz:
        hash: a1bffbe5152cfe869751179e7b16648c87c461cb8c46eee75062efbe164cc57c
        unpack: false
        rename: libarchive.tar.gz
builddeps   :
    - pkgconfig(bzip2)
    - pkgconfig(ext2fs)
    - pkgconfig(libacl)
    - pkgconfig(libattr)
    - pkgconfig(libb2)
    - pkgconfig(libcrypto)
    - pkgconfig(liblz4)
    - pkgconfig(liblzma)
    - pkgconfig(libstone)
    - pkgconfig(libzstd)
    - pkgconfig(lzo2)
    - pkgconfig(zlib)
    - libxml2-static
tuning      :
    - lto: full
setup       : |
    mkdir libarchive libarchive-static
    # This could use tar if we needed to rebootstrap
    bsdtar-static -xf %(sourcedir)/libarchive.tar.gz --strip-components=1 -C libarchive
    bsdtar-static -xf %(sourcedir)/libarchive.tar.gz --strip-components=1 -C libarchive-static

    function libarchive_configure() {
        %patch %(pkgdir)/0001-Add-stone-read-support.patch
        %patch %(pkgdir)/0001-Exclude-boulder-broken-test.patch
        %patch %(pkgdir)/0002-autotools-fix-libxml2-linking.patch

        %reconfigure \
            --disable-rpath \
            --with-lzo2 \
            --with-libstone \
            "$@"
    }

    pushd libarchive
        libarchive_configure \
            --disable-static \
            --enable-shared
    popd

    # Statically link in libxml2 and libicu since those are the libraries most likely to change sonames
    # libstone doesn't yet have a stable ABI and it's not needed so don't bother supporting it here.
    pushd libarchive-static
        libarchive_configure \
            --enable-bsdcpio=static \
            --enable-static \
            --disable-bsdcat \
            --disable-bsdcpio \
            --disable-bsdunzip \
            --disable-shared \
            --without-libstone \
            LIBXML2_PC_LIBS="$(pkg-config --variable=libdir libxml-2.0)/libxml2.a $(pkg-config --variable=libdir icu-uc)/libicuuc.a $(pkg-config --variable=libdir icu-uc)/libicudata.a -lstdc++ -lm" \
            ac_cv_lib_xml2_xmlInitParser=yes
    popd
build       : |
    for i in libarchive-static libarchive; do
        cat ${i}/Makefile
        %ccache_zero
        env CCACHE_BASEDIR="${PWD}/${i}" %make -C ${i} V=1
        %ccache_stats
    done
install     : |
    %make_install -C libarchive-static

    # Preserve bsdtar-static
    mv %(installroot)/%(bindir)/bsdtar %(installroot)/%(bindir)/bsdtar-static

    %make_install -C libarchive

    ln -sv bsdtar.1 %(installroot)/%(mandir)/man1/bsdtar-static.1

    # We don't (yet) need libarchive.a for anything else
    rm -v %(installroot)/%(libdir)/libarchive.a
check       : |
    # Note, the test suite MUST succeed at all times

    # This skips a file descriptor test that fails in boulder. We may need to change how /tmp is mounted
    export SKIP_OPEN_FD_ERR_TEST=1

    %make -C libarchive check || (cat /tmp/*_test*/*.log && exit 1)
packages    :
    - "bsdtar":
        summary: Manipulate tape archives
        description: Manipulate tape archives
        paths:
            - /usr/bin/bsdtar
            - /usr/share/man/man1/bsdtar*

    - "bsdtar-static":
        summary: Manipulate tape archives - static version
        description: Manipulate tape archives - static version
        paths:
            - /usr/bin/bsdtar-static
            - /usr/share/man/man1/bsdtar-static*

    - "bsdcat":
        summary: Expand files to standard output
        description: Expand files to standard output
        paths:
            - /usr/bin/bsdcat
            - /usr/share/man/man1/bsdcat*

    - "bsdcpio":
        summary: Copy files to and from archives
        description: Copy files to and from archives
        paths:
            - /usr/bin/bsdcpio
            - /usr/share/man/man1/bsdcpio*

    - "bsdunzip":
        summary: Extract files from a ZIP archive
        description: Extract files from a ZIP archive
        paths:
            - /usr/bin/bsdunzip
            - /usr/share/man/man1/bsdunzip*
