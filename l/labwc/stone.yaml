name        : labwc
version     : "0.20.3"
release     : 4
upstreams   :
    - https://github.com/labwc/labwc/archive/refs/tags/0.20.3.tar.gz : 1e70a5b74f149c5b47da76063dbdf967c44b2d7b6e94d3fdf65f70fc252f65c9
homepage    : https://labwc.github.io/
license     : GPL-2.0-or-later
summary     : Labwc is a window-stacking compositor for wayland
description : |
    Labwc is a wlroots-based window-stacking compositor for wayland, inspired by openbox.
builddeps   :
    - binary(msgfmt)
    - binary(scdoc)
    - binary(wayland-scanner)
    - pkgconfig(cairo)
    - pkgconfig(glib-2.0)
    - pkgconfig(libdrm)
    - pkgconfig(libinput)
    - pkgconfig(libpng)
    - pkgconfig(librsvg-2.0)
    - pkgconfig(libsfdo-basedir)
    - pkgconfig(libsfdo-desktop)
    - pkgconfig(libsfdo-icon)
    - pkgconfig(libsystemd)
    - pkgconfig(libxml-2.0)
    - pkgconfig(pangocairo)
    - pkgconfig(pixman-1)
    - pkgconfig(wayland-client)
    - pkgconfig(wayland-cursor)
    - pkgconfig(wayland-protocols)
    - pkgconfig(wayland-server)
    - pkgconfig(wlroots)
    - pkgconfig(xcb)
    - pkgconfig(xcb-ewmh)
    - pkgconfig(xcb-icccm)
    - pkgconfig(xkbcommon)
    - pkgconfig(xwayland)
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install

    %install_dir %(installroot)%(docdir)/%(name)-session/
    echo "DEPRECATED" > %(installroot)%(docdir)/%(name)-session/README
packages:
    - "%(name)-core":
        summary: Core files for %(name)
        description: Core files for %(name)
        paths:
            - /usr/bin
            - /usr/share/doc
            - /usr/share/locale
            - /usr/share/man
            - /usr/share/xdg-desktop-portal
        rundeps:
            - binary(Xwayland)
            - xdg-desktop-portal-wlr

    - "%(name)":
        rundeps:
            - "%(name)-core"

    - "%(name)-session":
        rundeps:
            - "%(name)"
        paths:
            - /usr/share/doc/labwc-session/
