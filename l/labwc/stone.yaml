name        : labwc
version     : "0.20.2"
release     : 2
upstreams   :
    - https://github.com/labwc/labwc/archive/refs/tags/0.20.2.tar.gz : fae023b6fe022f7057556707a17cdb2d98e0138c5dffaedaa1dade975699f9e8
homepage    : https://labwc.github.io/
license     : GPL-2.0-or-later
summary     : Labwc is a window-stacking compositor for wayland
description : |
    Labwc is a wlroots-based window-stacking compositor for wayland, inspired by openbox.
builddeps   :
    - binary(msgfmt)
    - binary(scdoc)
    - binary(wayland-scanner)
    - pkgconfig(cairo)
    - pkgconfig(glib-2.0)
    - pkgconfig(libdrm)
    - pkgconfig(libinput)
    - pkgconfig(libpng)
    - pkgconfig(librsvg-2.0)
    - pkgconfig(libsfdo-basedir)
    - pkgconfig(libsfdo-desktop)
    - pkgconfig(libsfdo-icon)
    - pkgconfig(libsystemd)
    - pkgconfig(libxml-2.0)
    - pkgconfig(pangocairo)
    - pkgconfig(pixman-1)
    - pkgconfig(wayland-client)
    - pkgconfig(wayland-cursor)
    - pkgconfig(wayland-protocols)
    - pkgconfig(wayland-server)
    - pkgconfig(wlroots)
    - pkgconfig(xcb)
    - pkgconfig(xcb-ewmh)
    - pkgconfig(xcb-icccm)
    - pkgconfig(xkbcommon)
    - pkgconfig(xwayland)
rundeps     :
    - binary(Xwayland)
    - xdg-desktop-portal-wlr
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
packages:
    - "%(name)-session":
        summary: Session files for %(name)
        description: Session files for %(name)
        rundeps:
            - binary(labwc)
        paths:
            - /usr/share/icons
            - /usr/share/wayland-sessions
            - /usr/lib/systemd/user/labwc-session.target
