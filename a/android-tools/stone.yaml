name        : android-tools
version     : "37.0.0"
release     : 9
homepage    : https://developer.android.com/tools
upstreams   :
    - https://github.com/nmeum/android-tools/releases/download/37.0.0/android-tools-37.0.0.tar.xz : 2725d09f892a3a38e534429f47a321f58ecf6a3169caa42c915fb2cb7d46be0e
summary     : Android SDK Platform-Tools
description : |
    Android SDK Platform-Tools is a component for the Android SDK.
    It includes tools that interface with the Android platform, primarily adb and fastboot.
license     :
    - Apache-2.0
builddeps   :
    - pkgconfig(fmt)
    - pkgconfig(libbrotlicommon)
    - pkgconfig(liblz4)
    - pkgconfig(libpcre2-8)
    - pkgconfig(libusb-1.0)
    - pkgconfig(libzstd)
    - pkgconfig(protobuf)
    - pkgconfig(zlib)
    - protobuf-staticlib
setup       : |
    %patch %(pkgdir)/0001-ftbfs-protobuf-36.0.patch

    %cmake
build       : |
    %cmake_build
install     : |
    %cmake_install
