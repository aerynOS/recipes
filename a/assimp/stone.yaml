name        : assimp
version     : "6.0.6"
release     : 10
homepage    : https://www.assimp.org/
upstreams   :
    - https://github.com/assimp/assimp/archive/refs/tags/v6.0.6.tar.gz : 5f7ed412b76575621df0525a762b31da5874afff352b3a890c6308db4ac7204c
summary     : Open Asset Import Library
description : |
    A library to import and export various 3d-model-formats including scene-post-processing to generate missing render data.
license     : BSD-3-Clause
builddeps   :
    - pkgconfig(minizip)
    - pkgconfig(zlib)
setup       : |
    %cmake \
        -DASSIMP_BUILD_ASSIMP_TOOLS=ON \
        -DASSIMP_BUILD_ZLIB=OFF \
        -DASSIMP_WARNINGS_AS_ERRORS=OFF
build       : |
    %cmake_build
install     : |
    %cmake_install
tuning      :
    - lto : full
packages   :
    - "%(name)-devel":
        rundeps:
            - pkgconfig(minizip)
            - pkgconfig(zlib)
