name        : akonadi-import-wizard
version     : "26.08.3"
release     : 19
homepage    : https://invent.kde.org/pim/akonadi-import-wizard
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/akonadi-import-wizard-26.08.3.tar.xz : e1b71ef5de5f29b317d129dd1c3e3fa45386726050bf2d46ae03cd52b201a03c
summary     : Assistant to import PIM data from other applications into Akonadi
description : |
    Assistant to import PIM data from other applications into Akonadi for use in KDE PIM applications.
license     :
    - GFDL-1.2-or-later
    - GPL-2.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Archive)
    - cmake(KF6Config)
    - cmake(KF6Contacts)
    - cmake(KF6Crash)
    - cmake(KF6DBusAddons)
    - cmake(KF6DocTools)
    - cmake(KF6IconThemes)
    - cmake(KF6KIO)
    - cmake(KPim6Akonadi)
    - cmake(KPim6IdentityManagementCore)
    - cmake(KPim6MailCommon)
    - cmake(KPim6MailImporterAkonadi)
    - cmake(KPim6MailTransport)
    - cmake(KPim6MessageViewer)
    - cmake(KPim6PimCommonAkonadi)
    - cmake(Qt6Keychain)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-docs":
        paths:
            - /usr/share/doc
