name        : ant
version     : "1.10.18"
release     : 2
homepage    : https://ant.apache.org/
upstreams   :
    - https://dlcdn.apache.org/ant/binaries/apache-ant-1.10.18-bin.tar.gz:
        hash: b45db2fdd76d639301550930d33dd7bc672c9d4fdea0fe8cfd2e6a3518388d59
        rename: apache-ant-1.10.18.tar.gz
summary     : Java library and command-line tool for building software
description : |
    Apache Ant is a Java library and command-line tool whose mission is to
    drive processes described in build files as targets and extension points
    dependent upon each other. The main known usage of Ant is the build of
    Java applications.
license     : Apache-2.0
rundeps     :
    - binary(java-25)
install     : |
    _ant_home="%(datadir)/%(name)"

    %install_dir %(installroot)${_ant_home}
    cp -a bin etc lib %(installroot)${_ant_home}/

    # Remove Windows helpers
    rm -f %(installroot)${_ant_home}/bin/*.{bat,cmd}

    %install_exe %(pkgdir)/ant.sh %(installroot)%(bindir)/ant
