name        : automake
version     : "1.20"
release     : 11
homepage    : https://www.gnu.org/software/automake/
upstreams   :
    - https://ftp.gnu.org/gnu/automake/automake-1.20.tar.xz : f6f34dad4cbe395715762b0710f7c511e39bd5cf777e6b95818ccbecf7714248
summary     : Generate Makefile.in files
description : |
    GNU Automake is a tool for automatically generating Makefile.in files compliant with the GNU Coding Standards. Automake requires the use of GNU Autoconf.
license     : GPL-3.0-or-later
checkdeps   :
    # Various compression tests
    - binary(gzip)
    - binary(rst2html)
    - binary(tar)
    - binary(zstd)
tuning      :
    - lto
    - optimize: speed
setup       : |
    %configure
build       : |
    %make
install     : |
    %make_install
check       : |
    # Fail due to gnu-isms
    for test in "objcxx-deps.sh" "objcxx-minidemo.sh" "subobj-objname-clash"; do
        sed -e "s|t/$test||" \
            -i Makefile.in Makefile
    done

    # Multilib test related to cross-compilation. We don't support that yet so no need in bothering to figure out how to fix it
    for test in "contrib/t/multilib.sh"; do
        sed -e "s|$test||" \
            -i Makefile.in Makefile
    done

    # Unknown cause for failure, possibly uutils?
    for test in "t/install-sh-unittests-w.sh" "t/install-sh-unittests.sh"; do
        sed -e "s|$test||" \
            -i Makefile.in Makefile
    done

    # Error due to not running as root
    for test in "depcomp-auto.tap" "depcomp-cpp.tap" "depcomp-dashmstdout.tap" "depcomp-disabled.tap" "depcomp-gcc.tap"; do
        sed -e "s|t/$test||" \
            -i Makefile.in Makefile
    done

    %make check || (cat ./test-suite.log && exit 1)
packages    :
    - "%(name)":
        paths:
            - /usr/share/aclocal
        rundeps     :
            - binary(autoconf)
