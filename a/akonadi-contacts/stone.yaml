name        : akonadi-contacts
version     : "26.08.3"
release     : 22
homepage    : https://invent.kde.org/pim/akonadi-contacts
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/akonadi-contacts-26.08.3.tar.xz : debe3b4a2d8df00a42f3406d965e2edec8df3451981034984f223725fd0b9963
summary     : Libraries and daemons to implement Contact Management in Akonadi
description : |
    Libraries and daemons to implement Contact Management in Akonadi.
license     : LGPL-2.1-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Contacts)
    - cmake(KF6GuiAddons)
    - cmake(KF6I18n)
    - cmake(KF6IconThemes)
    - cmake(KF6KIO)
    - cmake(KF6Mime)
    - cmake(KF6Prison)
    - cmake(KF6TextUtils)
    - cmake(KF6TextWidgets)
    - cmake(KF6XmlGui)
    - cmake(KPim6Akonadi)
    - cmake(KPim6GrantleeTheme)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    # The KPim6AkonadiContact*Config.cmake files find_dependency() KPim6Akonadi, so consumers need it present
    - "%(name)-devel":
        rundeps:
            - cmake(KPim6Akonadi)
            - cmake(KPim6GrantleeTheme)
