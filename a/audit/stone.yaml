name        : audit
version     : 4.1.4
release     : 1
upstreams   :
    - https://github.com/linux-audit/audit-userspace/archive/refs/tags/v4.1.4.tar.gz : 8396544ea08c69b39f5c00027549394f2149b31c4a9e693097d6ce134f3ffe3d
homepage    : https://github.com/linux-audit/audit-userspace
license     :
    - GPL-2.0-or-later
    - LGPL-2.1-or-later
summary     : audit daemon and libraries
description : |
    Provides the auditd daemon and libraries for the CONFIG_AUDIT interface
builddeps   :
    - binary(bison)
    - binary(flex)
    - binary(swig)
    - pkgconfig(krb5-gssapi)
    - pkgconfig(ldap)
    - pkgconfig(libcap-ng)
    - pkgconfig(liburing)
    - pkgconfig(python3)
    # apparmor?
setup       : |
    # Autoconf fix for using clang
    # export CC_FOR_BUILD="$CC"

    %reconfigure \
        --enable-gssapi-krb5=yes \
        --with-io_uring \
        --with-nftables
build       : |
    %make
install     : |
    %make_install

    # We need static so that the build succeeds but we don't need to install them
    rm -v %(installroot)%(libdir)/*.a
packages    :
    - "%(name)-libs":
        summary: Dynamic library for libaudit
        description: Dynamic library for libaudit
        paths:
            - /usr/lib/libaudit.so.*
            - /usr/lib/libauparse.so.*
            - /usr/lib/libauplugin.so.*
            # audit.conf
            - /usr/share/man/man5/libaudit.conf.5*

    - "%(name)-libs-devel":
        summary: Dynamic library for libaudit - devel
        description: Dynamic library for libaudit - devel
        rundeps:
            - "%(name)-libs"
        paths:
            - /usr/include/
            - /usr/lib/pkgconfig/
            - /usr/share/aclocal/
            - /usr/lib/libaudit.so
            - /usr/lib/libauparse.so
            - /usr/lib/libauplugin.so
            - /usr/share/man/man3/

    - "python-%(name)":
        summary: Python bindings for libaudit
        description: Python bindings for libaudit
        rundeps:
            - python-libs
        paths:
            - /usr/lib/python3*/site-packages/

    - "%(name)-rules":
        summary: audit rules and utilities
        description: audit rules and utilities
        paths:
            - /usr/sbin/auditctl
            - /usr/sbin/augenrules
            - /usr/lib/systemd/system/audit-rules.service
            - /usr/share/audit-rules/
            - /usr/share/man/man8/auditctl.8*
            - /usr/share/man/man8/augenrules.8*
            - /usr/share/man/man7/audit.rules.7*

    - "audispd-plugins":
        summary: Plugins for the audit event dispatcher
        description: Plugins for the audit event dispatcher
        rundeps:
            - "%(name)"
        paths:
            - /usr/sbin/audisp-af_unix
            - /usr/sbin/audisp-filter
            - /usr/sbin/audisp-remote
            - /usr/sbin/audisp-syslog
            - /usr/share/man/man5/audisp-remote.conf.5*
            - /usr/share/man/man8/audisp-af_unix.8*
            - /usr/share/man/man8/audisp-filter.8*
            - /usr/share/man/man8/audisp-remote.8*
            - /usr/share/man/man8/audisp-syslog.8*

    - "audispd-plugins-zos":
        summary: z/OS plugin for the audit event dispatcher
        description: z/OS plugin for the audit event dispatcher
        rundeps:
            - "%(name)"
        paths:
            - /usr/sbin/audispd-zos-remote
            - /usr/share/man/man5/zos-remote.conf.5*
            - /usr/share/man/man8/audispd-zos-remote.8*
