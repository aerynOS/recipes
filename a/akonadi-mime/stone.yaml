name        : akonadi-mime
version     : "26.08.3"
release     : 28
homepage    : https://invent.kde.org/pim/akonadi-mime
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/akonadi-mime-26.08.3.tar.xz : 983f0984574bfdb3181f015f0358fa204a44df02c4d3abfe0390eff888700c4b
summary    : Akonadi Mime is a library that effectively bridges the type-agnostic API of the Akonadi client libraries and the domain-specific KMime library
description: |
    Akonadi Mime is a library that effectively bridges the type-agnostic API of the Akonadi client libraries and the domain-specific KMime library. It provides jobs, models and other helpers to make working with emails through Akonadi easier.
license     : LGPL-2.1-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6I18n)
    - cmake(KF6ItemModels)
    - cmake(KF6KIO)
    - cmake(KF6Mime)
    - cmake(KF6XmlGui)
    - cmake(KPim6Akonadi)
    - cmake(Qt6CorePrivate)
    - pkgconfig(libxslt)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    # KPim6AkonadiMimeConfig.cmake find_dependency()s KPim6Akonadi, so consumers need it present
    - "%(name)-devel":
        rundeps:
            - cmake(KPim6Akonadi)
