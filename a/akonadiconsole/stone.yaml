name        : akonadiconsole
version     : "26.08.1"
release     : 13
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.1/src/akonadiconsole-26.08.1.tar.xz : 5fa0c3bc487cc67f69a88d1dd5455250bece0f204ff4635edc5b145a0cfac8a2
homepage    : https://invent.kde.org/pim/akonadiconsole
license     :
    - GPL-2.0-or-later
    - GPL-3.0-only
    - LGPL-2.0-or-later
summary     : Akonadi management and debugging console
description : |
    Akonadi management and debugging console
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6CalendarCore)
    - cmake(KF6Completion)
    - cmake(KF6Config)
    - cmake(KF6Contacts)
    - cmake(KF6Crash)
    - cmake(KF6DBusAddons)
    - cmake(KF6DocTools)
    - cmake(KF6I18n)
    - cmake(KF6ItemModels)
    - cmake(KF6ItemViews)
    - cmake(KF6KIO)
    - cmake(KF6Mime)
    - cmake(KF6TextWidgets)
    - cmake(KF6WidgetsAddons)
    - cmake(KF6XmlGui)
    - cmake(KPim6Akonadi)
    - cmake(KPim6AkonadiContactWidgets)
    - cmake(KPim6AkonadiMime)
    - cmake(KPim6AkonadiSearch)
    - cmake(KPim6CalendarSupport)
    - cmake(KPim6Libkdepim)
    - cmake(KPim6MessageViewer)
    - cmake(xapian)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
