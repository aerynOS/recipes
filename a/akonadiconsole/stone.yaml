name        : akonadiconsole
version     : "26.08.3"
release     : 15
homepage    : https://invent.kde.org/pim/akonadiconsole
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/akonadiconsole-26.08.3.tar.xz : 94331e802ebb4dca2583544e17fe506ca8674b74861db5b4b2d718900ea8fc40
summary     : Akonadi management and debugging console
description : |
    Akonadi management and debugging console
license     :
    - GPL-2.0-or-later
    - GPL-3.0-only
    - LGPL-2.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6CalendarCore)
    - cmake(KF6Completion)
    - cmake(KF6Config)
    - cmake(KF6Contacts)
    - cmake(KF6Crash)
    - cmake(KF6DBusAddons)
    - cmake(KF6DocTools)
    - cmake(KF6I18n)
    - cmake(KF6ItemModels)
    - cmake(KF6ItemViews)
    - cmake(KF6KIO)
    - cmake(KF6Mime)
    - cmake(KF6TextWidgets)
    - cmake(KF6WidgetsAddons)
    - cmake(KF6XmlGui)
    - cmake(KPim6Akonadi)
    - cmake(KPim6AkonadiContactWidgets)
    - cmake(KPim6AkonadiMime)
    - cmake(KPim6AkonadiSearch)
    - cmake(KPim6CalendarSupport)
    - cmake(KPim6Libkdepim)
    - cmake(KPim6MessageViewer)
    - cmake(xapian)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
