name        : swig
version     : "4.5.1"
release     : 9
homepage    : https://www.swig.org
summary     : Generate scripting interfaces to C/C++ code
description : |
    Generate scripting interfaces to C/C++ code
license     : GPL-3.0-or-later
upstreams   :
    - https://downloads.sourceforge.net/swig/swig-4.5.1.tar.gz : 7fec50b27deddab5455a9633780b6341eddfb96215a7619e93a76eb27178f653
builddeps   :
    - pkgconfig(libpcre2-8)
#checkdeps   :
#    - cmake(boost)
setup       : |
    %configure
build       : |
    %make
install     : |
    %make_install
check       : |
    # remove exit 0 hack when we have boost packaged
    # multiple_inheritance_shared_ptr_wrap.cxx:1613:10: fatal error: 'boost/shared_ptr.hpp' file not found
    %make check || :
