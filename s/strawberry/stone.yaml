name        : strawberry
version     : "1.2.31"
release     : 17
homepage    : https://www.strawberrymusicplayer.org
upstreams   :
    - https://github.com/strawberrymusicplayer/strawberry/releases/download/1.2.31/strawberry-1.2.31.tar.xz : cffc0cd453f3126a930b9e67f547e54d9fde0c8754fdead8185d2b2f5c68c037
summary     : Strawberry is a audio player and music collection organizer.
description : |
    Strawberry is a audio player and music collection organizer. It is a fork of Clementine released in 2018 aimed at music collectors, audio enthusiasts and audiophiles.
license     : GPL-3.0-or-later
builddeps   :
    - cmake(Boost)
    - cmake(KDSingleApplication-qt6)
    - cmake(Qt6)
    - cmake(Qt6GuiPrivate)
    - cmake(Qt6LinguistTools)
    - pkgconfig(alsa)
    - pkgconfig(fftw3)
    - pkgconfig(gdk-pixbuf-2.0)
    - pkgconfig(gio-2.0)
    - pkgconfig(glib-2.0)
    - pkgconfig(gstreamer-1.0)
    - pkgconfig(gstreamer-app-1.0)
    - pkgconfig(gstreamer-audio-1.0)
    - pkgconfig(gstreamer-base-1.0)
    - pkgconfig(gstreamer-pbutils-1.0)
    - pkgconfig(gstreamer-tag-1.0)
    - pkgconfig(icu-uc)
    - pkgconfig(libcdio)
    - pkgconfig(libchromaprint)
    - pkgconfig(libebur128)
    - pkgconfig(libmtp)
    - pkgconfig(libpulse)
    - pkgconfig(libsecret-1)
    - pkgconfig(libsparsehash)
    - pkgconfig(sqlite3)
    - pkgconfig(taglib)
    - pkgconfig(uchardet)
    - pkgconfig(x11)
    - pkgconfig(xcb)
    - pkgconfig(xkbcommon)
    # libgpod-1.0
checkdeps   :
    - cmake(GTest)
rundeps     :
    - gstreamer-plugin-qt6
    - gstreamer-plugins-bad
    - gstreamer-plugins-good
setup       : |
    %cmake \
        -DENABLE_GPOD=OFF
build       : |
    %cmake_build
install     : |
    %cmake_install
# TODO: Enable checks
