name        : sshfs
version     : "3.7.7"
release     : 5
homepage    : https://github.com/libfuse/sshfs
upstreams   :
    - https://github.com/libfuse/sshfs/archive/refs/tags/sshfs-3.7.7.tar.gz : 3f2873a2b7e7bdd3179ce2a5ee00d219a043cbd75d5be42ccb9707123a90418f
summary     : A network filesystem client to connect to SSH servers
description : |
    SSHFS allows you to mount a remote filesystem using SFTP. Most SSH servers support and enable this SFTP access by default, so SSHFS is very simple to use - there's nothing to do on the server-side.
license     : GPL-2.0-only
builddeps   :
    - binary(rst2man)
    - pkgconfig(fuse3)
    - pkgconfig(glib-2.0)
rundeps     :
    - binary(sftp)
    - binary(ssh)
setup       : |
    %patch %(pkgdir)/man-fuse3.patch

    %meson
build       : |
    %meson_build
install     : |
    %meson_install
check       : |
    %meson_test --suite unit
