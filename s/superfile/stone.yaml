name        : superfile
version     : "1.6.1"
release     : 3
homepage    : https://superfile.dev/
upstreams   :
    - https://github.com/yorukot/superfile/archive/refs/tags/v1.6.1.tar.gz : cdca43cebee4b302104274084d67de31e244b4add39a247a76ab2ae3b255e7d6
summary     : Pretty fancy and modern terminal file manager
description : |
    Pretty fancy and modern terminal file manager
license     : MIT
networking  : true
setup       : |
    %go_mod
build       : |
    go build -v -o ./bin/spf
install     : |
    %install_bin bin/spf

    %install_file %(pkgdir)/spf.desktop -t %(installroot)%(datadir)/applications/
    %install_file website/public/logo.svg %(installroot)%(datadir)/icons/hicolor/scalable/apps/spf.svg
    %install_file %(pkgdir)/io.github.yorukot.superfile.metainfo.xml -t %(installroot)%(datadir)/metainfo/
# check     : |
# go test needs -trimpath dropped, HOME/TMPDIR on one fs for trash,
# binary(zoxide), and exiftool (not packaged) for TestGetMetadata.
