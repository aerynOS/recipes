name        : skopeo
version     : "1.25.1"
release     : 14
homepage    : https://github.com/containers/skopeo
upstreams   :
    - https://github.com/containers/skopeo/archive/refs/tags/v1.25.1.tar.gz : 8e889df322ec3d9457a2e3b61ba9fa77759dd81dac857514333fb3b837e98b65
summary     : Inspect container images and repositories on registries
description : |
    Command line utility to inspect images and repositories directly on Docker
    registries without the need to pull them
license     : Apache-2.0
builddeps   :
    - binary(go)
    - binary(go-md2man)
    - pkgconfig(glib-2.0)
    - pkgconfig(gpgme)
    - pkgconfig(libassuan)
    - pkgconfig(libbtrfsutil)
    - pkgconfig(sqlite3)
    - shadow-devel
rundeps     :
    - ca-certificates
    - containers-common
tuning      :
    - golang-modflags: false
setup       : |
    sed -i 's|.PHONY: bin/skopeo||' Makefile
    sed -i 's|-gcflags "$(GOGCFLAGS)"||' Makefile
build       : |
    export BUILDTAGS="containers_image_ostree_stub libsqlite3 libsubid"

    # The containers/image prefix has changed domain names so in order to ensure that we use the correct setting regardless of which one is used just use both
    %make bin/skopeo \
        EXTRA_LDFLAGS="-X github.com/containers/image/v5/signature.systemDefaultPolicyPath=%(datadir)/containers/policy.json \
                       -X go.podman.io/image/v5/signature.systemDefaultPolicyPath=%(datadir)/containers/policy.json"
    %make docs
install     : |
    %make_install PREFIX="%(prefix)"
