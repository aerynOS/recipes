name        : svt-av1
version     : "4.3.1"
release     : 10
homepage    : https://github.com/AOMediaCodec/SVT-AV1
upstreams   :
    - https://github.com/AOMediaCodec/SVT-AV1/archive/refs/tags/v4.3.1.tar.gz:
        hash: ad94f481cb74821af183f37f4533fc52324b76ffbd98ec7723e282bab0cf9fc4
        unpackdir: current

    # - https://github.com/AOMediaCodec/SVT-AV1/archive/refs/tags/v3.1.2.tar.gz:
    #     hash: 802e9bb2b14f66e8c638f54857ccb84d3536144b0ae18b9f568bbf2314d2de88
    #     unpackdir: compat
summary     : Scalable Video Technology for AV1 (SVT-AV1 Encoder)
description : |
    The Scalable Video Technology for AV1 (SVT-AV1 Encoder) is an AV1-compliant encoder library core.
license     :
    - AOMPL-1.0 # https://aomedia.org/license/patent-license/
    - BSD-2-Clause
builddeps   :
    - binary(nasm)
tuning      :
    - lto: full
setup      : |
    if [ -d ../compat ]; then
        pushd ../compat

        %cmake \
            -DBUILD_APPS=OFF
        popd
    fi

    %cmake \
        -DBUILD_APPS=OFF
build      : |
    if [ -d ../compat ]; then
        pushd ../compat
            %ccache_zero
            env CCACHE_BASEDIR="${PWD}" %cmake_build
            %ccache_stats
        popd
    fi

    %ccache_zero
    env CCACHE_BASEDIR="${PWD}" %cmake_build
    %ccache_stats
install    : |
    if [ -d ../compat ]; then
        pushd ../compat
        DESTDIR="${PWD}/tmp" cmake --install "%(builddir)" --verbose

        # Only copy the sonames
        %install_dir %(installroot)/%(libdir)
        find ${PWD}/tmp/%(libdir) -name "libSvtAv1Enc.so.*" -print -exec mv {} %(installroot)/%(libdir) \;
        popd
    fi

    %cmake_install
