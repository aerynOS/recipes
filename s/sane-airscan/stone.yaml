name        : sane-airscan
version     : "0.99.38"
release     : 1
homepage    : https://github.com/alexpevzner/sane-airscan
upstreams   :
    - https://github.com/alexpevzner/sane-airscan/archive/refs/tags/0.99.38.tar.gz : 1e5b3b8373141caa37bf42fe74ae1950de3ff15c84966d8a415485d334ba5507
summary     : SANE backend for AirScan (eSCL) and WSD document scanners
description : |
    SANE backend for MFP and document scanners that implements either eSCL (AirScan/AirPrint scanning) or WSD "driverless" scanning protocol.
license     :
    - GPL-2.0-or-later
builddeps   :
    - pkgconfig(avahi-client)
    - pkgconfig(gnutls)
    - pkgconfig(libjpeg)
    - pkgconfig(libpng)
    - pkgconfig(libtiff-4)
    - pkgconfig(libxml-2.0)
    - pkgconfig(sane-backends)
setup       : |
    %patch %(pkgdir)/0001-sane-airscan-Support-stateless-config.patch

    # Temporary workaround for https://github.com/alexpevzner/sane-airscan/issues/411
    export CFLAGS="$CFLAGS -fno-inline"
    %meson
build       : |
    # Temporary workaround for https://github.com/alexpevzner/sane-airscan/issues/411
    export CFLAGS="$CFLAGS -fno-inline"
    %meson_build
install     : |
    %meson_install

    %install_dir %(installroot)/%(vendordir)/sane
    mv -t %(installroot)/%(vendordir)/sane %(installroot)%(sysconfdir)/sane.d/*
    rmdir %(installroot)%(sysconfdir)/sane.d %(installroot)%(sysconfdir)
