name        : signon-kwallet-extension
version     : "26.08.1"
release     : 18
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.1/src/signon-kwallet-extension-26.08.1.tar.xz : d50f42b725e5d1bcb7c9e3caff77c2b9c835715567427e544c3824e484776ced
homepage    : https://kde.org/
license     : GPL-2.0-or-later
summary     : KWallet integration for signon framework
description : |
    KWallet integration for signon framework
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Wallet)
    - pkgconfig(SignOnExtension)
setup       : |
    %cmake_kf6 \
        -DBUILD_WITH_QT6=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
