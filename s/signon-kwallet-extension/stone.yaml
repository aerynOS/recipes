name        : signon-kwallet-extension
version     : "26.08.3"
release     : 20
homepage    : https://invent.kde.org/network/signon-kwallet-extension
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/signon-kwallet-extension-26.08.3.tar.xz : e80090087eddc7f823ac5647e290288e890bd6d2372aaeaa24ff17cecd0480a9
summary     : KWallet integration for signon framework
description : |
    KWallet integration for signon framework
license     : GPL-2.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Wallet)
    - pkgconfig(SignOnExtension)
setup       : |
    %cmake_kf6 \
        -DBUILD_WITH_QT6=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
