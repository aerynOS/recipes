name        : shfmt
version     : "3.14.0"
release     : 2
homepage    : https://github.com/mvdan/sh
upstreams   :
    - https://github.com/mvdan/sh/archive/refs/tags/v3.14.0.tar.gz : f193c946e2882c4fa04935cd583f60e2cab60344209bd982a3a5933c4192aad8
summary     : Shell formatter
description : Format shell programs
license     : 
    - BSD-3-Clause 
networking  : true
builddeps   :
    - binary(git)
    - binary(go)
    - binary(scdoc)
checkdeps   :
    - binary(man)
    # dbus-1 is required to make `man` work. For more info, see https://github.com/AerynOS/os-tools/issues/828
    - pkgconfig(dbus-1)
setup       : |
    %go_mod
build       : |
    go build ./cmd/shfmt
    scdoc < ./cmd/shfmt/shfmt.1.scd > shfmt.1
install     : |
    %install_bin shfmt
    %install_file shfmt.1 -t %(installroot)%(mandir)/man1
check       : |
    go test ./cmd/shfmt/
    man -M %(installroot)%(mandir) shfmt > /dev/null
