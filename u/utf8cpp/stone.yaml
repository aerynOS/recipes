name        : utf8cpp
version     : "4.2.0"
release     : 4
homepage    : https://github.com/nemtrif/utfcpp
upstreams   :
    - https://github.com/nemtrif/utfcpp/archive/refs/tags/v4.2.0.tar.gz : 54a8e96ea835a7359e8e53d03e30e9833d51350cc4615ff53f8449ef19ee46ab
summary     : UTF-8 with C++ in a Portable Way
description : |
    UTF-8 with C++ in a Portable Way
license     : BSL-1.0
setup       : |
    %cmake \
        -DUTF8CPP_ENABLE_TESTS=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
check       : |
    %cmake_test
packages    :
    - "%(name)":
        paths:
            - /usr/include/utf8cpp
