name        : utf8cpp
version     : "5.0.0"
release     : 6
homepage    : https://github.com/nemtrif/utfcpp
upstreams   :
    - https://github.com/nemtrif/utfcpp/archive/refs/tags/v5.0.0.tar.gz : 42c36e1ef1307b1186996e4644f9999970e26325670b99019f3408bf0d3c952a
summary     : UTF-8 with C++ in a Portable Way
description : |
    UTF-8 with C++ in a Portable Way
license     : BSL-1.0
setup       : |
    %cmake \
        -DUTF8CPP_ENABLE_TESTS=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
check       : |
    %cmake_test
packages    :
    - "%(name)":
        paths:
            - /usr/include/utf8cpp
