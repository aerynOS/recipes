name        : uv
version     : "0.13.6"
release     : 15
homepage    : https://docs.astral.sh/uv/
upstreams   :
    - https://github.com/astral-sh/uv/releases/download/0.13.6/source.tar.gz : 37af57c31f780488bce798b73fcd382949faef72e7a98a7e73fe0f24874ed924
summary     : An extremely fast Python package and project manager, written in Rust.
description : |
    An extremely fast Python package and project manager, written in Rust.
license     : Apache-2.0
builddeps   :
    - binary(make)
    - binary(maturin)
networking  : true
setup       : |
    %patch %(pkgdir)/downstream-bin.patch

    %cargo_fetch
build       : |
    maturin build %(options_cargo_release) --compatibility linux --out dist
    maturin build %(options_cargo_release) --compatibility linux --out dist -m crates/uv-build/Cargo.toml

    mkdir completions
    _uv="%(cargo_target_dir)/uv"

    $_uv --generate-shell-completion bash > completions/uv
    $_uv --generate-shell-completion zsh > completions/_uv
    $_uv --generate-shell-completion fish > completions/uv.fish
install     : |
    # Install python libs & binaries
    %pyproject_install
    %cargo_install uv uvx

    # Completions
    %install_file completions/uv -t %(installroot)%(bashcompletionsdir)
    %install_file completions/_uv -t %(installroot)%(zshcompletionsdir)
    %install_file completions/uv.fish -t %(installroot)%(fishcompletionsdir)
packages    :
    - "python-%(name)":
        rundeps:
            - "%(name)"
            - python-libs
        paths:
            - /usr/lib/python3*/site-packages/uv-*
            - /usr/lib/python3*/site-packages/uv/

    - "python-%(name)-build":
        rundeps:
            - python-libs
        paths:
            - /usr/bin/uv-build
            - /usr/lib/python3*/site-packages/uv_build-*
            - /usr/lib/python3*/site-packages/uv_build/
