name        : usbutils
version     : "020"
release     : 7
homepage    : https://github.com/gregkh/usbutils
upstreams   :
    - https://mirrors.edge.kernel.org/pub/linux/utils/usb/usbutils/usbutils-020.tar.xz : 20287d68fcd9ebb50a05ba0645a4af7583bd8dfc7307215ba121e4bc6d057aa1
summary     : USB utilities for Linux, including lsusb
description : |
    This is a collection of USB tools for use on Linux systems to query what type of USB devices are connected to the system.
license     :
    - GPL-2.0-or-later
builddeps   :
    - pkgconfig(libudev)
    - pkgconfig(libusb-1.0)
rundeps     :
    - hwdata
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
