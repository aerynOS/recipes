name        : union
version     : "6.8.2"
release     : 7
upstreams   :
    - https://download.kde.org/stable/plasma/6.8.2/union-6.8.2.tar.xz : a87b6cd9e04c7941d631cb0f243277aa84795738383e5153750a0ad1659e0353
homepage    : https://kde.org/plasma-desktop/
license     :
    - LGPL-2.1-only
    - LGPL-3.0-only
summary     : A Qt style supporting both QtQuick and QtWidgets
description : |
    A Qt style supporting both QtQuick and QtWidgets
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6ColorScheme)
    - cmake(KF6CoreAddons)
    - cmake(KF6GuiAddons)
    - cmake(KF6IconThemes)
    - cmake(KF6KirigamiPlatform)
    - cmake(Qt6ShaderTools)
    - cmake(cxx-rust-cssparser)
tuning      :
    - lto: full
    - optimize: speed
setup       : |
    %cmake_kf6 \
        -DBUILD_OUTPUT_QTWIDGETS=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
