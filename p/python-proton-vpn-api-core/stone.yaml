name        : python-proton-vpn-api-core
version     : "5.5.11"
release     : 1
homepage    : https://github.com/ProtonVPN/python-proton-vpn-api-core
upstreams   :
    - https://github.com/ProtonVPN/python-proton-vpn-api-core/archive/refs/tags/v5.5.11.tar.gz : 4a3f2692852fda9689c581b272a5a67ccc3dd078c757038e39067272e6635b83
