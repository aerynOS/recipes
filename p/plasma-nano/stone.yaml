name        : plasma-nano
version     : "6.8.3"
release     : 8
homepage    : https://kde.org/plasma-desktop/
upstreams   :
    - https://download.kde.org/stable/plasma/6.8.3/plasma-nano-6.8.3.tar.xz : 26f152fc174505de8ad02dfb7e5e4775b0bd817ff8cd87a2ae265ec8526434a9
summary     : KDE Plasma nano
description : |
    A minimal Plasma shell package intended for embedded devices
license     :
    - GPL-2.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Config)
    - cmake(KF6CoreAddons)
    - cmake(KF6I18n)
    - cmake(KF6ItemModels)
    - cmake(KF6Service)
    - cmake(KF6Svg)
    - cmake(KF6WindowSystem)
    - cmake(KWayland)
    - cmake(Plasma)
    - cmake(Qt6Core5Compat)
    - cmake(Qt6Qml)
    - cmake(Qt6Svg)
rundeps     :
    - libplasma
    - qt6-5compat
tuning      :
    - lto: full
    - optimize: speed
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
