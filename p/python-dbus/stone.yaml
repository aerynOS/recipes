name        : python-dbus
version     : "1.5.1"
release     : 5
homepage    : https://www.freedesktop.org/wiki/Software/DBusBindings/
upstreams   :
    - https://dbus.freedesktop.org/releases/dbus-python/dbus_python-1.5.1.tar.gz : 57423cf87d09b7d084f420b55b737fe654c33339b06df77945620d97795c6ac4
summary     : D-Bus module for Python
description : |
    Easy access to dbus from Python
license     : MIT
builddeps   :
    - pkgconfig(dbus-1)
    - pkgconfig(glib-2.0)
    - pkgconfig(python3)
    - python(pyproject-metadata)
setup      : |
    %meson
build      : |
    %meson_build
install    : |
    %meson_install
    %python_compile

    # 1.5+ no longer ships egg-info; install PKG-INFO so we still provide python(dbus-python)
    sitepkg=$(python -c 'import site; print(site.getsitepackages()[0])')
    %install_file PKG-INFO %(installroot)$sitepkg/dbus_python.egg-info/PKG-INFO
