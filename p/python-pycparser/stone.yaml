name        : python-pycparser
version     : "3.11"
release     : 7
homepage    : https://github.com/eliben/pycparser
upstreams   :
    - https://pypi.debian.net/pycparser/pycparser-3.11.tar.gz : d875f09c3507d00e1aba0eecc6dcadc1352f30fff09dc6bff2f1c2935e97c2bc
summary     : C parser and AST generator written in Python
description : |
    C parser and AST generator written in Python
license     : BSD-3-Clause
builddeps   :
    - python(setuptools)
rundeps     :
    - python-libs
checkdeps   :
    - binary(clang-cpp)
build       : |
    %pyproject_build
install     : |
    %pyproject_install
check       : |
    python -m unittest discover
