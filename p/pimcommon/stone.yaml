name        : pimcommon
version     : "26.08.3"
release     : 26
homepage    : https://invent.kde.org/pim/pimcommon
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/pimcommon-26.08.3.tar.xz : 76c76b6781779d9740eb39c283e71797a8bbf1e1c314e07d50019fcfa106d2ec
summary     : Common libraries for KDE PIM
description : |
    Pimcommon library, used by several KDE PIM applications
license     :
    - GPL-2.0-or-later
    - LGPL-2.1-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Archive)
    - cmake(KF6Codecs)
    - cmake(KF6Config)
    - cmake(KF6Contacts)
    - cmake(KF6ItemModels)
    - cmake(KF6JobWidgets)
    - cmake(KF6KCMUtils)
    - cmake(KF6KIO)
    - cmake(KF6NewStuff)
    - cmake(KF6Purpose)
    - cmake(KF6TextAutoCorrectionWidgets)
    - cmake(KF6XmlGui)
    - cmake(KPim6Akonadi)
    - cmake(KPim6AkonadiContactWidgets)
    - cmake(KPim6AkonadiSearch)
    - cmake(KPim6IMAP)
    - cmake(KPim6LdapWidgets)
    - cmake(KPim6Libkdepim)
    - cmake(PlasmaActivities)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    # KPim6PimCommonConfig.cmake find_dependency()s these, so consumers need them present
    - "%(name)-devel":
        rundeps:
            - cmake(KF6Completion)
            - cmake(KF6Config)
            - cmake(KF6Contacts)
            - cmake(KF6KIO)
            - cmake(KF6TextAddonsWidgets)
            - cmake(KF6TextAutoCorrectionWidgets)
            - cmake(KF6TextCustomEditor)
            - cmake(KPim6Akonadi)
            - cmake(KPim6AkonadiContactWidgets)
            - cmake(KPim6IMAP)
            - cmake(KPim6Libkdepim)
            - cmake(PlasmaActivities)
