name        : plasma-integration
version     : "6.8.3"
release     : 35
homepage    : https://kde.org/plasma-desktop/
upstreams   :
    - https://download.kde.org/stable/plasma/6.8.3/plasma-integration-6.8.3.tar.xz : e32e074d79159f584c3098de550a2de46142049234602dffd50596c574816e5b
summary     : Integration of Qt application with KDE workspaces
description : |
    Integration of Qt application with KDE workspaces
license     :
    - GPL-2.0-or-later
    - LGPL-2.1-only
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Config)
    - cmake(KF6ConfigWidgets)
    - cmake(KF6GuiAddons)
    - cmake(KF6I18n)
    - cmake(KF6IconThemes)
    - cmake(KF6KIO)
    - cmake(KF6Notifications)
    - cmake(KF6StatusNotifierItem)
    - cmake(KF6WindowSystem)
    - cmake(PlasmaWaylandProtocols)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6QuickControls2)
    - cmake(Qt6WaylandClient)
    - pkgconfig(wayland-client)
    - pkgconfig(xcursor)
    - font-hack
    - font-noto
    - font-noto-emoji
    - xdg-desktop-portal-kde
rundeps     :
    - breeze
    - breeze-cursor-theme
    - breeze-icons
    - font-hack
    - font-noto
    - font-noto-emoji
    - kf6-qqc2-desktop-style
    - xdg-desktop-portal-kde
tuning      :
    - lto: full
    - optimize: speed
setup       : |
    %cmake_kf6 \
        -DBUILD_QT5=OFF \
        -DBUILD_QT6=ON \
        -DCMAKE_DISABLE_FIND_PACKAGE_FontNotoSans=true \
        -DCMAKE_DISABLE_FIND_PACKAGE_FontNotoColorEmoji=true \
        -DCMAKE_DISABLE_FIND_PACKAGE_FontHack=true \
        -DCMAKE_DISABLE_FIND_PACKAGE_XDGDesktopPortalKDE=true
build       : |
    %cmake_build
install     : |
    %cmake_install
