name        : pkgconf
version     : "3.0.11"
release     : 19
summary     : Package compiler and linker metadata toolkit
license     : ISC
homepage    : https://gitea.treehouse.systems/ariadne/pkgconf
description : |
    Package compiler and linker metadata toolkit
upstreams   :
    - https://distfiles.ariadne.space/pkgconf/pkgconf-3.0.11.tar.gz: a3d4173954eeab43ccc9f48f2fff1dd73ea0303972587ca6d9201f0b4fa6f4ee
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
    ln -sf pkgconf %(installroot)/usr/bin/pkg-config
packages    :
    - "%(name)":
        paths:
            - /usr/share/aclocal/pkg.m4
