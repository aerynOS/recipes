name        : pkgconf
version     : "3.0.8"
release     : 16
summary     : Package compiler and linker metadata toolkit
license     : ISC
homepage    : https://gitea.treehouse.systems/ariadne/pkgconf
description : |
    Package compiler and linker metadata toolkit
upstreams   :
    - https://distfiles.ariadne.space/pkgconf/pkgconf-3.0.8.tar.gz: 154b255abcd6d337f497e60707cbfaa3f33e165202a231a5cb958a8167d5b4a0
setup       : |
    # 3.0.8 dist tarball is missing tests/api/test-util.c, which breaks meson setup.
    # Remove this patch when updating to 3.0.9 (or later with a fixed tarball).
    %patch %(pkgdir)/0001-meson-drop-broken-api-util-test.patch

    %meson
build       : |
    %meson_build
install     : |
    %meson_install
    ln -sf pkgconf %(installroot)/usr/bin/pkg-config
packages    :
    - "%(name)":
        paths:
            - /usr/share/aclocal/pkg.m4
