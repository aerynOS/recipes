name        : python-tomlkit
version     : "0.15.2"
release     : 2
homepage    : https://github.com/python-poetry/tomlkit
upstreams   :
    - https://pypi.debian.net/tomlkit/tomlkit-0.15.2.tar.gz : 83e32755ba1d20d9340bd069ee97e9f6232ba2346b63ffcba425de01f7e327a6
summary     : Style-preserving TOML library for Python
description : |
    TOML Kit is a 1.0.0-compliant TOML library. It includes a parser that preserves all comments, indentations, whitespace and internal element ordering, and makes them accessible and editable via an intuitive API.
license     : MIT
builddeps   :
    - python(poetry-core)
checkdeps   :
    - python(pytest)
rundeps     :
    - python-libs
build       : |
    %pyproject_build
install     : |
    %pyproject_install
check       : |
    PYTHONPATH="$PWD"/src pytest -vv
