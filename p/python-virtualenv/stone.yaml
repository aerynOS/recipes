name        : python-virtualenv
version     : "21.14.10"
release     : 13
homepage    : https://virtualenv.pypa.io/
upstreams:
  - https://pypi.debian.net/virtualenv/virtualenv-21.14.10.tar.gz: f733501a49404c91b5bb1d34d107073b8f4b93a9a1ddb7e9a950eb8ce60f38ad
license     : MIT
summary     : Tool to create isolated 'virtual' python environments
description : |
  virtualenv is a tool to create isolated python environments, allowing for easier management of versions and dependencies in Python applications.
builddeps   :
    - python(hatch-vcs)
    - python(hatchling)
rundeps     :
    - binary(python3)
    - python-pip-wheel
    - python-setuptools-wheel
setup       : |
    %patch %(pkgdir)/system-wheel.patch

    rm src/virtualenv/seed/wheels/embed/pip-*
    rm src/virtualenv/seed/wheels/embed/setuptools-*
build       : |
    %pyproject_build
install     : |
    %pyproject_install
#check      : |
    # TODO
