name        : python-pytest-mock
version     : "3.17.0"
release     : 3
homepage    : https://pytest-mock.readthedocs.io/en/latest/
upstreams   :
    - https://pypi.debian.net/pytest-mock/pytest_mock-3.17.0.tar.gz : e36576e0985e01027e999891e7a966c67822d40c89ef1b4c8b6e22737e3590b4
summary     : Thin-wrapper around the mock package for easier use with pytest
description : |
    This plugin installs a mocker fixture which is a thin-wrapper around the patching API provided by the mock package, but with the benefit of not having to worry about undoing patches at the end of a test.
license     : MIT
builddeps   :
    - python(setuptools)
    - python(setuptools-scm)
rundeps     :
    - python(pytest)
build       : |
    %pyproject_build
install     : |
    %pyproject_install
