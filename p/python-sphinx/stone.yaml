name        : python-sphinx
version     : "9.2.0"
release     : 6
homepage    : https://www.sphinx-doc.org
upstreams   :
    - https://pypi.debian.net/Sphinx/sphinx-9.2.0.tar.gz : 90470459f3cab15d9dfed146c71cf77694b0445df17b2e0e69059cb9f7fc9ee4
summary     : Python documentation generator
description : |
    Python documentation generator
license     : BSD-2-Clause
builddeps   :
    - binary(make)
    - python(alabaster)
    - python(babel)
    - python(docutils)
    - python(flit-core)
    - python(imagesize)
    - python(jinja2)
    - python(pygments)
    - python(requests)
    - python(roman-numerals)
    - python(snowballstemmer)
rundeps     :
    - binary(python3)
# checkdeps   :
#     - python(babel)
#     - python(docutils)
#     - python(imagesize)
#     - python(jinja2)
#     - python(pygments)
#     - python(pytest)
#     - python(requests)
#     - python(roman-numerals)
#     - python(snowballstemmer)
# TODO: needs defusedxml or whatever that is for tests
setup       : |
    %patch %(pkgdir)/contribhelp-optional.patch
build       : |
    %pyproject_build

    export PYTHONPATH="$PWD"

    cd doc
    make man SPHINXBUILD="python ../sphinx/cmd/build.py"
install     : |
    %pyproject_install

    cd doc
    %install_file _build/man/sphinx-*.1 -t %(installroot)%(mandir)/man1
