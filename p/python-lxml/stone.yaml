name        : python-lxml
version     : "6.1.2"
release     : 11
homepage    : https://lxml.de/
upstreams   :
    - https://pypi.debian.net/lxml/lxml-6.1.2.tar.gz : 1055241852f2b02068af4a625a5d32c087db193c12251928af2562ecd2239f18
summary     : XML and HTML with Python
description : |
    lxml is the most feature-rich and easy-to-use library for processing XML and HTML in the Python language. It's also very fast and memory friendly, just so you know.
license     :
    - BSD-3-Clause
    - MIT
    - GPL-2.0-or-later
    - ZPL-2.0
builddeps   :
    - binary(cython)
    - pkgconfig(libxml-2.0)
    - pkgconfig(libxslt)
    - python(setuptools)
rundeps     :
    - python-libs
build       : |
    export WITH_CYTHON=true
    %pyproject_build
install     : |
    %pyproject_install
