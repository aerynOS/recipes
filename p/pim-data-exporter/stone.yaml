name        : pim-data-exporter
version     : "26.08.3"
release     : 2
homepage    : https://apps.kde.org/pimdataexporter/
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/pim-data-exporter-26.08.3.tar.xz : be99b901df35031d0ff6b078aa681cbb475eab1df482a5744b27ba71a18485ba
summary     : Archive and restore PIM data
description : |
    Application to assist you with backing up and archiving PIM data, including the necessary configuration, for archival or transfer to another computer.
license     :
    - BSD-3-Clause
    - CC0-1.0
    - GFDL-1.2-or-later
    - GPL-2.0-or-later
    - LGPL-2.0-or-later
    - MIT
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Archive)
    - cmake(KF6CalendarCore)
    - cmake(KF6Config)
    - cmake(KF6Contacts)
    - cmake(KF6CoreAddons)
    - cmake(KF6Crash)
    - cmake(KF6DBusAddons)
    - cmake(KF6DocTools)
    - cmake(KF6I18n)
    - cmake(KF6IconThemes)
    - cmake(KF6ItemViews)
    - cmake(KF6KIO)
    - cmake(KF6Mime)
    - cmake(KF6Notifications)
    - cmake(KF6StatusNotifierItem)
    - cmake(KF6TextAddonsWidgets)
    - cmake(KF6TextCustomEditor)
    - cmake(KF6UserFeedback)
    - cmake(KF6WidgetsAddons)
    - cmake(KF6XmlGui)
    - cmake(KPim6Akonadi)
    - cmake(KPim6AkonadiMime)
    - cmake(KPim6IdentityManagementCore)
    - cmake(KPim6MailCommon)
    - cmake(KPim6MailTransport)
    - cmake(KPim6MessageComposer)
    - cmake(KPim6MessageCore)
    - cmake(KPim6MessageViewer)
    - cmake(KPim6PimCommonAkonadi)
rundeps     :
    - qt6-wayland
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-docs":
        paths:
            - /usr/share/doc
