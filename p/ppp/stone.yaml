name        : ppp
version     : "2.5.5"
release     : 10
homepage    : https://ppp.samba.org/
upstreams   :
    - https://download.samba.org/pub/ppp/ppp-2.5.5.tar.gz : 0ebbcfef906d16cfbb9cbdd19c0d92aa3df2fd8fdd29731f614c58d16a279aa5
summary     : Point-to-Point Protocol (PPP)
description : |
    ppp (Paul's PPP Package) is an open source package which implements the Point-to-Point Protocol (PPP) on Linux and Solaris systems.
license     :
    - BSD-3-Clause
    - GPL-2.0-or-later
builddeps   :
    - pkgconfig(libpcap)
    - pkgconfig(libsystemd)
    - pkgconfig(libxcrypt)
    - pkgconfig(openssl)
    - pkgconfig(pam)
setup       : |
    %patch %(pkgdir)/stateless.patch

    %configure \
        --enable-systemd
build       : |
    %make
install     : |
    %make_install

    %tmpfiles '# Create neccessary runtime directories'
    %tmpfiles 'd /etc/ppp 0755 root root -'
    %tmpfiles 'd /run/pppd/lock 0700 root root -'
    %tmpfiles 'd /var/log/ppp 0700 root root -'
check       : |
    %make check
