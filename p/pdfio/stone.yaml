name        : pdfio
version     : "1.6.6"
release     : 5
homepage    : https://www.msweet.org/pdfio
upstreams   :
    - https://github.com/michaelrsweet/pdfio/releases/download/v1.6.6/pdfio-1.6.6.tar.gz : be9790ff2e9f0b7052fca8e96f2fdb6ebac903910e7ed8e2d1de4b1e55a40a23
summary     : A simple C library for reading and writing PDF files
description : |
    A simple C library for reading and writing PDF files
license     : Apache-2.0
builddeps   :
    - pkgconfig(libpng)
    - pkgconfig(zlib)
setup       : |
    %configure \
        --disable-static \
        --enable-shared
build       : |
    %make \
        AR=${AR}
install     : |
    %make_install
packages    :
    - "%(name)-examples":
        paths:
            - /usr/share/doc/pdfio/examples/
