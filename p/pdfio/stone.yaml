name        : pdfio
version     : "1.6.7"
release     : 6
homepage    : https://www.msweet.org/pdfio
upstreams   :
    - https://github.com/michaelrsweet/pdfio/releases/download/v1.6.7/pdfio-1.6.7.tar.gz : 4ca478ed8399ec0176b7cb849fd9c368305f357a985d44301d669170496e432a
summary     : A simple C library for reading and writing PDF files
description : |
    A simple C library for reading and writing PDF files
license     : Apache-2.0
builddeps   :
    - pkgconfig(libpng)
    - pkgconfig(zlib)
setup       : |
    %configure \
        --disable-static \
        --enable-shared
build       : |
    %make \
        AR=${AR}
install     : |
    %make_install
packages    :
    - "%(name)-examples":
        paths:
            - /usr/share/doc/pdfio/examples/
