name        : presenterm
version     : "0.16.1"
release     : 1
homepage    : https://mfontanini.github.io/presenterm
upstreams   :
    - https://github.com/mfontanini/presenterm/archive/refs/tags/v0.16.1.tar.gz : 221258deae7204c65a55d3666aaea5fa157312b4196a59abc60ba4d363787c10
summary     : A markdown terminal slideshow tool
description : |
    Create presentations in markdown format and run them from 
    your terminal, with support for image and animated gifs, 
    highly customizable themes, code highlighting, exporting 
    presentations into PDF format, and plenty of other features.
license     : BSD-2-Clause
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    %cargo_install
check       : |
    %cargo_test
