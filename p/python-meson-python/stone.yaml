name        : python-meson-python
version     : "0.22.0"
release     : 5
homepage    : https://mesonbuild.com/meson-python/
upstreams   :
    - https://pypi.debian.net/meson-python/meson_python-0.22.0.tar.gz : 9c819d0d4efa746edadfaae4663c0e9c75659186ef7e5bab12330bfe22964dfc
summary     : Meson PEP 517 Python build backend
description : |
    meson-python is a Python build back-end built on top of the Meson build system. It enables using Meson for the configuration and build steps of Python packages.
license     : MIT
builddeps   :
    - binary(meson)
    - binary(ninja)
    - binary(patchelf)
    - binary(python)
    - python(packaging)
    - python(pyproject-metadata)
rundeps     :
    - binary(meson)
    - python-libs
setup       : |
    sed -e '/ninja/d' -i pyproject.toml
build       : |
    %pyproject_build
install     : |
    %pyproject_install
