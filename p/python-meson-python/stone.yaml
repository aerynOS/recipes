name        : python-meson-python
version     : "0.22.1"
release     : 6
homepage    : https://mesonbuild.com/meson-python/
upstreams   :
    - https://pypi.debian.net/meson-python/meson_python-0.22.1.tar.gz : 52c88628b0e5671592dc2306613fb5f6f3615fd24def059b9894f143b7f9a139
summary     : Meson PEP 517 Python build backend
description : |
    meson-python is a Python build back-end built on top of the Meson build system. It enables using Meson for the configuration and build steps of Python packages.
license     : MIT
builddeps   :
    - binary(meson)
    - binary(ninja)
    - binary(patchelf)
    - binary(python)
    - python(packaging)
    - python(pyproject-metadata)
rundeps     :
    - binary(meson)
    - python-libs
setup       : |
    sed -e '/ninja/d' -i pyproject.toml
build       : |
    %pyproject_build
install     : |
    %pyproject_install
