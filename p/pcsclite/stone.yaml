name        : pcsclite
version     : "2.5.4"
release     : 12
homepage    : https://pcsclite.apdu.fr
upstreams   :
    - https://github.com/LudovicRousseau/PCSC/archive/refs/tags/2.5.4.tar.gz : 86f5563806bd8d3992dd2d832e95f58c3eb7d6f78a9da7f12bbac304b1ec71d3
summary     : PC/SC implementation
description : |
    PC/SC implementation
license     :
    - BSD-3-Clause
    - GPL-3.0-or-later
    - BSD-2-Clause
    - 0BSD
builddeps   :
    - binary(doxygen)
    - binary(flex)
    - binary(pod2man)
    - pkgconfig(libsystemd)
    - pkgconfig(libudev)
    - pkgconfig(libusb-1.0)
    - pkgconfig(polkit-gobject-1)
    - pkgconfig(systemd)
setup       : |
    %meson \
        -Dsystemdunit=system
build       : |
    %meson_build
install     : |
    %meson_install
packages    :
    - "%(name)-libs":
        paths:
            - /usr/lib/libpcsclite.so.*
            - /usr/lib/libpcsclite_real.so.*
            - /usr/lib/libpcscspy.so.*

    - "%(name)":
        rundeps:
            - "%(name)-libs"
            - binary(python3) # pcsc-spy
