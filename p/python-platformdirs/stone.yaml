name        : python-platformdirs
version     : "4.14.8"
release     : 15
homepage    : https://platformdirs.readthedocs.io/en/latest/
upstreams   :
    - https://pypi.debian.net/platformdirs/platformdirs-4.14.8.tar.gz : 96893d686e84e9e6f358a9ea41a8de544df66dbf2ba6cda250e7dc73acf85b9b
summary     : A library to determine platform-specific system directories
description : |
    A library to determine platform-specific system directories
license     : MIT
builddeps   :
    - python(hatch-fancy-pypi-readme)
    - python(hatch-vcs)
    - python(hatchling)
    - python(python-sbom)
checkdeps   :
    - python(appdirs)
    - python(pytest)
    - python(pytest-mock)
rundeps     :
    - binary(python3)
build       : |
    %pyproject_build
install     : |
    %pyproject_install
check       : |
    # TODO replace with pytest macro
    # tests/test_pytest_plugin.py needs the plugin's pytest11 entry point, which
    # isn't registered when testing straight from the source tree.
    # tests/test_testing.py needs python-coverage (not packaged).
    # Site-dir mode/ensure_exists tests fail in the build chroot where /usr/local
    # is not a real directory.
    PYTHONPATH="$PWD"/src PYTEST_PLUGINS=platformdirs.pytest_plugin pytest \
        --ignore=tests/test_testing.py \
        --deselect=tests/test_api.py::test_system_site_dir_keeps_default_mode \
        --deselect=tests/test_unix.py::test_site_data_dir_default_ensure_exists_creates_only_the_first_entry
