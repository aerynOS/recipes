name        : python-platformdirs
version     : "4.13.4"
release     : 12
homepage    : https://platformdirs.readthedocs.io/en/latest/
upstreams   :
    - https://pypi.debian.net/platformdirs/platformdirs-4.13.4.tar.gz : dd96496961684a7f42041923f842ec7494e09f5e87aded99117e1109cd40570e
summary     : A library to determine platform-specific system directories
description : |
    A library to determine platform-specific system directories
license     : MIT
builddeps   :
    - python(hatch-vcs)
    - python(hatchling)
rundeps     :
    - binary(python3)
checkdeps   :
    - python(appdirs)
    - python(pytest)
    - python(pytest-mock)
build       : |
    %pyproject_build
install     : |
    %pyproject_install
check       : |
    # TODO replace with pytest macro
    # tests/test_pytest_plugin.py needs the plugin's pytest11 entry point, which
    # isn't registered when testing straight from the source tree.
    PYTHONPATH="$PWD"/src PYTEST_PLUGINS=platformdirs.pytest_plugin pytest
