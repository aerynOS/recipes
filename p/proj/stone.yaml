name        : proj
version     : "9.8.1"
release     : 1
homepage    : https://github.com/OSGeo/PROJ
upstreams   :
    - https://github.com/OSGeo/PROJ/releases/download/9.8.1/proj-9.8.1.tar.gz : af5b731c145c1d13c4e3b4eeb7d167e94e845e440f71e3496b4ed8dae0291960
