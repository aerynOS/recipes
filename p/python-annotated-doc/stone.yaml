name        : python-annotated-doc
version     : "0.0.6"
release     : 5
homepage    : https://github.com/fastapi/annotated-doc
upstreams   :
    - https://pypi.debian.net/annotated-doc/annotated_doc-0.0.6.tar.gz : 7969bb69912085b2285849c0dcac0b4b374fd180c13cf10a87f284ffcf347bbf
summary     : Document parameters, class attributes, return types, and variables inline
description : |
    Document parameters, class attributes, return types, and variables inline
license     : MIT
builddeps   :
    - python(pdm-backend)
checkdeps   :
    - python(pytest)
    - python(typer)
