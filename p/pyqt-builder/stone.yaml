name        : pyqt-builder
version     : "1.20.0"
release     : 4
homepage    : https://github.com/Python-PyQt/PyQt-builder
upstreams   :
    - https://pypi.debian.net/PyQt-builder/pyqt_builder-1.20.0.tar.gz : 267ac1ee1593c67884f3c9cb6566f72a92ca28353050fc9d087433c28c74a889
summary     : The PEP 517 compliant PyQt build system
description : |
    PyQt-builder is the PEP 517 compliant build system for PyQt and projects that extend PyQt. It extends the SIP build system and uses Qt's qmake, in conjunction with make, to perform the actual compilation and installation of extension modules.
license     : GPL-3.0-or-later
builddeps   :
    - python(setuptools)
    - python(setuptools-scm)
rundeps     :
    - binary(python3)
build       : |
    %pyproject_build
install     : |
    %pyproject_install
