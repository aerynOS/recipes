name        : procps
version     : "4.0.7"
release     : 9
homepage    : https://gitlab.com/procps-ng/procps
upstreams   :
    - https://sourceforge.net/projects/procps-ng/files/Production/procps-ng-4.0.7.tar.xz : 9d2021f47a4501c667862c9942a92d1953694b21d11bcd1702e83eb594e3d67d
summary     : Utilities for monitoring your system and its processes
description : |
    Utilities for monitoring your system and its processes
license     :
    - GPL-2.0-or-later
    - LGPL-2.0-or-later
builddeps   :
    - pkgconfig(libsystemd)
    - pkgconfig(ncursesw)
setup       : |
    # error: use of undeclared identifier 'e' when built with dash
    %configure_with_bash \
        --disable-static \
        --disable-kill \
        --disable-skill
build       : |
    %make V=1
install     : |
    %make_install V=1
