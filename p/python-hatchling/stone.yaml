name        : python-hatchling
version     : "1.33.0"
release     : 13
homepage    : https://pypi.org/project/hatchling/
upstreams   :
    - https://pypi.debian.net/hatchling/hatchling-1.33.0.tar.gz : 4c422bd4d554fcff5de5b73e9596f85e41e9f97f7e553d8f7595ecb31a627bef
summary     : Modern, extensible Python build backend
description : |
    Modern, extensible Python build backend, as used by Hatch
