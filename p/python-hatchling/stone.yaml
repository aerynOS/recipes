name        : python-hatchling
version     : "1.32.4"
release     : 12
homepage    : https://pypi.org/project/hatchling/
upstreams   :
    - https://pypi.debian.net/hatchling/hatchling-1.32.4.tar.gz : c4468f73144c054d2aab4ef0f0378c43b9878bf07f8ffd6b79690e970d375f07
summary     : Modern, extensible Python build backend
description : |
    Modern, extensible Python build backend, as used by Hatch
license     :
    - MIT
builddeps   :
    - python(packaging)
    - python(pathspec)
    - python(pluggy)
    - python(tomlkit)
    - python(trove-classifiers)
rundeps     :
    - binary(python3)
build       : |
    %pyproject_build
install     : |
    %pyproject_install
