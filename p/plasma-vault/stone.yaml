name        : plasma-vault
version     : "6.8.3"
release     : 8
homepage    : https://kde.org/plasma-desktop/
upstreams   :
    - https://download.kde.org/stable/plasma/6.8.3/plasma-vault-6.8.3.tar.xz : 98552279fa15995a1329455f42b8dd1e4397df9f3b95d8ffdfbd2255ce49ebe6
summary     : Plasma Vault
description : |
    Plasma applet and services for creating encrypted vaults
license     :
    - BSD-3-Clause
    - GPL-2.0-or-later
builddeps   :
    - binary(gocryptfs)
    - binary(python3)
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6CoreAddons)
    - cmake(KF6DBusAddons)
    - cmake(KF6I18n)
    - cmake(KF6ItemModels)
    - cmake(KF6KIO)
    - cmake(KF6Kirigami)
    - cmake(KF6NetworkManagerQt)
    - cmake(KSysGuard)
    - cmake(Plasma)
    - cmake(PlasmaActivities)
    - cmake(Qt6Quick)
    - pkgconfig(gio-2.0)
    - pkgconfig(libnm)
rundeps     :
    - binary(gocryptfs)
    - kf6-kirigami
tuning      :
    - lto: full
    - optimize: speed
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
