#     - python(flit-core)
#     - python(jsonschema-rs)
#     - python(license-expression)
#     - python(pdm)
#     - python(pytest)
#     - python(pytest-mock)
#     - python(spdx-tools)
rundeps     :
    - binary(python)
build       : |
    %pyproject_build
install     : |
    %pyproject_install
