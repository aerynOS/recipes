name        : plasma-activities-stats
version     : "6.8.3"
release     : 27
homepage    : https://kde.org/plasma-desktop/
upstreams   :
    - https://download.kde.org/stable/plasma/6.8.3/plasma-activities-stats-6.8.3.tar.xz : 88681ff26460d3498b966aa3d16f4b9ba60e5571408af6341b46f6da35ec141f
summary     : library for accessing the usage data collected by the activities system
description : |
    library for accessing the usage data collected by the activities system
license     :
    - GPL-2.0-only
    - GPL-2.0-or-later
    - GPL-3.0-only
    - LGPL-2.0-or-later
    - LGPL-2.1-only
    - LGPL-3.0-only
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Config)
    - cmake(PlasmaActivities)
tuning      :
    - lto: full
    - optimize: speed
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
