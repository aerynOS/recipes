name        : plasma-systemmonitor
version     : "6.8.3"
release     : 34
homepage    : https://kde.org/plasma-desktop/
upstreams   :
    - https://download.kde.org/stable/plasma/6.8.3/plasma-systemmonitor-6.8.3.tar.xz : f368f843bd0d9d0cd261cda627a98b404268fca6a7e15bad9f69d8e050b004ed
summary     : New version of KSysGuard built on top of the new KStats daemon and using QML for its UI
description : |
    New version of KSysGuard built on top of the new KStats daemon and using QML for its UI
license     : GPL-3.0-only
builddeps   :
    - binary(ksystemstats)
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Config)
    - cmake(KF6Crash)
    - cmake(KF6DBusAddons)
    - cmake(KF6GlobalAccel)
    - cmake(KF6I18n)
    - cmake(KF6ItemModels)
    - cmake(KF6KIO)
    - cmake(KF6Kirigami)
    - cmake(KF6KirigamiAddons)
    - cmake(KF6NewStuff)
    - cmake(KF6Package)
    - cmake(KF6Service)
    - cmake(KF6WindowSystem)
    - cmake(KSysGuard)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6Quick)
rundeps     :
    - binary(ksystemstats)
    - kf6-kiconthemes
    - kf6-kirigami
    - kf6-kirigami-addons
    - kf6-kquickcharts
tuning      :
    - lto: full
    - optimize: speed
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)":
        paths:
            - /usr/lib/*.so
