name        : plasma-foreground-booster-dmemcg
version     : "0.2"
release     : 1
homepage    : https://github.com/pixelcluster/kcgroups
upstreams   :
    - https://github.com/pixelcluster/kcgroups/archive/refs/tags/booster-dmemcg-experimental-0.2.tar.gz : 837ed0a5bbacf4c5a321d89319ac8f176c4de6612938fb1c24c044db7787eaff
summary     : Foreground app CPU weight booster
description : |
    Foreground app CPU weight booster utilizing dmem cgroup
license     : LGPL-2.1-or-later
networking  : true
builddeps   :
    - cmake(ECM)
    - cmake(KF5CGroups)
    - cmake(KF6Config)
    - cmake(KF6DBusAddons)
    - cmake(LibTaskManager)
rundeps:
    - binary(dmemcg-booster)
    - tzdata
setup       : |
    %cmake \
    -DCMAKE_BUILD_TYPE=RelWithDebInfo
build       : |
    %cmake_build
install     : |
    %cmake_install
