name        : protontricks
version     : "1.15.0"
release     : 7
upstreams   :
    - https://pypi.debian.net/protontricks/protontricks-1.15.0.tar.gz : f40422d4a6c98db7b451d487039070b3c4eaa14767ba7b7b193bfa5a0feed20a
homepage    : https://github.com/Matoking/protontricks
license     : GPL-3.0-or-later
summary     : A simple wrapper that does winetricks things for Proton enabled games
description : |
    A simple wrapper that does winetricks things for Proton enabled games
builddeps   :
    - python(setuptools)
    - python(setuptools-scm)
rundeps     :
    - binary(winetricks)
    - binary(zenity)
    # TODO: Use YAD instead of zenity
setup       : |
    # Remove vendored vdf
    %patch %(pkgdir)/drop-vendored-vdf.patch -R
    rm -rf ./src/protontricks/_vdf
build       : |
    %pyproject_build
install     : |
    %pyproject_install
