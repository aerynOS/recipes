name        : python-httplib2
version     : "0.32.1"
release     : 7
homepage    : https://github.com/httplib2/httplib2
upstreams   :
    - https://github.com/httplib2/httplib2/archive/refs/tags/v0.32.1.tar.gz : 2f46228aeac064b85b877dcad6cfaceb8a2a8e54a77084c666109ab5cfae643e
summary     : Small, fast HTTP client library for Python
description : |
    Small, fast HTTP client library for Python. Features persistent connections, cache, Appengine support.
license     : MIT
builddeps   :
    - python(setuptools)
rundeps     :
    - python-libs
setup       : |
    %patch %(pkgdir)/system-certs.patch
build       : |
    %pyproject_build
install     : |
    %pyproject_install
