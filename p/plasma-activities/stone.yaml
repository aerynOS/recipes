name        : plasma-activities
version     : "6.8.2"
release     : 35
upstreams   :
    - https://download.kde.org/stable/plasma/6.8.2/plasma-activities-6.8.2.tar.xz : 5dfb5ac7658c0315f26fe8bd3cec4abd5c74ba1db34f6ec17c49cc24646938f4
homepage    : https://kde.org/plasma-desktop/
license     : GPL-2.0-or-later
summary     : Core components for the KDE Activity concept
description : |
    Core components for the KDE Activity concept
builddeps   :
    - cmake(Boost)
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Config)
    - cmake(KF6CoreAddons)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6Qml)
tuning      :
    - lto: full
    - optimize: speed
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
