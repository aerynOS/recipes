name        : polkit-kde-agent
version     : "6.8.3"
release     : 27
homepage    : https://kde.org/plasma-desktop/
upstreams   :
    - https://download.kde.org/stable/plasma/6.8.3/polkit-kde-agent-1-6.8.3.tar.xz : 59abbe4c339966f5961daf0f7151b29b67d749c4f7e78e821af287ea96cab4b3
summary     : Daemon providing a polkit authentication for KDE
description : |
    Daemon providing a polkit authentication for KDE
license     : GPL-2.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6CoreAddons)
    - cmake(KF6Crash)
    - cmake(KF6DBusAddons)
    - cmake(KF6I18n)
    - cmake(KF6Notifications)
    - cmake(KF6WindowSystem)
    - cmake(PolkitQt6-1)
    - cmake(Qt6Quick)
rundeps     :
    - kf6-kirigami
tuning      :
    - lto: full
    - optimize: speed
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
