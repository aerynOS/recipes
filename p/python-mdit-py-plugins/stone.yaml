name        : python-mdit-py-plugins
version     : "0.7.0"
release     : 6
homepage    : https://github.com/executablebooks/mdit-py-plugins
upstreams   :
    # The pypi source doesn't include the tests https://github.com/executablebooks/mdit-py-plugins/issues/97
    - https://github.com/executablebooks/mdit-py-plugins/archive/refs/tags/v0.7.0.tar.gz : 81fac1e870ae6a2cf8c7cbe9dfb6bf906a5eaafe5902497ca4b1b7c459e8ee65
summary     : Collection of core plugins for markdown-it-py
description : |
    Collection of core plugins for markdown-it-py
license     : MIT
builddeps   :
    - python(flit-core)
rundeps     :
    - python-libs
# checkdeps   :
#     - python(markdown-it-py)
#     - python(pytest)
# TODO: Needs python-pytest-regressions for tests
setup       : |
    # Workaround for flit-core 4
    %patch %(pkgdir)/flit-core-4.patch
build       : |
    %pyproject_build
install     : |
    %pyproject_install
# check       : |
#     # TODO replace with pytest macro
#     PYTHONPATH="$PWD" pytest
