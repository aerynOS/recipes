name        : plasma-bigscreen
version     : "6.8.3"
release     : 11
homepage    : https://kde.org/plasma-desktop/
upstreams   :
    - https://download.kde.org/stable/plasma/6.8.3/plasma-bigscreen-6.8.3.tar.xz : 11d1c1c2e613013af049ccce9f5e4a2c238d91052e33bef3ec613708f4cfbec7
summary     : Plasma shell for TVs
description : |
    Plasma shell for TVs
license     : GPL-2.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6BluezQt)
    - cmake(KF6ColorScheme)
    - cmake(KF6Config)
    - cmake(KF6DBusAddons)
    - cmake(KF6GlobalAccel)
    - cmake(KF6I18n)
    - cmake(KF6IconThemes)
    - cmake(KF6KCMUtils)
    - cmake(KF6KIO)
    - cmake(KF6Kirigami)
    - cmake(KF6Notifications)
    - cmake(KF6Screen)
    - cmake(KF6Svg)
    - cmake(KF6WindowSystem)
    - cmake(LibKWorkspace)
    - cmake(LibTaskManager)
    - cmake(Plasma)
    - cmake(Plasma5Support)
    - cmake(PlasmaActivities)
    - cmake(PlasmaActivitiesStats)
    - cmake(PlasmaWaylandProtocols)
    - cmake(QCoro6)
    - cmake(Qt6Core5Compat)
    - cmake(Qt6Multimedia)
    - cmake(Qt6Qml)
    - cmake(Qt6WaylandClient)
    - cmake(Qt6WaylandGlobalPrivate)
    - cmake(Qt6WebEngineCore)
    - cmake(SDL3)
    - pkgconfig(libcec)
    - pkgconfig(systemd)
    - kdeconnect
rundeps     :
    # https://bugs.kde.org/show_bug.cgi?id=522585
    - kdeconnect
    - kf6-kirigami
    - plasma-nano
    - plasma-workspace
    - qqc2-breeze-style
    - qt6-5compat
    - systemd # systemd-logind uaccess ACLs for uinput devices
tuning      :
    - lto: full
    - optimize: speed
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
