name        : pahole
version     : "1.32"
release     : 5
upstreams   :
    - https://fedorapeople.org/~acme/dwarves/dwarves-1.32.tar.xz : 319cbf319e9fc92065a5407ce47eb868d73566f3d4840a56832734e4579df947
homepage    : https://git.kernel.org/pub/scm/devel/pahole/pahole.git
license     : GPL-2.0-only
summary     : Pahole and other DWARF utils
description : |
    Pahole and other DWARF utils
builddeps   :
    # - pkgconfig(libbpf)
    - pkgconfig(libdw)
    - pkgconfig(libelf)
    - pkgconfig(zlib)
setup       : |
    %patch %(pkgdir)/cxx-dialects-lang-exclude.patch
    %patch %(pkgdir)/dwarf-atomic.patch

    # Re-enable libbpf in next update
    %cmake \
        -DLIBBPF_EMBEDDED=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
