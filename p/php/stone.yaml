name        : php
version     : "8.5.12"
release     : 24
homepage    : https://www.php.net/
upstreams   :
    - https://www.php.net/distributions/php-8.5.12.tar.xz : 08bc2eba2a588654ade1357174aa646b761556c862dda0678345ee29ed481209
summary     : PHP is a popular general-purpose scripting language
description : |
    PHP is a popular general-purpose scripting language that is especially suited to web development.
license     : PHP-3.01
builddeps   :
    - binary(bison)
    - binary(gawk)
    - pkgconfig(bzip2)
    - pkgconfig(enchant-2)
    - pkgconfig(gdlib)
    - pkgconfig(gmp)
    - pkgconfig(icu-uc)
    - pkgconfig(ldap)
    - pkgconfig(libargon2)
    - pkgconfig(libcurl)
    - pkgconfig(libexslt)
    - pkgconfig(libffi)
    - pkgconfig(libmariadb)
    - pkgconfig(libpcre2-8)
    - pkgconfig(libpq)
    - pkgconfig(libsasl2)
    - pkgconfig(libsodium)
    - pkgconfig(libssl)
    - pkgconfig(libxml-2.0)
    - pkgconfig(libzip)
    - pkgconfig(lmdb)
    - pkgconfig(odbc)
    - pkgconfig(oniguruma)
    - pkgconfig(readline)
    - pkgconfig(sqlite3)
    - pkgconfig(tidy)
    - pkgconfig(valgrind)
    - pkgconfig(zlib)
    - gdbm-devel
tuning      :
    - lto: false # Causes a clang segfault
    - optimize: speed
environment : |
    export EXTENSION_DIR=%(libdir)/php/extensions
setup       : |
    # TODO: Setup users/integration for php-fpm
    %configure \
        --libdir=%(libdir)/php \
        --enable-bcmath=shared \
        --enable-calendar=shared \
        --enable-dba=shared \
        --enable-exif=shared \
        --enable-gd \
        --enable-intl=shared \
        --enable-mbstring \
        --enable-pcntl \
        --enable-shmop=shared \
        --enable-sockets=shared \
        --with-bz2=shared \
        --with-curl=shared \
        --with-enchant=shared \
        --with-external-gd \
        --with-external-pcre \
        --with-ffi=shared \
        --with-gdbm \
        --with-gettext=shared \
        --with-gmp=shared \
        --with-iconv=shared \
        --with-ldap=shared \
        --with-ldap-sasl \
        --with-lmdb \
        --with-mysql-sock=/var/lib/mysql/mysqld.sock \
        --with-openssl \
        --with-openssl-argon2 \
        --with-password-argon2 \
        --with-pdo-mysql=shared \
        --with-pdo-odbc=shared,unixODBC \
        --with-pdo-pgsql=shared \
        --with-pdo-sqlite=shared \
        --with-pgsql=shared \
        --with-readline \
        --with-sodium=shared \
        --with-tidy=shared \
        --with-unixODBC=shared \
        --with-xsl=shared \
        --with-zip=shared \
        --with-zlib
build       : |
    %make
install     : |
    %make_install INSTALL_ROOT=%(installroot)
packages    :
    - "%(name)-devel":
        paths:
            - /usr/bin/php-config
            - /usr/lib/php/build
            - /usr/share/man/man1/php-config.1*
# TODO eventually we'll want to split out some of the extensions to subpackages
