name        : python-mdurl
version     : "0.1.2"
release     : 4
homepage    : https://github.com/executablebooks/mdurl
upstreams   :
    - https://pypi.debian.net/mdurl/mdurl-0.1.2.tar.gz : bb413d29f5eea38f31dd4754dd7377d4465116fb207585f97bf925588687c1ba
summary     : Markdown URL utilities
description : |
    This is a Python port of the JavaScript mdurl package.
license     : MIT
builddeps   :
    - python(flit-core)
rundeps     :
    - python-libs
# checkdeps   :
#     - python(pytest)
setup       : |
    # Workaround for flit-core 4
    %patch %(pkgdir)/flit-core-4.patch
build       : |
    %pyproject_build
install     : |
    %pyproject_install
