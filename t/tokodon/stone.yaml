name        : tokodon
version     : "26.08.3"
release     : 2
homepage    : https://apps.kde.org/tokodon/
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/tokodon-26.08.3.tar.xz : 7acb526269d92aec26526aa182c18d2080188ddc8444addb0fff2606ff43c52c
summary     : Mastodon and Fediverse client
description : |
    A modern client for Mastodon and other decentralized servers that implement its API (such as Pixelfed).
license     :
    - AGPL-3.0-or-later
    - BSD-2-Clause
    - BSD-3-Clause
    - CC-BY-SA-4.0
    - CC0-1.0
    - GPL-2.0-only
    - GPL-2.0-or-later
    - GPL-3.0-only
    - GPL-3.0-or-later
    - LGPL-2.0-or-later
    - LGPL-2.1-only
    - LGPL-2.1-or-later
    - LGPL-3.0-only
    - MIT
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6ColorScheme)
    - cmake(KF6Config)
    - cmake(KF6CoreAddons)
    - cmake(KF6Crash)
    - cmake(KF6DBusAddons)
    - cmake(KF6I18n)
    - cmake(KF6KIO)
    - cmake(KF6Kirigami)
    - cmake(KF6KirigamiAddons)
    - cmake(KF6KirigamiPlatform)
    - cmake(KF6Notifications)
    - cmake(KF6Purpose)
    - cmake(KF6QQC2DesktopStyle)
    - cmake(KF6WindowSystem)
    - cmake(KUnifiedPush)
    - cmake(QCoro6)
    - cmake(Qt6CorePrivate)
    # - cmake(Qt6HttpServer) # required for the autotests
    - cmake(Qt6Keychain)
    - cmake(Qt6Multimedia)
    - cmake(Qt6Quick)
    - cmake(Qt6QuickControls2)
    - cmake(Qt6Svg)
    - cmake(Qt6WebSockets)
    - cmake(Qt6WebView)
    - pkgconfig(openssl)
rundeps     :
    - kf6-kirigami
    - kf6-kitemmodels
    - kf6-qqc2-desktop-style
    - kf6-sonnet
    - qt6-wayland
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
