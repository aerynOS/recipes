name        : tclap
version     : "1.6.0"
release     : 3
homepage    : https://tclap.sourceforge.net/
upstreams   :
    - https://downloads.sourceforge.net/project/tclap/v1.6.0/tclap-1.6.0.tar.gz : 2ed4bb7655cb4feb7a0432311f1194875bf2d61d6624bf3e513fa101cb0bcb10
summary     : Small, flexible library that provides a simple interface for defining and accessing command line arguments.
description : |
    small, flexible library that provides a simple interface for defining and accessing command line arguments.
license     : MIT
setup       : |
    %cmake \
        -DBUILD_DOC=OFF \
        -DBUILD_EXAMPLES=OFF \
        -DBUILD_TESTING=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
check       : |
    %cmake_test
packages    :
    # Headers only package
    - "%(name)" :
        paths :
            - /*
