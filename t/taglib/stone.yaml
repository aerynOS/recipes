name        : taglib
version     : "2.3.2"
release     : 9
homepage    : https://taglib.org/
upstreams   :
    - https://github.com/taglib/taglib/releases/download/v2.3.2/taglib-2.3.2.tar.gz : 3ca2d8afaa7f1cf7f6ed10e511ebc368bfacd6dcaa3dbfa690b89e502e8963dc
summary     : Library to read metadata from a variety of multimedia formats
description : |
    TagLib is a library for reading and editing the meta-data of several popular
    audio formats. Currently it supports both ID3v1 and ID3v2 for MP3 files, Ogg
    Vorbis comments and ID3 tags and Vorbis comments in FLAC, MPC, Speex, WavPack
    TrueAudio, WAV, AIFF, MP4 and ASF files.
license     :
    - LGPL-2.1-or-later
    - MPL-1.1
builddeps   :
    - cmake(utf8cpp)
    - pkgconfig(zlib)
checkdeps   :
    - pkgconfig(cppunit)
setup       : |
    %cmake \
        -DBUILD_SHARED_LIBS=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
check       : |
    %cmake_test
packages    :
    - "%(name)-devel":
        paths:
            - /usr/bin/taglib-config
