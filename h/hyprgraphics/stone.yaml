name        : hyprgraphics
version     : "0.7.0"
release     : 8
upstreams   :
    - https://github.com/hyprwm/hyprgraphics/archive/refs/tags/v0.7.0.tar.gz : fea19225b0bf46912e8a78f3ab35aa1680f5517c6c207b997ac4b4f088de1a02
homepage    : https://github.com/hyprwm/hyprgraphics
license     : BSD-3-Clause
summary     : Hyprland graphics / resource utilities
description : |
    Hyprgraphics is a small C++ library with graphics / resource related utilities used across the hypr* ecosystem.
builddeps   :
    - pkgconfig(cairo)
    - pkgconfig(hyprutils)
    - pkgconfig(libdrm)
    - pkgconfig(libheif)
    - pkgconfig(libjpeg)
    - pkgconfig(libjxl)
    - pkgconfig(libmagic)
    - pkgconfig(libpng)
    - pkgconfig(librsvg-2.0)
    - pkgconfig(libwebp)
    - pkgconfig(opengl)
    - pkgconfig(pangocairo)
    - pkgconfig(pixman-1)
setup       : |
    %cmake
build       : |
    %cmake_build
install     : |
    %cmake_install
