name        : hyprgraphics
version     : "0.6.0"
release     : 6
upstreams   :
    - https://github.com/hyprwm/hyprgraphics/archive/refs/tags/v0.6.0.tar.gz : 27e9e19ff59ba75a2963d72c3dcb5c0840b266b90d7fca6d5df7cac105419b08
homepage    : https://github.com/hyprwm/hyprgraphics
license     : BSD-3-Clause
summary     : Hyprland graphics / resource utilities
description : |
    Hyprgraphics is a small C++ library with graphics / resource related utilities used across the hypr* ecosystem.
builddeps   :
    - pkgconfig(cairo)
    - pkgconfig(hyprutils)
    - pkgconfig(libdrm)
    - pkgconfig(libheif)
    - pkgconfig(libjpeg)
    - pkgconfig(libjxl)
    - pkgconfig(libmagic)
    - pkgconfig(librsvg-2.0)
    - pkgconfig(libwebp)
    - pkgconfig(opengl)
    - pkgconfig(pangocairo)
    - pkgconfig(pixman-1)
setup       : |
    %cmake
build       : |
    %cmake_build
install     : |
    %cmake_install
