name        : hyprlauncher
version     : "0.1.7"
release     : 7
upstreams   :
    - https://github.com/hyprwm/hyprlauncher/archive/refs/tags/v0.1.7.tar.gz : 66a8b893c13fbf6c523bdf2974ef65101a0ca94f25e020f4f53f043470418340
homepage    : https://github.com/hyprwm/hyprlauncher
license     : BSD-3-Clause
summary     : A multipurpose and versatile launcher / picker for Hyprland
description : |
    Hyprland launcher build with hyprtoolkit
    Features:
    - Various providers: Desktop, Unicode, Emoji, Math ...
    - Speedy: Fast, multi-threaded fuzzy searching
    - Daemon by default: instant opening of the launcher
    - Entry frequency caching: commonly used entries appear above others
builddeps   :
    - pkgconfig(fontconfig)
    - pkgconfig(hyprlang)
    - pkgconfig(hyprtoolkit)
    - pkgconfig(hyprutils)
    - pkgconfig(hyprwire)
    - pkgconfig(icu-uc)
    - pkgconfig(libdrm)
    - pkgconfig(libqalculate)
    - pkgconfig(pixman-1)
    - pkgconfig(xkbcommon)
setup       : |
    %cmake
build       : |
    %cmake_build
install     : |
    %cmake_install
