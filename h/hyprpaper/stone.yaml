name        : hyprpaper
version     : "0.8.5"
release     : 5
upstreams   :
    - https://github.com/hyprwm/hyprpaper/archive/refs/tags/v0.8.5.tar.gz : d5868931dc485fd2e798717ce885bc62abd1e00796ff921f31e1903147bff3bf
homepage    : https://github.com/hyprwm/hyprpaper
license     : BSD-3-Clause
summary     : A blazing fast wallpaper utility for Hyprland
description : |
    Hyprpaper is a blazing fast wallpaper utility for Hyprland with the ability to dynamically change wallpapers through sockets. It will work on all wlroots-based compositors, though.
builddeps   :
    - pkgconfig(hyprlang)
    - pkgconfig(hyprtoolkit)
    - pkgconfig(hyprutils)
    - pkgconfig(hyprwayland-scanner)
    - pkgconfig(hyprwire)
    - pkgconfig(libdrm)
    - pkgconfig(libmagic)
    - pkgconfig(opengl)
    - pkgconfig(pixman-1)
    - pkgconfig(wayland-client)
    - pkgconfig(wayland-protocols)
setup       : |
    %cmake
build       : |
    %cmake_build
install     : |
    %cmake_install
