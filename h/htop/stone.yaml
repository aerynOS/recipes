name        : htop
version     : "3.5.3"
release     : 12
homepage    : https://htop.dev/
upstreams   :
    - https://github.com/htop-dev/htop/releases/download/3.5.3/htop-3.5.3.tar.xz : a8b164386494cb85bb255a415a3f5f80afe7a0c4491da5d113b3a0f951087e65
summary     : Interactive process viewer
description : |
    htop is an interactive process viewer that can show detailed information
    about CPU & memory usage on the console
license     : GPL-2.0-or-later
builddeps   :
    - pkgconfig(hwloc)
    - pkgconfig(libcap)
    - pkgconfig(libnl-3.0)
    - pkgconfig(ncursesw)
    - lm_sensors-devel
rundeps     :
    - lm_sensors
setup       : |
    %configure \
        --enable-hwloc \
        --enable-unicode
build       : |
    %make
install     : |
    %make_install
