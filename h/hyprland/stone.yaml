name        : hyprland
version     : "0.57.1"
release     : 18
homepage    : https://hypr.land/
upstreams   :
    - https://github.com/hyprwm/Hyprland/releases/download/v0.57.1/source-v0.57.1.tar.gz : 24e7428f83115e58e5fc81f100f6b73691dcaaf7a503087391e44327a71c43ab
summary     : Hyprland is a 100% independent, dynamic tiling Wayland compositor that doesn't sacrifice on its looks.
description : |
    Hyprland is a 100% independent, dynamic tiling Wayland compositor that doesn't sacrifice on its looks. It provides the latest Wayland features, is highly customizable, has all the eyecandy, the most powerful plugins, easy IPC, much more QoL stuff than other compositors and more...
license     : BSD-3-Clause
builddeps   :
    - binary(python3)
    - cmake(glaze)
    - cmake(glslang)
    - pkgconfig(aquamarine)
    - pkgconfig(cairo)
    - pkgconfig(gbm)
    - pkgconfig(gio-2.0)
    - pkgconfig(hyprcursor)
    - pkgconfig(hyprgraphics)
    - pkgconfig(hyprland-protocols)
    - pkgconfig(hyprlang)
    - pkgconfig(hyprutils)
    - pkgconfig(hyprwayland-scanner)
    - pkgconfig(hyprwire)
    - pkgconfig(lcms2)
    - pkgconfig(libcanberra)
    - pkgconfig(libdrm)
    - pkgconfig(libeis-1.0)
    - pkgconfig(libinput)
    - pkgconfig(lua)
    - pkgconfig(muparser)
    - pkgconfig(opengl)
    - pkgconfig(pango)
    - pkgconfig(pangocairo)
    - pkgconfig(pixman-1)
    - pkgconfig(re2)
    - pkgconfig(readline)
    - pkgconfig(sdbus-c++)
    - pkgconfig(tomlplusplus)
    - pkgconfig(uuid)
    - pkgconfig(wayland-protocols)
    - pkgconfig(wayland-scanner)
    - pkgconfig(wayland-server)
    - pkgconfig(xcb-errors)
    - pkgconfig(xcb-icccm)
    - pkgconfig(xcursor)
    - pkgconfig(xkbcommon)
    # libinotify
rundeps     :
    - hyprland-guiutils
    - xdg-desktop-portal-gtk
    - xdg-desktop-portal-hyprland
setup       : |
    rm -rf subprojects/hyprland-protocols
    %cmake
build       : |
    %cmake_build
install     : |
    %cmake_install
