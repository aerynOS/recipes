name        : hyperfine
version     : "2.0.0"
release     : 9
homepage    : https://github.com/sharkdp/hyperfine
upstreams   :
    - https://github.com/sharkdp/hyperfine/archive/refs/tags/v2.0.0.tar.gz : f4b71df3c78e4cf752ca6fb6ebc4b025f7ea6a5ca5c48fea75f8a1fdb4c7d721
summary     : A command-line benchmarking tool
description : |
    A command-line benchmarking tool.
license     :
    - Apache-2.0
    - MIT
networking  : true
setup       : |
    %cargo_fetch
build       : |
    export SHELL_COMPLETIONS_DIR=%(workdir)/completions
    %cargo_build
install     : |
    %cargo_install

    %install_file doc/hyperfine.1 %(installroot)%(mandir)/man1/hyperfine.1
    %install_file completions/hyperfine.bash %(installroot)%(bashcompletionsdir)/hyperfine
    %install_file completions/hyperfine.fish %(installroot)%(fishcompletionsdir)/hyperfine.fish
    %install_file completions/_hyperfine %(installroot)%(zshcompletionsdir)/_hyperfine
    %install_file completions/hyperfine.elv %(installroot)%(elvishcompletionsdir)/hyperfine.elv
check       : |
    %cargo_test
