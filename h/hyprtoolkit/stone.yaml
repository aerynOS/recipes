name        : hyprtoolkit
version     : "0.6.0"
release     : 10
upstreams   :
    - https://github.com/hyprwm/hyprtoolkit/archive/refs/tags/v0.6.0.tar.gz : 53c41be72af97d9ede274a63c9c1034c58726d862905763ed6e5a564ae42ba6b
homepage    : https://github.com/hyprwm/hyprtoolkit
license     : BSD-3-Clause
summary     : A modern C++ Wayland-native GUI toolkit
description : |
    Hyprtoolkit is designed to be a small, simple, and modern C++ toolkit for making wayland GUI apps, with a few goals:
    - Simple C++ API for making a GUI app
    - Smooth animations
    - Easy usage
    - Simple system theming
builddeps   :
    - pkgconfig(absl_flat_hash_map)
    - pkgconfig(aquamarine)
    - pkgconfig(cairo)
    - pkgconfig(gbm)
    - pkgconfig(hyprgraphics)
    - pkgconfig(hyprlang)
    - pkgconfig(hyprutils)
    - pkgconfig(hyprwayland-scanner)
    - pkgconfig(iniparser)
    - pkgconfig(libdrm)
    - pkgconfig(opengl)
    - pkgconfig(pango)
    - pkgconfig(pixman-1)
    - pkgconfig(wayland-client)
    - pkgconfig(wayland-protocols)
    - pkgconfig(xkbcommon)
setup       : |
    %cmake
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-devel":
        rundeps:
            - pkgconfig(aquamarine)
            - pkgconfig(hyprgraphics)
