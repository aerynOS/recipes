name        : hyprtoolkit
version     : "0.7.0"
release     : 11
upstreams   :
    - https://github.com/hyprwm/hyprtoolkit/archive/refs/tags/v0.7.0.tar.gz : 7dc82a531537fd068f51110fa49c4cab01f3419d9e2cb8c2c2f2e8c49e26bcde
homepage    : https://github.com/hyprwm/hyprtoolkit
license     : BSD-3-Clause
summary     : A modern C++ Wayland-native GUI toolkit
description : |
    Hyprtoolkit is designed to be a small, simple, and modern C++ toolkit for making wayland GUI apps, with a few goals:
    - Simple C++ API for making a GUI app
    - Smooth animations
    - Easy usage
    - Simple system theming
builddeps   :
    - pkgconfig(absl_flat_hash_map)
    - pkgconfig(aquamarine)
    - pkgconfig(cairo)
    - pkgconfig(gbm)
    - pkgconfig(hyprgraphics)
    - pkgconfig(hyprlang)
    - pkgconfig(hyprutils)
    - pkgconfig(hyprwayland-scanner)
    - pkgconfig(iniparser)
    - pkgconfig(libdrm)
    - pkgconfig(opengl)
    - pkgconfig(pango)
    - pkgconfig(pixman-1)
    - pkgconfig(wayland-client)
    - pkgconfig(wayland-protocols)
    - pkgconfig(xkbcommon)
setup       : |
    %cmake
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-devel":
        rundeps:
            - pkgconfig(aquamarine)
            - pkgconfig(hyprgraphics)
