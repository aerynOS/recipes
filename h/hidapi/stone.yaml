name        : hidapi
version     : "0.16.0"
release     : 7
homepage    : https://libusb.info/hidapi/
upstreams   :
    - https://github.com/libusb/hidapi/archive/refs/tags/hidapi-0.16.0.tar.gz : bc599d295792fe515778f19ce86a49760b0ea5fc114e5258245d470609632bbf
summary     : A Simple cross-platform library for communicating with HID devices
description : |
    HIDAPI is a multi-platform library which allows an application to interface
    with USB and Bluetooth HID-Class devices.
license     : GPL-3.0-or-later OR BSD-3-Clause
builddeps   :
    - pkgconfig(libudev)
    - pkgconfig(libusb-1.0)
setup       : |
    %cmake
build       : |
    %cmake_build
install     : |
    %cmake_install
