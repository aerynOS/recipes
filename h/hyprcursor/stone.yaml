name        : hyprcursor
version     : "0.1.14"
release     : 3
upstreams   :
    - https://github.com/hyprwm/hyprcursor/archive/refs/tags/v0.1.14.tar.gz : f835995a1225ab169723d5e4e7510e31231dbb3048c4da6de6f6a51794e4cb38
homepage    : https://github.com/hyprwm/hyprcursor
license     : BSD-3-Clause
summary     : The hyprland cursor format, library and utilities.
description : |
    The hyprland cursor format, library and utilities.
builddeps   :
    - cmake(libzip)
    - cmake(tomlplusplus)
    - pkgconfig(cairo)
    - pkgconfig(hyprlang)
    - pkgconfig(librsvg-2.0)
setup       : |
    %cmake
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-devel":
        paths:
            - /usr/bin/hyprcursor-util
