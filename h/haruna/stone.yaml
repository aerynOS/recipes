name        : haruna
version     : "1.9.0"
release     : 21
homepage    : https://invent.kde.org/multimedia/haruna/
upstreams   :
    - https://download.kde.org/stable/haruna/1.9.0/haruna-1.9.0.tar.xz : cb8b2a58ff394379d3d60d9b24f30e192df4b850bd9b2449df3a4333403da647
summary     : Video player built with Qt/QML on top of libmpv
description : |
    Video player built with Qt/QML on top of libmpv
license     :
    - BSD-3-Clause
    - CC-BY-4.0
    - CC-BY-SA-4.0
    - GPL-2.0-or-later
    - GPL-3.0-or-later
builddeps   :
    - cmake(Breeze)
    - cmake(ECM)
    - cmake(KDSingleApplication-qt6)
    - cmake(KF6ColorScheme)
    - cmake(KF6Config)
    - cmake(KF6CoreAddons)
    - cmake(KF6Crash)
    - cmake(KF6FileMetaData)
    - cmake(KF6I18n)
    - cmake(KF6IconThemes)
    - cmake(KF6KIO)
    - cmake(KF6Kirigami)
    - cmake(KF6WindowSystem)
    - cmake(MpvQt)
    - cmake(Qt6Core5Compat)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6Qml)
    - cmake(Qt6ShaderTools)
    - pkgconfig(libavcodec)
    - pkgconfig(libavdevice)
    - pkgconfig(libavfilter)
    - pkgconfig(libavformat)
    - pkgconfig(libavutil)
    - pkgconfig(libswscale)
rundeps     :
    - breeze-icons # Default icon theme
    - kf6-kirigami # QML dep
    - kf6-kitemmodels # QML dep
    - kf6-qqc2-desktop-style # QML dep
    - qt6-wayland
    - yt-dlp # Online video playback
tuning      :
    - lto: full
    - optimize: speed
setup       : |
    %cmake \
        -DCMAKE_SKIP_INSTALL_RPATH=ON
build       : |
    %cmake_build
install     : |
    %cmake_install

    # Cleaning icons with non-standard resolution
    for i in 44 150 310; do
        rm -rf %(installroot)/usr/share/icons/hicolor/"${i}x${i}"
    done
