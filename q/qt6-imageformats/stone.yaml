name        : qt6-imageformats
version     : "6.12.1"
release     : 12
homepage    : https://www.qt.io
upstreams   :
    - https://download.qt.io/official_releases/qt/6.12/6.12.1/submodules/qtimageformats-everywhere-src-6.12.1.tar.xz : 20a40732228cf0734c5b2335d4a816c1cab97dcdcc6d13073c0b1065e1c6c608
summary     : Qt6 plugins for additional image formats
description : |
    The core Qt Gui library by default supports reading and writing image files of the most common file formats and a few more. The Qt Image Formats add-on module provides optional support for other image file formats.
license     :
    - GFDL-1.3-or-later
    - GPL-3.0-or-later
    - LGPL-3.0-or-later
builddeps   :
    - cmake(Qt6CorePrivate)
    - pkgconfig(jasper)
    - pkgconfig(libtiff-4)
    - pkgconfig(libwebp)
    # TODO: libmng
setup       : |
    %cmake_qt6 \
        -DQT_FEATURE_jasper=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
