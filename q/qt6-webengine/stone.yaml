name        : qt6-webengine
version     : "6.140.0"
release     : 38
homepage    : https://www.qt.io
upstreams   :
    - https://download.qt.io/development_releases/qtwebengine/6.140.0-rc/qtwebengine-everywhere-src-6.140.0-rc.tar.xz: 61257967afd9803a1db6403e86ea25c4efff8fad479bda365a9d81bfd709f621

### Manage the chromium source separately so it can be updated separately from the Qt version
### To update this run the ./update-chromium.py script
# Don't edit anything between the BEGIN_UPSTREAMS and END_UPSTREAMS tags
##@@BEGIN_UPSTREAMS
    - git|https://invent.kde.org/qt/qt/qtwebengine-chromium.git:
        ref: d69c434a9f56bed724258838563be52170cfcf00
##@@END_UPSTREAMS
summary     : Qt6 Webengine Module
description : |
    The Qt WebEngine module provides a web browser engine that makes it easy to embed content from the World Wide Web into your Qt application on platforms that do not have a native web engine.
license     :
    - GFDL-1.3-or-later
    - GPL-3.0-or-later
    - LGPL-3.0-or-later
builddeps   :
    - binary(bindgen)
    - binary(bison)
    - binary(flex)
    - binary(gperf)
    - binary(llvm-config-23)
    - binary(nasm)
    - binary(node)
    - binary(perl)
    - binary(python3)
    - binary(readelf)
    - binary(rustc)
    - cmake(Clang)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6Designer)
    - cmake(Qt6Positioning)
    - cmake(Qt6Quick)
    - cmake(Qt6Svg)
    - cmake(Qt6WebChannel)
    - cmake(Qt6WebSockets)
    - pkgconfig(alsa)
    - pkgconfig(epoxy)
    - pkgconfig(expat)
    - pkgconfig(fontconfig)
    - pkgconfig(gbm)
    - pkgconfig(harfbuzz)
    - pkgconfig(icu-i18n)
    - pkgconfig(krb5)
    - pkgconfig(lcms2)
    - pkgconfig(libavcodec)
    - pkgconfig(libavformat)
    - pkgconfig(libdrm)
    - pkgconfig(libjpeg)
    - pkgconfig(libopenjp2)
    - pkgconfig(libpci)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libpng)
    - pkgconfig(libpulse)
    - pkgconfig(libtiff-4)
    - pkgconfig(libva)
    - pkgconfig(libwebp)
    - pkgconfig(libxslt)
    - pkgconfig(minizip)
    - pkgconfig(nss)
    - pkgconfig(openh264)
    - pkgconfig(opus)
    - pkgconfig(re2)
    - pkgconfig(snappy)
    # - pkgconfig(vpx) # Disabled if VA-API used
    - pkgconfig(x11)
    - pkgconfig(xcomposite)
    - pkgconfig(xcursor)
    - pkgconfig(xdamage)
    - pkgconfig(xi)
    - pkgconfig(xkbfile)
    - pkgconfig(xrandr)
    - pkgconfig(xshmfence)
    - pkgconfig(xtst)
    - python(html5lib)
setup       : |
    # Use the version of Chromium we downloaded
    rm -rf src/3rdparty/{chromium,gn}
    cp -ra %(sourcedir)/qtwebengine-chromium.git/chromium src/3rdparty/
    cp -ra %(sourcedir)/qtwebengine-chromium.git/gn src/3rdparty/

    %patch %(pkgdir)/disable-spellchecker-demo.patch

    # 3rdparty patches
    %patch %(pkgdir)/qtwebengine-link-pipewire.patch -d src/3rdparty

    # https://chromium-review.googlesource.com/c/v8/v8/+/8548134
    # https://github.com/v8/v8/commit/f607706
    # https://github.com/Homebrew/homebrew-core/blob/main/Patches/node/icu4c-79.patch
    %patch %(pkgdir)/icu4c-79.patch -d src/3rdparty/chromium/v8

    # backports

    # TODO: fix webengine_rust_build=ON which might be due to missing PTY support in boulder
    %cmake_qt6 \
        -DQT_FEATURE_webengine_system_ffmpeg=ON \
        -DQT_FEATURE_webengine_system_icu=ON \
        -DQT_FEATURE_webengine_system_libevent=ON \
        -DQT_FEATURE_webengine_system_libxml=ON \
        -DQT_FEATURE_webengine_system_minizip=ON \
        -DQT_FEATURE_webengine_system_pulseaudio=ON \
        -DQT_FEATURE_webengine_system_re2=ON \
        -DQT_FEATURE_webengine_system_zlib=ON \
        -DQT_FEATURE_webengine_proprietary_codecs=ON \
        -DQT_FEATURE_webengine_kerberos=ON \
        -DQT_FEATURE_webengine_rust_build=OFF \
        -DQT_FEATURE_webengine_spellchecker=ON \
        -DQT_FEATURE_webengine_vaapi=ON \
        -DQT_FEATURE_webengine_webrtc=ON \
        -DQT_FEATURE_webengine_webrtc_pipewire=ON \
        -DQT_FEATURE_pdf_v8=ON \
        -DINSTALL_GN=OFF
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "qt6-pdf":
        summary: Qt6 - QtPdf components
        description: Qt6 - QtPdf components
        paths:
            - /usr/lib/libQt6Pdf*.so.*
            - /usr/lib/qt6/plugins/imageformats/libqpdf.so
            - /usr/lib/qt6/qml/QtQuick/Pdf

    - "qt6-pdf-demos":
        paths:
            - /usr/lib/qt6/examples/pdf*

    - "qt6-pdf-devel":
        summary: Qt6 - QtPdf components - Devel
        description: Qt6 - QtPdf components - Devel
        rundeps:
            - "qt6-pdf"
        paths:
            - /usr/include/qt6/QtPdf*
            - /usr/lib/cmake/Qt6Gui/Qt6QPdf*
            - /usr/lib/cmake/Qt6Pdf*
            - /usr/lib/cmake/Qt6Qml/QmlPlugins/Qt6Pdf*
            - /usr/lib/libQt6Pdf*.prl
            - /usr/lib/libQt6Pdf*.so
            - /usr/lib/pkgconfig/Qt6Pdf*.pc
            - /usr/lib/qt6/metatypes/qt6pdf*
            - /usr/lib/qt6/mkspecs/modules/qt_lib_pdf*
            - /usr/lib/qt6/modules/Pdf*
            - /usr/lib/qt6/sbom/qtpdf*

    - "%(name)-devtools":
        summary: WebEngine devtools_resources
        description: WebEngine devtools_resources
        rundeps:
            - "%(name)"
        paths:
            - /usr/share/qt6/resources/qtwebengine_devtools_resources.pak
