name        : qpdf
version     : "12.4.0"
release     : 8
homepage    : https://qpdf.sf.net
upstreams   :
    - https://github.com/qpdf/qpdf/releases/download/v12.4.0/qpdf-12.4.0.tar.gz : 2783a032f443cc886dad41aa6d5fae3dabf23dec00ee7ec2cfb27ef67ebcf529
summary     : Command-line tools and library for transforming PDF files
description : |
    Command-line tools and library for transforming PDF files
license     : Apache-2.0
builddeps   :
    - pkgconfig(libjpeg)
    - pkgconfig(libssl)
    - pkgconfig(zlib)
setup       : |
    %cmake \
        -DBUILD_STATIC_LIBS=OFF
build       : |
    %cmake_build
install     : |
    %cmake_install

    # Completions
    %install_file completions/bash/qpdf %(installroot)%(bashcompletionsdir)/qpdf
    %install_file completions/zsh/_qpdf %(installroot)%(zshcompletionsdir)/_qpdf
packages    :
    - "%(name)-libs":
        paths:
            - /usr/lib/libqpdf.so.*

    - "%(name)-docs":
        paths:
            - /usr/share/doc/qpdf
