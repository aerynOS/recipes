name        : qqc2-breeze-style
version     : "6.8.3"
release     : 9
homepage    : https://kde.org/plasma-desktop/
upstreams   :
    - https://download.kde.org/stable/plasma/6.8.3/qqc2-breeze-style-6.8.3.tar.xz : 73501d76471781d1205c6f8e094cadbe9d65443de34246a218a1a802771a9d45
summary     : Breeze Style for QQC2
description : |
    Breeze inspired QQC2 Style
license     :
    - GPL-2.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6ColorScheme)
    - cmake(KF6Config)
    - cmake(KF6GuiAddons)
    - cmake(KF6IconThemes)
    - cmake(KF6Kirigami)
    - cmake(Qt6Qml)
rundeps     :
    - kf6-kquickcharts
tuning      :
    - lto: full
    - optimize: speed
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
