name        : qt6-sensors
version     : "6.12.1"
release     : 11
homepage    : https://www.qt.io
upstreams   :
    - https://download.qt.io/official_releases/qt/6.12/6.12.1/submodules/qtsensors-everywhere-src-6.12.1.tar.xz : 68965b9ad073c4f535cb6028858f0217cca320a7fca087005d85d7750caaf7fb
summary     : Qt6 Sensors Module
description : |
    The Qt Sensors API provides access to sensor hardware via QML and C++ interfaces. The Qt Sensors API also provides a motion gesture recognition API for devices.
license     :
    - GFDL-1.3-or-later
    - GPL-3.0-or-later
    - LGPL-3.0-or-later
builddeps   :
    - cmake(Qt6CorePrivate)
    - cmake(Qt6Quick)
    - cmake(Qt6Svg)
setup       : |
    %cmake_qt6
build       : |
    %cmake_build
install     : |
    %cmake_install
