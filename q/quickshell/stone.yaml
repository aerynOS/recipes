name        : quickshell
version     : "0.3.2"
release     : 12
homepage    : https://quickshell.org/
upstreams   :
    - https://github.com/quickshell-mirror/quickshell/archive/refs/tags/v0.3.2.tar.gz : 946a27e2a276917a03c1079e5c60971af84ece73088c3661dee455d92eb420f7
summary     : Flexible QtQuick based desktop shell toolkit
description : |
    Quickshell is a toolkit for building status bars, widgets, lockscreens, and other desktop components using QtQuick. It can be used alongside your wayland compositor or window manager to build a complete desktop environment.
license     :
    - GPL-3.0-or-later
    - LGPL-3.0-or-later
    - GPL-3.0-only
    - LGPL-3.0-only
builddeps   :
    - cmake(Qt6Qml)
    - cmake(Qt6ShaderTools)
    - cmake(Qt6Svg)
    - cmake(Qt6WaylandClientPrivate)
    - cmake(cpptrace)
    - pkgconfig(CLI11)
    - pkgconfig(gbm)
    - pkgconfig(jemalloc)
    - pkgconfig(libdrm)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(pam)
    - pkgconfig(polkit-agent-1)
    - pkgconfig(wayland-protocols)
rundeps     :
    # Required for integrations
    - polkit # Need the server
    - power-profiles-daemon
    - upower
setup       : |
    %cmake \
        -DCRASH_REPORTER=OFF \
        -DDISTRIBUTOR="AerynOS" \
        -DINSTALL_QML_PREFIX="lib/qt6/qml" \
        -DNO_PCH=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
