name        : qt6-svg
version     : "6.12.0"
release     : 16
homepage    : https://www.qt.io
upstreams   :
    - https://download.qt.io/official_releases/qt/6.12/6.12.0/submodules/qtsvg-everywhere-src-6.12.0.tar.xz : e4ab39534ec97987b1b9b60ef7f4d3253d5912a69f8c713a01753174a4029331
summary     : Qt6 SVG Module
description : |
    Scalable Vector Graphics (SVG) is an XML-based language for describing two-dimensional vector graphics. Qt provides classes for rendering and displaying SVG drawings in widgets and on other paint devices.
license     :
    - GFDL-1.3-or-later
    - GPL-3.0-or-later
    - LGPL-3.0-or-later
builddeps   :
    - cmake(Qt6CorePrivate)
setup       : |
    # Fixes a build error in qt6-declarative with the following patch applied
    %patch %(pkgdir)/upstream-01.patch
    %patch %(pkgdir)/QTBUG-150174.patch

    %cmake_qt6
build       : |
    %cmake_build
install     : |
    %cmake_install
