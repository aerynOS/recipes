name        : qt6-5compat
version     : "6.12.0"
release     : 17
homepage    : https://www.qt.io
upstreams   :
    - https://download.qt.io/official_releases/qt/6.12/6.12.0/submodules/qt5compat-everywhere-src-6.12.0.tar.xz : 78cf1c283795312a7fa31c73eb7f7f556b48374adc484f10ad5a3c0bcb59264e
summary     : Qt 5 compatibility library for Qt 6
description : |
    The Qt 5 Core Compat module contains the Qt Core APIs which will be no longer supported in Qt 6 and therefore were removed from Qt 6. The module is provided to facilitate the transition to Qt 6.
license     :
    - GFDL-1.3-or-later
    - GPL-3.0-or-later
    - LGPL-3.0-or-later
builddeps   :
    - cmake(Qt6CorePrivate)
    - cmake(Qt6Qml)
    - cmake(Qt6ShaderTools)
    - pkgconfig(icu-i18n)
setup       : |
    %cmake_qt6
build       : |
    %cmake_build
install     : |
    %cmake_install
