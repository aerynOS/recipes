name        : exfatprogs
version     : "1.4.4"
release     : 8
homepage    : https://github.com/exfatprogs/exfatprogs
upstreams   :
    - https://github.com/exfatprogs/exfatprogs/releases/download/1.4.4/exfatprogs-1.4.4.tar.gz : 3ae7ad5903bf96845e191adfb48bbbeb9e0958d1444c97c75e1092040fb46412
summary     : exFAT filesystem userspace utilities
description : |
    exfatprogs are the official userspace utilities that contain all of the standard utilities for creating, fixing and debugging exFAT filesystems in Linux.
license     : GPL-2.0-or-later
builddeps   :
    - binary(bison)
    - binary(flex)
    - pkgconfig(blkid)
setup       : |
    # Bash required or fts.h detection fails
    %configure_with_bash
build       : |
    %make
install     : |
    %make_install
