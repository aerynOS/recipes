name        : exfatprogs
version     : "1.4.5"
release     : 9
homepage    : https://github.com/exfatprogs/exfatprogs
upstreams   :
    - https://github.com/exfatprogs/exfatprogs/releases/download/1.4.5/exfatprogs-1.4.5.tar.gz : 51b7e06691c583a35f5cc51a346843ffe3a68324dbe1c8beeaa34ac1d61dba81
summary     : exFAT filesystem userspace utilities
description : |
    exfatprogs are the official userspace utilities that contain all of the standard utilities for creating, fixing and debugging exFAT filesystems in Linux.
license     : GPL-2.0-or-later
builddeps   :
    - binary(bison)
    - binary(flex)
    - pkgconfig(blkid)
setup       : |
    # Bash required or fts.h detection fails
    %configure_with_bash
build       : |
    %make
install     : |
    %make_install
