name        : efivar
version     : "40"
release     : 2
homepage    : https://github.com/rhboot/efivar
upstreams   :
    - https://github.com/rhboot/efivar/archive/refs/tags/40.tar.gz : 01b8e74b1b2c37b3da273cec33a14de5cfc54113c22eadb56e4aa36fad1c1fa3
summary     : Tools and libraries to work with EFI variables
description : |
    Tools and libraries to work with EFI variables
license     : 
    - LGPL-2.1-or-later
    - GPL-3.0-or-later
builddeps   :
    - pkgconfig(libcrypto)
environment : |
    export CC=${CC}
    export COMPILER=${CC}
    export ENABLE_DOCS=0
build       : |
    %make
install     : |
    %make_install libdir=%(libdir)
