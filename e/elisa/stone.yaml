name        : elisa
version     : "26.08.3"
release     : 28
homepage    : https://apps.kde.org/elisa/
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/elisa-26.08.3.tar.xz : 1f1ad0cffcf3a11643b9f07d6ec4f1faa0067045252a75a544116b74eb8d5804
summary     : Music player from KDE
description : |
    Elisa is a simple music player aiming to provide a nice experience for its users. Elisa allows to browse music by album, artist or all tracks. The music is indexed using either a private indexer or an indexer using Baloo.
license     : LGPL-3.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Codecs)
    - cmake(KF6ColorScheme)
    - cmake(KF6Config)
    - cmake(KF6CoreAddons)
    - cmake(KF6I18n)
    - cmake(KF6IconThemes)
    - cmake(KF6KIO)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6Multimedia)
    - cmake(Qt6Qml)
    - cmake(Qt6Svg)
    # - pkgconfig(libvlc) # Qt6-multimedia is a sufficient backend
    - kf6-kirigami
    - kf6-kirigami-addons
rundeps     :
    - breeze-icons
    - kf6-kirigami
    - kf6-kirigami-addons
    - kf6-qqc2-desktop-style
    - qt6-5compat
    - qt6-wayland
setup       : |
    %patch %(pkgdir)/patches/0001-Clean-up-config-handling.patch
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
