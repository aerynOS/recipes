name        : extra-cmake-modules
version     : "6.32.0"
release     : 28
homepage    : https://invent.kde.org/frameworks/extra-cmake-modules
upstreams   :
    - https://download.kde.org/stable/frameworks/6.32/extra-cmake-modules-6.32.0.tar.xz : 305f4e2b82eb073be6ac3e50ace85578b3c0c409be262ccc51d445449e3d9312
summary     : Extra cmake modules and scripts
description : |
    Extra cmake modules and scripts
license     :
    - BSD-2-Clause
    - BSD-3-Clause
    - MIT
builddeps   :
    - binary(doxygen)
    - cmake(Qt6)
    - cmake(Qt6ToolsTools)
    - python(sphinx)
    - python(sphinxcontrib-qthelp)
rundeps     :
    - binary(cmake)
    - binary(doxygen)
    - cmake(Qt6) # We default to Qt6
    - cmake(Qt6ToolsTools)
setup       : |
    %patch %(pkgdir)/0001-Enable-stateless-paths.patch
    %patch %(pkgdir)/0002-We-use-qmake-rather-than-qmake-qt5.patch

    # Construct the KF6 macro manually otherwise we'd pull in ECM, and we are ECM
    %cmake %(options_cmake_kf6)
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-docs":
        paths:
            - /usr/share/doc
