name        : elephant
version     : "2.22.1"
release     : 5
homepage    : https://github.com/abenz1267/elephant
upstreams   :
    - https://github.com/abenz1267/elephant/archive/refs/tags/v2.22.1.tar.gz : 3d1d0d4c55ae531fa3f06406b96504b5165a0d7b53523d1f8351d9d93e457f44
summary     : Elephant - cuz it's phat - is a powerful data provider service and backend for building custom application launchers and desktop utilities.
description : |
    Elephant acts as a unified backend service that aggregates data from various sources (desktop applications, files, clipboard history, etc.) and provides a consistent interface for frontend applications like custom launchers, productivity tools, or desktop widgets.
license     : GPL-3.0-or-later
networking  : true
rundeps     :
    - ca-certificates
setup       : |
    %go_mod
build       : |
    go build -v -o elephant ./cmd/elephant

    for dir in internal/providers/*/; do
        go build -C "$dir" -buildmode=plugin -buildvcs=false
    done
install     : |
    %install_bin elephant
    %install_file assets/elephant.service %(installroot)%(libdir)/systemd/user/elephant.service
    %install_file LICENSE -t %(installroot)%(datadir)/licenses/%(name)/

    # Intended behavior is for each provider to only be installed with the specific package for it.
    %install_file internal/providers/*/*.so -t %(installroot)%(libdir)/%(name)/

    # Install all the providers
    %install_dir %(installroot)%(docdir)/%(name)-providers
    echo "Metapackage that installs all %(name) provider plugins." > %(installroot)%(docdir)/%(name)-providers/README
check       : |
    go test ./...
packages    :
    - "%(name)-1password":
        summary: 1password provider for %(name)
        description: 1password provider for %(name)
        rundeps:
            - "%(name)"
        paths:
            - /usr/lib/elephant/1password.so
    - "%(name)-aptpackages":
        summary: aptpackages provider for %(name)
