name        : expat
version     : "2.10.0"
release     : 21
summary     : An XML parser library
license     : MIT
homepage    : https://libexpat.github.io
description : |
    An XML parser library
upstreams   :
    - https://github.com/libexpat/libexpat/releases/download/R_2_10_0/expat-2.10.0.tar.xz: c624ba2998fc65df1163a49641ff3f9ab73138b11641d92c86bee0fb01b1bc7f
emul32      : true
# TODO: docbook2man for man pages
setup       : |
    %configure \
        --disable-static
build       : |
    %make
install     : |
    %make_install
check       : |
    %make check
workload    : |
    %make check
tuning      :
    - optimize : speed
    - lto : full
