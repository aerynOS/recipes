name        : expat
version     : "2.9.0"
release     : 20
summary     : An XML parser library
license     : MIT
homepage    : https://libexpat.github.io
description : |
    An XML parser library
upstreams   :
    - https://github.com/libexpat/libexpat/releases/download/R_2_9_0/expat-2.9.0.tar.xz: 1e6371862cc31999b368c3b89b49994f0677e1bab5f1b2b85ae3741f5d803051
emul32      : true
# TODO: docbook2man for man pages
setup       : |
    %configure \
        --disable-static
build       : |
    %make
install     : |
    %make_install
check       : |
    %make check
workload    : |
    %make check
tuning      :
    - optimize : speed
    - lto : full
