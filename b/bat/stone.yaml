name        : bat
version     : "0.27.0"
release     : 5
homepage    : https://github.com/sharkdp/bat
upstreams   :
    - https://github.com/sharkdp/bat/archive/refs/tags/v0.27.0.tar.gz : e7da57c30a7bf3c731bbc95d0be29ef14bab9e26ef8f0871df8ccaee241678dc
summary     : A cat(1) clone with wings
description : |
    A cat(1) clone with syntax highlighting and Git integration.
license     :
    - Apache-2.0
    - MIT
networking  : true
setup       : |
    %cargo_fetch
build       : |
    # build.rs renders the manpage and shell completions into this directory
    export BAT_ASSETS_GEN_DIR="%(workdir)/generated"
    %cargo_build
install     : |
    %cargo_install
    %install_file generated/assets/completions/bat.bash %(installroot)%(bashcompletionsdir)/%(name)
    %install_file generated/assets/completions/bat.fish %(installroot)%(fishcompletionsdir)/%(name).fish
    %install_file generated/assets/completions/bat.zsh %(installroot)%(zshcompletionsdir)/_%(name)
    %install_file generated/assets/manual/bat.1 %(installroot)%(mandir)/man1/%(name).1
check       : |
    %cargo_test
