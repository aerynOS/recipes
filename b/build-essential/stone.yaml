name        : build-essential
version     : "0"
release     : 10
summary     : Essential build tools for aerynOS
license     : MPL-2.0
homepage    : https://github.com/AerynOS
description : |
    This package provides the essential build tools for aerynOS.
rundeps     :
    - binary(bc)
    - binary(bison)
    - binary(boulder)
    - binary(bunzip2)
    # - binary(cc)
    - binary(clang)
    - binary(clang++)
    - binary(cpio)
    - binary(diff)
    - binary(ent)
    - binary(fj)
    - binary(flex)
    - binary(g++)
    - binary(gcc)
    - binary(gh)
    - binary(git)
    - binary(just)
    # - binary(ld)
    - binary(ld.bfd)
    - binary(ld.lld)
    - binary(make)
    - binary(patch)
    - binary(pkgconf)
    - binary(ps)
    - binary(python)
    - binary(renice)
    - binary(tar)
    - binary(unxz)
    - binary(unzip)
    - pkgconfig(libelf)
    - pkgconfig(libssl)
    - pkgconfig(libxcrypt)
    - pkgconfig(ncurses)
    - python(ruamel-yaml)
    - glibc-devel
    - layout
    - linux-headers
install     : |
    %install_dir %(installroot)%(docdir)/build-essential
    echo "This file will disappear when virtual packages are introduced" > %(installroot)%(docdir)/build-essential/README
