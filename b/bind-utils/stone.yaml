name        : bind-utils
version     : "9.20.27"
release     : 25
homepage    : https://www.isc.org/bind/
upstreams   :
    - https://downloads.isc.org/isc/bind9/9.20.27/bind-9.20.27.tar.xz : 145ab7a50b33a06d9d488b5e668c887e754f42acf8954e2b5dc7e238b080e4a0
summary     : Tools to interact with DNS services
description : |
    BIND (Berkeley Internet Name Domain) is a complete, highly portable
    implementation of the Domain Name System (DNS) protocol. This package
    includes client tools like dig & nslookup.
license     :
    - BSD-3-Clause
    - MIT
    - MPL-2.0-no-copyleft-exception
builddeps   :
    - pkgconfig(json-c)
    - pkgconfig(libcap)
    - pkgconfig(libidn2)
    - pkgconfig(libmaxminddb)
    - pkgconfig(libnghttp2)
    - pkgconfig(liburcu)
    - pkgconfig(libuv)
    - pkgconfig(libxml-2.0)
    - pkgconfig(openssl)
    - pkgconfig(readline)
    - pkgconfig(zlib)
setup       : |
    # Autoconf fix for using clang
    export CC_FOR_BUILD="$CC"

    %configure \
        --with-json-c \
        --with-libidn2 \
        --with-libxml2 \
        --with-readline=readline \
        --with-zlib
build       : |
    %make -C lib
    %make bind.keys.h
    %make -C bin/delv
    %make -C bin/dig
    %make -C bin/nsupdate
    %make -C doc/man
install     : |
    %make_install -C lib
    %make_install -C bin/delv
    %make_install -C bin/dig
    %make_install -C bin/nsupdate

    rm -rvf %(installroot)/usr/include

    install -dm00755 %(installroot)/%(mandir)/man1
    install -Dm00644 doc/man/delv.1 doc/man/dig.1 doc/man/host.1 doc/man/nslookup.1 doc/man/nsupdate.1 -t %(installroot)/%(mandir)/man1
# TODO Checks
packages    :
    - "%(name)":
        paths:
            - /usr/lib/*.so
