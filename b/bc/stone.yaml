name        : bc
version     : "1.08.2"
release     : 8
homepage    : https://ftp.gnu.org/gnu/bc
upstreams   :
    - https://ftp.gnu.org/gnu/bc/bc-1.08.2.tar.gz : ae470fec429775653e042015edc928d07c8c3b2fc59765172a330d3d87785f86
summary     : An arbitrary precision calculator language
description : |
    An arbitrary precision calculator language
license     :
    - GPL-3.0-or-later
builddeps   :
    - binary(ed)
    - binary(flex)
    - binary(makeinfo)
    - pkgconfig(readline)
setup       : |
    %patch %(pkgdir)/fedora/bc-1.06.95-doc.patch
    %patch %(pkgdir)/fedora/bc-1.06-dc_ibase.patch
    %patch %(pkgdir)/fedora/bc-1.07.1-readline-echo-empty.diff
    %configure --with-readline
build       : |
    %make -j1
install     : |
    %make_install -j1
    rm -rf %(installroot)/usr/share/info/dir
