name        : budgie-desktop-services
version     : "1.0.3"
release     : 1
homepage    : https://forge.moderndesktop.dev/BuddiesOfBudgie/budgie-desktop-services
upstreams   :
    - https://forge.moderndesktop.dev/BuddiesOfBudgie/budgie-desktop-services/archive/1.0.3.tar.gz : d62e7815afb089ac7a3fb664516500dadce90d102c24fcf8e0ffaada2a13097e
summary     : Daemon responsible for enabling various features of Budgie Desktop
description : |
    Daemon responsible for enabling various features of Budgie Desktop
license     : MPL-2.0
builddeps   :
