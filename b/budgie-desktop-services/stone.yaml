    - cmake(Qt6CorePrivate)
    - cmake(Qt6DBus)
    - cmake(Qt6WaylandClient)
    - cmake(toml11)
    - pkgconfig(wayland-client)
setup       : |
    %cmake
build       : |
    %cmake_build
install     : |
    %cmake_install
