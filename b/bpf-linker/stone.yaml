name        : bpf-linker
version     : "0.13.0"
release     : 4
upstreams   :
    - https://github.com/aya-rs/bpf-linker/archive/refs/tags/v0.13.0.tar.gz: c2d0cdd32b6566301b93a8a8c44030330c2fdce85edc0ee3e6c5bef35f2a2186
homepage    : https://github.com/aya-rs/bpf-linker
license     :
    - Apache-2.0
    - MIT
summary     : Simple BPF static linker
description : |
    BPF static linker
builddeps   :
    # Needs to match whatever Rust is using, which I _think_ just means the system llvm
    - binary(llvm-config-23)
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    %cargo_install
    %install_file README.md "%(installroot)%(datadir)/doc/bpf-linker/README.md"
