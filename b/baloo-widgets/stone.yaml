name        : baloo-widgets
version     : "26.08.2"
release     : 23
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.2/src/baloo-widgets-26.08.2.tar.xz : 445efd6a8e9aafcd2a86dd47ecc5459c39054303ba650c898893cde8db2f5bf6
homepage    : https://community.kde.org/Baloo
license     : LGPL-2.1-only
