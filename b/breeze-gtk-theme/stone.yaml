name        : breeze-gtk-theme
version     : "6.8.2"
release     : 25
upstreams   :
    - https://download.kde.org/stable/plasma/6.8.2/breeze-gtk-6.8.2.tar.xz : 662337b96be3fb67f5ecf903bbd685b894b6b899464822e09311f652a98bc4dd
homepage    : https://kde.org/plasma-desktop/
license     :
    - BSD-3-Clause
    - LGPL-2.1-only
summary     : GTK Theme Built to Match KDE's Breeze
description : |
    A GTK Theme Built to Match KDE's Breeze
builddeps   :
    - binary(python3)
    - binary(sassc)
    - cmake(Breeze)
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - pkgconfig(cairo)
    - python(pycairo)
tuning      :
    - lto: full
    - optimize: speed
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
