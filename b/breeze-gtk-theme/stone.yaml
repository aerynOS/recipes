name        : breeze-gtk-theme
version     : "6.8.3"
release     : 26
homepage    : https://kde.org/plasma-desktop/
upstreams   :
    - https://download.kde.org/stable/plasma/6.8.3/breeze-gtk-6.8.3.tar.xz : 9b96db2c0dd1a6ca018f9bb1cea4ed0947f140cd30f2106d9652448202e47c50
summary     : GTK Theme Built to Match KDE's Breeze
description : |
    A GTK Theme Built to Match KDE's Breeze
license     :
    - BSD-3-Clause
    - LGPL-2.1-only
builddeps   :
    - binary(python3)
    - binary(sassc)
    - cmake(Breeze)
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - pkgconfig(cairo)
    - python(pycairo)
tuning      :
    - lto: full
    - optimize: speed
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
