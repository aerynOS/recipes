name        : budgie-session
version     : "1.0.1"
release     : 1
homepage    : https://github.com/BuddiesOfBudgie/budgie-session
upstreams   :
    - https://github.com/BuddiesOfBudgie/budgie-session/releases/download/v1.0.1/budgie-session-v1.0.1.tar.xz : e6d0bf94979af5ab8aa478fd99fcd38bff51616ecdee4b36e5c9ddcb4af8f604
summary     : Budgie Session is a softish fork of gnome-session, designed to provide a stable session manager for Budgie 10.x
description : |
    Budgie Session is a softish fork of gnome-session, designed to provide a stable session manager for Budgie 10.x.
license     : GPL-2.0-or-later
builddeps   :
    - binary(msgfmt)
    - binary(xsltproc)
    - pkgconfig(dbus-glib-1)
    - pkgconfig(epoxy)
    - pkgconfig(egl)
    - pkgconfig(gio-2.0)
    - pkgconfig(gio-unix-2.0)
    - pkgconfig(glib-2.0)
    - pkgconfig(gl)
    - pkgconfig(glesv2)
    - pkgconfig(gnome-desktop-3.0)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(ice)
    - pkgconfig(json-glib-1.0)
    - pkgconfig(sm)
    - pkgconfig(systemd)
    - pkgconfig(wayland-client)
    - pkgconfig(x11)
    - pkgconfig(xau)
    - pkgconfig(xcomposite)
    - pkgconfig(xext)
    - pkgconfig(xrender)
    - pkgconfig(xtrans)
    - pkgconfig(xtst)
    - docbook
    - docbook-xsl
rundeps:
    - dconf
    - gsettings-desktop-schemas
environment : |
    %export_docbook_catalogs
setup       : |
    %patch %(pkgdir)/patches/cleanup-remove-g_gnuc_const.patch

    %meson \
      -Dman=true \
      -Dsystemd_session="default"
build       : |
    %meson_build
install     : |
    %meson_install
