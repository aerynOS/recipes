name        : blake3
version     : "1.8.8"
release     : 11
summary     : BLAKE3 hash algorithm
license     : Apache-2.0
homepage    : https://github.com/BLAKE3-team/BLAKE3
upstreams   :
    - https://github.com/BLAKE3-team/BLAKE3/archive/refs/tags/1.8.8.tar.gz : a5b927e875e16ebe76bacc1961107d2135637aab39ef227006fea27634e94cfe
description : |
    BLAKE3 hash algorithm
builddeps   :
    - cmake(TBB)
setup       : |
    cd c
    %cmake \
        -DBUILD_SHARED_LIBS=ON \
        -DBLAKE3_USE_TBB=ON
build       : |
    cd c
    %cmake_build
install     : |
    cd c
    %cmake_install
