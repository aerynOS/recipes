name        : bpftool
version     : "7.8.1"
release     : 10
upstreams   :
    - https://github.com/libbpf/bpftool/releases/download/v7.8.1/bpftool-libbpf-v7.8.1-sources.tar.gz: fed76b7acb54d810cc3982eb6394726010114977542fd146695887a7d904b60c
homepage    : https://github.com/libbpf/bpftool
license     :
    - GPL-2.0-only
    - BSD-2-Clause
summary     : Inspection and simple manipulation of eBPF programs and maps
description : |
    Inspection and simple manipulation of eBPF programs and maps
builddeps   :
    - binary(llvm-config-23)
    - binary(rst2man)
    - pkgconfig(libcap)
    - pkgconfig(libelf)
    - pkgconfig(openssl)
    - binutils-devel
environment : |
    _common_args="-C src \
                  prefix=/usr \
                  mandir=%(mandir)"
build       : |
    %make \
        ${_common_args} \
        HOSTCC="${CC}" \
        EXTRA_CFLAGS="${CFLAGS}" \
        EXTRA_LDFLAGS="${LDFLAGS}" \
        all doc
install     : |
    %make_install ${_common_args} doc-install

    mv %(installroot)/usr/{sbin,bin}
