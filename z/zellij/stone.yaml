name        : zellij
version     : "0.46.0"
release     : 11
homepage    : https://zellij.dev/
upstreams   :
    - https://github.com/zellij-org/zellij/archive/refs/tags/v0.46.0.tar.gz : 2dfa237fea447f3cc98954e81b0097b9d25841010036720e11f67880fe7861f0
summary     : A terminal workspace with batteries included
description : |
    Zellij is a terminal workspace. It has the base functionality of a terminal multiplexer (similar to tmux or screen) but includes many built-in features that would allow users to extend it and create their own personalized environment.
license     : MIT
networking  : true
builddeps   :
    - pkgconfig(libcurl)
    - pkgconfig(openssl)
    - pkgconfig(sqlite3)
environment : |
    export LIBSQLITE3_SYS_USE_PKG_CONFIG=1
    export OPENSSL_NO_VENDOR=1
setup       : |
    %patch %(pkgdir)/ftbfs-openssl-4.patch
    %cargo_fetch
build       : |
    %cargo_build --no-default-features --features "plugins_from_target web_server_capability terminal"

    %(cargo_target_dir)/zellij setup --generate-completion bash > zellij.bash
    %(cargo_target_dir)/zellij setup --generate-completion fish > zellij.fish
    %(cargo_target_dir)/zellij setup --generate-completion zsh > zellij.zsh
install     : |
    %cargo_install

    %install_file LICENSE.md %(installroot)%(datadir)/licenses/%(name)/LICENSE.md

    %install_file zellij.bash %(installroot)%(bashcompletionsdir)/zellij
    %install_file zellij.fish %(installroot)%(fishcompletionsdir)/zellij.fish
    %install_file zellij.zsh %(installroot)%(zshcompletionsdir)/_zellij

    # Desktop launcher (replaces the old zellij.desktop) — see docs/PACKAGING_DESKTOP.md
    %install_file assets/dev.zellij.Zellij.desktop -t %(installroot)%(datadir)/applications/
    %install_file assets/dev.zellij.Zellij.metainfo.xml -t %(installroot)%(datadir)/metainfo/

    %install_file assets/logo.svg %(installroot)%(datadir)/icons/hicolor/scalable/apps/dev.zellij.Zellij.svg
# Disabled: running the full test suite uses too much memory.
# check       : |
#     %cargo_test --no-default-features --features "plugins_from_target web_server_capability terminal" -- --test-threads=1
