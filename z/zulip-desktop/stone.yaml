name        : zulip-desktop
version     : "5.14.2"
release     : 9
homepage    : https://zulip.com
upstreams   :
    - https://github.com/zulip/zulip-desktop/archive/refs/tags/v5.14.2.tar.gz : 9be427a5e7e2218c9ebcbefc9decad9c3ed2b3815598ab78db233d3d6ca1dd52
summary     : Desktop client for Zulip
description : |
    Zulip is an organized team chat app for distributed teams of all sizes,
    combining the immediacy of real-time chat with an email-style threading model.
license     : Apache-2.0
networking  : true
builddeps   :
    - binary(pnpm)
rundeps     :
    - binary(xdg-open)
setup       : |
    %patch %(pkgdir)/0001-Disable-auto-update.patch
    %patch %(pkgdir)/1525.patch

    pnpm install
build       : |
    pnpm run pack
install     : |
    zulipdir=%(libdir)/%(name)

    %install_dir %(installroot)$zulipdir
    cp -a dist/linux-unpacked/* %(installroot)$zulipdir

    %install_file %(pkgdir)/org.zulip.Zulip.desktop -t %(installroot)%(datadir)/applications
    %install_file build/zulip.png %(installroot)%(datadir)/icons/hicolor/512x512/apps/org.zulip.Zulip.png

    %install_dir %(installroot)%(bindir)
    ln -srv %(installroot)${zulipdir}/zulip %(installroot)%(bindir)/zulip
