name        : zed
version     : "1.18.1"
release     : 59
homepage    : https://zed.dev/
upstreams   :
    - https://github.com/zed-industries/zed/archive/refs/tags/v1.18.1.tar.gz : 78afdefd396901c2ef5e386fc31a6ef5736d21edbaf207a5c23dc3e7a139352e
summary     : High performance, graphical code editor
description : |
    Code at the speed of thought – Zed is a high-performance, multiplayer code editor from the creators of Atom and Tree-sitter.
license     :
    - AGPL-3.0
    - Apache-2.0
    - GPL-3.0
builddeps   :
    - binary(cmake)
    - binary(envsubst)
    - binary(jq)
    - binary(make)
    - binary(mold)
    - pkgconfig(alsa)
    - pkgconfig(fontconfig)
    - pkgconfig(gl)
    - pkgconfig(glib-2.0)
    - pkgconfig(libcurl)
    - pkgconfig(libdrm)
    - pkgconfig(libelf)
    - pkgconfig(libssl)
    - pkgconfig(libzstd)
    - pkgconfig(protobuf)
    - pkgconfig(sqlite3)
    - pkgconfig(vulkan)
    - pkgconfig(wayland-client)
    - pkgconfig(xkbcommon)
    - pkgconfig(xkbcommon-x11)
    - libstdc++-devel
rundeps     :
    - binary(unzip)
networking  : true
tuning      :
    - lto: false
environment : |
    export RUSTFLAGS="$RUSTFLAGS -Clink-arg=-fuse-ld=mold"
    # enable LTO here instead
    export CARGO_PROFILE_RELEASE_LTO=thin
    export ZED_UPDATE_EXPLANATION="Package updates are provided via moss"
    export LIBSQLITE3_SYS_USE_PKG_CONFIG=1
    export OPENSSL_NO_VENDOR=true
    export ZSTD_SYS_USE_PKG_CONFIG=1
setup       : |
    %cargo_fetch
build       : |
    RUST_BACKTRACE=1 %cargo_build -p zed -p cli
install     : |
    %install_exe %(cargo_target_dir)/zed %(installroot)%(libexecdir)/zed-editor
    %install_exe %(cargo_target_dir)/cli %(installroot)%(bindir)/zed

    # stolen from zed's bundle-linux script
    export DO_STARTUP_NOTIFY="true"
    export APP_CLI="zed"
    export APP_ICON="zed"
    export APP_ARGS="%%U"
    export APP_NAME="Zed"
    export APP_ID="dev.zed.Zed"
    export BRANDING_LIGHT="#99c1f1"
    export BRANDING_DARK="#1a5fb4"

    # desktop file.
    %install_dir %(installroot)%(datadir)/{applications,metainfo}
    envsubst < "crates/zed/resources/zed.desktop.in" > "%(installroot)%(datadir)/applications/dev.zed.Zed.desktop"
    envsubst < "crates/zed/resources/flatpak/zed.metainfo.xml.in" > %(installroot)%(datadir)/metainfo/zed.metainfo.xml
    sed -i '/@release_info@/d' %(installroot)%(datadir)/metainfo/zed.metainfo.xml

    # icons
    %install_file crates/zed/resources/app-icon.png %(installroot)%(datadir)/icons/hicolor/512x512/apps/zed.png
    %install_file crates/zed/resources/app-icon@2x.png %(installroot)%(datadir)/icons/hicolor/1024x1024/apps/zed.png

    # completions
    export ZED_ALLOW_ROOT=true
    %(installroot)%(bindir)/zed --completions bash | %install_file /dev/stdin %(installroot)%(bashcompletionsdir)/%(name)
    %(installroot)%(bindir)/zed --completions fish | %install_file /dev/stdin %(installroot)%(fishcompletionsdir)/%(name).fish
    %(installroot)%(bindir)/zed --completions zsh | %install_file /dev/stdin %(installroot)%(zshcompletionsdir)/_%(name)
