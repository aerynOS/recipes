name        : zanshin
version     : "26.08.3"
release     : 2
homepage    : https://zanshin.kde.org/
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/zanshin-26.08.3.tar.xz : d4d87564e1e97262204e958ac10b4ee302a6058e17b4d743b59cc369b1aa2279
summary     : To-do management application
description : |
    A powerful yet simple application to manage your day to day actions.
license     :
    - CC0-1.0
    - GPL-2.0-only
    - GPL-3.0-only
    - LGPL-2.0-or-later
    - MIT
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(Boost)
    - cmake(ECM)
    - cmake(KF6CalendarCore)
    - cmake(KF6Crash)
    - cmake(KF6I18n)
    - cmake(KF6Parts)
    - cmake(KF6Runner)
    - cmake(KF6WindowSystem)
    - cmake(KPim6Akonadi)
    - cmake(KPim6AkonadiCalendar)
    - cmake(KPim6IdentityManagementCore)
    - cmake(KPim6KontactInterface)
    - cmake(Qt6Qml)
rundeps     :
    - kdepim-runtime
    - qt6-wayland
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
