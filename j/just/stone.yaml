name        : just
version     : "1.59.0"
release     : 17
homepage    : https://github.com/casey/just
upstreams   :
    - https://github.com/casey/just/archive/refs/tags/1.59.0.tar.gz : 20f876880851f1cc67fc7eb7589c7f7ccaa7612d827feac75797cf4a6ed729aa
summary     : just is a handy way to save and run project-specific commands.
description : |
    just is a handy way to save and run project-specific commands.
license     :
    - CC0-1.0
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    %cargo_install
    ./target/*/release/just --completions bash | %install_file /dev/stdin %(installroot)%(bashcompletionsdir)/just
    ./target/*/release/just --completions zsh | %install_file /dev/stdin %(installroot)%(zshcompletionsdir)/_just
    ./target/*/release/just --completions fish | %install_file /dev/stdin %(installroot)%(fishcompletionsdir)/just.fish
check       : |
    # backticks::trailing_newlines_are_stripped
    # completions::bash
    # functions::env_var_functions
    %cargo_test || :
