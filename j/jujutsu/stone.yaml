name        : jujutsu
version     : "0.47.1"
release     : 19
homepage    : https://jj-vcs.github.io/jj/
upstreams   :
    - https://github.com/jj-vcs/jj/archive/refs/tags/v0.47.1.tar.gz : 838fb5ddbf474ccee6639ce68835cedf88c8285b5c812599c56688286fb0b7a6
summary     : Git-compatible VCS that is both simple and powerful
description : |
    Git-compatible VCS that is both simple and powerful
license     : Apache-2.0
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build --all-features
install     : |
    %cargo_install jj

    %(cargo_target_dir)/jj util completion bash | %install_file /dev/stdin %(installroot)%(bashcompletionsdir)/jj
    %(cargo_target_dir)/jj util completion zsh | tail -n+3 | %install_file /dev/stdin %(installroot)%(zshcompletionsdir)/_jj
    # Don't install fish completions as the fish package ships a superior version

    %(cargo_target_dir)/jj util install-man-pages %(installroot)%(mandir)
