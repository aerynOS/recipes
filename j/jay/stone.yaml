name        : jay
version     : "1.15.1"
release     : 3
homepage    : https://github.com/mahkoh/jay
upstreams   :
    - https://github.com/mahkoh/jay/archive/refs/tags/v1.15.1.tar.gz : 630148643dbdb82fd082ff8e493f38d81a887d454b8f1d329c6d1b4b2f4ec713
summary     : A Wayland Compositor
description : |
    Jay is a Wayland compositor for Linux with an i3-like tiling layout, Vulkan and OpenGL rendering, multi-GPU support, screen sharing, and more.
license     : GPL-3.0-only
networking  : true
builddeps   :
    - pkgconfig(cairo)
    - pkgconfig(fontconfig)
    - pkgconfig(gbm)
    - pkgconfig(libinput)
    - pkgconfig(libudev)
    - pkgconfig(pango)
rundeps     :
    - binary(Xwayland)
    - binary(alacritty)
    - binary(bemenu)
    - soname(libsqlite3.so.0(x86_64))
    - soname(libvulkan.so.1(x86_64))
    - xdg-desktop-portal
    - xdg-desktop-portal-gtk
tuning      :
    - lto: full
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    %cargo_install

    %install_file etc/jay.portal %(installroot)%(datadir)/xdg-desktop-portal/portals/jay.portal
    %install_file etc/jay-portals.conf %(installroot)%(datadir)/xdg-desktop-portal/jay-portals.conf
    %install_file etc/jay.desktop %(installroot)%(datadir)/wayland-sessions/jay.desktop

    %(installroot)%(bindir)/jay generate-completion bash | %install_file /dev/stdin %(installroot)%(bashcompletionsdir)/jay
    %(installroot)%(bindir)/jay generate-completion fish | %install_file /dev/stdin %(installroot)%(fishcompletionsdir)/jay.fish
    %(installroot)%(bindir)/jay generate-completion zsh | %install_file /dev/stdin %(installroot)%(zshcompletionsdir)/_jay

    # TODO: When we support setting capabilities make sure to add CAP_SYS_NICE to the jay binary
