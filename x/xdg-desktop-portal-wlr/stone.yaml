name        : xdg-desktop-portal-wlr
version     : "0.8.5"
release     : 8
homepage    : https://github.com/emersion/xdg-desktop-portal-wlr
upstreams   :
    - https://github.com/emersion/xdg-desktop-portal-wlr/releases/download/v0.8.5/xdg-desktop-portal-wlr-0.8.5.tar.gz : 5d36f3c031d9c750f83a17a9468770df12f1ddc9d9d60eea81ad4062f7d71614
summary     : xdg-desktop-portal backend for wlroots
description : |
    xdg-desktop-portal backend for wlroots
license     : MIT
builddeps   :
    - binary(scdoc)
    - pkgconfig(gbm)
    - pkgconfig(inih)
    - pkgconfig(libdrm)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libsystemd)
    - pkgconfig(wayland-client)
    - pkgconfig(wayland-protocols)
rundeps     :
    - pipewire # service
    - xdg-desktop-portal
setup       : |
    %patch %(pkgdir)/patches/0001-screencast-Fall-back-to-slurp-when-no-dmenu-chooser-.patch
    %meson \
        -Dsd-bus-provider=libsystemd
build       : |
    %meson_build
install     : |
    %meson_install

    # Hopefully this can be removed in a future release
    %install_file contrib/wlroots-portals.conf -t %(installroot)%(datadir)/xdg-desktop-portal
