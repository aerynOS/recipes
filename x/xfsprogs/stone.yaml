name        : xfsprogs
version     : "7.3.0"
release     : 22
homepage    : https://xfs.wiki.kernel.org/
upstreams   :
    - https://mirrors.edge.kernel.org/pub/linux/utils/fs/xfs/xfsprogs/xfsprogs-7.3.0.tar.xz : 310c11e9e1d336064921cc123de5c84a331d5abe3c3b82aeadb89a191d34b449
summary     : Filesystem utilities for xfs filesystems
description : |
    Filesystem utilities for xfs filesystems
license     :
    - GPL-2.0-or-later
    - LGPL-2.1-or-later
builddeps   :
    - binary(file)
    - binary(msgfmt)
    - pkgconfig(blkid)
    - pkgconfig(devmapper)
    - pkgconfig(icu-i18n)
    - pkgconfig(inih)
    - pkgconfig(libedit)
    - pkgconfig(libsystemd)
    - pkgconfig(liburcu)
    - pkgconfig(uuid)
setup       : |
    %configure \
        --disable-static \
        --enable-editline=yes \
        --libexecdir=%(libdir)

    # Prevent rpath from ending up in the binaries
    sed -i 's|^hardcode_libdir_flag_spec=.*|hardcode_libdir_flag_spec=""|g' libtool
    sed -i 's|^runpath_var=LD_RUN_PATH|runpath_var=DIE_RPATH_DIE|g' libtool
build       : |
    %make
install     : |
    %make_install -j1 install install-dev \
        PKG_ROOT_SBIN_DIR=%(sbindir) PKG_LIB_DIR=%(libdir)
