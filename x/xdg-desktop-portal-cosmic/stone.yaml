name        : xdg-desktop-portal-cosmic
version     : "1.12.0"
release     : 56
homepage    : https://github.com/pop-os/xdg-desktop-portal-cosmic
upstreams   :
    - https://github.com/pop-os/xdg-desktop-portal-cosmic/archive/refs/tags/epoch-1.12.0.tar.gz : 0d858c7e4402217b22c766df0d0df347015d5dbf0d6e1f5ad36e619db64cc5dd
summary     : Cosmic Desktop - XDG Portal Support
description : |
    Cosmic Desktop - XDG Portal Support
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(gbm)
    - pkgconfig(glib-2.0)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(xkbcommon)
rundeps     :
    - binary(pipewire)
    - gvfs # Used for file services
    - xdg-desktop-portal
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
