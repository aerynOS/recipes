name        : xdg-desktop-portal-cosmic
version     : "1.10.0"
release     : 54
homepage    : https://github.com/pop-os/xdg-desktop-portal-cosmic
upstreams   :
    - https://github.com/pop-os/xdg-desktop-portal-cosmic/archive/refs/tags/epoch-1.10.0.tar.gz : b80b6f443ddb1a43b6c02bb1e81ab1b9c1e93724990576ac88d88ef1ccc9c699
summary     : Cosmic Desktop - XDG Portal Support
description : |
    Cosmic Desktop - XDG Portal Support
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(gbm)
    - pkgconfig(glib-2.0)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(xkbcommon)
rundeps     :
    - binary(pipewire)
    - gvfs # Used for file services
    - xdg-desktop-portal
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
