name        : xpumanager
version     : "2.2.0"
release     : 2
homepage    : https://intel.github.io/xpumanager/
upstreams   :
    - https://github.com/intel/xpumanager/archive/refs/tags/v2.2.0.tar.gz : ddb8a91ea5a3a3e7269056f1fa412f7a5db0c5bc67ea92819a9a9815dc9645a4
summary     : Free and open-source tool for monitoring and managing Intel Data Center GPUs.
description : |
    Free and open-source tool for monitoring and managing Intel Data Center GPUs.
license     : MIT
builddeps   :
    - cmake(igsc)
    - pkgconfig(CLI11)
    - pkgconfig(fmt)
    - pkgconfig(hwloc)
    - pkgconfig(level-zero)
    - pkgconfig(libcurl)
    - pkgconfig(libudev)
    - pkgconfig(nlohmann_json)
    - pkgconfig(pciaccess)
setup       : |
    %meson \
        -Dshared_library=true \
        -Duse_system_igsc=true \
        -Duse_system_levelzero=true
# -Dwith_tests=true
# requires doctest
build       : |
    %meson_build
install     : |
    %meson_install
# check       : |
#     %meson_test
packages    :
    - "%(name)":
        paths:
            - /usr/lib/libx*
