name        : carapace
version     : "1.8.2"
release     : 5
homepage    : https://carapace.sh/
upstreams   :
  - https://github.com/carapace-sh/carapace-bin/archive/refs/tags/v1.8.2.tar.gz : 56b934e1c94cb4e10d912c0158a74f8b727e430e6d9c8aff5bfb99e124fa3ace
summary     : A multi-shell completion library
description : |
    Carapace-bin provides argument completion for multiple CLI commands, works across multiple POSIX and non-POSIX shells
license     : Apache-2.0
networking  : true
setup       : |
    %go_mod
build       : |
    go generate ./cmd/...
    export GOFLAGS+=" \"-ldflags=-linkmode=external -X=main.version=v%(version)\""
    go build -v ./cmd/carapace
install     : |
    %install_bin carapace

    %install_file LICENSE -t %(installroot)%(datadir)/licenses/%(name)/
check       : |
    export PATH="%(installroot)%(bindir):$PATH"
    go test -v ./cmd/...
