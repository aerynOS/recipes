name        : cosmic-applets
version     : "1.9.0"
release     : 57
homepage    : https://github.com/pop-os/cosmic-applets
summary     : Cosmic Panel Applets
upstreams   :
    - https://github.com/pop-os/cosmic-applets/archive/refs/tags/epoch-1.9.0.tar.gz : f113f74cd05b179ab0478dd5876b671880914600d5df56d518f8f80c08543037
description : |
    Cosmic Panel Applets
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(dbus-1)
    - pkgconfig(libinput)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libpulse)
    - pkgconfig(libudev)
    - pkgconfig(xkbcommon)
rundeps     :
    - bluez # Bluetooth applet
networking  : true
setup       : |
    # prefer svg over png for menu icons and don't force symbolic recolour
    %patch %(pkgdir)/prefer-svg-no-symbolic-recolour.patch
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
