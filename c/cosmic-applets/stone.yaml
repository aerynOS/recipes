name        : cosmic-applets
version     : "1.12.0"
release     : 60
homepage    : https://github.com/pop-os/cosmic-applets
upstreams   :
    - https://github.com/pop-os/cosmic-applets/archive/refs/tags/epoch-1.12.0.tar.gz : 4aeceb0da95c1a08fc4e84d5433e4d7899d07082e95faa7f2e8b32f46b025012
summary     : Cosmic Panel Applets
description : |
    Cosmic Panel Applets
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(dbus-1)
    - pkgconfig(libinput)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libpulse)
    - pkgconfig(libudev)
    - pkgconfig(xkbcommon)
rundeps     :
    - bluez # Bluetooth applet
networking  : true
setup       : |
    # prefer svg over png for menu icons and don't force symbolic recolour
    %patch %(pkgdir)/prefer-svg-no-symbolic-recolour.patch
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
