name        : cosmic-applets
version     : "1.7.0"
release     : 54
homepage    : https://github.com/pop-os/cosmic-applets
summary     : Cosmic Panel Applets
upstreams   :
    - https://github.com/pop-os/cosmic-applets/archive/refs/tags/epoch-1.7.0.tar.gz : aba4783fe8cc31a3a1a1af642fffe593f69ff5d5e3bbb05994c21f04c7660676
description : |
    Cosmic Panel Applets
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(dbus-1)
    - pkgconfig(libinput)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libpulse)
    - pkgconfig(libudev)
    - pkgconfig(xkbcommon)
rundeps     :
    - bluez # Bluetooth applet
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
