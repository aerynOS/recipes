name        : cosmic-launcher
version     : "1.10.0"
release     : 53
homepage    : https://github.com/pop-os/cosmic-launcher
upstreams   :
    - https://github.com/pop-os/cosmic-launcher/archive/refs/tags/epoch-1.10.0.tar.gz : 6700ad7c036b323f877fbedd43d021f50128651af4265554466eb3847013774a
summary     : Cosmic Desktop Launcher
description : |
    Cosmic Desktop Launcher
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(xkbcommon)
rundeps     :
    - binary(pop-launcher)
networking  : true
setup       : |
    # Install shipped desktop/metainfo from data/, and use share/metainfo
    %patch %(pkgdir)/Install-metainfo-to-share-metainfo.patch

    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
