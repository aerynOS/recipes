name        : cosmic-launcher
version     : "1.7.0"
release     : 50
homepage    : https://github.com/pop-os/cosmic-launcher
upstreams   :
    - https://github.com/pop-os/cosmic-launcher/archive/refs/tags/epoch-1.7.0.tar.gz : 0c3cebad711559b4e6bdf889f6efab69734bc068c9c6ea191f7ca6d6704dcce7
summary     : Cosmic Desktop Launcher
description : |
    Cosmic Desktop Launcher
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(xkbcommon)
rundeps     :
    - binary(pop-launcher)
networking  : true
setup       : |
    # Install shipped desktop/metainfo from data/, and use share/metainfo
    %patch %(pkgdir)/Install-static-desktop-and-metainfo-files.patch

    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
