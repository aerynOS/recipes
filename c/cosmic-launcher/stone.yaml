name        : cosmic-launcher
version     : "1.8.0"
release     : 51
homepage    : https://github.com/pop-os/cosmic-launcher
upstreams   :
    - https://github.com/pop-os/cosmic-launcher/archive/refs/tags/epoch-1.8.0.tar.gz : a852eb334dd39b5ac1743d98751f5ab44208c88adedd74aaa5660b83057dfcce
summary     : Cosmic Desktop Launcher
description : |
    Cosmic Desktop Launcher
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(xkbcommon)
rundeps     :
    - binary(pop-launcher)
networking  : true
setup       : |
    # Install shipped desktop/metainfo from data/, and use share/metainfo
    %patch %(pkgdir)/Install-static-desktop-and-metainfo-files.patch

    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
