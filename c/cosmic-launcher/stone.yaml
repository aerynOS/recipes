name        : cosmic-launcher
version     : "1.12.0"
release     : 55
homepage    : https://github.com/pop-os/cosmic-launcher
upstreams   :
    - https://github.com/pop-os/cosmic-launcher/archive/refs/tags/epoch-1.12.0.tar.gz : 11f437c5c30181efa6289e9acbfad344fbd844d3803a6ec8bc13a42f7e32e74f
summary     : Cosmic Desktop Launcher
description : |
    Cosmic Desktop Launcher
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(xkbcommon)
rundeps     :
    - binary(pop-launcher)
networking  : true
setup       : |
    # Install shipped desktop/metainfo from data/, and use share/metainfo
    %patch %(pkgdir)/Install-metainfo-to-share-metainfo.patch

    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
