name        : cosmic-term
version     : "1.12.0"
release     : 58
homepage    : https://github.com/pop-os/cosmic-term
upstreams   :
    - https://github.com/pop-os/cosmic-term/archive/refs/tags/epoch-1.12.0.tar.gz : 7c06ccf7231056c3445d16fa6d3b5c4f9de59c1a06225dc2989b1065527ccae4
summary     : Cosmic Desktop Terminal Application
description : |
    Cosmic desktop Terminal Application
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(xkbcommon)
rundeps:
    - cosmic-icons
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
