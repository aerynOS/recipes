name        : cosmic-term
version     : "1.8.0"
release     : 53
homepage    : https://github.com/pop-os/cosmic-term
upstreams   :
    - https://github.com/pop-os/cosmic-term/archive/refs/tags/epoch-1.8.0.tar.gz : 00bd6308c660f21ffebf008998c2d4e80701a771659ef0890234aea4fee5dc55
summary     : Cosmic Desktop Terminal Application
description : |
    Cosmic desktop Terminal Application
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(xkbcommon)
networking  : true
setup       : |
    %cargo_fetch
