name        : cosmic-osd
version     : "1.8.0"
release     : 50
homepage    : https://github.com/pop-os/cosmic-osd
upstreams   :
    - https://github.com/pop-os/cosmic-osd/archive/refs/tags/epoch-1.8.0.tar.gz : bbd26d958173d9474cf4e6f89ffe1f3ff8aa57348748c3540001195e8f242cb2
summary     : Cosmic Desktop OSD
description : |
    Cosmic Desktop OSD
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(libinput)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libpulse)
    - pkgconfig(xkbcommon)
rundeps     :
    - polkit
networking  : true
environment : |
    export POLKIT_AGENT_HELPER_1=%(libdir)/polkit-1/polkit-agent-helper-1
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
