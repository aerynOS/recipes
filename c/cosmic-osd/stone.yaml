name        : cosmic-osd
version     : "1.12.0"
release     : 54
homepage    : https://github.com/pop-os/cosmic-osd
upstreams   :
    - https://github.com/pop-os/cosmic-osd/archive/refs/tags/epoch-1.12.0.tar.gz : d4285833dad6bd7ce273b79a92c6af6d3920a6607a3f6e17dc51d7ca8ecadd52
summary     : Cosmic Desktop OSD
description : |
    Cosmic Desktop OSD
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(libinput)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libpulse)
    - pkgconfig(xkbcommon)
rundeps     :
    - polkit
networking  : true
environment : |
    export POLKIT_AGENT_HELPER_1=%(libdir)/polkit-1/polkit-agent-helper-1
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
