name        : cosmic-osd
version     : "1.7.0"
release     : 49
homepage    : https://github.com/pop-os/cosmic-osd
upstreams   :
    - https://github.com/pop-os/cosmic-osd/archive/refs/tags/epoch-1.7.0.tar.gz : 200ca382ec3980110e56adf4ecfcd155134b3cc8082b8e6ea29200166bc78b3f
summary     : Cosmic Desktop OSD
description : |
    Cosmic Desktop OSD
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(libinput)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libpulse)
    - pkgconfig(xkbcommon)
rundeps     :
    - polkit
networking  : true
environment : |
    export POLKIT_AGENT_HELPER_1=%(libdir)/polkit-1/polkit-agent-helper-1
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
