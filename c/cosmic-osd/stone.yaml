name        : cosmic-osd
version     : "1.10.0"
release     : 52
homepage    : https://github.com/pop-os/cosmic-osd
upstreams   :
    - https://github.com/pop-os/cosmic-osd/archive/refs/tags/epoch-1.10.0.tar.gz : 41cd18721bee2c9123a9fb5f8c09617ad0033f5cf688933fff47f6ac28c825c0
summary     : Cosmic Desktop OSD
description : |
    Cosmic Desktop OSD
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(libinput)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libpulse)
    - pkgconfig(xkbcommon)
rundeps     :
    - polkit
networking  : true
environment : |
    export POLKIT_AGENT_HELPER_1=%(libdir)/polkit-1/polkit-agent-helper-1
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
