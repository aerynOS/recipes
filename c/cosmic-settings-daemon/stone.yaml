name        : cosmic-settings-daemon
version     : "1.7.0"
release     : 51
homepage    : https://github.com/pop-os/cosmic-settings-daemon
upstreams   :
    - https://github.com/pop-os/cosmic-settings-daemon/archive/refs/tags/epoch-1.7.0.tar.gz : c93e8f7f3c96619c6466fe0fef4a2eb203fd6acd0f8f484d80d93e052fc2084e
summary     : Cosmic Settings Daemon
description : |
    Cosmic Settings Daemon
license     : GPL-3.0
builddeps   :
    - binary(just)
    - binary(mold)
    - pkgconfig(libgeoclue-2.0)
    - pkgconfig(libinput)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libpulse)
    - pkgconfig(libudev)
    - pkgconfig(xkbcommon)
rundeps     :
    - cosmic-sound-theme
    - geoclue
    - power-profiles-daemon
networking  : true
environment :
    export GEOCLUE_AGENT=$(realpath %(libdir)/geoclue/geoclue-2.0/demos/agent)
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    %make_install prefix=%(prefix) TARGET=%(target_triple)/release
