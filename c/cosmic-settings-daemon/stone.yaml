name        : cosmic-settings-daemon
version     : "1.8.0"
release     : 52
homepage    : https://github.com/pop-os/cosmic-settings-daemon
upstreams   :
    - https://github.com/pop-os/cosmic-settings-daemon/archive/refs/tags/epoch-1.8.0.tar.gz : 10e26ed1d815f8e6176068df3c441c13dd6fda7bd85a059afcfddd54b4689e8e
summary     : Cosmic Settings Daemon
description : |
    Cosmic Settings Daemon
license     : GPL-3.0
builddeps   :
    - binary(just)
    - binary(mold)
    - pkgconfig(libgeoclue-2.0)
    - pkgconfig(libinput)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libpulse)
    - pkgconfig(libudev)
    - pkgconfig(xkbcommon)
rundeps     :
    - cosmic-sound-theme
    - geoclue
    - power-profiles-daemon
networking  : true
environment :
    export GEOCLUE_AGENT=$(realpath %(libdir)/geoclue/geoclue-2.0/demos/agent)
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    %make_install prefix=%(prefix) TARGET=%(target_triple)/release
