name        : cosmic-workspaces
version     : "1.12.0"
release     : 53
homepage    : https://github.com/pop-os/cosmic-workspaces-epoch
upstreams   :
    - https://github.com/pop-os/cosmic-workspaces-epoch/archive/refs/tags/epoch-1.12.0.tar.gz : 853db058e4285ea85ca39d82a72a31d90fcc72de663ac1154db851b9cb2ccb19
