name        : cosmic-workspaces
version     : "1.6.0"
release     : 47
homepage    : https://github.com/pop-os/cosmic-workspaces-epoch
upstreams   :
    - https://github.com/pop-os/cosmic-workspaces-epoch/archive/refs/tags/epoch-1.6.0.tar.gz : 81b07241ce051bc511e97462da84bb88d25f4d440b551bb52c7ee175e45b5074
