name        : cosmic-panel
version     : "1.10.0"
release     : 53
homepage    : https://github.com/pop-os/cosmic-panel
upstreams   :
    - https://github.com/pop-os/cosmic-panel/archive/refs/tags/epoch-1.10.0.tar.gz : e532f3ed38cfe911fb71f62a782de50f41488c2d39a24b09708f141826e8e343
summary     : Cosmic Desktop Panel
description : |
    Cosmic Desktop panel
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(xkbcommon)
rundeps     :
    - binary(cosmic-applets)
networking  : true
setup       : |
    %cargo_fetch
build       : |
    RUST_BACKTRACE=1 %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
