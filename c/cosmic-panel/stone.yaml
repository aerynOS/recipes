name        : cosmic-panel
version     : "1.7.0"
release     : 50
homepage    : https://github.com/pop-os/cosmic-panel
upstreams   :
    - https://github.com/pop-os/cosmic-panel/archive/refs/tags/epoch-1.7.0.tar.gz : cf6960923a87b695b6078f1bdf32245eba0a07e49f7e6aaebdd6c0262e8cb37d
summary     : Cosmic Desktop Panel
description : |
    Cosmic Desktop panel
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(xkbcommon)
rundeps     :
    - binary(cosmic-applets)
networking  : true
setup       : |
    %cargo_fetch
build       : |
    RUST_BACKTRACE=1 %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
