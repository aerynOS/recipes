name        : cosmic-panel
version     : "1.9.0"
release     : 52
homepage    : https://github.com/pop-os/cosmic-panel
upstreams   :
    - https://github.com/pop-os/cosmic-panel/archive/refs/tags/epoch-1.9.0.tar.gz : 6b036076e162568b6d0230ab82916b30d06b4942cb5be6a39960e42b499cab9b
summary     : Cosmic Desktop Panel
description : |
    Cosmic Desktop panel
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(xkbcommon)
rundeps     :
    - binary(cosmic-applets)
networking  : true
setup       : |
    %cargo_fetch
build       : |
    RUST_BACKTRACE=1 %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
