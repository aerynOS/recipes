name        : cosmic-panel
version     : "1.8.0"
release     : 51
homepage    : https://github.com/pop-os/cosmic-panel
upstreams   :
    - https://github.com/pop-os/cosmic-panel/archive/refs/tags/epoch-1.8.0.tar.gz : 3bc2f7d6481a5ad221c9ee505fcc068a7c28df42c54e171cc6a4c86a5a64549e
summary     : Cosmic Desktop Panel
description : |
    Cosmic Desktop panel
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(xkbcommon)
rundeps     :
    - binary(cosmic-applets)
networking  : true
setup       : |
    %cargo_fetch
build       : |
    RUST_BACKTRACE=1 %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
