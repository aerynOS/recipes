name        : cosmic-applibrary
version     : "1.8.0"
release     : 51
homepage    : https://github.com/pop-os/cosmic-applibrary
upstreams   :
    - https://github.com/pop-os/cosmic-applibrary/archive/refs/tags/epoch-1.8.0.tar.gz : 73184d86985437d76427570ff5aa442b8e7c49378f983f2d3d5ee85f74f657a4
summary     : Cosmic Desktop App Launcher
description : |
    Cosmic Desktop App Launcher
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(dbus-1)
    - pkgconfig(libudev)
    - pkgconfig(xkbcommon)
networking  : true
setup       : |
    # Install shipped desktop/metainfo from data/, and use share/metainfo
    %patch %(pkgdir)/Install-static-desktop-and-metainfo-files.patch

    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
