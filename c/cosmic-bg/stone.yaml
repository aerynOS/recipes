name        : cosmic-bg
version     : "1.8.0"
release     : 51
homepage    : https://github.com/pop-os/cosmic-bg
summary     : Cosmic Desktop Background Service
upstreams   :
    - https://github.com/pop-os/cosmic-bg/archive/refs/tags/epoch-1.8.0.tar.gz :  270c7d77e9b6d7283c016c3d2a6b64e4f029b6c419371642f6ce5bef81d1a967
description : |
    Cosmic Desktop Background Service
license     : GPL-3.0
builddeps   :
    - binary(just)
    - binary(which)
    - pkgconfig(dav1d)
    - pkgconfig(xkbcommon)
networking  : true
setup       : |
    %patch %(pkgdir)/aerynos_branding.patch
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
