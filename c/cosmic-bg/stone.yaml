name        : cosmic-bg
version     : "1.10.0"
release     : 53
homepage    : https://github.com/pop-os/cosmic-bg
summary     : Cosmic Desktop Background Service
upstreams   :
    - https://github.com/pop-os/cosmic-bg/archive/refs/tags/epoch-1.10.0.tar.gz :  1595505815bdf96cf4cfd16736a1d235cb249d78e4a35dccd02e3c997649b357
description : |
    Cosmic Desktop Background Service
license     : GPL-3.0
builddeps   :
    - binary(just)
    - binary(which)
    - pkgconfig(dav1d)
    - pkgconfig(xkbcommon)
networking  : true
setup       : |
    %patch %(pkgdir)/aerynos_branding.patch
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
