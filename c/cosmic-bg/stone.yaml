name        : cosmic-bg
version     : "1.12.0"
release     : 55
homepage    : https://github.com/pop-os/cosmic-bg
upstreams   :
    - https://github.com/pop-os/cosmic-bg/archive/refs/tags/epoch-1.12.0.tar.gz :  bd4e423c95671e2c8aaa26ad41d74146272dc6e5d73b6b520e1d98c6e1ff36f6
summary     : Cosmic Desktop Background Service
description : |
    Cosmic Desktop Background Service
license     : GPL-3.0
builddeps   :
    - binary(just)
    - binary(which)
    - pkgconfig(dav1d)
    - pkgconfig(xkbcommon)
networking  : true
setup       : |
    %patch %(pkgdir)/aerynos_branding.patch
    %cargo_fetch
