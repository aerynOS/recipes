name        : cosmic-bg
version     : "1.7.0"
release     : 50
homepage    : https://github.com/pop-os/cosmic-bg
summary     : Cosmic Desktop Background Service
upstreams   :
    - https://github.com/pop-os/cosmic-bg/archive/refs/tags/epoch-1.7.0.tar.gz :  0de7f92a8bd5223cc1e5df29b50e4f9c11325184b0f063436e2e800a80d0da04
description : |
    Cosmic Desktop Background Service
license     : GPL-3.0
builddeps   :
    - binary(just)
    - binary(which)
    - pkgconfig(dav1d)
    - pkgconfig(xkbcommon)
networking  : true
setup       : |
    %patch %(pkgdir)/aerynos_branding.patch
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
