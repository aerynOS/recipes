name        : cosmic-bg
version     : "1.9.0"
release     : 52
homepage    : https://github.com/pop-os/cosmic-bg
summary     : Cosmic Desktop Background Service
upstreams   :
    - https://github.com/pop-os/cosmic-bg/archive/refs/tags/epoch-1.9.0.tar.gz :  848594cabc13d78fef20a907bc79aa2b132986e40bb042b9423779bfc081dcca
description : |
    Cosmic Desktop Background Service
license     : GPL-3.0
builddeps   :
    - binary(just)
    - binary(which)
    - pkgconfig(dav1d)
    - pkgconfig(xkbcommon)
networking  : true
setup       : |
    %patch %(pkgdir)/aerynos_branding.patch
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
