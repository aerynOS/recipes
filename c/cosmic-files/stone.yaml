name        : cosmic-files
version     : "1.10.0"
release     : 60
homepage    : https://github.com/pop-os/cosmic-files
upstreams   :
    - https://github.com/pop-os/cosmic-files/archive/refs/tags/epoch-1.10.0.tar.gz : 1c33cf6f65782e8a84bb4281430f182363eb837229f68b7f36cce1f2d8147f05
summary     : Cosmic Desktop File Browser
description : |
    Cosmic desktop File Browser
license     : GPL-3.0
builddeps   :
    - binary(just)
    - binary(which)
    - pkgconfig(bzip2)
    - pkgconfig(glib-2.0)
    - pkgconfig(liblzma)
    - pkgconfig(libzstd)
    - pkgconfig(xkbcommon)
rundeps     :
    - cosmic-icons
    # Used for file services
    - gvfs-fuse
    - gvfs-mtp
    - gvfs-nfs
    - gvfs-smb
networking  : true
environment : |
    # Force system libs
    export ZSTD_SYS_USE_PKG_CONFIG=1
setup       : |
    %cargo_fetch
build       : |
    %cargo_build -p cosmic-files
    %cargo_build -p cosmic-files-applet
    %cargo_build -p cosmic-files-thumbnailer
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
