name        : cosmic-store
version     : "1.12.0"
release     : 54
homepage    : https://github.com/pop-os/cosmic-store
upstreams   :
    - https://github.com/pop-os/cosmic-store/archive/refs/tags/epoch-1.12.0.tar.gz : edacee33e7a0e9d111fc9d200048c044fbfe37676434e90c6330ef32ec967252
summary     : Cosmic Desktop Store
description : |
    Cosmic Desktop Store
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(dbus-1)
    - pkgconfig(flatpak)
    - pkgconfig(glib-2.0)
    - pkgconfig(libinput)
    - pkgconfig(libssl)
    - pkgconfig(libudev)
    - pkgconfig(xkbcommon)
rundeps   :
    - cosmic-icons
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build --features wgpu,flatpak,logind
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
