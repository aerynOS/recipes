name        : cinny-desktop
version     : "4.12.8"
release     : 4
homepage    : https://github.com/cinnyapp/cinny-desktop
upstreams   :
    - https://github.com/cinnyapp/cinny-desktop/archive/refs/tags/v4.12.8.tar.gz :
        hash: 0a28a371b95a430517a1c1760268ddfac1de2c4e8d1a92f128f05ca2aed0f839
        rename: cinny-desktop
    - https://github.com/cinnyapp/cinny/archive/refs/tags/v4.12.8.tar.gz :
        hash: 0c04303a9efddbc9ed0c3a33cb06068b5a6fb712d458f873f450a0ac8f937fb1
        unpackdir: cinny-desktop/cinny/
summary     :  Yet another matrix client for desktop
description : |
  Cinny is a matrix client focusing primarily on simple, elegant and secure interface.
license     : AGPL-3.0-or-later
builddeps   :
    - binary(cargo)
    - binary(npm)
    - pkgconfig(cairo)
    - pkgconfig(gdk-3.0)
    - pkgconfig(gio-2.0)
    - pkgconfig(glib-2.0)
    - pkgconfig(gobject-2.0)
    - pkgconfig(gstreamer-1.0)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(libsoup-3.0)
    - pkgconfig(pango)
    - pkgconfig(webkit2gtk-4.1)
rundeps     :
    - gstreamer-plugins-bad
    - gstreamer-plugins-good
networking  : true
setup       : |
    %patch 0001-disable-tauri-updater.patch
    cd cinny && npm --legacy-peer-deps ci
    cd .. && npm ci
build       : |
    npm run tauri build -- --no-bundle
install     : |
    %install_exe src-tauri/target/release/cinny %(installroot)/%(bindir)/cinny-desktop
    %install_file %(pkgdir)/in.cinny.app.desktop -t %(installroot)%(datadir)/applications
    %install_file cinny/public/res/svg/cinny.svg %(installroot)%(datadir)/icons/hicolor/scalable/apps/cinny-desktop.svg
