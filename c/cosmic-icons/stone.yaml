name        : cosmic-icons
version     : "1.10.0"
release     : 51
homepage    : https://github.com/pop-os/cosmic-icons
upstreams   :
    - https://github.com/pop-os/cosmic-icons/archive/refs/tags/epoch-1.10.0.tar.gz : 52625bef1b83ba2b08afe58197573738d72fb4d316de9d99eac34806a4cae80c
summary     : Cosmic Icons by System76
description : |
    Cosmic Icons by System76
license     : CC-BY-SA-4.0
builddeps   :
    - binary(gtk-update-icon-cache)
    - binary(just)
    - hicolor-icon-theme
    - pop-os-icon-theme
rundeps     :
    - pop-os-icon-theme
install     : |
    just rootdir=%(installroot) install

    for i in %(installroot)%(datadir)/icons/*/; do
        gtk-update-icon-cache -f $i
    done
