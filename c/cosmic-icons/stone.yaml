name        : cosmic-icons
version     : "1.12.0"
release     : 53
homepage    : https://github.com/pop-os/cosmic-icons
upstreams   :
    - https://github.com/pop-os/cosmic-icons/archive/refs/tags/epoch-1.12.0.tar.gz : 0017b6eecac789496e59f9a4786f2d332ee1f040ba4a71a9116e4be0879f23c4
summary     : Cosmic Icons by System76
description : |
    Cosmic Icons by System76
license     : CC-BY-SA-4.0
builddeps   :
    - binary(gtk-update-icon-cache)
    - binary(just)
    - hicolor-icon-theme
    - pop-os-icon-theme
rundeps     :
    - pop-os-icon-theme
install     : |
    just rootdir=%(installroot) install

    for i in %(installroot)%(datadir)/icons/*/; do
        gtk-update-icon-cache -f $i
    done
