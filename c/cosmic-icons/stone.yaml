name        : cosmic-icons
version     : "1.8.0"
release     : 49
homepage    : https://github.com/pop-os/cosmic-icons
upstreams   :
    - https://github.com/pop-os/cosmic-icons/archive/refs/tags/epoch-1.8.0.tar.gz : a85368f132859fcc00ef07304dd8688f9d372b3b83b2b2f39477585e4b9c247b
summary     : Cosmic Icons by System76
description : |
    Cosmic Icons by System76
license     : CC-BY-SA-4.0
builddeps   :
    - binary(gtk-update-icon-cache)
    - binary(just)
    - hicolor-icon-theme
    - pop-os-icon-theme
rundeps     :
    - pop-os-icon-theme
install     : |
    just rootdir=%(installroot) install

    for i in %(installroot)%(datadir)/icons/*/; do
        gtk-update-icon-cache -f $i
    done
