name        : cosmic-settings
version     : "1.8.0"
release     : 58
homepage    : https://github.com/pop-os/cosmic-settings
upstreams   :
    - https://github.com/pop-os/cosmic-settings/archive/refs/tags/epoch-1.8.0.tar.gz : 669bb605a63806a8afc751d78c17d7f0e8adc5297247919773b9184ab53328ac
summary     : Cosmic Desktop Settings
description : |
    Cosmic Desktop Settings
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(dav1d)
    - pkgconfig(libinput)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libudev)
    - pkgconfig(xkbcommon)
rundeps     :
    - binary(nm-connection-editor)
    - binary(pipewire-pulse)
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
