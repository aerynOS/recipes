name        : cosmic-settings
version     : "1.12.0"
release     : 63
homepage    : https://github.com/pop-os/cosmic-settings
upstreams   :
    - https://github.com/pop-os/cosmic-settings/archive/refs/tags/epoch-1.12.0.tar.gz : 801712c5394369d91a3386a3ff9473c5c96f5ac5a6a9eefaa79ac39fa11a9d65
summary     : Cosmic Desktop Settings
description : |
    Cosmic Desktop Settings
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(dav1d)
    - pkgconfig(libinput)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libudev)
    - pkgconfig(xkbcommon)
rundeps     :
    - binary(nm-connection-editor)
    - binary(pipewire-pulse)
    - cosmic-icons
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
