name        : cosmic-settings
version     : "1.7.0"
release     : 57
homepage    : https://github.com/pop-os/cosmic-settings
upstreams   :
    - https://github.com/pop-os/cosmic-settings/archive/refs/tags/epoch-1.7.0.tar.gz : 76b891ce2f4e30389a96ead032721851c35e8f948d699a93b03e5a8a34cdfd44
summary     : Cosmic Desktop Settings
description : |
    Cosmic Desktop Settings
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(dav1d)
    - pkgconfig(libinput)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libudev)
    - pkgconfig(xkbcommon)
rundeps     :
    - binary(nm-connection-editor)
    - binary(pipewire-pulse)
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
