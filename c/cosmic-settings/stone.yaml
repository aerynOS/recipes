name        : cosmic-settings
version     : "1.10.0"
release     : 61
homepage    : https://github.com/pop-os/cosmic-settings
upstreams   :
    - https://github.com/pop-os/cosmic-settings/archive/refs/tags/epoch-1.10.0.tar.gz : d11ba9d67d3fa279b659e31d64024366358b3f207ce6fe25564772805e517f34
summary     : Cosmic Desktop Settings
description : |
    Cosmic Desktop Settings
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(dav1d)
    - pkgconfig(libinput)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libudev)
    - pkgconfig(xkbcommon)
rundeps     :
    - binary(nm-connection-editor)
    - binary(pipewire-pulse)
    - cosmic-icons
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
