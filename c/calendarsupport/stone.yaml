name        : calendarsupport
version     : "26.08.1"
release     : 18
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.1/src/calendarsupport-26.08.1.tar.xz : 6490d2a70fcf393a8af1daaf571ba0b88972f9ab1b091ffb2dff19ac520423bc
homepage    : https://kontact.kde.org/
license     :
    - GPL-2.0-or-later
    - LGPL-2.1-or-later
summary     : Calendar Support library provides helper utilities for calendaring applications
description : |
    Calendar Support library provides helper utilities for calendaring applications.
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6CalendarCore)
    - cmake(KF6Codecs)
    - cmake(KF6GuiAddons)
    - cmake(KF6Holidays)
    - cmake(KF6I18n)
    - cmake(KF6KIO)
    - cmake(KF6Mime)
    - cmake(KF6TextCustomEditor)
    - cmake(KPim6Akonadi)
    - cmake(KPim6AkonadiCalendar)
    - cmake(KPim6CalendarUtils)
    - cmake(KPim6IdentityManagementCore)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-devel":
        rundeps:
            - cmake(KPim6AkonadiCalendar)
            - cmake(KPim6IdentityManagementCore)
            - cmake(KF6Mime)
