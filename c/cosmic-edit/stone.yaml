name        : cosmic-edit
version     : "1.10.0"
release     : 57
homepage    : https://github.com/pop-os/cosmic-edit
upstreams   :
    - https://github.com/pop-os/cosmic-edit/archive/refs/tags/epoch-1.10.0.tar.gz : 2cd6e262d5762a62df6e27691b76991ebd0aa7674436e78f8bbee3d4bf8c9ec2
summary     : Cosmic Desktop Text Editor
description : |
    Cosmic desktop Text Editor
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(glib-2.0)
    - pkgconfig(xkbcommon)
rundeps     :
    - cosmic-icons
    - gvfs # Used for file services
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
