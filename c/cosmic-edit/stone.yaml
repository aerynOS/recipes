name        : cosmic-edit
version     : "1.12.0"
release     : 59
homepage    : https://github.com/pop-os/cosmic-edit
upstreams   :
    - https://github.com/pop-os/cosmic-edit/archive/refs/tags/epoch-1.12.0.tar.gz : 73a2dc3b63440a1ff326632b970236dadab59eefa79522a5d332d659e1d4900d
summary     : Cosmic Desktop Text Editor
description : |
    Cosmic desktop Text Editor
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(glib-2.0)
    - pkgconfig(xkbcommon)
rundeps     :
    - cosmic-icons
    - gvfs # Used for file services
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
