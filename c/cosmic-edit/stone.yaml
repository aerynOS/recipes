name        : cosmic-edit
version     : "1.7.0"
release     : 53
homepage    : https://github.com/pop-os/cosmic-edit
upstreams   :
    - https://github.com/pop-os/cosmic-edit/archive/refs/tags/epoch-1.7.0.tar.gz : 8a4c43ad5c07ba50e3a82827426a1da5aca1ff1b8af1451aca1bfb80df301bef
summary     : Cosmic Desktop Text Editor
description : |
    Cosmic desktop Text Editor
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(glib-2.0)
    - pkgconfig(xkbcommon)
rundeps     :
    - gvfs # Used for file services
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
