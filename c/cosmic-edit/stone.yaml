name        : cosmic-edit
version     : "1.8.0"
release     : 54
homepage    : https://github.com/pop-os/cosmic-edit
upstreams   :
    - https://github.com/pop-os/cosmic-edit/archive/refs/tags/epoch-1.8.0.tar.gz : 91be2987160ddc8b83752e9879f3488615f62dbacad0766605d71086c0d251f2
summary     : Cosmic Desktop Text Editor
description : |
    Cosmic desktop Text Editor
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(glib-2.0)
    - pkgconfig(xkbcommon)
rundeps     :
    - gvfs # Used for file services
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
