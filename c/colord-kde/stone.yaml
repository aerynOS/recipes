name        : colord-kde
version     : "26.08.3"
release     : 2
homepage    : https://invent.kde.org/graphics/colord-kde
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.3/src/colord-kde-26.08.3.tar.xz : 3e78ffac79dd3669ce9f0ac92d71665927fd4fa3543cd15ca5455aea0cc75958
summary     : Color management integration for KDE
description : |
    Interfaces and session daemon to colord for KDE.
license     : GPL-2.0-or-later
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6CoreAddons)
    - cmake(KF6DBusAddons)
    - cmake(KF6I18n)
    - cmake(KF6ItemModels)
    - cmake(KF6KCMUtils)
    - cmake(KF6WidgetsAddons)
    - cmake(KF6WindowSystem)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6Qml)
    - pkgconfig(lcms2)
    - pkgconfig(xcb)
    - pkgconfig(xcb-randr)
    - pkgconfig(xrandr)
rundeps     :
    - colord
    - kf6-kirigami # QML dep
    - kf6-kirigami-addons
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
