name        : crun
version     : "1.31"
release     : 8
homepage    : https://github.com/containers/crun
upstreams   :
    - https://github.com/containers/crun/releases/download/1.31/crun-1.31.tar.zst : cb76a7951438205466725307e4061da6d1dfdc202bdf675cf209c7037b94002b
summary     : A fast and low-memory footprint OCI Container Runtime fully written in C
description : |
    A fast and lightweight fully featured OCI runtime and C library for running containers
license     :
    - GPL-2.0-or-later
    - LGPL-2.1-or-later
builddeps   :
    - binary(go-md2man)
    - binary(gperf)
    - binary(python3)
    - pkgconfig(json-c)
    - pkgconfig(libblake3)
    - pkgconfig(libcap)
    - pkgconfig(libseccomp)
    - pkgconfig(python3)
    - pkgconfig(systemd)
    # criu
setup       : |
    # python_crun: native module so users can import crun from Python scripts
    %configure \
        --disable-static \
        --enable-shared \
        --with-python-bindings
build       : |
    %make
install     : |
    %make_install
packages    :
    - "python-%(name)":
        summary: Python bindings for %(name)
        description: Python bindings for %(name)
        rundeps:
            - "%(name)"
        paths:
            - /usr/lib/python3*/site-packages/
