name        : cosmic-comp
version     : "1.9.0"
release     : 58
homepage    : https://github.com/pop-os/cosmic-comp
upstreams   :
    - https://github.com/pop-os/cosmic-comp/archive/refs/tags/epoch-1.9.0.tar.gz : f0f3a2362861fe8976d7d45436aaa0a10de975522b6e8a53d77058a74ffc81e8
summary     : Cosmic Desktop Compositor
description : |
    Cosmic Desktop Compositor
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(gbm)
    - pkgconfig(libdisplay-info)
    - pkgconfig(libinput)
    - pkgconfig(libseat)
    - pkgconfig(libudev)
    - pkgconfig(pixman-1)
    - pkgconfig(xkbcommon)
rundeps     :
    - binary(Xwayland)
    - iso-codes
    - shared-mime-info
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    %make_install prefix=%(prefix) TARGET=%(target_triple)/release
