name        : cosmic-comp
version     : "1.7.0"
release     : 56
homepage    : https://github.com/pop-os/cosmic-comp
upstreams   :
    - https://github.com/pop-os/cosmic-comp/archive/refs/tags/epoch-1.7.0.tar.gz : 8c1525759a0c5bcf565e2b8e67e6ef8e9d010f326b30cde5fc903d79aaa743c5
summary     : Cosmic Desktop Compositor
description : |
    Cosmic Desktop Compositor
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(gbm)
    - pkgconfig(libdisplay-info)
    - pkgconfig(libinput)
    - pkgconfig(libseat)
    - pkgconfig(libudev)
    - pkgconfig(pixman-1)
    - pkgconfig(xkbcommon)
rundeps     :
    - binary(Xwayland)
    - iso-codes
    - shared-mime-info
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    %make_install prefix=%(prefix) TARGET=%(target_triple)/release
