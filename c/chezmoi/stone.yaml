name        : chezmoi
version     : "2.74.1"
release     : 12
homepage    : https://www.chezmoi.io/
upstreams   :
    - https://github.com/twpayne/chezmoi/archive/refs/tags/v2.74.1.tar.gz : 818984475f981bb79d516f144386d0f4aeb03f035bca3c6d6287da2bdae61829
summary     : Manage your dotfiles across multiple machines
description : |
    chezmoi helps you manage your personal configuration files
    (dotfiles, like ~/.gitconfig) across multiple machines.
license     : MIT
networking  : true
checkdeps   :
    - binary(gzip)
    - binary(tar)
rundeps     :
    - ca-certificates
setup       : |
    %go_mod
build       : |
    _xflags="-X main.version=%(version) \
        -X main.date=$(date -u +'%%Y-%%m-%%dT%%H:%%M:%%SZ' --date=@$SOURCE_DATE_EPOCH) \
        -X main.builtBy=aerynOS"
    export GOFLAGS="$(echo "${GOFLAGS}" | sed "s#-ldflags=[^ ]*#\"& ${_xflags}\"#")"

    go build -v \
        -buildmode=pie \
        -tags noupgrade
install     : |
    %install_bin chezmoi
    cd completions
    %install_file *.bash    %(installroot)%(bashcompletionsdir)/chezmoi
    %install_file *.fish    %(installroot)%(fishcompletionsdir)/chezmoi.fish
    %install_file *.zsh     %(installroot)%(zshcompletionsdir)/_chezmoi
check       : |
    go test ./...
