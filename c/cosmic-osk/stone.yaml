name        : cosmic-osk
version     : "1.10.0"
release     : 2
homepage    : https://github.com/pop-os/cosmic-osk
upstreams   :
    - https://github.com/pop-os/cosmic-osk/archive/refs/tags/epoch-1.10.0.tar.gz : 7d92c3df124d1d009ae94cc95915c9085af4ceeb6027473fc02ee564dcead81a
summary     : Cosmic On-Screen Keyboard
description : |
    Cosmic On-Screen Keyboard
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(libudev)
    - pkgconfig(xkbcommon)
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
