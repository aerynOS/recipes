name        : cosmic-initial-setup
version     : "1.12.0"
release     : 39
homepage    : https://github.com/pop-os/cosmic-initial-setup
upstreams   :
    - https://github.com/pop-os/cosmic-initial-setup/archive/refs/tags/epoch-1.12.0.tar.gz : 1002f38c8c1f1e552e7fe14b02bac65709b66545c887b33aa8bb998e8c72860d
summary     : Cosmic Initial Setup
description : |
    Cosmic Desktop Intial Setup Application
license     : GPL-3.0
networking  : true
builddeps   :
    - binary(git-lfs)
    - binary(just)
    - pkgconfig(flatpak)
    - pkgconfig(libinput)
    - pkgconfig(libudev)
    - pkgconfig(openssl)
    - pkgconfig(xkbcommon)
setup       : |
    %patch %(pkgdir)/0001-Allow-xdg-directory-to-be-overridden.patch

    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" \
    XDG_INSTALL_DIR="%(datadir)/xdg" \
        just rootdir=%(installroot) install
