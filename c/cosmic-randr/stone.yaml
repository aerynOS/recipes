name        : cosmic-randr
version     : "1.12.0"
release     : 51
homepage    : https://github.com/pop-os/cosmic-randr
upstreams   :
    - https://github.com/pop-os/cosmic-randr/archive/refs/tags/epoch-1.12.0.tar.gz : ad235437a6e8813a581d4163a8461655208b2c47ff808a01241aa957f051f016
summary     : Cosmic Desktop display configuration
description : |
    Cosmic Desktop display configuration
license     : GPL-3.0
builddeps   :
    - binary(just)
    - binary(which)
    - pkgconfig(dbus-1)
    - pkgconfig(libudev)
    - pkgconfig(xkbcommon)
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
