name        : cosmic-randr
version     : "1.9.0"
release     : 48
homepage    : https://github.com/pop-os/cosmic-randr
upstreams   :
    - https://github.com/pop-os/cosmic-randr/archive/refs/tags/epoch-1.9.0.tar.gz : 6c082cba6b80c5d89b02aec7ed315c9de8452cd413f5181ece43d7fdb3011481
summary     : Cosmic Desktop display configuration
description : |
    Cosmic Desktop display configuration
license     : GPL-3.0
builddeps   :
    - binary(just)
    - binary(which)
    - pkgconfig(dbus-1)
    - pkgconfig(libudev)
    - pkgconfig(xkbcommon)
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
