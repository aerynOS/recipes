name        : cosmic-randr
version     : "1.8.0"
release     : 47
homepage    : https://github.com/pop-os/cosmic-randr
upstreams   :
    - https://github.com/pop-os/cosmic-randr/archive/refs/tags/epoch-1.8.0.tar.gz : 226591921a26f0fa03cf3867b73d7d1af89bda16f4ea45eea75decd0bbcd1e29
summary     : Cosmic Desktop display configuration
description : |
    Cosmic Desktop display configuration
license     : GPL-3.0
builddeps   :
    - binary(just)
    - binary(which)
    - pkgconfig(dbus-1)
    - pkgconfig(libudev)
    - pkgconfig(xkbcommon)
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
