name        : cosmic-randr
version     : "1.7.0"
release     : 46
homepage    : https://github.com/pop-os/cosmic-randr
upstreams   :
    - https://github.com/pop-os/cosmic-randr/archive/refs/tags/epoch-1.7.0.tar.gz : c401bf5f9777f2f907d8f5473e9a7d7793013c0e9043d626064aa37f118d3720
summary     : Cosmic Desktop display configuration
description : |
    Cosmic Desktop display configuration
license     : GPL-3.0
builddeps   :
    - binary(just)
    - binary(which)
    - pkgconfig(dbus-1)
    - pkgconfig(libudev)
    - pkgconfig(xkbcommon)
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
