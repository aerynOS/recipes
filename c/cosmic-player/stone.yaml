name        : cosmic-player
version     : "1.7.0"
release     : 40
homepage    : https://github.com/pop-os/cosmic-player
upstreams   :
    - https://github.com/pop-os/cosmic-player/archive/refs/tags/epoch-1.7.0.tar.gz : 19e338af052d28ad04055ab653523e6efc9af16c752d711435b6133de1b1548c
summary     : COSMIC media player
description : |
    Cosmic Desktop Media Player
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(gstreamer-1.0)
    - pkgconfig(gstreamer-plugins-base-1.0)
    - pkgconfig(xkbcommon)
rundeps     :
    # Moss upgrade bug
    - gstreamer-plugins-good
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
