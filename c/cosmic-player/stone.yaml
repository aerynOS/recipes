name        : cosmic-player
version     : "1.9.0"
release     : 42
homepage    : https://github.com/pop-os/cosmic-player
upstreams   :
    - https://github.com/pop-os/cosmic-player/archive/refs/tags/epoch-1.9.0.tar.gz : d2a13306348cdc3886f75c918f00e3722ec85509d0b7f286023f3929b7aa0600
summary     : COSMIC media player
description : |
    Cosmic Desktop Media Player
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(gstreamer-1.0)
    - pkgconfig(gstreamer-plugins-base-1.0)
    - pkgconfig(xkbcommon)
rundeps     :
    # Moss upgrade bug
    - gstreamer-plugins-good
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
