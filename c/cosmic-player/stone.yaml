name        : cosmic-player
version     : "1.12.0"
release     : 46
homepage    : https://github.com/pop-os/cosmic-player
upstreams   :
    - https://github.com/pop-os/cosmic-player/archive/refs/tags/epoch-1.12.0.tar.gz : dce7745d3109ee911f2e802d592fc86f32065f66eb67c6e8791ec8e3878efae8
summary     : COSMIC media player
description : |
    Cosmic Desktop Media Player
license     : GPL-3.0
networking  : true
builddeps   :
    - binary(just)
    - pkgconfig(gstreamer-1.0)
    - pkgconfig(gstreamer-plugins-base-1.0)
    - pkgconfig(xkbcommon)
rundeps     :
    # Needed to play video and audio. Not linked, so Moss will not pull them in.
    - gstreamer-plugin-libav
    - gstreamer-plugin-pipewire
    - gstreamer-plugins-good
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
