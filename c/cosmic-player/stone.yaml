name        : cosmic-player
version     : "1.8.0"
release     : 41
homepage    : https://github.com/pop-os/cosmic-player
upstreams   :
    - https://github.com/pop-os/cosmic-player/archive/refs/tags/epoch-1.8.0.tar.gz : 34e23a39e8cf9d484378355a0890dfdb0f050c0dcc10c37026549ff112e1aa89
summary     : COSMIC media player
description : |
    Cosmic Desktop Media Player
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(gstreamer-1.0)
    - pkgconfig(gstreamer-plugins-base-1.0)
    - pkgconfig(xkbcommon)
rundeps     :
    # Moss upgrade bug
    - gstreamer-plugins-good
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
