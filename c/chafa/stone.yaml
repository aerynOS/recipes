name        : chafa
version     : "1.18.3"
release     : 6
homepage    : https://github.com/hpjansson/chafa
upstreams   :
    - https://github.com/hpjansson/chafa/releases/download/1.18.3/chafa-1.18.3.tar.xz : fb995ef21dce6c73dd0dd454ba3e0f7fac08e053ea16060a2e5ce69a3746ee27
summary     : Converts image data into graphics formats or ANSI/Unicode character art suitable for display in a terminal.
description : |
    Converts image data into graphics formats or ANSI/Unicode character art suitable for display in a terminal.
license     :
    - LGPL-3.0
    - GPL-3.0
builddeps   :
    - binary(xsltproc)
    - pkgconfig(freetype2)
    - pkgconfig(glib-2.0)
    - pkgconfig(libavif)
    - pkgconfig(libheif)
    - pkgconfig(libjpeg)
    - pkgconfig(libjxl)
    - pkgconfig(librsvg-2.0)
    - pkgconfig(libtiff-4)
    - pkgconfig(libwebp)
    - docbook
    - docbook-xsl
    # TODO: Patch to fix man page generation
environment : |
    %export_docbook_catalogs
setup       : |
    %configure \
        --disable-static
build       : |
    %make
install     : |
    %make_install
    %install_file tools/completions/bash-completion.sh %(installroot)%(bashcompletionsdir)/chafa
    %install_file tools/completions/fish-completion.fish %(installroot)%(fishcompletionsdir)/chafa.fish
    %install_file tools/completions/zsh-completion.zsh %(installroot)%(zshcompletionsdir)/_chafa
packages    :
    - "%(name)-libs":
        paths:
            - /usr/lib/lib*.so.*

    - "%(name)-devel":
        paths:
            - /usr/lib/chafa/include/chafaconfig.h
