name        : cosmic-notifications
version     : "1.8.0"
release     : 50
homepage    : https://github.com/pop-os/cosmic-notifications
upstreams   :
    - https://github.com/pop-os/cosmic-notifications/archive/refs/tags/epoch-1.8.0.tar.gz : b25c12603624ba2f7567e5ede9133aa967b8135a618c83ac4e702f855908f9c6
summary     : Cosmic Desktop Notifications
description : |
    Cosmic Desktop Notifications
license     : GPL-3.0
builddeps   :
    - binary(just)
    - binary(which)
    - pkgconfig(dbus-1)
    - pkgconfig(libudev)
    - pkgconfig(xkbcommon)
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
