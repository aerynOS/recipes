name        : cosmic-notifications
version     : "1.7.0"
release     : 49
homepage    : https://github.com/pop-os/cosmic-notifications
upstreams   :
    - https://github.com/pop-os/cosmic-notifications/archive/refs/tags/epoch-1.7.0.tar.gz : 31c2c91430426ab847e32d880d3d6752089d3adc94eedf713a9b476d5a523e3a
summary     : Cosmic Desktop Notifications
description : |
    Cosmic Desktop Notifications
license     : GPL-3.0
builddeps   :
    - binary(just)
    - binary(which)
    - pkgconfig(dbus-1)
    - pkgconfig(libudev)
    - pkgconfig(xkbcommon)
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
