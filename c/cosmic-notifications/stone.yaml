name        : cosmic-notifications
version     : "1.9.0"
release     : 51
homepage    : https://github.com/pop-os/cosmic-notifications
upstreams   :
    - https://github.com/pop-os/cosmic-notifications/archive/refs/tags/epoch-1.9.0.tar.gz : 36fb0a639461432f77df30e8d065ecc536a64a8504e2eebe4b0dcd054cffad08
summary     : Cosmic Desktop Notifications
description : |
    Cosmic Desktop Notifications
license     : GPL-3.0
builddeps   :
    - binary(just)
    - binary(which)
    - pkgconfig(dbus-1)
    - pkgconfig(libudev)
    - pkgconfig(xkbcommon)
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
