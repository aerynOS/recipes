name        : cosmic-notifications
version     : "1.12.0"
release     : 54
homepage    : https://github.com/pop-os/cosmic-notifications
upstreams   :
    - https://github.com/pop-os/cosmic-notifications/archive/refs/tags/epoch-1.12.0.tar.gz : 67d8d569a147bdc6e5e62056fdb075e63f27a1c091e16157bf05a63691ce84be
