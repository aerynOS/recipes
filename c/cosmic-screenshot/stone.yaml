name        : cosmic-screenshot
version     : "1.9.0"
release     : 50
homepage    : https://github.com/pop-os/cosmic-screenshot
upstreams   :
    - https://github.com/pop-os/cosmic-screenshot/archive/refs/tags/epoch-1.9.0.tar.gz : 2f809f4e1ed8ca218b9d39975cee290d168f231b48204a4d91d75ee63f30abcb
summary     : Cosmic Screenshot Tool
description : |
    Cosmic Screenshot Tool
