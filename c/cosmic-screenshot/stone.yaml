name        : cosmic-screenshot
version     : "1.8.0"
release     : 49
homepage    : https://github.com/pop-os/cosmic-screenshot
upstreams   :
    - https://github.com/pop-os/cosmic-screenshot/archive/refs/tags/epoch-1.8.0.tar.gz : 1f4c38e5219f3c12540eec98ef9d4fd8756908bfebe10a8e793e4b72b0aae032
