name        : cosmic-screenshot
version     : "1.12.0"
release     : 54
homepage    : https://github.com/pop-os/cosmic-screenshot
upstreams   :
    - https://github.com/pop-os/cosmic-screenshot/archive/refs/tags/epoch-1.12.0.tar.gz : 096f72fd4c361e778d5e22118485883c84e1fe42af435ced4bfdc25f5ea2b7eb
summary     : Cosmic Screenshot Tool
description : |
    Cosmic Screenshot Tool
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(dbus-1)
    - pkgconfig(libudev)
    - pkgconfig(xkbcommon)
rundeps:
    - cosmic-icons
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
