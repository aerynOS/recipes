name        : cosmic-screenshot
version     : "1.10.0"
release     : 52
homepage    : https://github.com/pop-os/cosmic-screenshot
upstreams   :
    - https://github.com/pop-os/cosmic-screenshot/archive/refs/tags/epoch-1.10.0.tar.gz : 1f74e8ac311e564dd1bac64a2bf02aa095e9c98222be832c2b3366124b3a5000
summary     : Cosmic Screenshot Tool
description : |
    Cosmic Screenshot Tool
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(dbus-1)
    - pkgconfig(libudev)
    - pkgconfig(xkbcommon)
rundeps:
    - cosmic-icons
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
